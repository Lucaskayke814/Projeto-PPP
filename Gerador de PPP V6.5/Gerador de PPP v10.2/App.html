const IDENT_CAMPOS = [
  {k:'escola',      id:'fNome',   label:'Nome da escola', full:true, max:120, contador:true,
   ph:'Ex.: Escola Estadual Horizonte do Saber'},
  {k:'inep',        id:'fInep',   label:'Código da escola', max:8, ph:'de 2 a 8 dígitos', inputmode:'numeric',
   sub:'O código da escola na SEE (ou o INEP, de 8 dígitos). É o que identifica a escola na rede.'},
  /* v9.8: o código INEP do Censo Escolar, obrigatório na base de escolas.
     Vem de lá — não se digita aqui, como a regional. */
  {k:null,          id:'fCenso',  label:'Código INEP (Censo Escolar)', leitura:'censo',
   sub:'Vem da base de escolas da rede, onde é obrigatório. Está errado ou em branco? A correção é feita pela Diretoria Educacional, na base de escolas.'},
  {k:'municipio',   id:'fMun',    label:'Município', max:60, ph:'Ex.: Divinópolis'},
  {k:null,          id:'fSre',    label:'Superintendência Regional de Ensino', leitura:'sre',
   sub:'A regional é a do cadastro da escola na base da SEE, e vem do seu acesso — a tela não a altera. ' +
       'Escola transferida de regional é atualizada pelo Órgão Central, na base de escolas.'},
  {k:'ato',         id:'fAto',    label:'Ato de criação', max:160, contador:true, ph:'Ex.: Decreto nº 00.000, de __/__/____',
   sub:'Norma que criou a escola.'},
  {k:'direcao',     id:'fDir',    label:'Diretor(a)', max:120, contador:true, ph:'Nome completo'},
  {k:'especialista',id:'fEsp',    label:'Especialista / Coordenação Pedagógica', max:120, ph:'Nome completo'},
  {k:'vigencia',    id:'fVig',    label:'Vigência do PPP', max:40, ph:'Ex.: 2026–2028',
   sub:'Revisão no máximo a cada dois anos.'},
  {k:'endereco',    id:'fEnd',    label:'Endereço completo', full:true, max:200, contador:true, ph:'Logradouro, número — bairro'},
  {k:'turnos',      id:'fTurnos', label:'Turnos de funcionamento', max:60, ph:'Ex.: manhã e tarde'},
  {k:'estudantes',  id:'fEst',    label:'Nº de estudantes atendidos', max:8, ph:'Ex.: 480'},
  {k:'turmas',      id:'fTur',    label:'Nº de turmas', max:6, ph:'Ex.: 18'}
];
/** v8.13 (D10): os campos da TELA FINAL que viram coluna, com o rótulo de lá. */
const FINAL_CAMPOS = [
  {k:'assembleia',      label:'Assembleia Escolar de validação — data'},
  {k:'analiseSre',      label:'Análise técnica e pedagógica da SRE — data'},
  {k:'aprovacao',       label:'Aprovação pelo Colegiado Escolar — data'},
  {k:'quorumPresentes', label:'Membros presentes na aprovação'},
  {k:'quorumTotal',     label:'Total de membros do Colegiado'}
];
function renderDados(){
  const d = state.dados;
  const campo = function(c){
    const valor = c.leitura ? (d[c.leitura] || (SESSAO && SESSAO[c.leitura]) || '') : (d[c.k] || '');
    return '<div class="field' + (c.full ? ' full' : '') + '">' +
      '<label for="' + c.id + '">' + esc(c.label) + '</label>' +
      '<input id="' + c.id + '"' + (c.k ? ' data-k="' + c.k + '"' : '') + ' type="text"' +
      ' value="' + esc(valor) + '"' +
      (c.max ? ' maxlength="' + c.max + '"' : '') +
      (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '') +
      (c.inputmode ? ' inputmode="' + c.inputmode + '"' : '') +
      (c.k ? '' : ' readonly') + '>' +
      (c.contador ? '<p class="contador" id="ct_' + c.k + '"></p>' : '') +
      (c.sub ? '<span class="sub">' + esc(c.sub) + '</span>' : '') +
      /* v9.0 (M16): a mensagem do código inválido, visível (o title só aparece com o mouse) */
      (c.k === 'inep' ? '<p class="campo-erro" id="er_inep" hidden>' + ico('erro') + '<span>O código da escola tem de 2 a 8 dígitos, apenas números.</span></p>' : '') +
      '</div>';
  };
  $('#panelProducao').innerHTML = `
    <span class="eyebrow">Módulo 1 · Dados institucionais</span>
    <h2>Identificação da escola</h2>
    <p class="hint">O percurso começa aqui: são estes dados que compõem o cabeçalho oficial e a seção 1 do documento. Confiram cada um no cadastro oficial da escola (SIMADE) antes de preencher — depois é só avançar para a formação.</p>
    <div class="grid-fields">
      ${IDENT_CAMPOS.map(campo).join('\n      ')}
    </div>`;
  /* v8.13 (D12): o maxlength corta a colagem — e é o contador que faz a
     pessoa PERCEBER o corte, em vez de descobrir depois no documento. */
  const contaIdent = function(c){
    const el = $('#ct_' + c.k), campo = $('#' + c.id);
    if(!el || !campo) return;
    const n = campo.value.length;
    el.classList.remove('perto', 'estourou');
    if(n >= c.max){ el.textContent = milhar(n) + ' de ' + milhar(c.max) + ' caracteres — este campo não aceita mais texto'; el.classList.add('estourou'); }
    else if(n >= Math.round(c.max * 0.8)){ el.textContent = milhar(n) + ' de ' + milhar(c.max) + ' caracteres'; el.classList.add('perto'); }
    else el.textContent = '';
  };
  IDENT_CAMPOS.filter(function(c){ return c.contador; }).forEach(contaIdent);
  $('#panelProducao').querySelectorAll('[data-k]').forEach(function(el){
    const meu = IDENT_CAMPOS.filter(function(c){ return c.k === el.dataset.k; })[0];
    el.addEventListener('input', function(){
      state.dados[el.dataset.k] = el.value; sujar(); renderDocSuave();
      if(meu && meu.contador) contaIdent(meu);
      if(el.dataset.k === 'inep'){
        /* v7.3 (T-17): a identidade da escola tem de 2 a 8 dígitos, como no servidor */
        const v = el.value.replace(/\D/g,'');
        const ruim = v.length > 0 && !/^\d{2,8}$/.test(v);
        el.classList.toggle('campo-alerta', ruim); el.classList.toggle('erro', ruim);
        el.title = ruim ? 'O código da escola tem de 2 a 8 dígitos, apenas números' : '';
        /* v9.0 (M16): o erro também aparece escrito sob o campo — o title não existe no toque */
        const er = $('#er_inep'); if(er) er.hidden = !ruim;
      }
    });
    el.addEventListener('change', function(){ state.dados[el.dataset.k] = el.value; sujar(); renderDoc(); });
  });
}

/* v8.5: as indicações da oferta aceitam mais de uma marcação. O valor gravado passa a
   ser uma lista; o que foi gravado como texto nas versões anteriores continua válido e
   entra como opção já marcada, ainda que não esteja entre as previstas. */
function listaDet(v){
  if(Array.isArray(v)) return v.map(function(x){ return String(x == null ? '' : x).trim(); }).filter(Boolean);
  const s = String(v == null ? '' : v).trim();
  if(!s) return [];
  return s.split(/\s*;\s*|\s*,\s*|\s+e\s+/).map(function(x){ return x.trim(); }).filter(Boolean);
}
function opcoesDet(f, marcadas){
  return f.opcoes.concat(marcadas.filter(function(o){ return f.opcoes.indexOf(o) < 0; }));
}
function ordenarDet(f, arr){
  const pos = function(o){ const i = f.opcoes.indexOf(o); return i < 0 ? 900 + arr.indexOf(o) : i; };
  return arr.slice().sort(function(a, b){ return pos(a) - pos(b); });
}
function brutoDet(v){
  if(Array.isArray(v)) return v.map(function(x){ return String(x == null ? '' : x).trim(); }).filter(Boolean).join('; ');
  return String(v == null ? '' : v).trim();
}
function juntarDet(arr){
  if(arr.length < 2) return arr[0] || '';
  return arr.slice(0, -1).join(', ') + ' e ' + arr[arr.length - 1];
}

/* v8.13 (D12): teto do campo de indicação da oferta. Era o único campo de
   texto livre da tela SEM teto nenhum: 62 mil caracteres colados em "Cursos
   técnicos ofertados" estouravam a célula de "detalhes" e o PPP parava de
   gravar, apontando uma coluna interna que não existe na interface. */
const DET_MAX = 2000;
/** sub-campos obrigatórios exibidos quando a modalidade é marcada */
function detalhesHTML(id, marcado){
  const ds = DETALHES[id];
  if(!ds || !marcado) return '';
  const v = state.det[id] || {};
  return `<div class="det-box">
    <p class="det-tit">Indicação obrigatória para esta oferta</p>
    ${ds.map(function(f){
      const nota = f.nota ? `<span class="det-nota">${esc(f.nota)}</span>` : '';
      if(f.tipo === 'multi'){
        const marc = listaDet(v[f.id]);
        return `<div class="det-campo"><span>${esc(f.label)} <em class="det-dica">marquem quantas forem</em></span>
          <div class="det-opcoes" role="group" aria-label="${esc(f.label)}">
            ${opcoesDet(f, marc).map(function(o, i){
              const cid = 'det-' + id + '-' + f.id + '-' + i;
              return `<label class="det-opt" for="${cid}"><input type="checkbox" id="${cid}" data-det="${id}" data-f="${f.id}" data-multi="1" value="${esc(o)}" ${marc.indexOf(o) >= 0 ? 'checked' : ''}>
                <span class="bx" aria-hidden="true">${ico('check')}</span>
                <span class="tx">${esc(o)}</span></label>`;
            }).join('')}
          </div>${nota}</div>`;
      }
      if(f.tipo === 'opcao'){
        const atual = String(v[f.id] || '');
        return `<div class="det-campo"><span>${esc(f.label)} <em class="det-dica">uma resposta</em></span>
          <div class="det-opcoes" role="radiogroup" aria-label="${esc(f.label)}">
            ${f.opcoes.map(function(o, i){
              const cid = 'det-' + id + '-' + f.id + '-' + i;
              return `<label class="det-opt det-opt--radio" for="${cid}"><input type="radio" id="${cid}" name="${'det-' + id + '-' + f.id}" data-det="${id}" data-f="${f.id}" value="${esc(o)}" ${atual === o ? 'checked' : ''}>
                <span class="bx" aria-hidden="true"></span><span class="tx">${esc(o)}</span></label>`;
            }).join('')}
          </div>${nota}</div>`;
      }
      if(f.tipo === 'select'){
        return `<label class="det-campo"><span>${esc(f.label)}</span>
          <select data-det="${id}" data-f="${f.id}">
            <option value="">selecione…</option>
            ${f.opcoes.map(o=>`<option ${v[f.id]===o?'selected':''}>${esc(o)}</option>`).join('')}
          </select>${nota}</label>`;
      }
      return `<label class="det-campo"><span>${esc(f.label)}</span>
        <input type="text" data-det="${id}" data-f="${f.id}" maxlength="${DET_MAX}" value="${esc(brutoDet(v[f.id]))}" placeholder="${esc(f.ph||'')}">${nota}</label>`;
    }).join('')}
  </div>`;
}

function renderMarcacao(t){
  const set = state.sel[t.grupo], b = 'TELAS.' + t.id;
  const raiz = {etapas:'ETAPAS', mods:'MODALIDADES', infra:'INFRA', temas:'TEMAS',
                principios:'PRINCIPIOS', metodos:'METODOS'}[t.grupo];
  $('#panelProducao').innerHTML = `
    <span class="eyebrow"${ed(b + '.eyebrow')}>${esc(t.eyebrow)}</span><h2${ed(b + '.titulo')}>${esc(t.titulo)}</h2>
    <p class="hint"${ed(b + '.hint')}>${t.hint}</p>
    <fieldset><legend${ed(b + '.legend')}>${esc(t.legend)}</legend><p class="legend-sub"${ed(b + '.legendSub')}>${esc(t.legendSub)}</p>
      <div class="opts" id="optsHost">${itensVisiveis(t.grupo).map(function(o){
        const c = raiz + '.' + GRUPOS[t.grupo].indexOf(o);
        return `
        <div class="opt-wrap">
        <label class="opt"><input type="checkbox" data-id="${o.id}" ${set.has(o.id)?'checked':''}>
          <span class="box" aria-hidden="true">${ico('check')}</span>
          <span><span class="opt-title"${ed(c + '.label')}>${esc(o.label)}</span><span class="opt-ref"${ed(c + '.ref')}>Texto-base · ${esc(o.ref)}</span></span>
        </label>${detalhesHTML(o.id, set.has(o.id))}
        ${EDICAO.ativa ? `<div class="ed-exemplo"><span class="ed-rot">Texto inserido no documento</span>
          <p${ed(c + '.texto')}>${esc(o.texto)}</p></div>` : ''}</div>`; }).join('')}</div>
    </fieldset>
    <div class="info-strip">
      ${ico('info')}
      <span${ed(b + '.info')}>${esc(t.info)}</span></div>`;
  const host = $('#optsHost');
  host.addEventListener('change', function(e){
    const det = e.target.dataset.det;
    if(det){
      const campo = e.target.dataset.f;
      if(!state.det[det]) state.det[det] = {};
      if(e.target.dataset.multi){                       /* v8.5: marcação múltipla */
        const f = (DETALHES[det] || []).filter(function(x){ return x.id === campo; })[0];
        const arr = listaDet(state.det[det][campo]), val = e.target.value, j = arr.indexOf(val);
        if(e.target.checked){ if(j < 0) arr.push(val); } else if(j >= 0){ arr.splice(j, 1); }
        state.det[det][campo] = f ? ordenarDet(f, arr) : arr;
        sujar(); renderDoc(); return;
      }
      state.det[det][campo] = e.target.value;
      sujar(); renderDoc(); return;
    }
    const id = e.target.dataset.id; if(!id) return;
    e.target.checked ? set.add(id) : set.delete(id);
    sujar(); renderMarcacao(t); renderDoc(id);
  });
  host.addEventListener('input', function(e){
    const det = e.target.dataset.det;
    if(!det || e.target.tagName !== 'INPUT' || e.target.type !== 'text') return;
    if(!state.det[det]) state.det[det] = {};
    state.det[det][e.target.dataset.f] = e.target.value;
    sujar(); renderDoc();
  });
}

        : 'Nenhum espaço foi marcado na tela anterior. Descreva aqui as condições de que a escola dispõe.')
      + `</span></div>`;
  }
  const b = 'TELAS.' + t.id;
  $('#panelProducao').innerHTML = `
    <span class="eyebrow"${ed(b + '.eyebrow')}>${esc(t.eyebrow)}</span><h2${ed(b + '.titulo')}>${esc(t.titulo)}</h2>
    <p class="hint"${ed(b + '.hint')}>${t.hint}</p>` + avisos +
    perguntasHTML(t.perguntas, 'Antes de escrever, conversem sobre isto', b) + camposHTML(t.campos, '', b);
  ligarCampos($('#panelProducao'));
}

/* ==========================================================
   6b. O documento em páginas A4 (v8.9)
   ==========================================================
   Até a 8.8 a tela mostrava uma folha contínua e quem paginava o PDF era o
   conversor do Google — sem número de página, e sem que a escola pudesse
   saber, antes de gerar, onde cada seção cairia. A paginação passa a ser
   feita aqui, uma vez, e serve aos três destinos: a prévia lateral, a tela
   cheia e o PDF. O que se vê é o que sai impresso.

   As medidas são as do Padrão Ofício (Manual de Redação da Presidência da
   República, 3ª edição): papel A4, margem esquerda de 3 cm, direita de
   1,5 cm, superior e inferior de 2 cm, entrelinhas simples, 6 pontos depois
   de cada parágrafo, texto justificado, recuo de 2,5 cm na primeira linha e
   numeração a partir da segunda página. */
const PAG = {larg:210, alt:297, cima:20, baixo:20, esq:30, dir:15};

/**
 * v8.11 — O código de autenticidade que vai ao rodapé. Na tela, o do PPP
 * aberto, quando já existe; no que segue para o servidor, a marca que ele
 * substitui (o código nasce na conclusão, depois de a tela montar as
 * folhas).
 */
/**
 * v8.13 (D21) — a tela monta o rodapé só quando é ELA quem sabe: o PPP
 * aberto pela própria direção, ainda vivo na tela. E monta a MESMA frase do
 * servidor, com o endereço de conferência — até a 8.12 o "confira em" só
 * existia no PDF, e quem lia na tela (inclusive na porta pública) não via
 * onde conferir o papel que tinha na mão.
 */
function frasedoRodape(hash, assinaturas){
  const lista = assinaturas || [];
  const colhidas = lista.filter(function(a){ return !!a.assinadoEm; }).length;
  const completo = lista.length > 0 && colhidas === lista.length;
  const url = APP.urlApp || '';
  return (completo ? 'Documento assinado eletronicamente no Gerador de PPP'
                   : 'Documento em coleta de assinaturas no Gerador de PPP') +
    ' · código de autenticidade ' + hash +
    (url ? ' · confira em ' + url + '?v=' + encodeURIComponent(hash) : '');
}
function rodapeDeAutenticidade(){
  if(APP.paraPdf) return '<!--COD-->';
  if(!APP.hash) return '';
  return esc(frasedoRodape(APP.hash, APP.assinaturas));
}

/** A imagem do brasão, embutida uma única vez pelo Index. */
function brasaoHTML(){
  const img = document.querySelector('#brasaoFonte img');
  return img ? img.outerHTML : '';
}

/**
 * v8.12 — O documento CONGELADO no Drive é o que vai para o PDF: nele o
 * brasão e o código de autenticidade são marcas que o servidor troca na
 * conversão. Exibido na tela, ele precisa da mesma troca, senão a folha
 * aparece sem brasão e com o rodapé vazio — foi o que se via ao abrir um
 * PPP já concluído.
 */
function trocarMarcasDoDoc(html, rodape){
  /* v8.13 (D21): quando o servidor manda o rodapé, é ele que vale — é o
     servidor que sabe quantas assinaturas foram colhidas, e a tela não pode
     afirmar "assinado eletronicamente" sobre um documento em coleta. */
  const texto = (typeof rodape === 'string' && rodape)
    ? rodape
    : (APP.hash ? frasedoRodape(APP.hash, APP.assinaturas) : '');
  return String(html || '')
    .replace(/<!--BRASAO-->/g, brasaoHTML())
    .replace(/<!--COD-->/g, esc(texto));
}

function novaPaginaEm(host){
  const pag = document.createElement('div'); pag.className = 'pagina';
  const corpo = document.createElement('div'); corpo.className = 'pag-corpo';
  pag.appendChild(corpo); host.appendChild(pag);
  return corpo;
}
function cabeNaPagina(corpo){ return corpo.scrollHeight <= corpo.clientHeight + 1; }
function ehTituloDoc(el){
  return el && el.nodeType === 1 && (el.classList.contains('doc-h') || el.classList.contains('doc-sub'));
}
/* v8.13 (D17): a folha que só tem o título. Sem esta leitura, o título
   descia para a folha nova, o bloco continuava não cabendo, a condição
   "anterior tem mais de um filho" falhava e o título ficava SOZINHO numa
   folha em branco — 40 ocorrências em 40 cenários, e a página 12 do PDF de
   exemplo que acompanha o pacote. */
function soTemTitulo(c){
  const itens = Array.prototype.slice.call(c.childNodes)
    .filter(function(n){ return n.nodeType === 1 || String(n.textContent).trim(); });
  return itens.length > 0 && itens.every(ehTituloDoc);
}

/** Divide um bloco que não cabe sozinho numa página. Devolve [primeira, resto]. */
function dividirBloco(no, corpo){
  if(no.nodeType !== 1) return null;
  /* tabela: divide por linhas, para que uma folha de assinaturas longa não
     seja cortada pela borda da página */
  if(no.tagName === 'TABLE'){
    const corpoTab = no.tBodies[0] || no;
    const linhas = Array.prototype.slice.call(corpoTab.rows || []);
    if(linhas.length < 2) return null;
    /* v8.15 — A TABELA CONTINUA COMO NUM EDITOR DE TEXTO.
       Três coisas estavam erradas aqui, e as três produziam o mesmo efeito
       no papel: tabela que termina no pé da folha e recomeça na outra sem
       se explicar.
       1) O clone era RASO (cloneNode(false)): a continuação nascia sem
          <thead> e sem <tbody>, e as linhas eram penduradas direto na
          <table>. Quem lia a folha seguinte via números sem saber de que
          coluna eram.
       2) Quando nem a primeira linha cabia, a função devolvia null — mas
          já tinha REMOVIDO as demais de dentro da tabela, e ninguém as
          devolvia. A tabela seguia para a folha seguinte mutilada, e as
          linhas do meio desapareciam do documento.
       3) O cabeçalho não se repetia. Word e LibreOffice repetem; um
          documento oficial com tabela partida sem cabeçalho obriga quem lê
          a folhear para trás. */
    const a = no;
    const b = no.cloneNode(false);
    /* a continuação leva o cabeçalho, e um tbody de verdade */
    const cab = no.tHead;
    if(cab) b.appendChild(cab.cloneNode(true));
    const bTab = document.createElement('tbody');
    b.appendChild(bTab);
    corpo.appendChild(a);
    let corte = linhas.length - 1;
    while(corte > 0){
      if(cabeNaPagina(corpo)) break;
      corpoTab.removeChild(linhas[corte]); corte--;
    }
    corpo.removeChild(a);
    if(corte <= 0){
      /* nem uma linha coube: a tabela volta INTEIRA, como chegou, e quem
         resolve é o caminho da folha nova */
      for(let i = 1; i < linhas.length; i++) corpoTab.appendChild(linhas[i]);
      return null;
    }
    for(let i = corte + 1; i < linhas.length; i++) bTab.appendChild(linhas[i]);
    return bTab.rows.length ? [a, b] : null;
  }
  if(no.hasAttribute('data-cur')) return null;   /* não parte texto curável */
  /* v8.13 (D17): CONTÊINER DE BLOCOS — divide por filho, como a tabela
     divide por linha. A lista de referências é UM elemento com 73 filhos:
     sem isto ela é jogada inteira numa folha e o overflow:hidden come o que
     passa de 257 mm, sem erro, sem aviso e sem marca. Foi assim que a LDB,
     o ECA, a BNCC e as Resoluções da própria SEE sumiram do PDF oficial —
     73 referências no documento, 19 no papel. Qualquer lista futura passa a
     continuar na folha seguinte pelo mesmo caminho. */
  if(no.children.length){
    const filhos = Array.prototype.slice.call(no.children);
    const soBlocos = Array.prototype.slice.call(no.childNodes)
      .every(function(n){ return n.nodeType === 1 || !String(n.textContent).trim(); });
    if(filhos.length < 2 || !soBlocos) return null;
    const a = no, b = no.cloneNode(false);
    corpo.appendChild(a);
    let corte = filhos.length - 1;
    while(corte > 0){
      if(cabeNaPagina(corpo)) break;
      a.removeChild(filhos[corte]); corte--;
    }
    corpo.removeChild(a);
    /* nem o primeiro filho coube: devolve o nó inteiro, como estava, e deixa
       o caminho do título/página nova resolver — nada se perde aqui */
    if(corte <= 0){ filhos.forEach(function(f){ a.appendChild(f); }); return null; }
    for(let i = corte + 1; i < filhos.length; i++) b.appendChild(filhos[i]);
    return b.children.length ? [a, b] : null;
  }
  const palavras = String(no.textContent || '').split(/\s+/).filter(Boolean);
  /* v8.15: o mínimo era de 24 palavras. Parágrafo de vinte — e o documento
     tem muitos — ia inteiro para a folha seguinte, deixando um vão de cinco
     centímetros no pé da anterior, quando o editor de texto o teria partido.
     Doze palavras é o mínimo que ainda permite deixar seis de cada lado. */
  if(palavras.length < 12) return null;
  const a = no.cloneNode(false), b = no.cloneNode(false);
  corpo.appendChild(a);
  let lo = 1, hi = palavras.length - 1, melhor = 0;
  while(lo <= hi){
    const m = (lo + hi) >> 1;
    a.textContent = palavras.slice(0, m).join(' ');
    if(cabeNaPagina(corpo)){ melhor = m; lo = m + 1; } else hi = m - 1;
  }
  corpo.removeChild(a);
  /* nem órfã no pé, nem viúva no alto: pelo menos seis palavras de cada lado
     (v8.15: eram oito; com o mínimo de doze palavras, seis é o par) */
  if(melhor < 6 || palavras.length - melhor < 6) return null;
  a.textContent = palavras.slice(0, melhor).join(' ');
  b.textContent = palavras.slice(melhor).join(' ');
  b.classList.add('cont');                      /* continuação: sem recuo de primeira linha */
  return [a, b];
}

/**
 * v8.13 (D22) — O NÚMERO DA PÁGINA EM CADA ITEM DO SUMÁRIO.
 *
 * O sistema pagina o documento e sabe em que folha cada título caiu; o
 * sumário saía só com os rótulos e uma linha pontilhada, o que não localiza
 * nada num PPP de quinze a vinte folhas (e a ABNT NBR 6027 pede o
 * indicativo de página). A passada acontece DEPOIS de distribuir, porque é
 * a distribuição que conhece o número.
 *
 * O casamento é pelo TEXTO e pela ORDEM: dois títulos iguais não se
 * confundem, porque cada ocorrência é consumida uma vez só.
 * O item da folha de assinaturas recebe a folha seguinte ao corpo — quem
 * confirma esse número é o servidor, ao montar o documento completo
 * (documentoComFolha_), que é quem sabe quantas folhas a assinatura ocupa.
 */
function numerarSumarioNoHost(host){
  const paginas = Array.prototype.slice.call(host.querySelectorAll('.pagina'));
  const ocorrencias = [];
  paginas.forEach(function(p, i){
    p.querySelectorAll('h3.doc-h').forEach(function(h3){
      ocorrencias.push({t: String(h3.textContent || '').trim(), n: i + 1, usado: false});
    });
  });
  const numeros = [];
  Array.prototype.slice.call(host.querySelectorAll('.sum-item')).forEach(function(it){
    const alvo = it.getAttribute('data-sum') || '';
    let n = '';
    if(alvo === 'folha'){ n = String(paginas.length + 1); }
    else {
      for(let k = 0; k < ocorrencias.length; k++){
        if(!ocorrencias[k].usado && ocorrencias[k].t === alvo){
          ocorrencias[k].usado = true; n = String(ocorrencias[k].n); break;
        }
      }
    }
    const sp = it.querySelector('.sum-pag');
    if(sp) sp.textContent = n;
    numeros.push(n);
  });
  return numeros;
}

/**
 * Distribui o conteúdo em páginas A4. Sem cálculo de geometria (as baterias
 * em jsdom), devolve uma página só — a estrutura é a mesma, e é isso que as
 * verificações conferem.
 */
function paginar(html, segundaPassada){
  const abre = '<div class="paginas">', fecha = '</div>';
  paginar.excedeu = false;         /* v8.13 (D17): a marca é sempre desta chamada */
  /* v8.13 (D18): O QUE JÁ ESTÁ EM FOLHAS NÃO SE REPAGINA.
     O documento congelado no Drive já é <div class="paginas"><div class="pagina">…:
     é isso que concluirPPP grava. Ao reabri-lo — na tela da escola e na porta
     pública de conferência — ele passava por aqui de novo, e a fila ficava com
     um único nó que não cabia e não podia ser dividido: as folhas reais eram
     aninhadas DENTRO de uma folha nova e o overflow:hidden cortava 95% do
     documento (14 de 263 blocos visíveis). A guarda fica aqui, e não em cada
     chamador, porque são quatro chamadores hoje e o quinto nasceria com o
     mesmo defeito. A troca de marcas (trocarMarcasDoDoc) continua valendo e
     acontece ANTES, sobre o texto.
     O `^\s*` é proposital: um documento que traga a expressão no meio do
     texto de uma escola não pode ser confundido com um documento paginado.
     Registro concluído antes da 8.9 pode ter congelado SEM folhas — ele
     continua sendo paginado aqui, e é isso que a regra preserva. */
  if(/^\s*<div class="paginas"/.test(String(html))) return String(html);
  if(ambienteSemLayout()){
    /* v8.11: mesmo sem geometria para medir, a folha sai com o rodapé — é
       ele que leva o código de autenticidade, e a estrutura tem de ser a
       mesma que o servidor vai completar ao montar o PDF. */
    return abre + '<div class="pagina" data-pag="1" data-de="1"><div class="pag-corpo">' +
      String(html).replace(/<div class="quebra"><\/div>/g, '') + '</div>' +
      '<div class="pag-rodape"><span class="pag-cod">' + rodapeDeAutenticidade() +
      '</span><span class="pag-num"></span></div></div>' + fecha;
  }
  const host = document.createElement('div');
  /* a medição precisa da MESMA tipografia do destino: sem a classe "doc", o
     cálculo saía com a fonte da interface e as páginas fechavam cedo, com um
     vão no pé */
  /* v9.1: e da mesma FONTE. Se ela ainda não chegou, mede-se assim mesmo
     (isto é síncrono) e a tela é refeita quando ela chegar. */
  paginar.semFonte = !fontesDoDocProntas();
  if(paginar.semFonte) prepararFontesDoDoc();
  host.className = 'paginas medindo doc';
  document.body.appendChild(host);
  try {
    const fonte = document.createElement('div');
    fonte.innerHTML = html;
    const fila = Array.prototype.slice.call(fonte.childNodes);
    let corpo = novaPaginaEm(host);
    let guarda = 0;
    /* v8.13 (D17): a guarda é proporcional à fila, e não um número fixo. Um
       campo com 20 mil linhas coladas de uma planilha enche a fila com 20
       mil parágrafos: com o teto fixo de 20.000 voltas a paginação parava no
       meio e DESCARTAVA o resto — 44.093 caracteres sumiam e as seções 1 a
       22, as referências e a folha de assinaturas simplesmente não existiam
       no documento gerado. Cada nó pode voltar à fila algumas vezes (título
       que desce, bloco que se parte), daí o fator 4. */
    const tetoVoltas = Math.max(20000, fila.length * 4);
    while(fila.length && guarda++ < tetoVoltas){
      const no = fila.shift();
      if(no.nodeType === 3 && !String(no.textContent).trim()) continue;
      if(no.nodeType === 1 && no.classList.contains('quebra')){
        if(corpo.childNodes.length) corpo = novaPaginaEm(host);
        continue;
      }
      corpo.appendChild(no);
      if(cabeNaPagina(corpo)) continue;
      corpo.removeChild(no);
      /* o texto continua na página seguinte, como num documento impresso:
         partir aqui evita o vão de meia página que sobrava ao empurrar o
         parágrafo inteiro para a folha de baixo */
      const partes = dividirBloco(no, corpo);
      if(partes){ corpo.appendChild(partes[0]); corpo = novaPaginaEm(host); fila.unshift(partes[1]); continue; }
      /* v8.13 (D17): a folha que só tem o título não abre outra folha. Se
         abrisse, o título ficaria sozinho nela e o bloco começaria na
         seguinte — que é o defeito A6-13. O bloco fica COM o título, o
         mesmo tratamento que o código já dava à folha vazia. */
      if(corpo.childNodes.length && !soTemTitulo(corpo)){
        const anterior = corpo;
        corpo = novaPaginaEm(host);
        /* título não fica sozinho no pé da página: desce com o texto dele.
           v8.13 (D17): descem TODOS os títulos do pé, e não só o último —
           uma seção "9." seguida da subseção "9.1" são dois, e mover apenas
           o de baixo deixava o de cima sozinho no pé da folha. */
        while(anterior.childNodes.length > 1 && ehTituloDoc(anterior.lastElementChild)){
          corpo.insertBefore(anterior.lastElementChild, corpo.firstChild);
        }
        fila.unshift(no);
        continue;
      }
      corpo.appendChild(no);            /* não há como dividir: segue nesta página */
      corpo = novaPaginaEm(host);
    }
    /* a última página pode ter ficado vazia */
    const ultima = host.lastElementChild;
    if(ultima && !ultima.querySelector('.pag-corpo').childNodes.length) host.removeChild(ultima);
    /* v8.13 (D17): o que a paginação não conseguiu distribuir NÃO se joga
       fora. Folha feia é ruim; seção que desaparece do documento oficial é
       inadmissível. O resto da fila vai para uma última folha marcada, que
       cresce em vez de cortar, e a tela avisa (paginar.excedeu). */
    if(fila.length){
      paginar.excedeu = true;
      const pagExc = document.createElement('div');
      pagExc.className = 'pagina';
      pagExc.setAttribute('data-excedente', '1');
      const corpoExc = document.createElement('div');
      corpoExc.className = 'pag-corpo';
      const tarja = document.createElement('p');
      tarja.className = 'tarja-exc';
      tarja.textContent = 'ATENÇÃO — o conteúdo abaixo excedeu a paginação em A4 e segue em folha única, ' +
        'sem quebra de página. Reduza o texto dos campos para que o documento volte a caber nas folhas.';
      corpoExc.appendChild(tarja);
      while(fila.length){
        const resto = fila.shift();
        if(resto.nodeType === 3 && !String(resto.textContent).trim()) continue;
        if(resto.nodeType === 1 && resto.classList.contains('quebra')) continue;
        corpoExc.appendChild(resto);
      }
      pagExc.appendChild(corpoExc);
      host.appendChild(pagExc);
    }
    /* ============================================================
       v8.15 — A CONFERÊNCIA DEPOIS DE PAGINAR

       O laço acima decide folha a folha, e decide bem. Mas ele decide UMA
       vez por nó: quando um bloco entra, os que já estavam não são medidos
       de novo, e basta um reajuste de linha — uma palavra que muda de
       linha porque a anterior encolheu — para a folha passar do limite sem
       que ninguém perceba. Antes isso sumia atrás do overflow:hidden; agora
       apareceria, o que é melhor, mas ainda não é o certo.

       Esta passada percorre as folhas prontas e, achando uma que passou,
       devolve o último bloco dela para o começo da seguinte — repetindo
       até caber, como faz um editor de texto ao reflowar o documento. É
       barata: só age quando há sobra, e na esmagadora maioria dos
       documentos não há nenhuma.
       ============================================================ */
    (function conferirFolhas(){
      const corpos = Array.prototype.slice.call(host.querySelectorAll('.pag-corpo'));
      let mexeu = 0;
      for(let i = 0; i < corpos.length && mexeu < 500; i++){
        const c = corpos[i];
        if(c.parentElement && c.parentElement.hasAttribute('data-excedente')) continue;
        let volta = 0;
        while(!cabeNaPagina(c) && c.children.length > 1 && volta++ < 80){
          const sobra = c.lastElementChild;
          let seguinte = corpos[i + 1];
          if(!seguinte || (seguinte.parentElement && seguinte.parentElement.hasAttribute('data-excedente'))){
            /* não há folha adiante: cria uma, no mesmo molde das outras */
            seguinte = novaPaginaEm(host);
            corpos.splice(i + 1, 0, seguinte);
          }
          seguinte.insertBefore(sobra, seguinte.firstChild);
          mexeu++;
        }
      }
      /* a última folha pode ter ficado vazia depois do remanejo */
      const fim = host.lastElementChild;
      const corpoFim = fim && fim.querySelector('.pag-corpo');
      if(corpoFim && !corpoFim.childNodes.length && !fim.hasAttribute('data-excedente')) host.removeChild(fim);
    })();

    /* numeração: a partir da segunda página, como manda o padrão */
    /* v8.11: o rodapé de cada página — o código de autenticidade à esquerda
       (a marca <!--COD-->, que o servidor troca ao montar o PDF) e o número
       à direita, a partir da segunda, como manda o padrão. */
    const paginas = host.querySelectorAll('.pagina');
    paginas.forEach(function(p, i){
      p.setAttribute('data-pag', i + 1);
      p.setAttribute('data-de', paginas.length);
      const rod = document.createElement('div');
      rod.className = 'pag-rodape';
      const cod = document.createElement('span');
      cod.className = 'pag-cod';
      cod.innerHTML = rodapeDeAutenticidade();
      const n = document.createElement('span');
      n.className = 'pag-num'; n.textContent = i === 0 ? '' : String(i + 1);
      rod.appendChild(cod); rod.appendChild(n);
      p.appendChild(rod);
    });
    /* v8.13 (D22): os números do sumário, e no máximo UMA repaginação. Se
       escrevê-los empurrar o sumário para além da folha, pagina-se de novo
       com eles já escritos — e para aí: uma terceira passada seria perseguir
       a própria sombra. Tudo dentro de try, porque um sumário sem número é
       um defeito, e um documento que não se monta é um desastre. */
    let saida = abre + host.innerHTML + fecha;
    try {
      const numeros = numerarSumarioNoHost(host);
      if(numeros.length){
        const estourou = Array.prototype.slice.call(host.querySelectorAll('.pag-corpo'))
          .some(function(c){ return !cabeNaPagina(c); });
        if(estourou && !segundaPassada){
          const refeito = document.createElement('div');
          refeito.innerHTML = html;
          const vagas = refeito.querySelectorAll('.sum-item .sum-pag');
          for(let i = 0; i < vagas.length && i < numeros.length; i++) vagas[i].textContent = numeros[i];
          return paginar(refeito.innerHTML, true);
        }
        saida = abre + host.innerHTML + fecha;
      }
    } catch(e){ /* o documento sai sem os números, mas sai */ }
    return saida;
  } finally { document.body.removeChild(host); }
}

/**
 * v8.13 (D17) — O AVISO DO EXCEDENTE.
 *
 * Quando a paginação não consegue distribuir tudo em folhas A4, o resto vai
 * para uma última folha marcada — nada é descartado —, e a pessoa precisa
 * saber disso e saber QUAL campo inchou o documento, porque é ele que ela
 * vai reduzir. Até a 8.12 o excedente sumia em silêncio.
 */
function campoQueInchou(){
  let maior = '', tam = 0;
  Object.keys(state.txt || {}).forEach(function(k){
    const n = String(state.txt[k] || '').length;
    if(n > tam){ tam = n; maior = k; }
  });
  if(!maior) return '';
  return '"' + ((typeof ROTULO_DO_CAMPO !== 'undefined' && ROTULO_DO_CAMPO[maior]) || maior) +
         '", com ' + tam.toLocaleString('pt-BR') + ' caracteres';
}
function avisarExcedente(){
  const campo = campoQueInchou();
  alerta('O documento ficou grande demais para ser distribuído em folhas A4. O que não coube ' +
    'foi para uma última folha, marcada, em página única e sem quebra — nada foi descartado.' +
    (campo ? '\n\nO campo mais longo é ' + campo + '.' : '') +
    '\n\nReduza o texto para que o documento volte a caber nas folhas.',
    'Documento maior do que cabe em A4');
}

/** A escala que faz a folha A4 caber na largura disponível. */
/* ============================================================
   v9.1 — A FOLHA NA TELA É A FOLHA DO PAPEL

   Três coisas faziam a tela discordar do que se mediu, e as três
   apareciam do mesmo jeito: texto passando da margem inferior e invadindo
   o rodapé, como num print que chegou da porta pública.

   1) A FONTE vinha do aparelho. O documento é medido em Carlito 12 (a
      métrica de Calibri); um Mac, um iPad e um Android não têm Carlito
      nem Calibri e caem em Arial ou Roboto, mais largas. O documento
      congelado na conclusão — medido na tela da direção — refluía nesses
      aparelhos e ganhava três ou quatro linhas por folha. A fonte agora
      vai embutida na página (DocFonte.html), em data: URI — pronta
      durante a leitura da página, antes de qualquer folha. paginar() é
      síncrona e não espera: se por acaso medir antes de a fonte chegar,
      prepararFontesDoDoc() refaz o que está na tela quando ela chegar
      (redesenharFolhasVisiveis), e a conclusão do PPP só congela o
      documento com a fonte pronta (fontesDoDocProntas).

   2) O ZOOM refazia o layout. `zoom` recalcula tudo no tamanho reduzido, e
      a linha quebra em lugar diferente do que foi medido em 100%. O
      `transform` desenha a folha medida, reduzida ou ampliada: a linha
      quebra onde foi medida, em qualquer escala. Como o transform não
      ocupa espaço, a caixa recebe a altura da imagem.

   3) Não havia CONFERÊNCIA na exibição. paginar() confere as folhas que
      acabou de montar (v8.15), mas o documento congelado não passa por
      paginar() — chega em folhas prontas e era exibido como veio. Agora
      toda folha exibida passa por acomodarFolhas(): o que passa da margem
      continua na folha seguinte, como faz um editor de texto, e o rodapé é
      renumerado. Com a fonte embutida isso quase nunca acontece; quando
      acontecer, o leitor vê o texto inteiro, dentro da margem.
   ============================================================ */
function ajustarEscalaDoc(caixa, fator){
  if(!caixa) return;
  const pg = caixa.querySelector('.paginas');
  if(!pg) return;
  const larguraA4 = PAG.larg * 96 / 25.4;               /* 210 mm em pixels de CSS */
  caixa.style.width = '';                               /* mede a largura da caixa, não a da imagem anterior */
  caixa.style.height = '';
  const disponivel = caixa.clientWidth - 10;
  if(!disponivel || disponivel <= 0) return;
  const base = Math.min(1, disponivel / larguraA4);
  const k = base * (fator || 1);
  pg.style.zoom = '';
  pg.style.transformOrigin = '0 0';
  pg.style.transform = 'scale(' + k.toFixed(4) + ')';
  const largImagem = pg.offsetWidth * k, altImagem = pg.offsetHeight * k;   /* offset* ignora o transform */
  /* centrada quando cabe; encostada à esquerda quando é maior que a caixa */
  pg.style.margin = '0 0 0 ' + Math.max(0, Math.round((caixa.clientWidth - largImagem) / 2)) + 'px';
  caixa.style.height = Math.ceil(altImagem) + 'px';
}

/* as quatro faces que o documento usa; carregadas de DocFonte.html */
const FONTES_DOC = ['12pt Carlito', 'bold 12pt Carlito', 'italic 12pt Carlito', 'bold italic 12pt Carlito'];
let _fontesDocProntas = false;
function fontesDoDocProntas(){
  if(_fontesDocProntas) return true;
  if(!document.fonts || !document.fonts.check){ _fontesDocProntas = true; return true; }
  _fontesDocProntas = FONTES_DOC.every(function(f){ try { return document.fonts.check(f); } catch(e){ return true; } });
  return _fontesDocProntas;
}
let _fontesDocPedidas = false;
function prepararFontesDoDoc(){
  if(!document.fonts || !document.fonts.load || _fontesDocPedidas) return;
  _fontesDocPedidas = true;
  const depois = function(){
    /* também na falha: não há mais o que esperar — a folha fica com a fonte
       substituta, e a acomodação na exibição é o que segura a margem */
    const antes = _fontesDocProntas;
    _fontesDocProntas = true;
    if(!antes) redesenharFolhasVisiveis();
  };
  Promise.all(FONTES_DOC.map(function(f){ return document.fonts.load(f); })).then(depois, depois);
}
/* a fonte chegou depois de alguma folha já estar na tela: refaz o que está
   visível. A tela cheia que mostra um documento ALHEIO — o congelado de
   verDocumento, ou o da porta pública — nunca é repaginada a partir do
   documento em curso: ela só é acomodada de novo (APP.docFullAlheio). */
function redesenharFolhasVisiveis(){
  try {
    const ov = $('#ovDoc'), full = $('#docFull');
    const cheiaAberta = ov && !ov.hidden && full && full.querySelector('.paginas');
    if(cheiaAberta && APP.docFullAlheio){
      acomodarFolhas(full);
      ajustarEscalaDoc(full, docZoomCheio / 100);
    }
    const mini = $('#docMini');
    if(mini && mini.querySelector('.paginas')) renderDoc();   /* repagina a prévia — e a tela cheia, se for o documento em curso */
    else if(cheiaAberta && !APP.docFullAlheio){
      acomodarFolhas(full);
      ajustarEscalaDoc(full, docZoomCheio / 100);
    }
  } catch(e){}
}

/**
 * Renumera as folhas de uma caixa exibida: data-pag, data-de e o número do
 * rodapé (a partir da segunda folha, como manda o padrão). A folha criada
 * pela acomodação nasce sem rodapé e recebe uma cópia do da anterior — é
 * assim que o código de autenticidade continua em todas.
 */
function renumerarFolhas(host){
  const paginas = Array.prototype.slice.call(host.querySelectorAll('.pagina'));
  let ultimoRodape = null;
  paginas.forEach(function(p, i){
    p.setAttribute('data-pag', i + 1);
    p.setAttribute('data-de', paginas.length);
    let rod = p.querySelector('.pag-rodape');
    if(!rod && ultimoRodape){ rod = ultimoRodape.cloneNode(true); p.appendChild(rod); }
    if(rod){
      const n = rod.querySelector('.pag-num');
      if(n) n.textContent = i === 0 ? '' : String(i + 1);
      ultimoRodape = rod;
    }
  });
}

/**
 * A conferência das folhas EXIBIDAS. Percorre as folhas de uma caixa e, na
 * que passou da margem inferior, leva o que sobra para a folha seguinte —
 * partindo o parágrafo ou a tabela quando dá (dividirBloco), movendo o
 * bloco inteiro quando não dá —, criando folha nova quando não há seguinte.
 * Mede sem escala: scrollHeight e clientHeight ignoram o transform.
 * Devolve quantos remanejos fez (0 na quase totalidade dos casos).
 */
function acomodarFolhas(caixa){
  if(!caixa || ambienteSemLayout()) return 0;
  const host = caixa.querySelector('.paginas');
  if(!host) return 0;
  const corpos = Array.prototype.slice.call(host.querySelectorAll('.pag-corpo'))
    .filter(function(c){ return !(c.parentElement && c.parentElement.hasAttribute('data-excedente')); });
  let mexeu = 0;
  for(let i = 0; i < corpos.length && mexeu < 500; i++){
    const c = corpos[i];
    let volta = 0;
    while(!cabeNaPagina(c) && c.children.length >= 1 && volta++ < 80){
      /* um único bloco maior que a folha (parágrafo de mais de uma folha,
         numa fonte mais larga que a medida): parte-se, como paginar() faz;
         se não der para partir, fica — e fica visível, que é o que permite
         corrigir */
      if(c.children.length === 1){
        const unico = c.lastElementChild;
        c.removeChild(unico);
        const metades = dividirBloco(unico, c);
        if(!metades){ c.appendChild(unico); break; }
        c.appendChild(metades[0]);
        let prox = corpos[i + 1];
        if(!prox){
          const pag2 = document.createElement('div'); pag2.className = 'pagina';
          prox = document.createElement('div'); prox.className = 'pag-corpo';
          pag2.appendChild(prox);
          c.parentElement.parentNode.insertBefore(pag2, c.parentElement.nextSibling);
          corpos.push(prox);
        }
        prox.insertBefore(metades[1], prox.firstChild);
        const em = metades[1].nextElementSibling;
        if(em && em.tagName === 'P' && em.classList.contains('cont')){
          metades[1].textContent = String(metades[1].textContent || '').replace(/\s+$/, '') + ' ' + String(em.textContent || '').replace(/^\s+/, '');
          prox.removeChild(em);
        }
        mexeu++;
        continue;
      }
      let seguinte = corpos[i + 1];
      if(!seguinte){
        const pag = document.createElement('div'); pag.className = 'pagina';
        seguinte = document.createElement('div'); seguinte.className = 'pag-corpo';
        pag.appendChild(seguinte);
        c.parentElement.parentNode.insertBefore(pag, c.parentElement.nextSibling);
        corpos.push(seguinte);
      }
      const sobra = c.lastElementChild;
      c.removeChild(sobra);
      const partes = cabeNaPagina(c) ? dividirBloco(sobra, c) : null;
      const noTopo = partes ? partes[1] : sobra;
      if(partes) c.appendChild(partes[0]);
      seguinte.insertBefore(noTopo, seguinte.firstChild);
      /* o parágrafo que a paginação tinha partido volta a ser um só quando as
         duas metades se reencontram na mesma folha: a metade de cima desceu
         e a continuação (p.cont) já estava no alto da folha seguinte. Sem
         isto o leitor via a frase cortada em dois parágrafos. Só parágrafos
         de texto são partidos (dividirBloco), e a emenda é por texto. */
      const emenda = noTopo.nextElementSibling;
      if(noTopo.tagName === 'P' && emenda && emenda.tagName === 'P' && emenda.classList.contains('cont')){
        noTopo.textContent = String(noTopo.textContent || '').replace(/\s+$/, '') + ' ' + String(emenda.textContent || '').replace(/^\s+/, '');
        seguinte.removeChild(emenda);
      }
      mexeu++;
    }
    /* o título não fica sozinho no pé: se o remanejo deixou um título por
       último, o texto dele já está na folha seguinte — o título vai junto
       (a mesma regra de paginar(); todos os títulos do pé, não só o último) */
    while(volta && corpos[i + 1] && c.children.length > 1 && ehTituloDoc(c.lastElementChild) && !soTemTitulo(c)){
      corpos[i + 1].insertBefore(c.lastElementChild, corpos[i + 1].firstChild);
      mexeu++;
    }
  }
  if(mexeu) renumerarFolhas(host);
  acomodarFolhas.ultimo = mexeu;
  return mexeu;
}

/** Põe folhas prontas numa caixa da tela: acomoda e escala. */
function exibirFolhas(caixa, html, fator){
  caixa.innerHTML = html;
  acomodarFolhas(caixa);
  ajustarEscalaDoc(caixa, fator);
}

   7. Documento
   ========================================================== */
function textoComDetalhes(item){
  const ds = DETALHES[item.id];
  if(!ds) return item.texto;
  const v = state.det[item.id] || {};
  const frases = [];
  ds.forEach(function(f){
    const bruto = brutoDet(v[f.id]);
    const vals = (f.tipo === 'multi') ? ordenarDet(f, listaDet(v[f.id])) : (bruto ? [bruto] : []);
    if(!vals.length) return;
    const val = (f.tipo === 'multi') ? juntarDet(vals) : vals[0];
    if(typeof f.frase === 'string'){
      const molde = (vals.length > 1 && f.frasePl) ? f.frasePl : f.frase;
      frases.push(molde.replace('{v}', val));
    } else {
      frases.push(f.frase[val] || val);
    }
  });
  if(!frases.length) return item.texto;
  const partes = [];
  frases.forEach(function(f){
    if(/^[a-zà-ú]/.test(f) && partes.length) partes[partes.length-1] += ', ' + f;
    else partes.push(f);
  });
  return item.texto + ' ' + partes.map(function(x){ return x.replace(/\.$/,'') + '.'; }).join(' ');
}
/**
 * v8.12 — O parágrafo do corpo do documento sai JUSTIFICADO, como manda a
 * redação oficial. Na tela quem justifica é a folha de estilo; no arquivo
 * que vai para a conversão em PDF vai também o atributo align, porque o
 * conversor do Google descarta boa parte do CSS e o atributo ele respeita.
 * Os dois dizem a mesma coisa — o atributo é o cinto de segurança.
 */
const P_JUST = '<p align="justify">';
/* v8.13 (D16): a tela e o PDF passam a emitir a MESMA quantidade de
   elementos — um <p> por parágrafo nos dois. Até a 8.12 a tela embrulhava
   cada parágrafo num <div class="blk"> e o PDF o soltava como <p>: a
   paginação media um contêiner que dividirBloco não sabia partir, e o
   mesmo conteúdo fechava em 21 folhas na tela e 20 no papel. O realce da
   curadoria continua achando .blk[data-id] — agora no próprio parágrafo. */
function blkBase(item, paraPdf, caminho){
  const txt = textoComDetalhes(item);
  if(paraPdf) return `${P_JUST}${esc(txt)}</p>`;
  return `<p class="blk" data-id="${item.id}"${ed(caminho, false)}>${esc(txt)}</p>`;
}
function blkFixo(txt, paraPdf, caminho){
  if(paraPdf) return `${P_JUST}${esc(txt)}</p>`;
  return `<p class="blk"${ed(caminho)}>${esc(txt)}</p>`;
}
function blkEscola(titulo, txt, paraPdf){
  if(!txt) return '';
  return txt.split(/\n+/).map(function(x){
    return paraPdf ? `${P_JUST}${esc(x.trim())}</p>` : `<p class="blk">${esc(x.trim())}</p>`;
  }).join('');
}
function vazio(chave, paraPdf){
  return `<p class="vazio"${paraPdf ? '' : ed('VAZIOS.' + chave)}>${
    paraPdf ? esc(VAZIOS.pdf) : esc(VAZIOS[chave] || '')}</p>`;
}
function listaTextos(grupo, conector){
  const itens = GRUPOS[grupo].filter(o => state.sel[grupo].has(o.id)).map(o => o.texto);
  if(!itens.length) return '';
  return conector + itens.join('; ') + '.';
}

  r.push(nome + '. Plano de Ação. ' + (state.dados.municipio || '[Município]') + ': ' + (state.dados.escola || '[Escola]') + '.');

function refsDoDocumento(){
  let r = REF_LEGISLACAO.slice();
  Object.keys(REF_COND).forEach(function(g){
    Object.keys(REF_COND[g]).forEach(function(id){
      if(state.sel[g] && state.sel[g].has(id)) r = r.concat(REF_COND[g][id]);
    });
  });
  r = r.concat(refsInstitucionais());
  (state.txt.tReferencias || '').split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(function(x){ r.push(x); });
  const vistas = {}, unicas = [];
  r.forEach(function(x){ if(!vistas[x]){ vistas[x] = true; unicas.push(x); } });
  return unicas.sort(compararReferencias);
}

/**
 * v8.13 (D23) — A ORDEM DA LISTA DE REFERÊNCIAS.
 *
 * localeCompare estrito compara caractere a caractere: punha "Lei nº 8.069"
 * e "Lei nº 9.394" DEPOIS de "Lei nº 15.468", porque "8" vem depois de "1".
 * Tecnicamente alfabético, ilegível numa lista de normas. Agora ordena-se
 * pelo autor (o trecho até o primeiro ponto) e, dentro do mesmo autor e do
 * mesmo tipo de ato, pelo NÚMERO, como número. Sem número, volta ao
 * localeCompare — é o caso da Constituição e dos documentos do MEC.
 */
function autorDaRef(x){
  const i = String(x).indexOf('.');
  return i < 0 ? String(x) : String(x).slice(0, i);
}
function numeroDaRef(x){
  const m = String(x).match(/n[ºo°]\s*([\d.]+)/);
  return m ? parseFloat(m[1].replace(/\./g, '')) : NaN;
}
function tipoDaRef(x){
  /* "Lei", "Resolução SEE", "Resolução CNE/CEB"… — o que vem antes do "nº" */
  const m = String(x).match(/\.\s*([^.]*?)\s*n[ºo°]\s*[\d.]/);
  return m ? m[1].trim() : '';
}
function compararReferencias(a, b){
  const aa = autorDaRef(a), ab = autorDaRef(b);
  if(aa !== ab) return aa.localeCompare(ab, 'pt-BR');
  const ta = tipoDaRef(a), tb = tipoDaRef(b);
  if(ta !== tb) return ta.localeCompare(tb, 'pt-BR');
  const na = numeroDaRef(a), nb = numeroDaRef(b);
  if(!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
  return String(a).localeCompare(String(b), 'pt-BR');
}

/** Disposições finais construídas a partir do que foi efetivamente registrado. */
function disposicoesFinais(){
  const d = state.dados;
  const p = [];
  p.push(d.assembleia
    ? 'Este documento foi apresentado e validado com a comunidade escolar em Assembleia Escolar realizada em ' + dataBR(d.assembleia) + '.'
    : 'Este documento será apresentado e validado com a comunidade escolar em Assembleia Escolar.');
  p.push(d.analiseSre
    ? 'Foi submetido à análise técnica e pedagógica da Superintendência Regional de Ensino em ' + dataBR(d.analiseSre) + ', tendo as contribuições recebidas sido incorporadas à versão final.'
    : 'Será submetido à análise técnica e pedagógica da Superintendência Regional de Ensino, cujas contribuições serão incorporadas à versão final.');
  if(d.aprovacao){
    const q = (d.quorumPresentes && d.quorumTotal)
      ? ', com a presença de ' + d.quorumPresentes + ' dos ' + d.quorumTotal + ' membros, atendido o quórum de maioria absoluta,'
      : ', com observância do quórum de maioria absoluta';
    p.push('Foi aprovado pelo Colegiado Escolar em reunião de ' + dataBR(d.aprovacao) + q + ' e lavratura de ata.');
  } else {
    p.push('Será aprovado pelo Colegiado Escolar em reunião específica, com observância do quórum de maioria absoluta e lavratura de ata.');
  }
  p.push('Após a aprovação, a versão final é encaminhada à Superintendência Regional de Ensino para homologação e arquivamento, sendo amplamente divulgada à comunidade escolar.');
  return p.join(' ');
}

function docHTML(paraPdf){
  const d = state.dados, t = state.txt;

  const sre  = d.sre || '—';
  const dir  = d.direcao.trim() || '—';
  const vig  = d.vigencia.trim();

  /* v8.9: o brasão do Estado no alto de tudo. Na tela, a imagem que o Index
     embutiu uma única vez; no PDF, uma marca que o servidor troca pela mesma
     imagem, para que o documento congelado no Drive não carregue 240 KB de
     base64 em cada PPP da rede. */
  const capa = `
    <div class="capa">
      <div class="brasao">${paraPdf ? '<!--BRASAO-->' : brasaoHTML()}</div>
      <div class="doc-org"><div class="l1">Secretaria de Estado de Educação de Minas Gerais</div>
        <div class="l2">Superintendência Regional de Ensino de ${esc(sre)}</div></div>
      <hr class="doc-rule">
      <div class="doc-title"><h1>Projeto Político-Pedagógico</h1>
        <div class="school">${esc(nome)}</div>
        <div class="meta">${esc(d.municipio.trim()||'—')} — Minas Gerais</div>
        ${vig ? `<div class="meta">Vigência ${esc(vig)}</div>` : ''}</div>
    </div>`;

  const lista = function(grupo, abertura){
    const itens = GRUPOS[grupo].filter(o => state.sel[grupo].has(o.id)).map(o => o.texto);
    return itens.length ? abertura + itens.join('; ') + '.' : '';
  };
  const sec = function(n){
    const chave = (typeof n === 'number') ? 's' + n : n;
    const num = (typeof n === 'number') ? n + '. ' : '';
    return `<h3 class="doc-h" data-sec="${n}"${ed('SECOES.' + chave)}>${num}${esc(SECOES[chave] || '')}</h3>`;
  };
  const sub = function(n){ return `<p class="doc-sub"${ed('SUBSECOES.' + n)}><b>${n} ${esc(SUBSECOES[n] || '')}</b></p>`; };
  const subL = function(k){ return `<p class="doc-sub"${ed('SUBSECOES.' + k)}><b>${esc(SUBSECOES[k] || '')}</b></p>`; };

  /* v8.9: os dados da escola vêm antes do sumário, na folha de rosto */
  const identificacao = sec('ident') +
    `<p class="ident"><b>Escola Estadual:</b> ${esc(nome)}</p>
     <p class="ident"><b>Código da escola:</b> ${esc(d.inep.trim()||'—')}</p>
     <p class="ident"><b>Código INEP (Censo Escolar):</b> ${esc((d.censo||'').trim()||'—')}</p>
     <p class="ident"><b>Município:</b> ${esc(d.municipio.trim()||'—')}</p>

     <p class="ident"><b>Diretor(a):</b> ${esc(dir)}</p>
     <p class="ident"><b>Especialista / Coordenação Pedagógica:</b> ${esc(d.especialista.trim()||'—')}</p>
     <p class="ident"><b>Turnos de funcionamento:</b> ${esc(d.turnos.trim()||'—')}</p>
     <p class="ident"><b>Estudantes atendidos:</b> ${esc(d.estudantes.trim()||'—')} · <b>Turmas:</b> ${esc(d.turmas.trim()||'—')}</p>
     <p class="ident"><b>Etapas de ensino:</b> ${esc(ETAPAS.filter(o=>state.sel.etapas.has(o.id)).map(o=>o.label).join('; ')||'—')}</p>
     <p class="ident"><b>Modalidades ofertadas:</b> ${esc(MODALIDADES.filter(o=>state.sel.mods.has(o.id)).map(o=>o.label).join('; ')||'—')}</p>
     <p class="ident"><b>Vigência do PPP:</b> ${esc(vig||'—')}</p>`;

  let h = sec('apres') + blkFixo(T.apresentacao, paraPdf, 'T.apresentacao') + blkFixo(T.metodologia, paraPdf, 'T.metodologia') +
       (t.tApresentacao ? blkEscola('Apresentação', t.tApresentacao, paraPdf) : '');
  h += subL('justificativa') + blkFixo(T.justificativa, paraPdf, 'T.justificativa') +

       (t.tHistorico ? blkEscola('Histórico', t.tHistorico, paraPdf)
                     : vazio('historico', paraPdf));

       (t.tArticulacao ? blkEscola('Articulação entre os profissionais', t.tArticulacao, paraPdf)
                       : vazio('articulacao', paraPdf));
  h += sub('17.2') + blkFixo(T.decisorio, paraPdf, 'T.decisorio') +
       (t.tDecisorio ? blkEscola('Participação no processo decisório', t.tDecisorio, paraPdf)
                     : vazio('decisorio', paraPdf));

       (t.tPlanoAcao ? blkEscola('Plano de Ação', t.tPlanoAcao, paraPdf) : '');
  h += sub('19.2') + blkFixo(T.avaliacaoInstitucional, paraPdf, 'T.avaliacaoInstitucional') +
       (t.tAvaliacaoInstitucional ? blkEscola('Avaliação institucional', t.tAvaliacaoInstitucional, paraPdf)
                                  : vazio('avaliacaoInstitucional', paraPdf));
  if(t.tBalanco) h += sub('19.3') + blkEscola('Balanço', t.tBalanco, paraPdf);
  h += blkFixo(disposicoesFinais(), paraPdf);

  if(d.aprovacao) h += `<p class="ident"><b>Aprovado pelo Colegiado Escolar em:</b> ${esc(dataBR(d.aprovacao))}</p>`;
  if(vig) h += `<p class="ident"><b>Vigência:</b> ${esc(vig)}, observada a revisão no máximo a cada dois anos.</p>`;

  h += sec(20) +
       (t.tOutrosAspectos ? blkEscola('Outros aspectos', t.tOutrosAspectos, paraPdf)
                          : blkFixo(T.outrosAspectos, paraPdf, 'T.outrosAspectos'));

  h += sec(21) +
    `<div class="refs">${refsDoDocumento().map(r=>`<p class="ref-item">${esc(r)}</p>`).join('')}</div>`;

  /* v8.13 (D19): as caixas de assinatura são da FOLHA, não do corpo. Até a
     8.12 elas entravam aqui sem guarda de paraPdf e, na conclusão,
     APP.assinaturas ainda está vazio: o que congelava eram as caixas de
     PRÉVIA, com os textos de instrução da tela ("Assina no sistema ao
     concluir o documento"), e o PDF oficial saía com DUAS tabelas de caixas.
     Na tela, antes da conclusão, elas continuam aparecendo — é onde a escola
     vê como o documento vai terminar. */
  if(!paraPdf) h += caixasDoDocumento();

  /* v8.13 (D22): o rótulo do item do sumário é o TEXTO do título, não o HTML
     escapado dele — é por ele que a paginação casa o item com a folha em que
     o título caiu, e esc() aplicado duas vezes escreveria "&amp;" no papel. */
  const titulos = ((identificacao + h).match(/<h3 class="doc-h"[^>]*>[^<]+<\/h3>/g) || [])
    .map(x => deEsc(x.replace(/<[^>]+>/g,'')));
  const tituloFolha = (CONTEUDO.padroesServidor && CONTEUDO.itens['DOC.folha.titulo']) ||
               (CONTEUDO.padroesServidor && CONTEUDO.padroesServidor['DOC.folha.titulo']) || '22. Folha de assinaturas';
  /* v8.13 (D22): cada item leva o número da folha em que a seção começa — um
     sumário sem indicativo de página não localiza nada num documento de
     quinze a vinte folhas, e a ABNT NBR 6027 o exige. O número é escrito
     depois de paginar, porque é a paginação que o conhece; o item da folha de
     assinaturas é preenchido pelo servidor, que é quem monta o documento
     completo. */
  const itemSum = function(rotulo, alvo){
    return `<p class="sum-item" data-sum="${esc(alvo)}"><span class="sum-tx">${esc(rotulo)}</span><span class="sum-pag"></span></p>`;
  };
  const sumario = `<div class="sumario"><h3 class="doc-h"${ed('SECOES.sumario')}>${esc(SECOES.sumario)}</h3>
    ${titulos.map(x=>itemSum(x, x)).join('')}${itemSum(tituloFolha, 'folha')}</div>`;
  /* v8.9: a quebra é a mesma na tela e no PDF — quem pagina é o sistema */
  const quebra = '<div class="quebra"></div>';
  const preenchidos = Object.keys(state.txt).filter(k=>state.txt[k].trim()).length;

  return {
    html: capa + identificacao + quebra + sumario + quebra + h,
    marcados: Object.keys(state.sel).reduce((a,g)=>a+state.sel[g].size,0),
    escritos: preenchidos
  };
}

function secaoDaTela(i){
  const t = TELAS[i];
  if(!t) return 0;
  if(t.tipo === 'dados')       return 'ident';
  if(t.tipo === 'balanco')     return 19;
  if(t.tipo === 'indicadores') return 2;
  if(t.tipo === 'final')       return 19;
  if(t.modulo === 0)           return 'apres';
  if(t.grupo)                  return SECAO_GRUPO[t.grupo] || 0;
  if(t.campos && t.campos.length) return SECAO_CAMPO[t.campos[0].id] || 0;
  for(let j = i + 1; j < TELAS.length; j++){
    if(TELAS[j].modulo !== t.modulo) break;
    const sec = secaoDaTela(j);
    if(sec) return sec;
  }
  return 0;
}

/** destaca no documento a seção correspondente à tela atual */
function marcarSecao(rolar){
  const n = secaoDaTela(state.tela);
  const doc = $('#docMini');
  doc.querySelectorAll('.foco,.em-foco').forEach(function(el){
    el.classList.remove('foco'); el.classList.remove('em-foco');
  });
  if(!n && n !== 0) return;
  const alvo = doc.querySelector('h3.doc-h[data-sec="' + n + '"]');
  if(!alvo) return;
  alvo.classList.add('foco');
  let el = alvo.nextElementSibling;
  while(el && el.tagName !== 'H3'){ el.classList.add('em-foco'); el = el.nextElementSibling; }
  if(rolar){
    const cx = $('#docScroll');
    /* v9.1: pela posição desenhada, e não por offsetTop — que é relativo à
       folha (position:relative) e ignora o transform: a prévia não rolava
       até a seção da tela desde a folha A4 (v8.9) */
    if(cx){
      const r = alvo.getBoundingClientRect(), rc = cx.getBoundingClientRect();
      cx.scrollTop = Math.max(0, cx.scrollTop + (r.top - rc.top) - 14);
    }
    alvo.classList.remove('pulsa'); void alvo.offsetWidth; alvo.classList.add('pulsa');
  }
}

/* v8.6 (E2): o documento em tela cheia é como o Colegiado lê antes de assinar.
   No celular são dezenas de telas de rolagem; o sumário permite saltar. */
function montarSumarioDoc(){
  const lista = $('#docSumarioLista'); if(!lista) return;
  const hs = Array.prototype.slice.call($('#docFull').querySelectorAll('h3.doc-h'));
  hs.forEach(function(h, i){ if(!h.id) h.id = 'docsec-' + i; });
  lista.innerHTML = hs.map(function(h){
    return '<button type="button" class="doc-sum-item" data-sec="' + h.id + '">' + esc(h.textContent) + '</button>';
  }).join('');
  const cx = $('#docSumario');
  if(cx){ cx.hidden = hs.length < 3; cx.open = false; }
}
let _renderTimer = null;
function renderDocSuave(){                 // usado nos campos de texto: evita redesenhar a cada tecla
  clearTimeout(_renderTimer);
  _renderTimer = setTimeout(function(){ renderDoc(); }, 120);
}
function renderDoc(flashId){
  clearTimeout(_renderTimer);
  const d = docHTML(false);
  const cx = $('#docScroll');
  const pos = cx ? cx.scrollTop : 0;           // preserva a leitura durante a digitação
  exibirFolhas($('#docMini'), paginar(d.html), docZoom / 100);   /* v8.9: páginas A4, como sai impresso; v9.1: acomodadas e escaladas por transform */
  if(cx) cx.scrollTop = pos;
  const paginas = $('#docMini').querySelectorAll('.pagina').length;
  /* v8.13 (D17): a prévia lateral redesenha a cada tecla — aqui o aviso é um
     toque, e uma vez só; o alerta de verdade fica na prévia e na conclusão. */
  if(paginar.excedeu){
    if(!_excedenteAvisado){ _excedenteAvisado = true; toast('O documento excedeu a paginação em A4: veja a última folha.'); }
  } else { _excedenteAvisado = false; }
  const nSec = (d.html.match(/<h3 class="doc-h"[^>]*>/g) || []).length - 1;   // exclui o próprio sumário
  $('#miniCount').innerHTML = `<b>${nSec}</b> seções · ${n(paginas, 'página', 'páginas')} A4`;
  marcarSecao(false);
  atualizarPendencias();
  if(!$('#panelFinal').hidden) buildChecklist();
  if(!$('#ovDoc').hidden && !APP.docFullAlheio) exibirFolhas($('#docFull'), paginar(d.html), docZoomCheio / 100);   /* v9.1: a tela cheia com documento alheio não se sobrescreve */
  if(flashId){
    const b = $('#docMini').querySelector(`.blk[data-id="${flashId}"]`);
    if(b){ b.classList.add('flash'); b.scrollIntoView({block:'nearest'}); }
  }
}

/* v8.8 (F2) — A tela final era um paredão de 37 pendências que não levavam a
   lugar nenhum: a referência ("Seção 2.1") era texto morto, e eram cinco a
   seis telas de rolagem até o botão de concluir. Cada item passa a ser um
   botão que leva à tela onde ele se resolve, os itens são agrupados por
   módulo, e o módulo já pronto vem recolhido.

   Para onde cada item leva sai do próprio teste do item: se ele consulta
   state.txt.tX, a tela é a do campo tX; se consulta state.sel.g, é a da
   marcação do grupo g. Assim não há uma segunda lista para manter em dia. */
function telaDoItem(c){
  const fonte = String(c.ok);
  const grupo = (fonte.match(/state\.sel\.(\w+)/) || [])[1];
  const campo = (fonte.match(/state\.txt\.(\w+)/) || [])[1];
  const telaDoGrupo = function(g){ return TELAS.findIndex(function(t){ return t.tipo === 'marcacao' && t.grupo === g; }); };
  const telaDoCampo = function(k){ return TELAS.findIndex(function(t){ return (t.campos || []).some(function(x){ return x.id === k; }); }); };
  /* falta marcar? leva à marcação. Já marcou e falta escrever? leva ao texto. */
  if(grupo && state.sel[grupo] && state.sel[grupo].size === 0){ const i = telaDoGrupo(grupo); if(i >= 0) return i; }
  if(campo){ const i = telaDoCampo(campo); if(i >= 0) return i; }
  /* v8.13 (D14/A4-11): A ORDEM IMPORTA. O item dos indicadores cita
     `state.sel.etapas` E `state.ind.etapas`; com o teste de grupo antes deste,
     ele ganhava sempre e o item apontava a tela das ETAPAS — o rótulo dizia
     "ir para a tela 8", a tela 8 é a marcação das etapas e o clique parava na
     tela 2. Três destinos para o mesmo toque, e nenhum deles onde o item se
     resolve. Quem cita a tabela de indicadores vai para a tabela. */
  if(/state\.ind\./.test(fonte)) return TELAS.findIndex(function(t){ return t.tipo === 'indicadores'; });
  if(grupo){ const i = telaDoGrupo(grupo); if(i >= 0) return i; }
  /* a aprovação e o quórum são preenchidos na própria tela final */
  if(/aprovacao|assembleia|quorum/.test(fonte)) return TELAS.length - 1;
  if(/state\.dados\./.test(fonte)) return TELAS.findIndex(function(t){ return t.tipo === 'dados'; });
  return -1;
}
function buildChecklist(){
  const feitos = CHECK.filter(function(c){ return c.ok(); }).length;
  const itens = CHECK.map(function(c){
    const i = telaDoItem(c);
    return {c: c, ok: c.ok(), tela: i, modulo: (i >= 0 && TELAS[i]) ? TELAS[i].modulo : 99};
  });
  const mods = [];
  itens.forEach(function(x){
    let g = mods.filter(function(m){ return m.modulo === x.modulo; })[0];
    if(!g){ g = {modulo: x.modulo, itens: []}; mods.push(g); }
    g.itens.push(x);
  });
  mods.sort(function(a, b){ return a.modulo - b.modulo; });
  const linha = function(x){
    const rot = esc(x.c.t) + (x.ok ? '' : ' — pendente');
    const ref = '<span class="ck-ref">' + esc(x.c.ref) + (x.ok || x.tela < 0 ? '' : ' · ir para a tela ' + (x.tela + 1)) + '</span>';
    if(x.tela < 0) return '<div class="check-item"><span class="ck ' + (x.ok ? 'ok' : 'pend') + '">' +
      (x.ok ? ico('check') : ico('alerta')) + '</span><span>' + rot + ref + '</span></div>';
    return '<button type="button" class="check-item check-link" data-ck-tela="' + x.tela + '">' +
      '<span class="ck ' + (x.ok ? 'ok' : 'pend') + '">' + (x.ok ? ico('check') : ico('alerta')) + '</span>' +
      '<span>' + rot + ref + '</span></button>';
  };
  $('#checklist').innerHTML =
    `<div class="check-item" style="border-bottom:1px solid var(--linha);padding-bottom:10px;margin-bottom:4px">
       <span class="ck ${feitos===CHECK.length?'ok':'pend'}">${feitos===CHECK.length?ico('check'):feitos}</span>
       <span><b>${feitos} de ${CHECK.length} itens preenchidos</b>
       <span class="ck-ref">${APP.protocolo ? 'Protocolo '+APP.protocolo : 'PPP ainda não salvo'} · selecione um item pendente para ir até ele</span></span></div>` +
    mods.map(function(g){
      const nome = (MODULOS[g.modulo] ? 'Módulo ' + (g.modulo + 1) + ' · ' + MODULOS[g.modulo].n : 'Outros itens');
      const pend = g.itens.filter(function(x){ return !x.ok; }).length;
      return '<details class="check-mod"' + (pend ? ' open' : '') + '>' +
        '<summary><span>' + esc(nome) + '</span><span class="ck-tag ' + (pend ? 'pend' : 'ok') + '">' +
        (pend ? n(pend, 'pendente', 'pendentes') : 'tudo pronto') + '</span>' + ico('seta-baixo') + '</summary>' +
        g.itens.map(linha).join('') + '</details>';
    }).join('');
}

   Mapa do percurso (v6.1)

const TIPO_ROTULO = {formativa:'Formação', reflexao:'Reflexão', aprofundamento:'Aprofundamento', dados:'Dados',
                     marcacao:'Marcação', indicadores:'Indicadores', escrita:'Escrita', final:'Conclusão',
                     balanco:'Balanço'};
function tituloDaTela(t){
  return (t.conteudo && t.conteudo.titulo) || t.titulo ||
         (t.tipo==='dados' ? 'Identificação da escola' : t.tipo==='final' ? 'Aprovação, conclusão e assinaturas' : '');
}
/** situação de cada tela: {cls, txt} */
function situacaoTela(i){
  const t = TELAS[i];
  if(t.tipo==='formativa' || t.tipo==='reflexao'){
    const tar = tarefaDaTela(i);
    if(tar && tar.obrigatorio) return tarefaCompleta(i) ? {cls:'ok', txt:'preparação confirmada'} : {cls:'pend', txt:'preparação pendente'};
    return {cls:'neutro', txt:'leitura'};
  }
  if(t.tipo==='dados') return (state.dados.escola && state.dados.inep && state.dados.municipio) ? {cls:'ok', txt:'preenchida'} : {cls:'pend', txt:'faltam dados'};
  if(t.tipo==='marcacao'){ const qtd = state.sel[t.grupo].size; return qtd ? {cls:'ok', txt:n(qtd, 'marcada', 'marcadas')} : {cls:'pend', txt:'nada marcado'}; }
  if(t.tipo==='indicadores'){
    const algum = ETAPAS.some(o=>{ const l=state.ind.etapas[o.id]||{}; return state.sel.etapas.has(o.id) && IND_COLS.some(c=>String(l[c.k]||'').trim()); });
    return algum ? {cls:'ok', txt:'tabela preenchida'} : {cls:'pend', txt:'tabela vazia'};
  }
  if(t.tipo==='escrita' || t.tipo==='aprofundamento' || t.tipo==='balanco'){
    const campos = (t.campos||[]).filter(c=>!c.opcional);
    if(!campos.length) return {cls:'neutro', txt:'leitura'};
    const feitos = campos.filter(c=>state.txt[c.id].trim()).length;
    return feitos === campos.length ? {cls:'ok', txt:'texto escrito'} : {cls:'pend', txt:feitos + ' de ' + n(campos.length, 'texto', 'textos')};
  }
  if(t.tipo==='final') return state.dados.aprovacao ? {cls:'ok', txt:'aprovação registrada'} : {cls:'pend', txt:'aprovação pendente'};
  return {cls:'neutro', txt:''};
}
function abrirMapa(){
  const qtd = telasVisiveis().length;   /* v8.6 (E6): o número era fixo no HTML */
  $('#mapaQtd').textContent = 'As ' + qtd + ' telas do percurso e o que ainda falta em cada uma.';
  $('#mapaCorpo').innerHTML = MODULOS.map(function(m, mi){
    const telas = TELAS.map((t,i)=>({t:t,i:i})).filter(x=>x.t.modulo===mi && telaVisivel(x.i));
    const pend = pendenciasModulo(mi);
    return `<div class="mapa-mod"><h4>Módulo ${mi+1} · ${esc(m.n)} ${pend ? `<span class="pend">${pend}</span>` : ''}</h4>` +
      telas.map(function(x){
        const st = situacaoTela(x.i);
        return `<button class="mapa-tela ${x.i===state.tela?'atual':''}" data-ir="${x.i}">

          <span>${esc(tituloDaTela(x.t))}</span><span class="st ${st.cls}">${esc(st.txt)}</span></button>`;
      }).join('') + `</div>`;
  }).join('');
  $('#ovMapa').hidden = false;
  const atual = $('#mapaCorpo .mapa-tela.atual'); if(atual) atual.focus();
}

   8. Navegação
