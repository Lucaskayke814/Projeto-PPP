}
/* Os papéis, em espelho do servidor. A tela não decide competência — ela
   apenas deixa de oferecer o que o servidor recusaria. */
const PAPEIS_UI = {
  central:              {nome:'Órgão Central',                          cadastra:['central','superintendente']},
  superintendente:      {nome:'Superintendente Regional de Ensino',     cadastra:['diretor_educacional','coordenador_inspecao']},
  diretor_educacional:  {nome:'Diretor Educacional',                    cadastra:['equipe_de']},
  coordenador_inspecao: {nome:'Coordenador de Inspeção',                cadastra:['equipe_inspecao']},
  equipe_de:            {nome:'Equipe da Diretoria Educacional',        cadastra:[]},
  equipe_inspecao:      {nome:'Equipe da Coordenação de Inspeção',      cadastra:[]},
  diretor_escolar:      {nome:'Direção Escolar',                        cadastra:['colegiado']},
  colegiado:            {nome:'Colegiado Escolar',                      cadastra:[]}
};
function nomePapel(p){ return (PAPEIS_UI[p] && PAPEIS_UI[p].nome) || p || '—'; }

function abrirPorta(porta){
  $('#portas').hidden = true;
  $('#portasVoltar').hidden = true;
  $('#landErro').classList.remove('show');
  SESSAO.porta = porta;
  if(APP.local){
    /* Na demonstração não há conta institucional a identificar: a escolha do
       perfil faz esse papel. E como os perfis passaram a ser vários dentro
       da mesma regional, a porta da regional abre a escolha do papel a
       simular. A direção e o colegiado entram direto, cada um pela sua
       porta (v7.4: o colegiado saiu de dentro da porta da direção). */
    const papeis = (porta === 'central')
      ? [{p:'central', d:'Acompanha toda a rede, cadastra os Superintendentes e edita os textos do sistema'}]
      : (porta === 'escola')
        ? [{p:'diretor_escolar', d:'Elabora o PPP, cadastra o colegiado e assina'}]
      : (porta === 'colegiado')
        ? [{p:'colegiado', d:'Lê o PPP da sua escola e assina dentro do sistema'}]
        : [{p:'superintendente', d:'Cadastra os Diretores Educacionais e o Coordenador de Inspeção da sua SRE'},
           {p:'diretor_educacional', d:'Cadastra a sua equipe, valida os PPPs e associa diretores às escolas'},
           {p:'equipe_de', d:'Valida os PPPs e associa diretores às escolas'},
           {p:'coordenador_inspecao', d:'Cadastra a equipe da Coordenação de Inspeção; no PPP, apenas lê'},
           {p:'equipe_inspecao', d:'Apenas leitura dos PPPs das escolas da sua SRE'}];
    if(papeis.length === 1){ SESSAO.papelDemo = papeis[0].p; entrarInst(); return; }
    $('#papelLista').innerHTML = papeis.map(function(x){
      return `<button class="porta" data-papel="${esc(x.p)}">
        <span class="pt">${esc(nomePapel(x.p))}</span>
        <span class="pd">${esc(x.d)}</span></button>`;
    }).join('');
    $('#portaPapel').hidden = false;
    return;
  }
  $('#portaInst').hidden = false;
  const central = (porta === 'central');
  const escola = (porta === 'escola');
  const colegiado = (porta === 'colegiado');
  $('#instTitulo').textContent = central ? 'Órgão Central'
    : (escola ? 'Direção Escolar' : colegiado ? 'Colegiado Escolar' : 'Superintendência Regional de Ensino');
  $('#instSub').textContent = central
    ? 'Informe a senha institucional do Órgão Central. Sem ela, o acesso não é liberado.'
    : (escola
        ? 'Informe o e-mail e a senha cadastrados para a direção da sua escola pela Superintendência Regional de Ensino.'
        : colegiado
        ? 'Informe o e-mail e a senha que você criou pelo link de primeiro acesso, enviado quando a direção da escola cadastrou você no Colegiado.'
        : 'Informe o e-mail e a senha cadastrados pelo Órgão Central para a sua regional.');
  $('#instCampoEmail').hidden = false;
  $('#instCampoNome').hidden = !central;
  $('#instCampoMasp').hidden = !central;
  /* v7.4 (P3): não há mais "abrir por protocolo" — o PPP começado antes do
     cadastro é adotado pela regional (adotarPPP) */
  $('#linkProtocolo').hidden = true;
  setTimeout(function(){ $('#instEmail').focus(); }, 60);
}
const PASSOS_LANDING = ['portaEntrada','portaEscola','portaInst','portaModo','portaIdent',
                        'portaSemCadastro','portaPapel','portaPrimeiro','portaVerificar'];
function esconderPassosLanding(){
  PASSOS_LANDING.forEach(function(id){ const e = $('#' + id); if(e) e.hidden = true; });
}
function voltarPortas(){
  esconderPassosLanding();
  SESSAO.porta = '';
  $('#landRetomar').classList.remove('open');
  $('#landErro').classList.remove('show');
  $('#portas').hidden = false;
  $('#portasVoltar').hidden = false;

}

/* ==========================================================
   v8.12 — A ANTESSALA
   ==========================================================
   Duas coisas se pode querer ao abrir o sistema: entrar nele, ou conferir
   um documento que se recebeu. Até a 8.11 a conferência era mais uma porta
   entre as dos perfis, o que a fazia parecer um acesso — e ela não é: não
   tem sessão, não tem perfil e não tem senha. Agora a escolha vem antes, e
   só o lado esquerdo leva ao login. */
function irParaEntrada(){
  esconderPassosLanding();
  SESSAO.porta = '';
  $('#portas').hidden = true;
  $('#portasVoltar').hidden = true;
  $('#landRetomar').classList.remove('open');
  $('#landErro').classList.remove('show');
  $('#uiLandLgpd').hidden = true;
  $('#uiLandSub').hidden = true;
  $('#uiLandEntrada').hidden = false;
  $('#portaEntrada').hidden = false;
}
function entrarNoSistema(){
  $('#portaEntrada').hidden = true;
  $('#uiLandEntrada').hidden = true;
  $('#uiLandSub').hidden = false;
  $('#uiLandLgpd').hidden = false;
  $('#portas').hidden = false;
  $('#portasVoltar').hidden = false;
  mostrarIdentificacao();
}
function abrirAutenticacao(){
  esconderPassosLanding();
  $('#portas').hidden = true;
  $('#portasVoltar').hidden = true;
  $('#uiLandLgpd').hidden = true;
  $('#uiLandSub').hidden = true;
  $('#uiLandEntrada').hidden = true;
  $('#portaVerificar').hidden = false;
  $('#verifResultado').innerHTML = '';
  setTimeout(function(){ const c = $('#verifCodigo'); if(c) c.focus(); }, 60);
}
function entrarInst(){
  const erro = $('#landErro'); erro.classList.remove('show');
  const btn = $('#btnEntrarInst'); btn.disabled = true; btn.textContent = 'Entrando…';
  servidor('entrarInstitucional', {email:$('#instEmail').value.trim(), senha:$('#instSenha').value,
      nome:$('#instNome').value.trim(), masp:$('#instMasp').value.trim(),
      perfilDemo:SESSAO.porta, papelDemo:SESSAO.papelDemo || '',
      /* v7.4: a porta vai junto — o servidor recusa colegiado pela porta da
         direção, e direção pela porta do colegiado */
      porta:SESSAO.porta},
    function(res){
      btn.disabled = false; btn.textContent = 'Entrar';
      if(!res || !res.ok){ erro.textContent = (res && res.erro) || 'Não foi possível entrar.'; erro.classList.add('show'); return; }
      aplicarSessao(res);
      $('#instSenha').value = '';
      if(res.perfil === 'central'){ $('#portaInst').hidden = true; $('#portaModo').hidden = false; }
      else { SESSAO.modo = 'visualizacao'; $('#landing').hidden = true; abrirPainelInst(); }
    },
    function(){ btn.disabled = false; btn.textContent = 'Entrar';
      erro.textContent = 'Falha de comunicação com o servidor.'; erro.classList.add('show'); });
}
function escolherModo(modo){
  SESSAO.modo = modo; guardarSessao();
  $('#landing').hidden = true;
  if(modo === 'edicao') entrarModoEdicao(); else abrirPainelInst();
}
function sairSessao(confirmado){
  if(!confirmado && Object.keys(CUR.rascunhos || {}).length)
    return confirmar('Há alterações de texto em rascunho, ainda não publicadas.\n\nSair mesmo assim? O rascunho fica guardado e você o encontra ao entrar de novo.',
      function(){ sairSessao(true); }, {titulo:'Sair do sistema', rotulo:'Sair mesmo assim'});
  /* v7.8 (P7): sair também no servidor — o token deixa de valer */
  if(SESSAO.token){ const tk = SESSAO.token; servidor('sair', {token:tk}, function(){}, function(){}); }
  esquecerSessaoGuardada();
  zerarSessao();
  CUR.token = ''; CUR.rascunhos = {};
  sairEdicao(true);
  $('#ovDoc').hidden = true;
  $('#painelInst').hidden = true;
  $('#stage').hidden = false;
  $('#btnPainel').hidden = true;
  irParaEntrada();
  $('#landing').hidden = false;
}

/* ---- painel institucional ---- */
const STATUS_LISTA = ['Em andamento','Em validação','Validado','Em assinatura','Assinado','Concluído','Enviado para homologação','Homologado'];
let PAINEL = {linhas:[], sres:[]};
/** O selo do alto, no painel: papel e unidade da sessão. Volta a ele quando o
    documento aberto para consulta é fechado (v7.3, T-19). */
function badgeDoPainel(){
  const central = SESSAO.perfil === 'central', escola = SESSAO.perfil === 'escola';
  $('#badgeProto').textContent = SESSAO.papelNome
    ? (SESSAO.papel === 'central' ? 'Órgão Central'
       : (escola ? SESSAO.papelNome : SESSAO.papelNome + ' · ' + SESSAO.sre))
    : (central ? 'Órgão Central' : (escola ? 'Direção Escolar' : 'SRE ' + SESSAO.sre));
  $('#badgeProto').classList.remove('salvo');
  $('#badgeUser').textContent = SESSAO.nome || '';
}
function abrirPainelInst(){
  $('#btnPainel').hidden = true;
  /* v9.0 (M06): a faixa "Documento homologado" é do percurso; ao voltar ao
     painel ela ficava presa no topo, por cima da lista da regional. */
  $('#travaRibbon').hidden = true;
  const central  = SESSAO.perfil === 'central';
  const regional = SESSAO.perfil === 'regional';
  const escola   = SESSAO.perfil === 'escola';
  badgeDoPainel();
  $('#stage').hidden = true;
  $('#painelInst').hidden = false;
  $('#trilha').parentElement.hidden = true;
  /* v9.0 (R20): o olho-de-página diz só o papel; " · valida os PPPs" repetia o que a fila já mostra. */
  $('#piEyebrow').textContent = (SESSAO.papelNome || (central ? 'Órgão Central' : (escola ? 'Direção Escolar' : 'Superintendência Regional de Ensino'))) +
    (SESSAO.soLeitura ? ' · somente leitura' : '');
  $('#piTitulo').textContent = central ? 'Documentos de toda a rede'
    : (escola ? (SESSAO.escola || 'Projetos Político-Pedagógicos da escola')
              : 'Documentos da SRE ' + SESSAO.sre);
  $('#piSub').textContent = escola
    ? SESSAO.nome + (SESSAO.inep ? ' · código ' + SESSAO.inep : '') + (SESSAO.sre ? ' · SRE ' + SESSAO.sre : '')
    : SESSAO.nome + (central ? ' · acesso a todas as regionais' : ' · acesso às escolas desta regional');
  const abaInicial = (SESSAO.papel === 'colegiado') ? 'assinaturas' : 'docs';
  /* CADA PAPEL VÊ O QUE LHE CABE. A tela não decide competência — ela deixa
     de oferecer o que o servidor recusaria, e diz por quê quando importa. */
  const papel = SESSAO.papel || (central ? 'central' : (escola ? 'diretor_escolar' : 'superintendente'));
  const colegiado = (papel === 'colegiado');
  const cadastra = (SESSAO.cadastra && SESSAO.cadastra.length) ? SESSAO.cadastra
                 : ((PAPEIS_UI[papel] || {}).cadastra || []);
  $('#piAbas').hidden = false;
  /* v9.7: cada nível administra só o nível imediatamente abaixo. Os
     diretores escolares são da Diretoria Educacional e da sua equipe
     (SESSAO.podeAssociar); a BASE de escolas é do Órgão Central (que a
     carrega na implantação, com a carga inicial de diretores junto) e da
     Diretoria Educacional. */
  $('#piAbaAcessos').hidden = escola || !SESSAO.podeAssociar;
  $('#piAbaEscolas').hidden = !(central || (regional && SESSAO.podeAssociar));
  /* "Minha equipe" existe para quem tem quem cadastrar dentro da regional */
  const cadastraEquipe = cadastra.filter(function(x){ return x !== 'central' && x !== 'superintendente' && x !== 'colegiado'; });
  $('#piAbaEquipe').hidden = !(regional && cadastraEquipe.length);
  $('#piAbaEquipe').textContent = (papel === 'superintendente') ? 'Equipe da Superintendência' : 'Minha equipe';
  /* v8.13 (C16): a lista de contas a regularizar é de quem associa diretores
     — e também da DIREÇÃO ESCOLAR, que é quem cadastra o Colegiado e é a
     única a quem o aviso de conta pendente de um docente ou servidor
     administrativo pode servir. O escopo de cada uma é decidido pelo
     servidor (contasPendentes), nunca por esta linha. */
  $('#piAbaContas').hidden = !(SESSAO.podeAssociar || papel === 'diretor_escolar');
  $('#piAbaInst').hidden = !central;
  $('#piAbaInst').textContent = 'Acesso do superintendente';
  /* v7.7 (P5): a cobertura — escolas, inclusive as sem PPP — é da regional e do Central */
  $('#piAbaCobertura').hidden = escola;
  COB = {sre:'', dados:null, mun:'', filtro:''};
  $('#piAbaColegiado').hidden = (papel !== 'diretor_escolar');
  $('#piAbaAssinaturas').hidden = !(papel === 'colegiado' || papel === 'diretor_escolar');
  /* v8.13 (E08, A7-02): o histórico de associações é de quem MANTÉM
     cadastros, e a fonte é a mesma que #piAbaAcessos e #piAbaContas já usam
     (SESSAO.cadastra). O comentário anterior dizia que os dois papéis de
     Inspeção "acompanham os cadastros da sua SRE" — e o código entregava à
     Inspeção o histórico de todos os institucionais e de todas as direções
     escolares da regional. Quem recusa é o servidor; a tela esconde a aba por
     consequência, não por causa: o Coordenador de Inspeção continua com ela
     (mantém a própria equipe) e a Equipe de Inspeção não.
     v8.13 (F06, R1-02): a Equipe da Diretoria Educacional VOLTA a tê-la. Ela
     não cadastra ninguém, mas ASSOCIA diretores às escolas — é o que a aba
     "Acessos das escolas" faz —, e quem associa precisa poder ver o que
     associou, por quem e quando. A razão que este comentário dava ("quem
     recusa é o servidor") é justamente a que manda devolvê-la: o servidor
     calcula ["diretor_escolar"] para ela. */
  /* v9.6: a aba única do histórico saiu — cada caixa de cadastro traz o
     histórico da sua categoria (historicoEmbutido). O id fica, oculto. */
  $('#piAbaHistorico').hidden = true;
  $('#piEditar').hidden = !central;
  $('#piNovo').hidden = (papel !== 'diretor_escolar');
  $('#piNovo').title = '';
  /* v8.9: baixar planilha é do Órgão Central — a regional acompanha pelo
     painel e pela aba Cobertura, sem extrair lista da rede para fora.
     v8.13 (E09, A7-05): a política vale para as TRÊS planilhas — painel,
     cobertura e "contas a regularizar". Esta última era a exceção, e era
     justamente a que tinha mais dado pessoal. A coluna MASP não sai mais do
     sistema em planilha nenhuma: ela existe para identificar quem assina, e
     regularizar e-mail não precisa dela. O que a regional perde é a extração
     em massa, não a informação: a aba continua na tela, com busca, filtro e
     o botão de copiar o link de primeiro acesso. */
  $('#piExportar').hidden = !central;
  $('#piSre').parentElement.style.display = '';
  $('#piSre').hidden = !central;
  $('#piBusca').hidden = escola;
  if($('#piBuscaDica')) $('#piBuscaDica').hidden = escola;   /* v8.13 (E11) */
  $('.pi-filtros').classList.toggle('uma', escola);
  $('#piStatus').innerHTML = '<option value="">Todas as situações</option>' +
    STATUS_LISTA.map(x=>`<option>${esc(x)}</option>`).join('') +
    (escola ? '' : '<option value="__vencidas">Somente revisão vencida</option>');
  mostrarAbaPainel(abaInicial);
  carregarPainel();
}
function mostrarAbaPainel(aba){
  ['docs','cobertura','acessos','escolas','equipe','contas','inst','colegiado','assinaturas','historico'].forEach(function(x){
    const el = $('#pi' + x.charAt(0).toUpperCase() + x.slice(1));
    if(el) el.hidden = (x !== aba);
  });
  $$('#piAbas button').forEach(function(b){ b.classList.toggle('on', b.dataset.aba === aba); });
  if(aba === 'cobertura') carregarCobertura();
  if(aba === 'acessos') carregarAcessos();
  if(aba === 'escolas') carregarBaseEscolas();
  if(aba === 'equipe') carregarMinhaEquipe();
  if(aba === 'contas') carregarContasPendentes();
  if(aba === 'inst') carregarInstitucionais();
  if(aba === 'colegiado') carregarColegiado();
  if(aba === 'assinaturas') carregarMinhasAssinaturas();
  if(aba === 'historico') carregarHistoricoAssociacoes();
}

/* ==========================================================
   v8.12 — HISTÓRICO DE ASSOCIAÇÕES, EM TODOS OS NÍVEIS
   ==========================================================
   Quem pôs esta pessoa neste perfil, quando, e quem a tirou. A pergunta
   vale para o Órgão Central e vale para a direção que cadastra o Colegiado
   da sua escola — e até aqui só tinha resposta para os diretores escolares
   e, no Órgão Central, para os acessos institucionais. O escopo é o da
   sessão: ninguém vê fora do que gere. */
let HIST_GRUPO = '';
/* v8.13 (C02): o Colegiado só é grupo possível no escopo ESCOLAR — é a
   direção quem o cadastra e a única que pode vê-lo. Fora dali o servidor
   devolve lista vazia; a lista abaixo é montada a partir do escopo da
   RESPOSTA para que a tela não ofereça um filtro que será recusado. */
const HIST_GRUPOS_BASE = [{v:'', r:'Tudo'}, {v:'institucional', r:'Regionais e Órgão Central'},
                          {v:'escola', r:'Direções escolares'}];
function gruposDoHistorico(res){
  return (res && res.escopo === 'escola')
    ? HIST_GRUPOS_BASE.concat([{v:'colegiado', r:'Colegiado Escolar'}])
    : HIST_GRUPOS_BASE;
}
function carregarHistoricoAssociacoes(){
  $('#piHistorico').innerHTML = '<p class="pi-vazio carregando">Carregando o histórico de acessos…</p>';
  servidor('historicoAssociacoes', {token:SESSAO.token, grupo:HIST_GRUPO}, function(res){
    if(!res || !res.ok){
      $('#piHistorico').innerHTML = '<p class="pi-vazio erro">' + esc((res && res.erro) || 'Não foi possível carregar o histórico de acessos.') + '</p>';
      return;
    }
    desenharHistoricoAssociacoes(res);
  }, function(){ $('#piHistorico').innerHTML = '<p class="pi-vazio erro">' + TXT_SEM_RESPOSTA + '</p>'; });
}
/* v9.0 (item 62): devolve a locução inteira ("na SRE X", "em toda a rede") —
   o modelo antepunha "em" e saía "em a SRE Divinópolis". */
function ondeDoHistorico(res){
  if(res.escopo === 'rede') return 'de superintendente, cadastrado pelo Órgão Central';   /* v9.6 */
  if(res.escopo === 'sre') return 'na SRE ' + (res.sre || '—');
  return res.escola ? 'em ' + res.escola : 'na sua escola';
}
function desenharHistoricoAssociacoes(res){
  const L = res.linhas || [];
  const daEscola = (res.escopo === 'escola');
  $('#piHistorico').innerHTML = `
    <p class="hint" style="max-width:76ch;margin-bottom:14px">Cada linha é um período de acesso ${esc(ondeDoHistorico(res))}:
      quando começou, quem o registrou, quando terminou e quem o encerrou. O histórico não se apaga — cadastrar,
      alterar, suspender e remover deixam todos o seu rastro.</p>
    ${(daEscola || res.escopo === 'rede') ? '' : `<div class="pi-filtros uma" style="margin-bottom:12px">
      <select id="histGrupo" aria-label="Tipo de acesso">${
        gruposDoHistorico(res).map(function(g){ return `<option value="${esc(g.v)}"${g.v === HIST_GRUPO ? ' selected' : ''}>${esc(g.r)}</option>`; }).join('')}</select>
    </div>`}
    ${L.length ? `<div class="gh-lista">${L.map(function(g){
      return `<div class="gh ${g.vigente ? 'atual' : ''}">
        <span class="per" aria-hidden="true"></span>
        <span><b>${esc(g.nome || '(sem nome)')}${g.vigente ? '<span class="marca">vigente</span>' : ''}</b>
          <span class="meta">${esc(g.email || '—')}${g.masp ? ' · MASP ' + esc(g.masp) : ''} · ${esc(rotuloPerfilHist(g))}</span>
          ${g.observacao ? '<span class="meta">' + esc(g.observacao) + '</span>' : ''}
          <span class="meta">${esc(g.inicio || '—')} até ${g.fim ? esc(g.fim) : 'hoje'}${
            g.registradoPor ? ' · cadastrado por ' + esc(g.registradoPor) : ''}${
            g.fim && g.encerradoPor ? ' · encerrado por ' + esc(g.encerradoPor) : ''}</span>
          ${g.motivo ? '<span class="meta">Encerramento: ' + esc(g.motivo) + '</span>' : ''}</span>
      </div>`;
    }).join('')}</div>` : '<p class="pi-vazio">Nenhum período registrado ainda.</p>'}`;
  const sel = $('#histGrupo');

function ligarHistoricosEmbutidos(raiz){
  (raiz || document).querySelectorAll('details.hist-embutido').forEach(function(det){
    if(det.dataset.ligado) return;
    det.dataset.ligado = '1';
    det.addEventListener('toggle', function(){
      if(!det.open || det.dataset.carregado) return;
      det.dataset.carregado = '1';
      const corpo = det.querySelector('.hist-corpo');
      corpo.innerHTML = '<p class="hint" style="margin:8px 0 0">Carregando…</p>';
      const chave = det.dataset.hist;               /* 'papel:<papel>' ou 'grupo:colegiado' */
      const pedido = {token:SESSAO.token};
      if(/^papel:/.test(chave)) pedido.papel = chave.slice(6);
      if(/^grupo:/.test(chave)) pedido.grupo = chave.slice(6);
      servidor('historicoAssociacoes', pedido, function(res){
        if(!res || !res.ok){ corpo.innerHTML = '<p class="hint" style="margin:8px 0 0">' + esc((res && res.erro) || 'Não foi possível carregar o histórico.') + '</p>'; det.dataset.carregado = ''; return; }

function desenharPainel(){

    /* v8.13 (D06): 'Assinado' e 'Concluído' contam aqui por COMPATIBILIDADE —

/**
 * v8.8 (G1) — As ações da linha. Na visão da escola ficam todas à vista,
 * como antes: são poucas e é o caminho do dia a dia. Na visão da regional e
 * do Órgão Central, fica à vista o que só lê — abrir o documento, o PDF, a
 * linha do tempo — e o que MUDA A SITUAÇÃO do documento vai para um menu,
 * marcado, para não ter o mesmo peso visual de "abrir documento".
 */
const ACOES_QUE_MUDAM = ['data-validar', 'data-devolver', 'data-homologar',
                         'data-desfazer-homolog', 'data-adotar'];   /* v9.3: data-nova-versao saiu da linha */
function acoesDaLinha(x, acoes, escola){
  const ler = ((x.temPdf || x.pdfUrl)
      ? '<button class="pi-acao" data-pdf="' + esc(x.protocolo) + '" title="Baixar o PDF oficial, entregue pelo sistema">baixar PDF</button>' : '') +
    (SESSAO.papel !== 'colegiado'
      ? '<button class="pi-acao" data-linha-tempo="' + esc(x.protocolo) + '" title="Todos os atos deste PPP, em ordem">linha do tempo</button>' : '');
  if(escola) return acoes + ler;
  /* separa os botões que mudam a situação dos que só abrem */
  const botoes = String(acoes).match(/<button[\s\S]*?<\/button>/g) || [];
  const mudam = botoes.filter(function(b){ return ACOES_QUE_MUDAM.some(function(a){ return b.indexOf(a) >= 0; }); });
  const abrem = botoes.filter(function(b){ return mudam.indexOf(b) < 0; });
  if(!mudam.length) return abrem.join('') + ler;
  return abrem.join('') + ler +
    /* v9.0 (M10, R4): rótulo fixo com a seta; a contagem não ajudava. O item que
       muda a situação leva o ícone de alerta no lugar do "●" em texto. */
    '<details class="acoes-menu"><summary title="Ações que mudam a situação deste documento">Ações' + ico('seta-baixo') + '</summary><div class="acoes-menu-lista">' +
    mudam.map(function(b){ return b.replace('class="pi-acao', 'class="pi-acao muda').replace(/^(<button[^>]*>)/, '$1' + ico('alerta')); }).join('') +
    '</div></details>';
}

/* ==========================================================
   v7.7 (P5): QUADRO DAS REGIONAIS, FILA DE VALIDAÇÃO E COBERTURA
   ========================================================== */
/** Dias desde uma data "dd/MM/aaaa HH:mm"; null quando não reconhece. */
function diasDesdeUI(txt){
  const m = String(txt || '').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
}
/* v8.13 (E11, A7-09): a faixa que explica por que a lista não é o que o
   usuário esperava — busca curta ignorada pelo servidor, ou resposta cortada
   no teto. Sem ela, um painel truncado passa por painel completo. */
function avisoPainel(){
  let a = '';

    a += '<p class="hint pi-aviso" style="margin:4px 0 10px">A busca foi ignorada: são precisos pelo menos <b>três</b> caracteres. A lista abaixo <b>não</b> está filtrada por ela.</p>';
  }
  if(PAINEL.truncado){
    a += '<p class="hint pi-aviso" style="margin:4px 0 10px">Mostrando as <b>' + (PAINEL.maximo || 500) + '</b> primeiras de <b>' + (PAINEL.total || 0) + '</b> — use um filtro mais específico, ou a aba <b>Cobertura</b> para ver a rede inteira. Os números acima contam a lista inteira.</p>';
  }
  return a;
}
/* v8.13 (F08): o rótulo do balde dos registros sem regional gravada. O mesmo
   literal que o servidor usa em SEM_SRE — e, desde a 8.13, um valor de filtro
   reconhecido: o clique abre a lista, e ela pode ser corrigida. */
const SEM_SRE_UI = '(sem SRE)';
const TITULO_SEM_SRE = 'Registros sem Superintendência Regional de Ensino gravada, ' +
  'vindos de base anterior. O clique abre a lista: cada linha pode ser corrigida ' +
  'pela aba Escolas ou por carga em lote.';

/** v8.8 (B2): o quadro das regionais somado pelo SERVIDOR — sem trazer as linhas. */

  $('#piResumo').innerHTML =
    cartao(t.total, 'PPPs na rede') +

function desenharQuadroSres(L){
  const por = {};
  L.forEach(function(x){ const k = x.sre || SEM_SRE_UI; (por[k] = por[k] || []).push(x); });
  const sres = Object.keys(por).sort(function(a, b){ return a.localeCompare(b, 'pt-BR'); });
  const linha = function(sre, lista){
    const c = function(f){ return lista.filter(f).length; };
    const val = lista.filter(x=>x.status==='Em validação');
    const antiga = val.reduce(function(m, x){ const d = diasDesdeUI(x.enviadoValidacaoEm); return d != null && d > m ? d : m; }, 0);
    return `<tr data-quadro-sre="${esc(sre)}" title="${esc(sre === SEM_SRE_UI ? TITULO_SEM_SRE : 'Ver os PPPs desta regional')}">
      <td data-r="Regional"><span class="esc">${esc(sre)}</span></td>
      <td class="num" data-r="PPPs">${lista.length}</td>
      <td class="num" data-r="Em andamento">${c(x=>x.status==='Em andamento')}</td>
      <td class="num" data-r="Em validação">${val.length}${val.length ? '<span class="mun">a mais antiga há ' + n(antiga, 'dia', 'dias') + '</span>' : ''}</td>
      <td class="num" data-r="Em assinatura">${c(x=>x.status==='Em assinatura'||x.status==='Assinado')}</td>
      <td class="num" data-r="Aguardando homologação">${c(x=>x.status==='Concluído'||x.status==='Enviado para homologação')}</td>
      <td class="num" data-r="Homologados">${c(x=>x.status==='Homologado')}</td>
      <td class="num" data-r="Revisão vencida">${c(x=>x.revisaoVencida) || ''}</td>
      <td><span class="pi-acao">ver</span></td></tr>`;
  };
  $('#piTabela').innerHTML = '<p class="hint" style="margin:4px 0 10px">Quadro das regionais: escolha uma para ver a lista dos PPPs dela — ou use a busca e a situação acima. A aba <b>Cobertura</b> mostra as escolas, inclusive as que ainda não começaram.</p>' +
    `<table class="quadro-sre"><thead><tr><th>Regional</th><th class="num">PPPs</th><th class="num">Em andamento</th><th class="num">Em validação</th>
      <th class="num">Em assinatura</th><th class="num">Aguardando homologação</th><th class="num">Homologados</th><th class="num">Revisão vencida</th><th></th></tr></thead><tbody>` +
    sres.map(function(sre){ return linha(sre, por[sre]); }).join('') + '</tbody></table>';
}

/* ============================================================
   v8.13 (C17, A3-17) — UMA SÓ REGRA PARA AS TRÊS PLANILHAS

   As três exportações repetiam, literalmente, a mesma função `campo()`, e
   ela só tratava o DELIMITADOR: célula que começa por `=`, `+`, `-`, `@`,
   tabulação ou retorno de carro saía crua, e o Excel a avalia — inclusive
   `=HYPERLINK`, `=WEBSERVICE` e DDE. O nome de uma escola começando por `=`
   entra pela carga e chega à planilha que o Órgão Central baixa.

   A neutralização é na EXPORTAÇÃO, não na entrada: o nome legítimo de uma
   escola pode começar por hífen, e recusá-lo na base da rede seria um
   estrago maior do que neutralizá-lo na planilha. O apóstrofo é o que o
   Excel e o LibreOffice entendem como "isto é texto".

   O `\r` e o `\t` entraram também na regra das aspas: sem isso um retorno
   de carro no meio de um nome parte a linha em duas.
   ============================================================ */
function campoCSV(v){
  if(v === true) return 'sim';
  if(v === false) return 'não';
  let t = String(v == null ? '' : v);
  if(/^[=+\-@\t\r]/.test(t)) t = "'" + t;
  return /[";\n\r\t]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t;
}
function exportarCoberturaCSV(){
  if(SESSAO.perfil !== 'central'){ toast('A planilha da cobertura é do Órgão Central.'); return; }
  const r = COB.dados; if(!r) return;
  let cols, L, nome;
  if(r.quadro){
    cols = [['Regional','sre'],['Escolas ativas','escolas'],['Sem PPP','semPPP'],['Em andamento','emAndamento'],['Em validação','emValidacao'],['Espera mais antiga (dias)','esperaMaisAntiga'],['Validados','validado'],['Em assinatura','emAssinatura'],['Aguardando homologação (concluídos)','concluido'],['Enviados para homologação (declarado)','enviadoHomologacao'],['Homologados pela SRE','homologado'],['Sem diretor','semDiretor']];
    L = r.quadro; nome = 'PPP_cobertura_REDE.csv';
  } else {
    cols = [['Escola','escola'],['Código da escola','inep'],['Município','municipio'],['SRE','sre'],['Diretor(a)','diretor'],['E-mail do diretor','diretorEmail'],['Situação do PPP','status'],['Dias na situação','dias'],['Desde','desde'],['Protocolo','protocolo'],['Versão','versao']];
    L = r.escolas || []; nome = 'PPP_cobertura_' + slugCliente(r.sre || SESSAO.sre || 'SRE') + '.csv';
  }
  if(!L.length){ toast('Não há linhas para exportar.'); return; }
  const linhas = [cols.map(c=>c[0]).join(';')].concat(L.map(x=>cols.map(c=>campoCSV(x[c[1]])).join(';')));
  const csv = '\uFEFF' + linhas.join('\r\n');
  registrarExportacao('cobertura', L.length);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast('Planilha gerada com ' + n(L.length, 'linha', 'linhas') + '.');
}
$('#piCobertura').addEventListener('click', function(e){
  if(e.target.id === 'cobExportar') return exportarCoberturaCSV();
  if(e.target.id === 'cobVoltar'){ COB.sre = ''; COB.mun = ''; COB.filtro = ''; return carregarCobertura(); }
  const l = e.target.closest('[data-cob-sre]');
  if(l){ COB.sre = l.dataset.cobSre; COB.mun = ''; COB.filtro = ''; return carregarCobertura(); }
});

  if(e.target.id === 'cobMun'){ COB.mun = e.target.value; desenharCobertura(); }

});

  /* v8.13 (F08, acabamento): o balde "(sem SRE)" não é uma regional — ele não
     vem na lista que o servidor devolve, e por isso o <select> descartava o
     valor em silêncio e o clique redesenhava o mesmo quadro. A opção é criada

function abrirLinhaDoTempo(protocolo){
  aviso('Linha do tempo · ' + protocolo, '<p class="hint">Carregando…</p>', null, {rotulo:'Fechar'});
  servidor('linhaDoTempo', {token:SESSAO.token, protocolo:protocolo}, function(res){
    if(!res || !res.ok){ $('#avisoTexto').innerHTML = '<p>' + esc((res && res.erro) || 'Não foi possível montar a linha do tempo.') + '</p>'; return; }
    const ev = res.eventos || [];
    $('#avisoTitulo').textContent = 'Linha do tempo · ' + res.protocolo + (res.versao > 1 ? ' · versão ' + res.versao : '');
    $('#avisoTexto').innerHTML =
      '<p class="hint" style="margin-bottom:10px">' + esc(res.escola || '') + ' · situação atual: <b>' + esc(res.status || '') + '</b>. ' + n(ev.length, 'evento', 'eventos') + '.</p>' +
      (ev.length ? '<ol class="linha-tempo">' + ev.map(function(e){
        return '<li><span class="lt-data">' + esc(e.data) + '</span><span class="lt-ato">' + esc(e.ato) + '</span>' +
          (e.autor ? '<span class="lt-quem">' + esc(e.autor) + (e.papel ? ' · ' + esc(e.papel) : '') + '</span>' : '') +
          (e.detalhe ? '<span class="lt-det">' + esc(e.detalhe) + '</span>' : '') + '</li>';
      }).join('') + '</ol>' : '<p class="pi-vazio">Nenhum evento registrado.</p>');
  }, function(){ $('#avisoTexto').innerHTML = '<p>Sem resposta do servidor.</p>'; });
}

function ppEmElaboracao(x){

  btn.classList.toggle('btn-primary', !emAndamento);
  btn.title = emAndamento
    ? 'Já existe um PPP em elaboração (' + emAndamento.protocolo + ', ' + String(emAndamento.status || '').toLowerCase() + '). Continue esse antes de começar outro.'
    : 'Começar o Projeto Político-Pedagógico desta escola';
}
function desenharResumoEscola(L){
  ajustarBotaoNovo(L);
  const emAndamento = L.filter(ppEmElaboracao).length;
  const vigente = L.filter(function(x){ return x.status === 'Homologado'; })[0] || L.filter(function(x){ return x.status === 'Enviado para homologação'; })[0];
  const vencida = L.filter(function(x){ return x.revisaoVencida; }).length;
  const cards = [
    {n:L.length, r:L.length === 1 ? 'PPP da escola' : 'PPPs da escola'},
    {n:emAndamento, r:'em elaboração', c:emAndamento ? 'pendente' : ''},
    {n:vigente ? (vigente.versao || 1) : '—', r:vigente ? 'versão homologada' : 'nenhuma versão homologada', c:vigente ? 'destaque' : ''}
  ];
  if(vencida) cards.push({n:vencida, r:'com revisão vencida', c:'vencida'});
  $('#piResumo').innerHTML = cards.map(x=>`<div class="pi-card ${x.c||''}"><span class="n">${x.n}</span><span class="r">${esc(x.r)}</span></div>`).join('');
}

/** exporta a lista do painel, como está filtrada, em CSV para planilha */
function exportarPainelCSV(){
  if(SESSAO.perfil !== 'central'){ toast('A planilha do painel é do Órgão Central.'); return; }
  const L = PAINEL.linhas || [];
  if(!L.length){ toast('Não há PPPs para exportar com os filtros atuais.'); return; }
  const cols = [['Protocolo','protocolo'],['Versão','versao'],['Escola','escola'],['Código da escola','inep'],
    ['Município','municipio'],['SRE','sre'],['Situação','status'],['% preenchido','pct'],
    ['Assinaturas colhidas','assinadas'],['Assinaturas previstas','totalAssin'],
    ['Ata anexada','ata'],['Revisão vencida','revisaoVencida'],['Enviado para homologação em','homolData'],
    ['Homologado pela SRE em','homolEm'],['Ato de homologação','homolAto'],['Homologação registrada por','homolPor'],
    ['Última atualização','atualizadoEm'],['PDF gerado','temPdf']];
  const linhas = [cols.map(c=>c[0]).join(';')].concat(L.map(x=>cols.map(c=>campoCSV(x[c[1]])).join(';')));
  const csv = '\uFEFF' + linhas.join('\r\n');           // BOM: abre acentuado no Excel
  const nome = 'PPP_painel_' + (SESSAO.perfil === 'regional' ? slugCliente(SESSAO.sre) : 'REDE') + '.csv';
  registrarExportacao('painel', L.length);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast('Planilha gerada com ' + n(L.length, 'PPP', 'PPPs') + ', conforme os filtros da tela.');
}
/** v7.4 (P3): cada CSV deixa rastro no histórico — sem bloquear o download.
    v8.13 (E12): o servidor recusa a combinação impossível (tipo × perfil). O
    download não depende disto — quem impede é a conferência de perfil da
    própria função de exportação (E09). Uma recusa aqui quer dizer tela
    desatualizada, e vale dizê-lo em voz baixa. */
function registrarExportacao(tipo, linhas){
  if(!SESSAO.token) return;
  servidor('registrarExportacao', {token:SESSAO.token, tipo:tipo, linhas:linhas}, function(res){
    if(res && res.ok === false) toast('A planilha foi gerada, mas o sistema não registrou a exportação: ' +
      ((res.erro || '') + ' Atualize a página.'));
  }, function(){});
}

/**
 * v7.4 (P3): ADOÇÃO de um PPP órfão. O registro criado antes do cadastro (pelo
 * antigo "abrir por protocolo") não pertence a nenhuma direção da escola; a
 * regional o grava para o diretor em exercício. Se o código da escola do
 * registro não estiver na base, o servidor pede o código certo, e a tela o
 * pergunta.
 */
function adotarPPP(protocolo, inep){
  const linha = (PAINEL.linhas || []).filter(function(x){ return x.protocolo === protocolo; })[0] || {};
  const enviar = function(){
    servidor('adotarPPP', {token:SESSAO.token, protocolo:protocolo, inep:inep || ''}, function(res){
      if(res && res.ok){
        toast(UI.adotarFeito.replace('{diretor}', res.diretor || res.email || '').replace('{escola}', res.escola || ''));
        carregarPainel(); return;
      }
      const erro = (res && res.erro) || 'Não foi possível vincular o PPP à escola.';
      if(/não está na base/.test(erro)){
        return aviso(UI.adotarTitulo, '<p style="margin-bottom:10px">' + esc(erro) + '</p>' +
          '<div class="field"><label for="adotarInep">Código da escola na base da rede</label>' +
          '<input id="adotarInep" type="text" inputmode="numeric" placeholder="Ex.: 184381"></div>',
          function(){
            const cod = String(($('#adotarInep') || {value:''}).value || '').replace(/\D/g, '');
            if(!/^\d{2,8}$/.test(cod)) return erroNoAviso('Informe o código da escola, de 2 a 8 dígitos.');
            adotarPPP(protocolo, cod); return true;
          }, {rotulo:'Vincular a esta escola', rotuloCancelar:'Cancelar'});
      }
      alerta(erro, UI.adotarTitulo);
    }, function(){ toast('Sem resposta do servidor.'); });
  };
  if(inep) return enviar();
  confirmar(UI.adotarConfirma.replace('{protocolo}', protocolo).replace('{escola}', linha.escola || '(sem nome)'),
    enviar, {titulo:UI.adotarTitulo, rotulo:'Vincular à escola'});
}

function verDocumento(protocolo){
  servidor('registroLeitura', {token:SESSAO.token, p:protocolo}, function(res){
    if(!res || !res.ok){ alerta((res && res.erro) || 'Não foi possível abrir o documento.'); return; }
    preencherRegistro(res.registro, true);
    /* v8.11: concluído, o que se lê é o documento CONGELADO na conclusão —
       o mesmo de que sai o PDF —, e não uma remontagem com os textos de hoje */
    /* v8.13 (D18): o congelado chega em folhas — paginar() o reconhece e o

    $('#ovDocTitulo').textContent = (res.registro.escola || 'Documento') + ' · ' + res.registro.protocolo +

    APP.docFullAlheio = !!res.congelado;                      /* v9.1: congelado não se repagina a partir do documento em curso */

/* ---- gestão de acessos a partir da base de escolas da rede (v6.7) ---- */
let ESCOLAS = [];          // base da rede, já com o gestor de cada escola
let ESC_FILTRO = '';       // '', 'com' ou 'sem'
let ESC_SRE = '';          // regional escolhida — só o Órgão Central escolhe
let ESC_MUN = '';          // município escolhido
let SRES_BASE = [];        // regionais já conhecidas, para o cadastro de escola
let GESTOR_ATUAL = null;   // escola aberta na janela de edição

function carregarAcessos(){
  $('#piAcessos').innerHTML = '<p class="pi-vazio carregando">Carregando a base de escolas…</p>';
  servidor('escolasListar', {token:SESSAO.token}, function(res){
    if(!res || !res.ok){
      $('#piAcessos').innerHTML = '<p class="pi-vazio erro">' + esc((res && res.erro) || 'Não foi possível carregar a base de escolas.') + '</p>';
      return;
    }
    ESCOLAS = res.escolas || []; desenharAcessos();
  }, function(){ $('#piAcessos').innerHTML = '<p class="pi-vazio erro">' + TXT_SEM_RESPOSTA + '</p>'; });
}

function escolasParaAcesso(){
  /* Escola inativa não recebe gestor novo; só continua na lista enquanto
     tiver um acesso em aberto para regularizar. */
  return ESCOLAS.filter(function(e){ return e.situacao !== 'inativa' || e.gestor; });
}
/* As regionais e os municípios presentes numa lista de escolas, em ordem.
   Servem aos filtros: o Órgão Central escolhe a regional; a regional, que
   já vê só a sua, escolhe o município. */
function valoresDe(L, campo){
  const m = {};
  L.forEach(function(e){ if(e[campo]) m[e[campo]] = true; });
  return Object.keys(m).sort(function(a,b){ return a.localeCompare(b, 'pt-BR'); });
}
function escolasFiltradas(){
  const b = ($('#escBusca') ? $('#escBusca').value : '').trim().toLowerCase();
  return escolasParaAcesso().filter(function(e){
    if(ESC_FILTRO === 'com' && !e.gestor) return false;
    if(ESC_FILTRO === 'sem' && e.gestor)  return false;
    if(ESC_SRE && e.sre !== ESC_SRE) return false;
    if(ESC_MUN && e.municipio !== ESC_MUN) return false;
    if(!b) return true;
    return (e.escola + ' ' + e.municipio + ' ' + e.inep + ' ' +
            (e.gestor ? e.gestor.nome + ' ' + e.gestor.email : '')).toLowerCase().indexOf(b) >= 0;
  });
}

function desenharAcessos(){
  const central = SESSAO.perfil === 'central';
  const BASE = escolasParaAcesso();
  const com = BASE.filter(function(e){ return !!e.gestor; }).length;
  const busca = $('#escBusca') ? $('#escBusca').value : '';
  /* O Órgão Central escolhe a regional; escolhida uma, a lista de municípios
     se restringe a ela. A regional não escolhe regional — ela já vê só a
     sua —, escolhe o município. */
  const sres = central ? valoresDe(BASE, 'sre') : [];
  if(ESC_SRE && sres.indexOf(ESC_SRE) < 0) ESC_SRE = '';
  const doEscopo = BASE.filter(function(e){ return !ESC_SRE || e.sre === ESC_SRE; });
  const municipios = valoresDe(doEscopo, 'municipio');
  if(ESC_MUN && municipios.indexOf(ESC_MUN) < 0) ESC_MUN = '';
  $('#piAcessos').innerHTML = `
    <div class="pi-resumo" style="margin-bottom:14px">
      <div class="pi-card"><span class="n">${BASE.length}</span><span class="r">escolas ativas</span></div>
      <div class="pi-card destaque"><span class="n">${com}</span><span class="r">com diretor cadastrado</span></div>
      <div class="pi-card ${BASE.length - com ? 'pendente' : ''}"><span class="n">${BASE.length - com}</span><span class="r">ainda sem acesso</span></div>
    </div>
    ${BASE.length ? `<div class="pi-filtros${central ? ' quatro' : ''}">
      <input id="escBusca" type="search" placeholder="Escola, município, código da escola, nome ou e-mail do diretor" aria-label="Buscar escola" value="${esc(busca)}">
      ${central ? `<select id="escSre" aria-label="Superintendência Regional de Ensino">
        <option value="">Todas as regionais</option>
        ${sres.map(x=>`<option${ESC_SRE === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}
      </select>` : ''}
      <select id="escMun" aria-label="Município">
        <option value="">Todos os municípios</option>
        ${municipios.map(x=>`<option${ESC_MUN === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}
      </select>
      <select id="escFiltro" aria-label="Situação do acesso">
        <option value="">Todas as escolas</option>
        <option value="sem"${ESC_FILTRO === 'sem' ? ' selected' : ''}>Somente sem acesso</option>
        <option value="com"${ESC_FILTRO === 'com' ? ' selected' : ''}>Somente com acesso</option>
      </select>
    </div>
    <div id="escLista"></div>` : ''}
    `;   /* v9.8: o painel "Importar diretores em lote" saiu — o cadastro é sempre individual, pela janela da escola */
  desenharListaEscolas();
}

/* ==========================================================
   v7.6 (P4): CARGA EM LOTE — diretores (quem associa) e colegiado (direção)
   A simulação é obrigatória: só depois dela o botão "Importar" existe, e a
   carga real leva a chave do texto conferido. A carga corre em lotes, com
   o progresso na tela.
   ========================================================== */
/* v9.8: a carga em lote saiu da interface — a do Colegiado na 8.12 (cada
   membro é cadastrado um a um) e a de diretores agora. O painel, o
   despachante da carga e a memória da última carga saíram com elas; o que
   restou é a tabela de simulação, usada pela carga da BASE DE ESCOLAS, que
   continua com o Órgão Central. */
function tabelaSimulacao(r){
  const itens = (r.itens || []);
  const ruins = itens.filter(function(i){ return !i.ok; });
  const subs = itens.filter(function(i){ return i.ok && (i.substitui || i.substituiu); });
  const avisos = itens.filter(function(i){ return i.ok && i.aviso; });
  let h = '';
  if(subs.length) h += '<p class="hint" style="color:var(--alerta);margin-bottom:6px"><b>' + (r.resultado ? 'Substituições feitas' : 'Substituições que a carga faria') + ':</b> ' +
    subs.slice(0, 40).map(function(i){ return 'linha ' + i.linha + ' — ' + esc(i.escola || i.email) + ' (substitui ' + esc(i.substitui || i.substituiu) + ')'; }).join('; ') + (subs.length > 40 ? ' …' : '') + '</p>';
  if(ruins.length) h += '<p class="hint" style="margin-bottom:6px"><b>' + (r.resultado ? 'Recusadas' : 'Linhas recusadas') + ':</b> ' +
    ruins.slice(0, 60).map(function(i){ return 'linha ' + i.linha + ' — ' + esc(i.motivo || ''); }).join('; ') + (ruins.length > 60 ? ' … (' + ruins.length + ' no total)' : '') + '</p>';
  if(avisos.length) h += '<p class="hint"><b>E-mails fora do domínio</b> (entram por senha, pelo convite): ' + avisos.length + '.</p>';
  return h;
}

function desenharListaEscolas(){
  const alvo = $('#escLista'); if(!alvo) return;
  const L = escolasFiltradas();
  if(!escolasParaAcesso().length){
    $('#piAcessos').insertAdjacentHTML('beforeend',
      '<p class="pi-vazio">Nenhuma escola ativa na base' + (SESSAO.perfil === 'central' ? '' : ' desta regional') +
      '. Use a aba <b>Escolas da rede</b> para cadastrar a primeira.</p>');
    return;
  }
  if(!L.length){ alvo.innerHTML = '<p class="pi-vazio">Nenhuma escola encontrada com esse filtro.</p>'; return; }
  alvo.innerHTML = L.slice(0, 300).map(function(e){
    const g = e.gestor;
    return `<button class="esc-linha" data-inep="${esc(e.inep)}">
      <span><b>${esc(e.escola)}</b><span class="sub-linha">${esc(e.municipio || '—')} · código ${esc(e.inep)}${SESSAO.perfil === 'central' ? ' · ' + esc(e.sre || '—') : ''}</span></span>
      <span>${g ? '<b>' + esc(g.nome || '(sem nome)') + '</b><span class="sub-linha">' + esc(g.email) +
              (g.masp ? ' · MASP ' + esc(g.masp) : '') +
              (e.gestoresJaCadastrados > 1 ? ' · ' + e.gestoresJaCadastrados + 'º diretor' : '') + '</span>'
            : '<span class="sub-linha">sem diretor cadastrado' +
              (e.gestoresJaCadastrados ? ' · ' + e.gestoresJaCadastrados + ' no histórico' : '') + '</span>'}</span>
      <span>${e.situacao === 'inativa' ? '<span class="esc-tag off">escola inativa</span>'
            : (g ? '<span class="esc-tag sim">com acesso</span>'
                 : '<span class="esc-tag nao">sem acesso</span>')}</span>
      <span class="pi-acao">${g ? 'alterar' : 'cadastrar'}</span>
    </button>`;
  }).join('') + (L.length > 300
    ? '<p class="hint" style="margin-top:10px">Mostrando as 300 primeiras de ' + L.length + '. Use a busca para chegar à escola.</p>'
    : '');
}

/* ---- janela do diretor da escola ----
   Três passos, nesta ordem: ver quem está no exercício, preencher, conferir.
   O passo de conferência existe porque gravar aqui não é editar um cadastro:
   é encerrar o período de uma pessoa e abrir o de outra, no histórico
   permanente da escola. */
let GESTOR_MODO = '';      // 'novo' ou 'correcao'

function painelGestor(qual){
  ['atual','form','resumo','desativar'].forEach(function(x){
    $('#gsPainel' + x.charAt(0).toUpperCase() + x.slice(1)).hidden = (x !== qual);
  });
  $('#gsVoltar').hidden    = (qual === 'atual');
  $('#gsContinuar').hidden = (qual !== 'form');
  $('#gsSalvar').hidden    = (qual !== 'resumo');
  $('#gsDesativar').hidden = (qual !== 'desativar');
  $('#gsCancelar').textContent = (qual === 'atual') ? 'Fechar' : 'Cancelar';
  $('#gsErro').classList.remove('show');
}

function abrirGestor(inep){
  const e = ESCOLAS.filter(function(x){ return x.inep === inep; })[0];
  if(!e) return;
  GESTOR_ATUAL = e; GESTOR_MODO = '';
  const g = e.gestor;
  $('#gsEscola').innerHTML = '<b>' + esc(e.escola) + '</b>';
  $('#gsLocal').textContent = (e.municipio || '—') + ' · código ' + e.inep +
    (e.codigoInep ? ' · INEP ' + e.codigoInep : '') + ' · SRE ' + (e.sre || '—');
  carregarHistoricoGestores(e);
  if(g){
    $('#gsTitulo').textContent = 'Direção da escola';
    $('#gsAtualNome').textContent = g.nome || '(sem nome)';
    $('#gsAtualMeta').textContent = g.email + (g.masp ? ' · MASP ' + g.masp : '');
    $('#gsAtualDesde').textContent = g.desde ? ('Associado em ' + g.desde) : '';
    $('#gsAtualDesde').hidden = !g.desde;
    painelGestor('atual');
  } else {
    $('#gsTitulo').textContent = 'Associar diretor à escola';
    prepararFormGestor('novo');
  }
  $('#ovGestor').hidden = false;
  setTimeout(function(){ ($('#gsPainelAtual').hidden ? $('#gsNome') : $('#gsCartaoAtual')).focus(); }, 60);
}

function prepararFormGestor(modo){
  const g = GESTOR_ATUAL && GESTOR_ATUAL.gestor;
  GESTOR_MODO = modo;
  const corrige = (modo === 'correcao');
  $('#gsTitulo').textContent = corrige ? 'Corrigir os dados do diretor'
    : (g ? 'Associar novo diretor' : 'Associar diretor à escola');
  /* v8.13 (C07): a tela deixa de prometer o que não é mais verdade. Corrigir
     o e-mail exige nova definição de senha, pelo convite — credencial não
     acompanha endereço —, e trocar a pessoa é o outro botão. */
  $('#gsFormIntro').innerHTML = corrige
    ? 'Acerte o que estiver errado nos dados de <b>' + esc(g.nome || g.email) + '</b>. O período dele continua o mesmo. ' +
      'Corrigir o <b>e-mail</b> cancela a senha atual e envia um novo link de primeiro acesso para o endereço novo. ' +
      'Se quem assume é outra pessoa, volte e use <b>Associar novo diretor</b>.'
    : (g ? 'Os dados são de quem <b>assume</b> a direção. Ao salvar, o período de <b>' + esc(g.nome || g.email) +
           '</b> é encerrado com a data de hoje e o novo começa.'
         : 'Esta escola ainda não tem diretor associado. Os dados abaixo definem quem responde por ela e quem entra no sistema.');
  /* No diretor novo os campos começam VAZIOS: preenchê-los com os dados de
     quem sai é o que levava a sobrescrever a pessoa anterior sem querer. */
  $('#gsNome').value  = corrige ? (g.nome || '') : '';
  $('#gsMasp').value  = corrige ? (g.masp || '') : '';
  $('#gsEmail').value = corrige ? (g.email || '') : '';
  painelGestor('form');
  setTimeout(function(){ $('#gsNome').focus(); }, 40);
}

function linhaResumo(rot, val){
  return '<div><dt>' + esc(rot) + '</dt><dd' + (val ? '' : ' class="vazio"') + '>' +
         esc(val || 'não informado') + '</dd></div>';
}

/** Passo 2 → 3: valida e mostra o que será gravado. */
function conferirGestor(){
  if(!GESTOR_ATUAL) return;
  const erro = $('#gsErro');
  const dizer = function(m){ erro.textContent = m; erro.classList.add('show'); };
  erro.classList.remove('show');
  const nome = $('#gsNome').value.trim();
  const email = $('#gsEmail').value.trim();
  const masp = ($('#gsMasp').value || '').replace(/\D/g, '');
  if(nome.length < 3) return dizer('Informe o nome do diretor.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return dizer('Informe um e-mail institucional válido.');
  if(masp && !/^\d{6,12}$/.test(masp)) return dizer('O MASP deve ter de 6 a 12 dígitos.');
  const g = GESTOR_ATUAL.gestor;
  const troca = (GESTOR_MODO !== 'correcao') && !!g;
  $('#gsTitulo').textContent = 'Confira antes de salvar';
  $('#gsResumo').innerHTML =
    linhaResumo('Escola', GESTOR_ATUAL.escola) +
    linhaResumo('Código da escola', GESTOR_ATUAL.inep) +
    linhaResumo('Diretor', nome) +
    linhaResumo('MASP', masp) +
    linhaResumo('E-mail', email) +
    linhaResumo(troca ? 'Assume em' : (GESTOR_MODO === 'correcao' ? 'Associado em' : 'Associação em'),
                (GESTOR_MODO === 'correcao' && g && g.desde) ? g.desde : hojeExtenso());
  const aviso = $('#gsResumoAviso');
  /* e-mail fora do domínio da rede: o cadastro é aceito, mas a pessoa não
     conseguirá abrir o sistema enquanto não tiver conta institucional */
  if(!/@educacao\.mg\.gov\.br$/i.test(email)){
    aviso.hidden = false;
    aviso.innerHTML = '<b>Atenção:</b> ' + esc(email) + ' não é uma conta @educacao.mg.gov.br. ' +
      'Esta pessoa não é identificada pela conta institucional e entrará por e-mail e senha, pelo link de ' +
      'primeiro acesso que receberá nesse endereço. Providencie a conta @educacao.mg.gov.br para que ela ' +
      'passe a entrar sem senha. O cadastro é gravado assim mesmo.' +
      (troca ? '<br><br>Ao confirmar, o período de <b>' + esc(g.nome || g.email) + '</b> é encerrado hoje e vai para o histórico da escola.' : '');
    painelGestor('resumo');
    setTimeout(function(){ $('#gsSalvar').focus(); }, 40);
    return;
  }
  if(troca){
    aviso.hidden = false;
    aviso.innerHTML = 'Ao confirmar, o período de <b>' + esc(g.nome || g.email) +
      '</b> é encerrado hoje e vai para o histórico da escola, que é permanente. ' +
      'O acesso dele ao sistema termina no mesmo ato.';
  } else if(GESTOR_MODO === 'correcao'){
    aviso.hidden = false;
    aviso.innerHTML = 'Correção de dados: o período em curso continua o mesmo, com a data de associação original. ' +
      'A mudança fica registrada no histórico de acessos. Se o e-mail mudar, a senha atual deixa de valer e a pessoa ' +
      'define outra pelo link que receberá no endereço novo.';
  } else { aviso.hidden = true; aviso.innerHTML = ''; }
  painelGestor('resumo');
  setTimeout(function(){ $('#gsSalvar').focus(); }, 40);
}

function hojeExtenso(){
  const d = new Date(), z = function(n){ return (n < 10 ? '0' : '') + n; };
  return z(d.getDate()) + '/' + z(d.getMonth()+1) + '/' + d.getFullYear();
}

/** Todos os diretores que já responderam pela escola, do mais recente ao mais antigo. */
function carregarHistoricoGestores(e){
  const box = $('#gsHistBox'), alvo = $('#gsHist');
  const quantos = e.gestoresJaCadastrados || 0;
  /* v9.8: TODO gerenciamento de acesso traz o histórico dentro de si — e ele
     não desaparece quando ainda não há período nenhum. Some, quem abre a
     janela de uma escola sem diretor fica sem saber se a escola nunca teve um
     ou se a tela apenas não mostrou; presente e vazio, a tela responde. */
  box.hidden = false;
  box.open = false;
  $('#gsHistResumo').textContent = 'Histórico de diretores desta escola' +
    (quantos ? ' (' + n(quantos, 'período', 'períodos') + ')' : '');
  const escolaDoPedido = e.inep;
  alvo.innerHTML = '<p class="hint" style="margin:10px 0 0">Carregando…</p>';
  servidor('gestoresHistorico', {token:SESSAO.token, inep:e.inep}, function(res){
    /* v9.8: a resposta pode chegar com a janela já em outra escola — nesse
       caso ela não escreve nada (o mesmo cuidado de carregarHistoricoRegional) */
    if(!GESTOR_ATUAL || GESTOR_ATUAL.inep !== escolaDoPedido) return;
    if(!res || !res.ok){
      alvo.innerHTML = '<p class="hint" style="margin:10px 0 0">' + esc((res && res.erro) || 'Não foi possível carregar o histórico.') + '</p>';
      return;
    }
    const L = res.gestores || [];
    $('#gsHistResumo').textContent = 'Histórico de diretores desta escola' +
      (L.length ? ' (' + n(L.length, 'período', 'períodos') + ')' : '');
    if(!L.length){ alvo.innerHTML = '<p class="hint" style="margin:10px 0 0">Nenhum diretor registrado ainda — esta escola ainda não teve diretor associado no sistema.</p>'; return; }
    /* a data de associação do vigente vem do histórico, não do cadastro */
    const vig = L.filter(function(g){ return g.vigente; })[0];
    if(vig && GESTOR_ATUAL && GESTOR_ATUAL.gestor){
      GESTOR_ATUAL.gestor.desde = vig.inicio || '';
      if(!$('#gsPainelAtual').hidden){
        $('#gsAtualDesde').textContent = vig.inicio ? ('Associado em ' + vig.inicio) : '';
        $('#gsAtualDesde').hidden = !vig.inicio;
      }
    }
    alvo.innerHTML = L.map(function(g){
      return `<div class="gh ${g.vigente ? 'atual' : ''}">
        <span class="per" aria-hidden="true"></span>
        <span><b>${esc(g.nome || '(sem nome)')}${g.vigente ? '<span class="marca">vigente</span>' : ''}</b>
          <span class="meta">${esc(g.email || '—')}${g.masp ? ' · MASP ' + esc(g.masp) : ''}</span>
          <span class="meta">${esc(g.inicio || '—')} até ${g.fim ? esc(g.fim) : 'hoje'}${
            g.registradoPor ? ' · associado por ' + esc(g.registradoPor) : ''}${
            g.fim && g.encerradoPor ? ' · encerrado por ' + esc(g.encerradoPor) : ''}</span>
          ${g.motivo ? '<span class="meta">Encerramento: ' + esc(g.motivo) + '</span>' : ''}
          ${g.semEncerramento ? '<span class="meta">período em aberto sem encerramento registrado</span>' : ''}</span>
      </div>`;
    }).join('');
  }, function(){ alvo.innerHTML = '<p class="hint" style="margin:10px 0 0">Sem resposta do servidor.</p>'; });
}

function salvarGestor(){
  if(!GESTOR_ATUAL) return;
  const erro = $('#gsErro'); erro.classList.remove('show');
  const dizer = function(m){ erro.textContent = m; erro.classList.add('show'); painelGestor('form'); };

  const email = $('#gsEmail').value.trim();
  const masp = ($('#gsMasp').value || '').replace(/\D/g, '');
  const nomeEscola = GESTOR_ATUAL.escola;
  const substituiu = (GESTOR_MODO !== 'correcao') && !!GESTOR_ATUAL.gestor;
  const btn = $('#gsSalvar'); btn.disabled = true; btn.textContent = 'Salvando…';
  servidor('acessoSalvar', {token:SESSAO.token, perfil:'escola', inep:GESTOR_ATUAL.inep,
      nome:nome, email:email, masp:masp, modo:(GESTOR_MODO === 'correcao' ? 'correcao' : 'novo')},
    function(res){
      btn.disabled = false; btn.textContent = 'Confirmar e salvar';
      if(!res || !res.ok){ dizer((res && res.erro) || 'Não foi possível salvar.'); return; }
      ESCOLAS = res.escolas || ESCOLAS; fecharGestor(); desenharAcessos();
      toast(GESTOR_MODO === 'correcao' ? 'Dados de ' + nome + ' corrigidos.'
        : (substituiu ? nome + ' assume a direção de ' + nomeEscola + '.'
                      : nome + ' associado a ' + nomeEscola + '.'));
      if(res.aviso) aviso('Conta institucional pendente', textoParaHTML(res.aviso));
    },
    function(){ btn.disabled = false; btn.textContent = 'Confirmar e salvar'; dizer('Sem resposta do servidor.'); });
}

/* ---- validação: enviar, validar, devolver ---- */
function enviarParaValidacao(protocolo){
  const reg = (PAINEL.linhas || []).filter(function(x){ return x.protocolo === protocolo; })[0] || {};
  /* v8.13 (D13): a conferência só vale se o PPP aberto na tela É este — do
     painel se enviam também PPPs que não estão carregados aqui, e nesses o
     servidor é quem recusa. */
  if(APP.protocolo === protocolo){
    const barra = barrarPorIndicadores('enviar para validação');
    if(barra){ alerta(barra, 'Indicadores com valor inválido'); irParaCampo('indicadores'); return; }
  }
  confirmar('Enviar este PPP para a validação da Diretoria Educacional?\n\n' +
    (reg.pct < 100 ? 'Atenção: o documento está ' + reg.pct + '% preenchido. ' +
      'O que estiver em branco vai assim para o parecer.\n\n' : '') +
    'A partir do envio o documento fica parado até o parecer: a escola não consegue mais alterá-lo. ' +
    'Validado, o passo seguinte é concluir e colher as assinaturas; devolvido, ele volta editável, ' +
    'com o que precisa ser ajustado escrito na tela.',
    function(){
      servidor('enviarParaValidacao', {token:SESSAO.token, protocolo:protocolo}, function(res){
        if(!res || !res.ok){ alerta((res && res.erro) || 'Não foi possível enviar.'); return; }
        /* v8.13 (F04): o envio MEXE na linha — sem esta atualização a tela
           ficava com a revisão velha e a conclusão seguinte era recusada por
           conflito com o ato da própria pessoa. É o gatilho mais comum. */
        if(res.registro && APP.protocolo === protocolo && res.registro.rev !== undefined)
          APP.rev = parseInt(res.registro.rev, 10) || 0;
        carregarPainel();
        aviso('Enviado para validação',
          'O PPP <b>' + esc(protocolo) + '</b> foi enviado à Diretoria Educacional da SRE ' +
          esc(SESSAO.sre || '') + '.<br><br>Enquanto ela não se manifestar, o conteúdo não pode ser alterado.');
      }, function(){ toast('Sem resposta do servidor.'); });
    }, {titulo:'Enviar para validação', rotulo:'Enviar para validação'});
}

function validarDocumento(protocolo){
  const reg = (PAINEL.linhas || []).filter(function(x){ return x.protocolo === protocolo; })[0] || {};
  aviso('Validar o Projeto Político-Pedagógico',

    '<div class="field"><label for="valParecer">Parecer (opcional)</label>' +

/* v7.9 (P9): a homologação registrada pela SRE — quem, quando e o ato */
/* v8.2 — homologar é CONFIRMAR. Quem homologa não digita ato nem data: o
   ato é o próprio clique, e a data é a do momento em que ele acontece. */
/**
 * v10.0 — HOMOLOGAR É O ATO QUE ENCERRA O DOCUMENTO.
 *
 * O aviso de assinaturas faltantes existe desde a 8.7 (C2), mas dizia só um
 * número: "7 de 9 caixas assinadas". Com a homologação definitiva — o
 * desfazer saiu nesta versão —, a caixa que ficar em branco fica em branco
 * para sempre, no documento final da vigência. Um número não permite
 * decidir: quem homologa precisa saber QUEM foi marcado como presente na
 * reunião de aprovação e ainda não assinou, para escolher entre esperar
 * essas pessoas e encerrar sem elas. A lista vem do servidor, com nome e
 * segmento de cada um, e é ele que decide de novo se falta alguém — a tela
 * apenas pergunta antes, com o que já tem no painel.
 */
function listaDePendentes(pendentes){
  if(!pendentes || !pendentes.length) return '';
  return '<ul class="lista-pendentes">' + pendentes.map(function(a){
    return '<li><b>' + esc(a.nome || '(sem nome)') + '</b>' +
      (a.direcao ? ' <span class="sub-linha">direção da escola</span>'
                 : (a.segmento ? ' <span class="sub-linha">' + esc(a.segmento) + '</span>' : '')) + '</li>';
  }).join('') + '</ul>';
}
function homologarDocumento(protocolo, jaConfirmou, pendentesDoServidor){
  const reg = (PAINEL.linhas || []).filter(function(x){ return x.protocolo === protocolo; })[0] || {};
  const total = parseInt(reg.totalAssin, 10) || 0;
  const feitas = parseInt(reg.assinadas, 10) || 0;
  const faltam = total > 0 && feitas < total;
  /* a lista já vem no painel; a do servidor, quando ele recusa, prevalece —
     é ele quem de fato decide, e entre carregar o painel e clicar alguém
     pode ter assinado */
  const pendentes = pendentesDoServidor || reg.pendentesAssin || [];
  const enviar = function(comFalta){
    servidor('homologarPPP', {token:SESSAO.token, protocolo:protocolo, confirmaSemAssinaturas: !!comFalta},
      function(res){
        /* o servidor é quem confere de verdade: se ele disser que falta
           assinatura, a pergunta é refeita COM A LISTA que ele devolveu */
        if(res && res.faltamAssinaturas && !comFalta){ homologarDocumento(protocolo, true, res.pendentes); return; }
        if(!res || !res.ok){ alerta((res && res.erro) || 'Não foi possível registrar a homologação.'); return; }
        carregarPainel();
        aviso('PPP homologado', 'Homologação registrada em <b>' +
          esc((res.registro && res.registro.homolEm) || '') + '</b>, em seu nome. A direção da escola foi avisada.' +
          '<br><br>Esta é a <b>versão final e definitiva</b> desta vigência: o documento não pode mais ser editado, ' +
          'não recebe mais assinatura e a homologação não é desfeita.' +
          (res.total && res.assinadas < res.total
            ? '<br><br>Registrado com <b>' + res.assinadas + ' de ' + res.total + '</b> caixas assinadas.' : ''));
      }, function(){ toast('Sem resposta do servidor.'); });
  };
  if((faltam || (pendentes && pendentes.length)) && !jaConfirmou){
    return aviso('Faltam assinaturas',
      '<p class="hint" style="margin-bottom:10px">Escola: <b>' + esc(reg.escola || '') + '</b> · ' + esc(protocolo) + '</p>' +
      '<p class="hint" style="margin-bottom:10px">A folha deste documento tem <b>' + feitas + ' de ' + total +
      '</b> caixas assinadas.</p>' +
      (pendentes && pendentes.length
        ? '<p class="hint" style="margin-bottom:6px">Marcados como presentes na reunião de aprovação e ainda <b>sem assinar</b>:</p>' +
          listaDePendentes(pendentes)
        : '') +
      '<p class="hint">Homologado, o documento é <b>final e definitivo</b>: não recebe mais assinatura e a homologação ' +
      'não é desfeita — estas caixas ficam em branco no PDF, para sempre. ' +
      'Se a intenção é esperar essas pessoas, cancele e homologue depois.</p>',
      function(){ enviar(true); return true; },
      {rotulo:'Homologar assim mesmo', rotuloCancelar:'Esperar as assinaturas'});
  }
  aviso('Homologar este PPP',
    '<p class="hint" style="margin-bottom:10px">Escola: <b>' + esc(reg.escola || '') + '</b> · ' + esc(protocolo) +
    (reg.homolData ? ' · assinado e encaminhado em ' + esc(reg.homolData) : '') + '</p>' +
    (total ? '<p class="hint" style="margin-bottom:10px">Folha de assinaturas: <b>' + feitas + ' de ' + total +
             '</b> caixas assinadas.</p>' : '') +
    '<p class="hint">' + UI.homologarConfirma + '</p>',
    function(){ enviar(jaConfirmou); return true; },
    {rotulo:'Confirmar a homologação', rotuloCancelar:'Cancelar'});
}

/* v10.0: `desfazerHomologacaoDocumento` saiu junto com o botão. A rota do
   servidor continua existindo e RECUSA, para que nenhuma aba aberta de antes
   nem atalho guardado volte a gravar em silêncio. */

function devolverDocumento(protocolo){
  const reg = (PAINEL.linhas || []).filter(function(x){ return x.protocolo === protocolo; })[0] || {};
  const revogando = reg.status === 'Validado';        /* v8.7 (C1) */
  aviso(revogando ? 'Revogar a validação e devolver' : 'Devolver para ajustes',
    '<p class="hint" style="margin-bottom:10px">Escola: <b>' + esc(reg.escola || '') + '</b> · ' + esc(protocolo) + '</p>' +
    (revogando
      ? '<p class="hint" style="margin-bottom:10px">Este PPP <b>já foi validado</b>. Devolvê-lo agora <b>revoga a validação</b>: o registro de quem validou é apagado, o ato fica no histórico do documento e a escola volta a poder editar.</p>'
      : '') +
    '<p class="hint" style="margin-bottom:10px">O documento volta editável para a escola, com o seu parecer na tela. Descreva o que precisa ser ajustado — é o que a escola vai ler.</p>' +
    '<textarea id="devParecer" style="width:100%;min-height:130px;border:1px solid var(--linha);border-radius:8px;padding:10px;font-family:inherit;font-size:14px" placeholder="Ex.: a seção de avaliação da aprendizagem precisa descrever os instrumentos e a periodicidade."></textarea>',
    function(){
      const txt = ($('#devParecer') || {value:''}).value.trim();
      /* v7.3 (T-13): o parecer curto é apontado dentro do diálogo — o texto digitado fica */
      if(txt.length < 20) return erroNoAviso('Descreva no parecer o que precisa ser ajustado — ao menos 20 caracteres. É o que a escola vai ler.');
      servidor('devolverPPP', {token:SESSAO.token, protocolo:protocolo, parecer:txt},
        function(res){
          if(!res || !res.ok){ alerta((res && res.erro) || 'Não foi possível devolver.'); return; }
          carregarPainel();
          toast((res.revogada ? 'Validação revogada e PPP devolvido à escola' : 'PPP devolvido à escola') +
                (res.rodadas > 1 ? ' (' + res.rodadas + 'ª devolução)' : '') + '.');
        }, function(){ toast('Sem resposta do servidor.'); });
    }, {rotulo:'Devolver com o parecer', rotuloCancelar:'Cancelar'});
}

/* ============================================================
   MINHA EQUIPE (v7.0)
   Cada chefia cadastra a sua: o Superintendente, os Diretores Educacionais e
   o Coordenador de Inspeção; o Diretor Educacional, a equipe da Diretoria;
   o Coordenador, a equipe da Inspeção. A cascata termina na equipe.
   ============================================================ */
let EQUIPE = [];
let EQ_EDIT = '';

function papeisQuePossoCadastrar(){
  const base = (SESSAO.cadastra && SESSAO.cadastra.length) ? SESSAO.cadastra
             : ((PAPEIS_UI[SESSAO.papel] || {}).cadastra || []);
  return base.filter(function(x){ return x !== 'central' && x !== 'superintendente' && x !== 'colegiado'; });
}

function carregarMinhaEquipe(){
  $('#piEquipe').innerHTML = '<p class="pi-vazio carregando">Carregando a equipe…</p>';
  /* v7.4 (P3): pede só os papéis que este cargo cadastra — o servidor não
     devolve mais a SRE inteira (nem colegiado, nem diretores) */
  servidor('acessosListar', {token:SESSAO.token, papeis:papeisQuePossoCadastrar()}, function(res){
    if(!res || !res.ok){ $('#piEquipe').innerHTML = '<p class="pi-vazio erro">' + esc((res && res.erro) || 'Não foi possível carregar a equipe.') + '</p>'; return; }
    const meus = papeisQuePossoCadastrar();
    EQUIPE = (res.acessos || []).filter(function(a){ return meus.indexOf(a.papel || '') >= 0; });
    desenharMinhaEquipe();
  }, function(){ $('#piEquipe').innerHTML = '<p class="pi-vazio erro">' + TXT_SEM_RESPOSTA + '</p>'; });
}

function desenharMinhaEquipe(){
  const meus = papeisQuePossoCadastrar();
  const porPapel = meus.map(function(pp){
