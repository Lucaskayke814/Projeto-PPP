/** Quantos itens de produção ainda faltam em cada módulo. */
function pendenciasModulo(m){
  let n = 0;
  TELAS.filter(function(t, i){ return t.modulo === m && telaVisivel(i); }).forEach(function(t){
    if(t.tipo==='dados'){
      if(!state.dados.escola || !state.dados.inep || !state.dados.municipio) n++;
    } else if(t.tipo==='marcacao'){
      if(state.sel[t.grupo].size === 0) n++;
    } else if(t.tipo==='indicadores'){
      const algum = ETAPAS.some(function(o){
        const l = state.ind.etapas[o.id]||{};
        return state.sel.etapas.has(o.id) && IND_COLS.some(c=>String(l[c.k]||'').trim());
      });
      if(!algum) n++;
    } else if(t.tipo==='escrita' || t.tipo==='balanco' || (t.tipo==='aprofundamento' && t.campos)){
      t.campos.forEach(c=>{ if(!c.opcional && !state.txt[c.id].trim()) n++; });
    } else if(t.tipo==='final'){
      if(!state.dados.aprovacao) n++;
    }
  });
  return n;
}
function renderTrilha(){
  $('#trilha').innerHTML = MODULOS.map((m,i)=>`<button class="mod-btn" data-mod="${i}" title="Módulo ${i+1} · ${esc(m.n)}" aria-label="Módulo ${i+1}: ${esc(m.n)}">
    <span class="num">${('0'+(i+1)).slice(-2)}</span><span class="lbl">${esc(m.n)}</span>
    <span class="pend" data-pend="${i}" hidden></span></button>`).join('');
  $$('.mod-btn').forEach(b=>b.addEventListener('click',function(){
    const alvo = TELAS.findIndex((t,i)=>t.modulo === +b.dataset.mod && telaVisivel(i));
    if(alvo>=0) irParaComTravas(alvo);
  }));
  atualizarPendencias();
}
/** v8.8 (F4): no celular, a trilha rola até o módulo atual — sem isso, os
    módulos 9 e 10 ficavam fora da tela sem nenhuma pista de que havia mais. */
function centralizarTrilha(modulo){
  const trilha = $('#trilha');
  if(!trilha || typeof trilha.scrollTo !== 'function') return;
  const b = trilha.querySelector('.mod-btn[data-mod="' + modulo + '"]');
  if(!b || !trilha.scrollWidth || trilha.scrollWidth <= trilha.clientWidth) return;
  const alvo = b.offsetLeft - (trilha.clientWidth - b.offsetWidth) / 2;
  try { trilha.scrollTo({left: Math.max(0, alvo), behavior: 'smooth'}); }
  catch(e){ trilha.scrollLeft = Math.max(0, alvo); }
}
function atualizarPendencias(){
  MODULOS.forEach(function(m,i){
    const el = document.querySelector('[data-pend="'+i+'"]');
    if(!el) return;
    const n = pendenciasModulo(i);
    el.textContent = n;
    el.hidden = (n === 0);
    el.title = (n === 1 ? '1 item' : n + ' itens') + ' a preencher neste módulo';
  });
}

/** salto pela trilha ou pelo mapa: para na primeira tarefa obrigatória ainda não confirmada */
/** telas que só existem na revisão bienal ficam ocultas na primeira versão */
function telaVisivel(i){
  const t = TELAS[i];
  return !!t && (!t.somenteRevisao || (APP.versao || 1) > 1);
}
function telasVisiveis(){
  return TELAS.map(function(_, i){ return i; }).filter(telaVisivel);
}
function proximaVisivel(i, passo){
  let j = i + passo;
  while(j >= 0 && j < TELAS.length && !telaVisivel(j)) j += passo;
  return (j >= 0 && j < TELAS.length) ? j : i;
}
function irParaComTravas(alvo){
  for(let j = 0; j < alvo; j++){
    if(telaVisivel(j) && travaPreparacao(j)){
      irPara(j);
      toast('Antes de avançar, confirme os itens de preparação desta tela.');
      return;
    }
  }
  irPara(alvo);
}
function irPara(i, semSalvar){
  const ant = TELAS[state.tela];
  if(!semSalvar && ant && ['dados','marcacao','escrita','indicadores'].indexOf(ant.tipo)>=0){
    // v6.1: ao sair da identificação com escola e INEP válidos, o registro é criado
    // automaticamente (com a checagem de INEP duplicado); antes, nada era gravado
    // até a escola clicar em "Salvar", e um fechamento de aba perdia tudo.
    if(ant.tipo==='dados' && !APP.local && !APP.protocolo && state.dados.escola.trim() &&
       /^\d{2,8}$/.test(state.dados.inep.replace(/\D/g,''))) salvarExplicito();
    else autoSalvar();
  }

  /* v8.13 (D14/A4-13): índice não inteiro deixava `state.tela` em NaN ou 1.7 e
     a linha seguinte lançava TypeError — e o valor corrompido ia para a coluna
     "Tela atual". Nenhum caminho da interface passa não inteiro hoje; isto é
     robustez, e entra aqui porque é a função que o checklist chama. */
  const n = Math.round(Number(i));
  if(!isFinite(n)) return;
  state.tela = Math.max(0, Math.min(TELAS.length-1, n));
  if(!telaVisivel(state.tela)) state.tela = proximaVisivel(state.tela, 1);
  const t = TELAS[state.tela];

  $('#panelFormativo').hidden = true;
  $('#panelProducao').hidden = true;
  $('#panelFinal').hidden = true;

  if(t.tipo==='balanco'){ renderBalanco(t); $('#panelFormativo').hidden=false; }
  else if(t.tipo==='formativa'){ renderFormativa(t); $('#panelFormativo').hidden=false; }
  else if(t.tipo==='reflexao'){ renderReflexao(t); $('#panelFormativo').hidden=false; }
  else if(t.tipo==='aprofundamento'){ renderAprofundamento(t); $('#panelFormativo').hidden=false; }
  else if(t.tipo==='dados'){ renderDados(); $('#panelProducao').hidden=false; }
  else if(t.tipo==='marcacao'){ renderMarcacao(t); $('#panelProducao').hidden=false; }
  else if(t.tipo==='indicadores'){ renderIndicadores(t); $('#panelProducao').hidden=false; }
  else if(t.tipo==='escrita'){ renderEscrita(t); $('#panelProducao').hidden=false; }
  else { $('#panelFinal').hidden=false; }
  inserirParecerDevolucao(t);


  $$('.mod-btn').forEach((b,i2)=>{
    b.classList.toggle('current', i2===t.modulo);
    b.classList.toggle('done',    i2< t.modulo);
    /* v8.8 (F4): a trilha escondia o nome de nove dos dez módulos atrás de
       números, com espaço vazio de sobra ao lado. O módulo atual e os seus
       vizinhos passam a mostrar o nome; os demais continuam pelo número. */
    b.classList.toggle('com-nome', Math.abs(i2 - t.modulo) <= 1);
  });
  centralizarTrilha(t.modulo);
  const vis = telasVisiveis(), pos = Math.max(0, vis.indexOf(state.tela));
  $('#barraProg').style.width = (pos/Math.max(1, vis.length-1)*100)+'%';
  $('#barraProg').parentElement.setAttribute('title', 'Tela ' + (pos+1) + ' de ' + vis.length);

  $('#btnBack').disabled = (pos === 0);
  const rot = {formativa:'Avançar →', reflexao:'Escrever o texto da escola →'};
  $('#btnNext').textContent = rot[t.tipo] || 'Avançar →';
  $('#btnNext').hidden = (t.tipo==='final');
  atualizarBotaoAvancar();
  aplicarBloqueio();
  if(t.tipo==='final') montarTelaFinal();

  const titulo = ($('#panelFormativo').hidden ? $('#panelProducao') : $('#panelFormativo'));
  const h2 = (t.tipo==='final' ? $('#panelFinal') : titulo).querySelector('h2');
  $('#anuncio').textContent = 'Tela ' + (pos+1) + ' de ' + vis.length +
    (h2 ? ' — ' + h2.textContent : '');

  renderDoc();
  marcarSecao(true);
  window.scrollTo({top:0, behavior:'smooth'});
  const foco = (t.tipo==='final' ? $('#panelFinal') : (['formativa','reflexao','aprofundamento'].indexOf(t.tipo)>=0 ? $('#panelFormativo') : $('#panelProducao'))).querySelector('h2');
  if(foco){ foco.setAttribute('tabindex','-1'); foco.focus({preventScroll:true}); }
}

function baixarBase64(b64,nome,mime){
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([bytes],{type:mime||'application/pdf'}));
  a.download=nome; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },4000);
}
/**
 * v7.4 (P1): o PDF oficial, a ata e os anexos são entregues PELO APP, depois
 * da autorização no servidor (documentoPdf) — nenhum link do Drive é exposto.
 *   tipo: 'ppp' | 'ata' | 'anexo' (com id); protocolo: o do documento aberto, se omitido.
 */
function baixarDocumento(tipo, protocolo, id, btn, indice){
  const p = protocolo || APP.protocolo;
  if(!p){ toast('Não há documento aberto para baixar.'); return; }
  const rotulo = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Preparando…'; }
  const volta = function(){ if(btn){ btn.disabled = false; btn.textContent = rotulo; } };
  const pedido = {token:SESSAO.token, p:p, tipo:tipo || 'ppp', id:id || ''};
  if(indice !== undefined && indice !== null && indice !== '') pedido.indice = indice;
  servidor('documentoPdf', pedido, function(res){
    volta();
    if(res && res.ok && res.base64) baixarBase64(res.base64, res.nome || (p + '.pdf'), res.mime);
    else alerta((res && res.erro) || 'Não foi possível obter o arquivo agora.');
  }, function(){ volta(); toast('Sem resposta do servidor. Tente novamente em instantes.'); });
}

function verificarQuorum(){
  const pres = parseInt(state.dados.quorumPresentes,10), tot = parseInt(state.dados.quorumTotal,10);
  const el = $('#avisoQuorum');
  if(isNaN(pres) || isNaN(tot) || tot <= 0){ el.textContent = ''; el.className = 'sub'; return; }
  const minimo = Math.floor(tot/2) + 1;
  if(pres >= minimo){ el.textContent = 'Quórum de maioria absoluta atendido (mínimo de ' + minimo + ').'; el.className = 'sub ok'; }
  else { el.textContent = 'Quórum insuficiente: a maioria absoluta exige ao menos ' + minimo + ' membros.'; el.className = 'sub alerta'; }
}

/**
 * v7.3 (T-07): o parecer da última devolução acompanha a escola no percurso —
 * um cartão de atenção no topo do painel, enquanto o PPP estiver em
 * andamento. Some quando o documento é reenviado.
 */
function htmlParecerDevolucao(){
  if(!APP.parecerValidacao || APP.status !== 'Em andamento') return '';
  const dev = APP.devolucoes || [];
  const ultima = dev.length ? dev[dev.length - 1] : null;
  return '<div class="card-atencao parecer-devolucao" id="parecerDevolucao"><h4>' +
    esc(UI.parecerTitulo) + (ultima ? ' — ' + esc(ultima.em) + (ultima.por ? ' · ' + esc(ultima.por) : '') : '') + '</h4>' +
    '<p>' + esc(APP.parecerValidacao) + '</p>' +
    (dev.length > 1 ? '<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12.5px">' +
      esc(UI.parecerTodas.replace('{n}', dev.length)) + '</summary>' +
      dev.slice().reverse().map(function(x){
        return '<p style="margin-top:8px;font-size:13px"><b>' + esc(x.em || '') + '</b>' +
          (x.por ? ' · ' + esc(x.por) : '') + '<br>' + esc(x.parecer || '') + '</p>';
      }).join('') + '</details>' : '') + '</div>';
}
function inserirParecerDevolucao(t){
  const html = htmlParecerDevolucao();
  const alvo = (t && t.tipo === 'final') ? null
    : ($('#panelFormativo').hidden ? $('#panelProducao') : $('#panelFormativo'));
  if(!alvo) return;
  const existente = alvo.querySelector('#parecerDevolucao');
  if(existente) existente.remove();
  if(html) alvo.insertAdjacentHTML('afterbegin', html);
}

/* ============================================================
   v8.1 — AS CAIXAS DE ASSINATURA AO FIM DO DOCUMENTO

   Saíram as linhas de assinatura padronizadas e a menção a presidente de
   colegiado. Em seu lugar vem uma caixa por pessoa, com espaço para assinar:
   a direção, cada membro do Colegiado Escolar que compareceu à reunião de
   aprovação e, por último, quem acompanhou o documento pela Superintendência
   — identificado como "acompanhado por", não como signatário.

   É o mesmo desenho que o servidor imprime na folha de assinaturas
   (caixaAssinatura_/caixasAssinatura_ no Code.gs): o que se vê na tela é o
   que sai no PDF.
   ============================================================ */
function caixaAssin(op){
  const nome = String((op && op.nome) || '').trim();
  return '<td class="cxa">' +
    '<p class="cx-rot">' + esc(op.rotulo || '') + '</p>' +
    '<div class="cx-esp"></div>' +
    '<div class="cx-lin"></div>' +
    '<p class="cx-nome">' + (nome ? esc(nome) : '&nbsp;') + '</p>' +
    (op.abaixo ? '<p class="cx-rep">' + esc(op.abaixo) + '</p>' : '') +
    (op.quando ? '<p class="cx-quando">' + esc(op.quando) + '</p>' : '') +
    '</td>';
}
function caixasDoDocumento(){
  const cx = [];
  const lista = APP.assinaturas || [];
  if(lista.length){
    lista.forEach(function(a){
      const daDirecao = a.papel === 'Direção Escolar';
      cx.push(caixaAssin({
        rotulo: daDirecao ? 'Direção Escolar' : (a.segmento || 'Colegiado Escolar'),
        nome: a.nome || '',
        abaixo: (daDirecao ? '' : 'Colegiado Escolar') +
                (a.masp ? (daDirecao ? '' : ' · ') + 'MASP ' + a.masp : ''),
        quando: a.assinadoEm ? 'Assinado no sistema em ' + a.assinadoEm : 'Assinatura pendente no sistema'}));
    });
  } else {
    /* antes da conclusão a folha ainda não existe: a prévia mostra a caixa da
       direção e uma caixa de exemplo do Colegiado, para que se veja o fim do
       documento como ele vai ficar */
    cx.push(caixaAssin({rotulo:'Direção Escolar', nome:(state.dados.direcao || '').trim(),
                        abaixo:'', quando:'Assina no sistema ao concluir o documento'}));
    cx.push(caixaAssin({rotulo:'Colegiado Escolar', nome:'',
                        abaixo:'Membro presente à reunião de aprovação',
                        quando:'Uma caixa por membro presente'}));
  }
  if(APP.validadoPor){
    const partes = String(APP.validadoPor).split(' · ');
    cx.push(caixaAssin({
      rotulo: UI.folhaAcompanhamento,
      nome: partes[0] || '',
      abaixo: (partes[1] || '') + (state.dados.sre ? (partes[1] ? ' · ' : '') + 'SRE ' + state.dados.sre : ''),
      quando: APP.validadoEm ? 'Documento validado em ' + APP.validadoEm : ''}));
  } else {
    cx.push(caixaAssin({rotulo: UI.folhaAcompanhamento, nome:'',
                        abaixo:'Superintendência Regional de Ensino',
                        quando:'Preenchido com quem validar o documento'}));
  }
  let h = '<table class="cxs"><tbody>';
  for(let i = 0; i < cx.length; i += 2){
    h += '<tr>' + cx[i] + (cx[i+1] || '<td class="cxa vazia"></td>') + '</tr>';
  }
  return h + '</tbody></table>';
}

function montarTelaFinal(){
  $('#fAssemb').value = state.dados.assembleia || '';
  $('#fAnalise').value = state.dados.analiseSre || '';
  $('#fQpres').value = state.dados.quorumPresentes || '';
  $('#fQtot').value = state.dados.quorumTotal || '';
  verificarQuorum();
  $('#fAprov').value = state.dados.aprovacao || '';

  const congelado = bloqueado();
  const emValidacao = (APP.status === 'Em validação');
  const validado  = (APP.status === 'Validado');
  const assinado  = (APP.status === 'Assinado');
  const encerrado = (APP.status === 'Concluído');
  /* v7.9 (P9): "Homologado" (pela SRE) é tratado como o envio declarado, com a informação a mais */
  const homologado = (APP.status === 'Enviado para homologação' || APP.status === 'Homologado');

  /* v7.3 (T-14): validado, o documento está travado, mas o passo seguinte —
     concluir — fica à mão; em validação, nem concluir nem assinar.
     v8.14: e em elaboração o passo seguinte é a VALIDAÇÃO, não a conclusão.
     O servidor já recusava concluir um PPP que a Diretoria Educacional não
     tinha visto ("Este PPP ainda não foi validado…"); a tela é que oferecia
     o botão assim mesmo e deixava a escola bater numa porta fechada. */
  const emElaboracao = (APP.status === 'Em andamento');
  /* o cartão aparece em toda elaboração: quem chega ao fim do percurso tem de
     ver qual é o passo seguinte. Sem protocolo ainda não há o que enviar — e
     é o botão que diz isso, não a ausência do cartão. */
  $('#cardValidacao').hidden   = !emElaboracao;
  if(emElaboracao){
    const semProto = !APP.protocolo;
    $('#btnEnviarValidacao').disabled = semProto;
    $('#btnEnviarValidacaoTxt').textContent = semProto
      ? 'Salve o PPP para poder enviá-lo'
      : 'Enviar para validação';
  }
  $('#cardEmValidacao').hidden = !emValidacao;
  if(emValidacao){
    $('#uiEmValidQuando').textContent = APP.enviadoValidacaoEm
      ? 'Enviado em ' + APP.enviadoValidacaoEm + '.' : '';
  }
  $('#cardConcluir').hidden    = !validado;
  $('#btnConcluir').disabled   = false;
  $('#cardAssinaturas').hidden = !congelado || validado || emValidacao;
  /* v8.1 — a ata vem ANTES das assinaturas: aparece durante a coleta e
     continua aparecendo para registros antigos, que assinaram antes dela */
  const emAssinatura = (APP.status === 'Em assinatura');
  $('#cardAta').hidden         = !(emAssinatura || assinado);
  if((emAssinatura || assinado) && !$('#ataData').value && state.dados.aprovacao) $('#ataData').value = state.dados.aprovacao;
  /* v8.13 (D08): a reunião já aconteceu — o calendário não oferece o futuro */
  if(!$('#cardAta').hidden && !$('#ataData').max){
    const h = new Date();
    $('#ataData').max = h.getFullYear() + '-' + ('0'+(h.getMonth()+1)).slice(-2) + '-' + ('0'+h.getDate()).slice(-2);
    $('#ataData').min = '2000-01-01';
  }
  /* v8.13 (D05) — o material complementar entra ENQUANTO A COLETA ESTÁ
     ABERTA. Até a 8.12 o cartão só aparecia depois do encerramento, que é
     justamente quando o servidor passou a recusar: o anexo mudava a folha e
     o PDF oficial de um documento já assinado, sob o mesmo código. Fechada a
     coleta, o cartão continua aparecendo — mas só como lista. */
  const podeAnexar = emAssinatura;
  $('#cardAnexos').hidden      = !(podeAnexar || assinado || encerrado || homologado);
  if(!$('#cardAnexos').hidden){
    $('#listaAnexos').innerHTML = listaAnexosHTML();
    $('#anexoZona').hidden = !podeAnexar;
    $('#btnEnviarAnexo').hidden = !podeAnexar;
    $('#anexosFechado').hidden = podeAnexar;
    $('#anexosFechado').textContent = podeAnexar ? '' :
      'Assinado o termo pela direção, o documento não recebe mais anexos: o código de autenticidade ' +
      'responde pelo que foi assinado. Para acrescentar material, inicie uma nova versão.';
  }
  /* v8.2: o cartão da homologação é informativo — aparece depois que a
     assinatura da direção encaminhou o documento */
  $('#cardHomol').hidden       = !(encerrado || APP.status === 'Enviado para homologação');
  $('#cardAtaOk').hidden       = !homologado;
  $('#cardVersao').hidden      = !(assinado || encerrado || homologado);
  /* v7.4 (P1): nenhum link direto do Drive — os botões pedem o arquivo ao
     app (baixarDocumento → documentoPdf), que confere a autorização */
  const temPdf = !!(APP.temPdf || APP.pdfUrl);
  if(!$('#cardHomol').hidden){
    $('#infoHomol').innerHTML =
      (APP.homolData ? 'Encaminhado em <b>' + esc(APP.homolData) + '</b>' +
        (APP.homolDestino ? ' · ' + esc(APP.homolDestino) : '') + '. ' : '') +
      (temPdf ? '<button type="button" class="acao-min" data-baixar="ppp">baixar o PDF do documento</button>' : '');
  }

  if(homologado){
    /* v9.0 (item 38): o cartão dizia "Processo encerrado" e "assinado por todos
       os membros previstos" enquanto o Colegiado ainda podia assinar. Agora o
       título segue a situação e o texto conta as assinaturas que existem. */
    const ass = APP.assinaturas || [];
    const assinadas = ass.filter(function(x){ return !!x.assinadoEm; }).length;
    $('#cardAtaOk h3').textContent = APP.homolEm ? 'Documento homologado' : 'Documento encaminhado para homologação';
    $('#txtAtaOk').innerHTML = 'Este Projeto Político-Pedagógico foi assinado pela direção e tem a ata da reunião de aprovação' +
      (APP.ataData ? ' de <b>' + esc(APP.ataData) + '</b>' : '') +
      (APP.ataIdent ? ' (' + esc(APP.ataIdent) + ')' : '') + ' anexada.' +
      (ass.length ? ' Assinaturas: ' + assinadas + ' de ' + ass.length + '.' : '') +
      (APP.ataUrl || APP.ataNome ? ' <button type="button" class="acao-min" data-baixar="ata">baixar a ata anexada</button>' : '') +
      (temPdf ? ' <button type="button" class="acao-min" data-baixar="ppp">baixar o PDF do documento</button>' : '') +
      (APP.homolData ? '<br>Encaminhado à Superintendência Regional de Ensino para homologação em <b>' + esc(APP.homolData) + '</b> (' +
        esc(APP.homolDestino) + ').' : '') +
      (APP.homolEm ? '<br><b>Homologado pela Superintendência Regional de Ensino em ' + esc(APP.homolEm) + '</b>' +
        (APP.homolAto ? ', ato ' + esc(APP.homolAto) : '') + (APP.homolPor ? ', registrado por ' + esc(APP.homolPor) : '') + '.' : '');
  }

  if(assinado || encerrado || homologado){
    $('#txtVersao').innerHTML = 'Este PPP está <b>' + (APP.status === 'Homologado' ? 'homologado pela Superintendência Regional de Ensino' : homologado ? 'enviado para homologação' : encerrado ? 'concluído' : 'integralmente assinado') +
      '</b> (protocolo ' + esc(APP.protocolo) + ', versão ' + APP.versao + ') e não pode mais ser alterado. ' +
      'Ao iniciar a revisão bienal, todo o conteúdo é copiado para um novo protocolo e ' +
      '<b>a versão atual permanece preservada</b>.';
  }

  if(congelado && !validado && !emValidacao){
    const a = APP.assinaturas || [];
    const dir = a.filter(x=>x.papel==='Direção Escolar')[0];
    const dirAssinou = !!(dir && dir.assinadoEm);
    const temAta = !!(APP.ataUrl || APP.ataNome);
    const temPresentes = a.some(function(x){ return x.papel === 'Colegiado Escolar'; });
    /* v8.13 (F01) — a ata só é insubstituível A PARTIR DA PRIMEIRA
       ASSINATURA. A tela diz isso ANTES do envio: quem escolheu o PDF errado
       descobre que pode trocar sem mandar 12 MB para receber uma recusa, e
       quem já não pode encontra o botão desabilitado, e não uma recusa. */
    const algumaAssinatura = a.some(function(x){ return !!x.assinadoEm; });
    if(!$('#cardAta').hidden){
      const travada = temAta && algumaAssinatura;
      $('#btnRegistrarAta').disabled = travada;
      $('#btnAtaTxt').textContent = travada ? 'Ata anexada'
        : (temAta ? 'Substituir a ata da reunião' : 'Anexar a ata da reunião');
      $('#uiAtaMini').innerHTML = htmlSeguro(UI.ataMini || '') + (travada
        ? ' <b>Este documento já tem assinatura registrada: a ata não pode mais ser trocada. ' +
          'Se houver o que corrigir, o caminho é uma nova versão.</b>' : '');
    }

    $('#infoCongelado').innerHTML = 'Documento concluído em <b>' + esc(APP.concluidoEm||'—') +
      '</b> · código de autenticidade <b>' + esc(APP.hash||'—') + '</b>' +
      (temPdf ? ' · <button type="button" class="acao-min" data-baixar="ppp">baixar o PDF do documento</button>' : '');

    /* v8.1 — a ordem é ata (1), presença (2), assinatura da direção (3). A
       direção só assina quando as duas primeiras estiverem feitas, e o botão
       diz o que falta em vez de recusar sem explicação. */
    $('#blocoColegiado').hidden = dirAssinou && !temPresentes;
    if(!$('#listaPresenca').children.length || PRESENCA.length !== a.filter(x=>x.papel==='Colegiado Escolar').length)
      carregarPresenca();
    $('#btnPresenca').hidden = dirAssinou;

    $('#blocoDirecao').hidden = dirAssinou;
    /* v8.13 (D03): os três campos são EXIBIÇÃO do cadastro — o que vai ser
       impresso na folha —, não entrada. O servidor não lê o que estiver aqui. */
    if(!dirAssinou && dir){
      $('#aDirNome').value  = SESSAO.nome  || dir.nome  || state.dados.direcao || '';
      $('#aDirMasp').value  = SESSAO.masp  || dir.masp  || '';
      $('#aDirEmail').value = SESSAO.email || dir.email || APP.email || '';
    }
    const falta = [];
    if(!temAta) falta.push('anexar a ata da reunião de aprovação');
    if(!temPresentes) falta.push('marcar quem compareceu');
    $('#dirPendencias').hidden = !falta.length;
    $('#dirPendencias').textContent = falta.length
      ? 'Antes de assinar, falta ' + falta.join(' e ') + '.' : '';
    $('#btnAssinarDir').disabled = falta.length > 0;
    $('#tabelaAssin').innerHTML = tabelaAssinaturas();
  }
}

/** Limpa tudo o que pertence a um PPP, para começar outro do zero. */

  APP.hash = ''; APP.concluidoEm = ''; APP.pdfUrl = ''; APP.temPdf = false; APP.assinaturas = []; APP.anexos = [];
  APP.ataUrl = ''; APP.ataNome = ''; APP.ataData = ''; APP.ataIdent = '';
  APP.homolDestino = ''; APP.homolData = ''; APP.homolPor = ''; APP.homolEm = ''; APP.homolAto = '';
  APP.parecerValidacao = ''; APP.devolucoes = [];

function iniciarNovaVersao(confirmado){
  if(!APP.protocolo) return;
  if(!confirmado) return confirmar('Iniciar uma nova versão deste PPP?\n\nSerá criado um novo protocolo com todo o conteúdo copiado. A versão atual (' +
              APP.protocolo + ') permanece preservada e continua acessível.',
              function(){ iniciarNovaVersao(true); }, {titulo:'Nova versão', rotulo:'Iniciar nova versão'});
  const btn = $('#btnNovaVersao');
  btn.disabled = true; btn.textContent = 'Criando nova versão…';
  servidor('novaVersao', {p:APP.protocolo, token:SESSAO.token}, function(res){
    btn.disabled = false; btn.textContent = 'Iniciar nova versão';
    if(res && res.ok){
      preencherRegistro(res.registro);
      toast('Versão ' + (res.registro.versao||2) + ' criada · protocolo ' + res.registro.protocolo);
    } else {
      alerta((res && res.erro) || 'Não foi possível criar a nova versão.');
    }
  }, function(){ btn.disabled=false; btn.textContent='Iniciar nova versão';
                 toast('Sem resposta do servidor. Seu texto continua na tela; tente novamente em instantes.'); });
}

/* ==========================================================
   9. Persistência
   ========================================================== */
function coletarDados(){
  const o = {protocolo: APP.protocolo || '', tela: state.tela};
  Object.keys(state.dados).forEach(k=>o[k]=state.dados[k]);
  Object.keys(state.txt).forEach(k=>o[k]=state.txt[k]);
  Object.keys(state.sel).forEach(g=>{
    o[g] = GRUPOS[g].filter(x=>state.sel[g].has(x.id)).map(x=>x.label);
  });
  o.indicadores = JSON.stringify(state.ind);
  o.detalhes = JSON.stringify(state.det);
  const ids = {};
  Object.keys(state.sel).forEach(g=>{ ids[g] = Array.from(state.sel[g]); });
  o.selecoes = JSON.stringify(ids);          // fonte primária na restauração
  o.tarefas = JSON.stringify(state.tarefas); // itens de preparação confirmados (v6.1)
  /* v8.13 (D02): "objetivos/indicadores da versão anterior" são do SERVIDOR
     (novaVersao os escreve) e viajavam no payload sem necessidade. A tela
     continua lendo-os para montar o balanço; não os devolve mais. */
  o.sessao = APP.sessao;                      // trava de edição concorrente
  o.token = SESSAO.token || '';               // autoriza pelo vínculo escola↔INEP
  o.rev = APP.rev;                            // v8.13 (D01): em que revisão esta tela está
  return o;
}
/**
 * v8.13 (D09) — O INSTANTÂNEO DO CONTEÚDO QUE FOI ENVIADO.
 *
 * "Salvo" tem de ser uma afirmação conferida: o que voltou do servidor é o
 * que estava na tela no momento do ENVIO, não o que está nela agora. Entre
 * um e outro cabem 2,5 s de rede de escola — e tudo o que se digitou nesse
 * intervalo só existe no DOM. Comparar o conteúdo enviado com o conteúdo de
 * agora é exato: não depende de relógio, de fuso nem de hash, e a
 * serialização custa milissegundos mesmo com um PPP inteiro.
 *
 * Só entra o que é CONTEÚDO. Ficam de fora a credencial (token, sessao), a
 * revisão e o status (que o servidor governa) e a tela atual (navegar não é
 * escrever — quem muda de tela não fica com "alterações não salvas").
 * A lista é de EXCLUSÃO, de propósito: campo de conteúdo novo entra sozinho.
 */
const FORA_DO_CONTEUDO = {token:1, sessao:1, rev:1, status:1, tela:1, protocolo:1, sobrepor:1, concluindo:1};
function conteudoDe(d){
  const o = d || {};
  return Object.keys(o).filter(function(k){ return !FORA_DO_CONTEUDO[k]; }).sort()
    .map(function(k){ return k + '\u001f' + String(o[k] === undefined || o[k] === null ? '' : o[k]); })
    .join('\u001e');
}
/**
 * v8.13 (D09) — O que ficou para trás volta a ser tentado.
 * Quando a resposta chega e a tela já mudou, não basta marcar "sujo": sem um
 * novo salvamento agendado, a próxima gravação só viria no relógio de 120 s.
 */
let _autoTimer = null;
function agendarAutoSalvar(ms){
  clearTimeout(_autoTimer);
  _autoTimer = setTimeout(function(){ _autoTimer = null; autoSalvar(); }, ms || 3000);
}
function atualizarBadge(hora){
  const b = $('#badgeProto');
  if(APP.sujo){
    /* v8.6 (E1): o protocolo não quebra, mas o aviso sim — e no celular ele vira
       um ponto ao lado, para não empurrar a página além da largura da tela. */
    b.innerHTML = '<span class="badge-id">' + esc(APP.protocolo || 'Sem protocolo') + '</span>' +
                  '<span class="badge-aviso"> · <span class="badge-aviso-tx">alterações não salvas</span></span>';
    b.title = 'Há alterações não salvas neste PPP.';
    b.setAttribute('aria-label', (APP.protocolo || 'Sem protocolo') + ' — alterações não salvas');
    b.classList.remove('salvo');
    return;
  }
  b.removeAttribute('title'); b.removeAttribute('aria-label');
  if(APP.protocolo){
    b.innerHTML = '<span class="badge-id">' + esc(APP.protocolo) + '</span>' + (APP.versao > 1 ? '<span class="badge-versao">v'+APP.versao+'</span>' : '') +
                  (hora ? ' · salvo '+esc(String(hora).split(' ')[1]) : '');
    b.classList.add('salvo');
  }
}
/** marca que há alterações pendentes de gravação */
function sujar(){
  APP.sujo = true; atualizarBadge();
  clearTimeout(_rascTimer);               /* v8.7 (D2) */
  _rascTimer = setTimeout(guardarRascunhoLocal, 1200);
}
/**
 * v8.13 (D09) — ao voltar do servidor, conferir antes de dizer "salvo".
 * `enviado` é o instantâneo do conteúdo no momento do envio. Se a tela
 * continua igual, a gravação de fato cobriu tudo: o selo vira "salvo" e o
 * rascunho local pode sair. Se mudou, o que se digitou durante o voo NÃO
 * está gravado: o selo continua em "alterações não salvas", o rascunho é
 * regravado com o que está na tela e outro salvamento é agendado.
 */
function concluirGravacao(res, enviado){
  APP.protocolo = res.protocolo || APP.protocolo;
  APP.versao = res.versao || APP.versao;
  if(res.rev !== undefined) APP.rev = parseInt(res.rev,10)||0;        /* v8.13 (D01) */
  gravacaoRestabelecida();                                            /* v8.7 (D2) */
  if(conteudoDe(coletarDados()) === enviado){
    APP.sujo = false; atualizarBadge(res.atualizadoEm);
    limparRascunhoLocal(APP.protocolo);
    return true;
  }
  APP.sujo = true; atualizarBadge();
  guardarRascunhoLocal(); agendarAutoSalvar();
  return false;
}
/** v8.13 (D09): a resposta chegou; se houve pedido represado, ele vai agora. */
function liberarVoo(){
  APP.emVoo = false;
  if(APP.salvarDeNovo){ APP.salvarDeNovo = false; autoSalvar(); }
}
function autoSalvar(){
  if(bloqueado()) return;
  /* v8.13 (D09): uma gravação por vez. Duas em voo levariam a MESMA revisão
     (D01) e a segunda voltaria como conflito da tela consigo mesma. */
  if(APP.emVoo){ APP.salvarDeNovo = true; return; }
  const d = coletarDados();
  if(!d.escola) return;
  if(!APP.protocolo) return;                 // o primeiro registro é sempre explícito (checagem de INEP)
  d.status = 'Em andamento';
  guardarRascunhoLocal();                         /* v8.7 (D2): antes de tentar, guarda */
  const enviado = conteudoDe(d); APP.emVoo = true;
  servidor('salvarPPP', d, function(res){
    APP.emVoo = false;
    if(res&&res.ok){
      concluirGravacao(res, enviado);               /* v8.13 (D09) */
    }
    else if(res&&res.conflito){               /* v8.13 (D01): a linha mudou desde que esta tela a leu */
      guardarRascunhoLocal(); falhaAoSalvar(res.erro); tratarConflito(res, d);
    }
    else if(res&&res.campoGrande){            /* v8.7 (D1): a recusa nomeia o campo */
      guardarRascunhoLocal(); falhaAoSalvar(res.erro);
      alerta(res.erro, 'Campo grande demais para gravar');
      irParaCampo(res.campoGrande);
    }
    else if(res&&res.erro){ toast(res.erro); falhaAoSalvar(res.erro); }
    liberarVoo();
  }, function(){
    /* v8.7 (D2): sem resposta do servidor, a tarja fica — o selo do cabeçalho
       sozinho passava despercebido, e o texto seguinte se perdia */
    guardarRascunhoLocal(); falhaAoSalvar();
    liberarVoo();                                   /* v8.13 (D09): senão a tela para de salvar */
  });
}
/** Leva à tela do campo apontado pelo servidor (v8.7 — D1). */
function irParaCampo(id){
  let i = TELAS.findIndex(function(t){ return (t.campos || []).some(function(c){ return c.id === id; }); });
  /* v8.13 (D12): fora dos textareas, o destino vem de TELA_DA_COLUNA — antes,
     "detalhes", "selecoes", "indicadores" e os campos da identificação
     devolviam -1 e o clique não levava a lugar nenhum. */
  if(i < 0 && TELA_DA_COLUNA[id] !== undefined) i = TELA_DA_COLUNA[id];
  if(i < 0){
    toast('O campo "' + (ROTULO_DO_CAMPO[id] || id) + '" não fica numa única tela: procure-o pelo Mapa do percurso.');
    return;
  }
  irPara(i, true);
  const ta = $('#ta_' + id) || $('#panelProducao [data-k="' + id + '"]');
  if(ta){ ta.focus(); ta.scrollIntoView({block:'center'}); }
}
function salvarExplicito(){
  if(bloqueado()){ toast('Documento concluído: para alterar o conteúdo, inicie uma nova versão na tela final.'); return; }
  const btn = $('#btnSalvar'), original = btn.innerHTML;
  btn.disabled = true; btn.textContent = 'Salvando…';
  const d = coletarDados(); d.status = 'Em andamento';
  const enviado = conteudoDe(d); APP.emVoo = true;                       /* v8.13 (D09) */
  servidor('salvarPPP', d, function(res){
    btn.disabled=false; btn.innerHTML=original;
    APP.emVoo = false;
    if(res&&res.ok){
      const coberto = concluirGravacao(res, enviado);                    /* v8.13 (D09) */
      toast(coberto ? ('PPP salvo · protocolo '+res.protocolo)
                    : 'Salvo até o último envio. O que você escreveu depois será salvo em instantes; até lá fica guardado neste navegador.');
      renderDoc(); }
    else if(res&&res.conflito){                                          /* v8.13 (D01) */
      guardarRascunhoLocal(); falhaAoSalvar(res.erro); tratarConflito(res, d); }
    else if(res&&res.duplicado){ tratarDuplicado(res.duplicado, d); }
    else if(res&&res.campoGrande){                                  /* v8.7 (D1) */
      guardarRascunhoLocal(); falhaAoSalvar(res.erro);
      alerta(res.erro, 'Campo grande demais para gravar'); irParaCampo(res.campoGrande); }
    else if(res&&res.erro){ alerta(res.erro); }
    liberarVoo();                                                        /* v8.13 (D09) */
  }, function(){ btn.disabled=false; btn.innerHTML=original;
    APP.emVoo = false;
    guardarRascunhoLocal(); falhaAoSalvar();                             /* v8.7 (D2) */
    toast('Não foi possível salvar agora. Seu texto continua na tela — tente de novo em instantes.');
    liberarVoo();                                                        /* v8.13 (D09) */ });
}

/**
 * v8.13 (D01) — A LINHA MUDOU DESDE QUE ESTA TELA A LEU.
 *
 * Duas abas da mesma escola (ou a escola e um ato da Superintendência)
 * gravaram a mesma linha. O servidor recusa em vez de sobrescrever, e aqui
 * a pessoa escolhe entre as duas saídas honestas: ler o que está gravado
 * (o texto da tela continua no rascunho local) ou gravar o seu por cima —
 * o que fica registrado na linha do tempo do documento.
 * O texto da tela NÃO é apagado em nenhum dos dois caminhos, e APP.sujo
 * continua verdadeiro: nada se perde enquanto a pessoa não decide.
 */
function tratarConflito(res, dados){
  confirmar((res.erro || 'Este PPP foi gravado por outra pessoa.') +
    '\n\nO que você escreveu continua na tela e no rascunho deste navegador. ' +
    'Você pode abrir o que está gravado no servidor — e perder de vista o seu texto até recolá-lo — ' +
    'ou gravar o seu por cima, o que fica registrado na linha do tempo do documento.',
    function(){
      /* gravar o meu por cima: reenvia com a revisão do servidor e a marca */
      const d = Object.assign({}, dados);
      d.rev = res.rev; d.sobrepor = true;
      /* v8.13 (D09): também aqui o "gravado" é conferido — o que se digitou
         enquanto o diálogo estava aberto não foi ao servidor. */
      const enviado = conteudoDe(d);
      servidor('salvarPPP', d, function(r2){
        if(r2 && r2.ok){
          concluirGravacao(r2, enviado);
          toast('Gravado por cima · a sobreposição ficou registrada na linha do tempo.');
          renderDoc();
        } else alerta((r2 && r2.erro) || 'Não foi possível gravar.');
      });
    },
    {titulo:'Este PPP foi gravado por outra pessoa',
     rotulo:'Gravar o meu por cima',
     rotuloCancelar:'Ver o que está gravado',
     aoCancelar: function(){
       servidor('buscarPPP', {p: APP.protocolo, sessao: APP.sessao, token: SESSAO.token}, function(r3){
         if(r3 && r3.ok) preencherRegistro(r3.registro);
         else alerta((r3 && r3.erro) || 'Não foi possível abrir o registro gravado.');
       });
     }});
}

/**
 * v8.13 (F04) — A CONCLUSÃO RECUSADA POR OUTRA GRAVAÇÃO TEM CAMINHO.
 *
 * Não se reaproveita `tratarConflito` aqui: o botão "Gravar o meu por cima"
 * dela dispara `salvarPPP`, que num PPP validado é recusado por `bloqueado` —
 * a pessoa cairia numa segunda recusa. E não se oferece "concluir o meu por
 * cima": em gravação normal a sobreposição é reversível (grava-se de novo);
 * em conclusão, não — o que for congelado responde pelo código. Não há o que
 * perder ao recarregar: com o PPP em "Validado" a escola já não altera o
 * conteúdo, de modo que o texto da tela é o texto gravado.
 */
function conflitoNaConclusao(res){
  confirmar('Este PPP mudou no servidor depois que esta tela o abriu (última gravação em ' +
    ((res && res.atualizadoEm) || 'data não informada') + '). Nada foi congelado e nada se perdeu. ' +
    'Abra o que está gravado e conclua a partir dele.',
    function(){
      servidor('buscarPPP', {p: APP.protocolo, sessao: APP.sessao, token: SESSAO.token}, function(r){
        if(r && r.ok){
          preencherRegistro(r.registro);
          toast('PPP atualizado. Use "Concluir o PPP" para concluir.');
        } else alerta((r && r.erro) || 'Não foi possível abrir o registro gravado.');
      });
    },
    {titulo:'A conclusão não foi feita',
     rotulo:'Abrir o que está gravado',
     rotuloCancelar:'Fechar'});
}

/** já existe PPP em andamento para este código de escola: um PPP por vez —
    o caminho é continuar o existente. (v7.4, P3: sem sessão não há gravação,
    e por isso acabou o segundo caminho, "criar um novo" com ignorarDuplicado.) */
function tratarDuplicado(dup){
  return confirmar('Esta escola já tem um PPP em andamento:\n\n' +
    dup.protocolo + ' — ' + dup.escola + ' (última gravação em ' + dup.atualizadoEm + ')\n\n' +
    'Só é possível ter um PPP em elaboração por vez. Continue esse ou conclua-o antes de começar outro.',
    function(){ retomarDuplicado(dup); },
    {titulo:'Já existe um PPP em andamento', rotulo:'Continuar esse PPP', rotuloCancelar:'Fechar'});
}
function retomarDuplicado(dup){
  servidor('buscarPPP', {p:dup.protocolo, sessao:APP.sessao, token:SESSAO.token}, function(res){
    if(res && res.ok){ preencherRegistro(res.registro); toast('PPP ' + dup.protocolo + ' aberto.'); }
    else alerta((res && res.erro) || 'Não foi possível abrir o registro existente.');
  });
}

function preencherRegistro(reg, semNavegar){
  APP.protocolo = reg.protocolo;
  APP.versao = reg.versao || 1;
  /* v8.13 (D01): a revisão com que esta tela leu a linha */
  APP.rev = (reg.rev === undefined || reg.rev === '') ? undefined : (parseInt(reg.rev, 10) || 0);
  APP.origem = reg.origem || '';
  APP.status = reg.status || 'Em andamento';
  APP.hash = reg.hash || '';
  APP.concluidoEm = reg.concluidoEm || '';
  /* v7.4 (P1): o link do Drive não é mais usado pela tela; o que importa é
     saber se HÁ um PDF a pedir ao app (pdfId, ou o link de registros antigos) */
  APP.pdfUrl = reg.pdfUrl || '';
  APP.temPdf = !!(reg.temPdf || reg.pdfId || reg.pdfUrl);
  APP.ataUrl = reg.ataUrl || ''; APP.ataNome = reg.ataNome || '';
  APP.ataData = reg.ataData || ''; APP.ataIdent = reg.ataIdent || '';
  APP.homolDestino = reg.homolDestino || ''; APP.homolData = reg.homolData || '';
  APP.homolPor = reg.homolPor || ''; APP.homolEm = reg.homolEm || ''; APP.homolAto = reg.homolAto || '';   // v7.9 (P9)
  APP.objetivosAnteriores = reg.objetivosAnteriores || '';
  APP.indicadoresAnteriores = reg.indicadoresAnteriores || '';
  /* v7.3 (T-07): o parecer da devolução e as rodadas anteriores viajam com o registro */
  APP.parecerValidacao = reg.parecerValidacao || '';
  APP.enviadoValidacaoEm = reg.enviadoValidacaoEm || '';   /* v8.14: a tela final diz desde quando */
  /* v8.1: a caixa "acompanhado por" ao fim do documento */
  APP.validadoPor = reg.validadoPor || ''; APP.validadoEm = reg.validadoEm || '';
  try { APP.devolucoes = Array.isArray(reg.devolucoes) ? reg.devolucoes : JSON.parse(reg.devolucoes || '[]'); }
  catch(e){ APP.devolucoes = []; }
  if(!Array.isArray(APP.devolucoes)) APP.devolucoes = [];
  try { APP.anexos = JSON.parse(reg.anexos || '[]'); } catch(e){ APP.anexos = []; }
  try { APP.assinaturas = JSON.parse(reg.assinaturas || '[]'); } catch(e){ APP.assinaturas = []; }
  try {
    const ind = JSON.parse(reg.indicadores || '{}');
    state.ind = Object.assign({ano:'',idebAI:'',idebAF:'',idebAno:'',proalfa:'',proeb:'',clima:'',aee:'',docentes:'',etapas:{}}, ind);
    if(!state.ind.etapas) state.ind.etapas = {};
  } catch(e) { state.ind.etapas = {}; }
  try { state.det = JSON.parse(reg.detalhes || '{}'); } catch(e){ state.det = {}; }
  let tarefasDeAntes = false;
  try {
    const tf = JSON.parse(reg.tarefas || '{}') || {};
    tarefasDeAntes = tarefasAntigas_(tf);
    state.tarefas = migrarTarefas_(tf);
  } catch(e){ state.tarefas = {}; }
  Object.keys(state.dados).forEach(k=>{ if(reg[k]!==undefined) state.dados[k]=reg[k]; });
  Object.keys(state.txt).forEach(k=>{ if(reg[k]!==undefined) state.txt[k]=reg[k]; });
  let ids = null;
  try { ids = reg.selecoes ? JSON.parse(reg.selecoes) : null; } catch(e){ ids = null; }
  Object.keys(state.sel).forEach(g=>{
    const validos = GRUPOS[g].map(o=>o.id);
    if(ids && Array.isArray(ids[g])){
      state.sel[g] = new Set(ids[g].filter(id=>validos.indexOf(id)>=0));
    } else {
      const arr = reg[g] || [];
      state.sel[g] = new Set(GRUPOS[g].filter(o=>arr.indexOf(o.label)>=0||arr.indexOf(o.id)>=0).map(o=>o.id));
    }
  });
  APP.sujo = false;
  if(semNavegar){
    $('#badgeProto').textContent = SESSAO.perfil === 'central' ? 'Órgão Central · consulta' :
      (SESSAO.perfil === 'regional' ? 'SRE ' + SESSAO.sre + ' · consulta' : 'Consulta');
    renderDoc(); return;
  }
  atualizarBadge(reg.atualizadoEm);
  irPara(indiceAoAbrir_(reg.tela, tarefasDeAntes), true);
  ofertarRascunhoLocal(reg);                       /* v8.7 (D2) */
}
/* v7.4 (P3): buscarRegistro (abrir por protocolo, sem sessão) foi removida. A
   direção retoma o PPP pela tela inicial (continuarPPP), com sessão. */

/* v7.3 (T-14): em validação e validado também travam a edição — o documento
   está parado esperando a SRE, ou já tem o aval e só pode ser concluído. */
function bloqueado(){
  return ['Em validação','Validado','Em assinatura','Assinado','Concluído','Enviado para homologação','Homologado'].indexOf(APP.status) >= 0;
}

    /* v8.13 (E17): a recusa por TAMANHO tem mensagem própria — ela diz o que
       fazer, e o caminho é o mesmo do aviso de documento excedente (D17). A
       recusa por sessão o invólucro servidor() já trata. */
    else if(res && res.erro) toast(res.erro);
  }, function(){ btn.disabled=false; $('#btnPreviaTxt').textContent='Baixar prévia em PDF';
                 toast('Não foi possível gerar a prévia.'); });
}

/**
 * v8.14 — O ENVIO PARA VALIDAÇÃO, PELA TELA FINAL.
 *
 * Até aqui, terminar o percurso levava direto ao botão de concluir, e a
 * escola só descobria o passo que faltava na recusa do servidor. O envio
 * existia, mas escondido no painel, ao lado dos outros PPPs. Agora o fim do
 * percurso é o fim do percurso: o documento vai para a Diretoria
 * Educacional, e a conclusão aparece quando ele voltar validado.
 */
function enviarValidacaoDaTela(){
  if(!APP.protocolo){
    alerta('Salve o PPP antes de enviá-lo para validação: ele ainda não tem protocolo.',
           'Enviar para validação');
    return;
  }
  if(APP.sujo){
    /* o que a Diretoria Educacional vai ler é o que está GRAVADO */
    alerta('Há alterações não salvas nesta tela. Salve e envie em seguida: ' +
           'a Diretoria Educacional analisa o que está gravado.', 'Enviar para validação');
    return;
  }
  const pend = CHECK.filter(function(c){ return !c.ok(); });
  const btn = $('#btnEnviarValidacao');
  const seguir = function(){
    const barra = barrarPorIndicadores('enviar para validação');
    if(barra){ alerta(barra, 'Indicadores com valor inválido'); irParaCampo('indicadores'); return; }
    btn.disabled = true; $('#btnEnviarValidacaoTxt').textContent = 'Enviando…';
    const solta = function(){
      btn.disabled = false;
      $('#btnEnviarValidacaoTxt').textContent = 'Enviar para validação';
    };
    servidor('enviarParaValidacao', {token:SESSAO.token, protocolo:APP.protocolo}, function(res){
      solta();
      if(!res || !res.ok){ alerta((res && res.erro) || 'Não foi possível enviar.', 'Enviar para validação'); return; }
      if(res.registro){
        APP.status = res.registro.status || 'Em validação';
        APP.enviadoValidacaoEm = res.registro.enviadoValidacaoEm || '';
        if(res.registro.rev !== undefined) APP.rev = parseInt(res.registro.rev, 10) || 0;
      }
      montarTelaFinal();
      atualizarBadge();
      aviso('Enviado para validação',
        'O Projeto Político-Pedagógico foi enviado à Diretoria Educacional da SRE ' +
        esc(SESSAO.sre || state.dados.sre || '') + '.<br><br>' +
        'Enquanto ela não se manifestar, o conteúdo não pode ser alterado. ' +
        'Validado, a conclusão e as assinaturas ficam liberadas nesta tela.');
    }, function(){ solta(); toast('Sem resposta do servidor.'); });
  };
  confirmar((pend.length
      ? 'Atenção: ainda há ' + n(pend.length, 'item obrigatório', 'itens obrigatórios') + ' sem preenchimento. ' +
        'O que estiver em branco vai assim para o parecer.\n\n' : '') +
    'Enviar este Projeto Político-Pedagógico para a validação da Diretoria Educacional?\n\n' +
    'A partir do envio o documento fica parado até o parecer: a escola não consegue mais alterá-lo. ' +
    'Validado, o passo seguinte é concluir e colher as assinaturas; devolvido, ele volta editável, ' +
    'com o que precisa ser ajustado escrito na tela.',
    seguir, {titulo:'Enviar para validação', rotulo:'Enviar para validação'});
}

function concluirPPP(confirmado){
  const pend = CHECK.filter(c=>!c.ok());
  const alertaPend = pend.length
    ? 'Atenção: ainda há ' + n(pend.length, 'item obrigatório', 'itens obrigatórios') + ' sem preenchimento.\n\n'
    : '';
  if(!confirmado) return confirmar(alertaPend + 'Concluir este PPP?\n\n' +
     'O conteúdo fica congelado e não poderá mais ser alterado. Em seguida começa a coleta de ' +
     'assinaturas: direção escolar e membros do Colegiado Escolar.\n\n' +
     'Para alterar depois disso, será preciso iniciar uma nova versão.',
     function(){ concluirPPP(true); }, {titulo:'Concluir o PPP', rotulo:'Concluir'});

  /* v8.13 (D13): número inválido não entra em documento com valor normativo.
     A recusa acontece aqui e no servidor, e leva à tela em que se corrige. */
  const barra = barrarPorIndicadores('concluir');
  if(barra){
    alerta(barra, 'Indicadores com valor inválido');
    irParaCampo('indicadores');
    return;
  }
  /* v9.1: o documento só se congela com a fonte pronta — o que se grava
     aqui é o que sai no PDF e o que todo aparelho vai exibir. A fonte vem
     em data: URI e está pronta no carregamento; a espera é só uma
     segurança, e nunca passa de alguns milissegundos. */
  if(!fontesDoDocProntas() && document.fonts && document.fonts.ready){
    prepararFontesDoDoc();
    document.fonts.ready.then(function(){ _fontesDocProntas = true; concluirPPP(true); });
    return;
  }
  const btn=$('#btnConcluir'); btn.disabled=true; $('#btnConcluirTxt').textContent='Concluindo…';
  const d = coletarDados();
  APP.paraPdf = true;
  d.docHtml = paginar(docHTML(true).html);
  APP.paraPdf = false;
  if(paginar.excedeu) avisarExcedente();      /* v8.13 (D17) */
  /* v7.3 (T-15) / v8.13 (D03): quem assina é quem está CADASTRADO. A caixa da
     direção é montada pelo servidor a partir do cadastro da sessão; a tela não
     manda mais nome, MASP nem e-mail de assinatura. */
  servidor('concluirPPP', d, function(res){
    btn.disabled=false; $('#btnConcluirTxt').textContent='Concluir o PPP';
    if(res && res.ok){
      preencherRegistro(res.registro);
      irPara(TELAS.length-1, true);
      toast('PPP concluído · código de autenticidade ' + (res.registro.hash||''));
    } else if(res && res.conflito){
      /* v8.13 (F04): D01 fez a conclusão herdar a recusa por conflito de
         revisão. A recusa é certa — congelar o instantâneo de uma tela que
         não é o último estado gravado produziria documento oficial com texto
         vencido, sob código de autenticidade —, mas o `else` genérico não
         nomeava o ato tentado nem oferecia caminho. */
      conflitoNaConclusao(res);
    } else { alerta((res && res.erro) || 'Não foi possível concluir o documento.'); }
  }, function(e){ btn.disabled=false; $('#btnConcluirTxt').textContent='Concluir o PPP';
                  console.error(e); alerta('Não foi possível concluir o documento agora. Nada foi alterado — tente novamente em instantes.'); });
}

function assinarDirecao(confirmado){
  /* v8.1 — a direção assina por último: ata anexada, presença marcada e o
     atesto de veracidade. O servidor confere as três coisas de novo. */
  if(!(APP.ataUrl || APP.ataNome)){ toast('Anexe a ata da reunião de aprovação antes de assinar.'); return; }
  if(!(APP.assinaturas||[]).some(function(a){ return a.papel === 'Colegiado Escolar'; })){
    toast('Marque quem compareceu à reunião de aprovação antes de assinar.'); return; }
  if(!$('#aDirAceite').checked){ toast('Marque o atesto de veracidade para assinar.'); return; }
  /* v8.13 (D03): não há mais nome a digitar — e por isso não há mais o que
     validar aqui. O nome impresso é o do cadastro, e o servidor o busca. */
  /* v8.2 — assinar é também encaminhar: a confirmação diz isso antes do ato */
  if(!confirmado) return confirmar(UI.assinarConfirma,
    function(){ assinarDirecao(true); },
    {titulo:'Assinar e encaminhar à Diretoria Educacional', rotulo:'Assinar e encaminhar'});
  const btn=$('#btnAssinarDir'); btn.disabled=true; btn.textContent='Registrando…';
  servidor('assinarDirecao', {p:APP.protocolo, token:SESSAO.token, atesto:true},
    function(res){
      btn.disabled=false; btn.textContent='Assinar como Direção Escolar';
      if(res && res.ok){
        preencherRegistro(res.registro); montarTelaFinal();
        aviso('Documento assinado e encaminhado', UI.assinarEnviado +
          (res.destino ? '<br><br><b>Destino:</b> ' + esc(res.destino) : '') +
          (res.avisados ? '<br><b>Avisos a enviar por e-mail:</b> ' + res.avisados : ''));
      }
      else alerta((res && res.erro) || 'Não foi possível registrar a assinatura.');
    },
    function(){ btn.disabled=false; btn.textContent='Assinar como Direção Escolar';
                toast('Sem resposta do servidor. Seu texto continua na tela; tente novamente em instantes.'); });
}

const SEGMENTOS = ['Docente','Servidor administrativo','Pai, mãe ou responsável','Estudante','Comunidade'];
/* ============================================================
   v8.1 — PRESENÇA NA REUNIÃO DE APROVAÇÃO

   O colegiado já é cadastrado pela direção, na aba própria da tela inicial.
   Aqui ela não cadastra ninguém nem envia link: apenas MARCA quem esteve na
   reunião que aprovou o documento. Quem foi marcado ganha uma caixa de

let PRESENCA = [];      // os membros cadastrados da escola, como o servidor os devolveu

let ataBase64 = null, ataMime = '', ataNomeArq = '';

function escolherAta(){ $('#ataArquivo').click(); }

function arquivoSelecionado(e){
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  if(f.size > 12 * 1024 * 1024){
    toast('Arquivo acima de 12 MB. Digitalize em resolução menor ou salve como PDF comprimido.');
    e.target.value = ''; return;
  }
  if(!/\.(pdf|jpe?g|png)$/i.test(f.name)){
    toast('Formato não aceito. A ata pode ser enviada em PDF, JPG ou PNG.');
    e.target.value = ''; return;
  }
  const r = new FileReader();
  r.onload = function(){
    ataBase64 = String(r.result).split(',')[1];
    ataMime = f.type || 'application/octet-stream';
    ataNomeArq = f.name;
    $('#ataZona').classList.add('tem');
    $('#ataNome').textContent = f.name + ' · ' + Math.round(f.size/1024) + ' KB — pronto para envio.';
  };
  r.onerror = function(){ toast('Não foi possível ler o arquivo. Verifique se ele não está corrompido e tente outro.'); };
  r.readAsDataURL(f);
}

function registrarAta(confirmado){
  if(!ataBase64){ toast('Escolha o arquivo da ata antes de anexá-la.'); return; }
  /* v8.13 (D08): a data da reunião sai IMPRESSA no documento oficial — o
     servidor passou a exigi-la, e a tela pede antes de tentar. */
  if(!$('#ataData').value){
    toast('Informe a data da reunião do Colegiado: ela sai impressa no documento oficial.');
    $('#ataData').focus(); return;
  }
  if(!confirmado){
    /* v8.1: a ata é o primeiro passo, não o último — anexá-la não encerra nada */
    /* v8.13 (F01): substituir não é o mesmo ato que anexar, e a caixa passa a
       dizer o que acontece com o arquivo anterior e até quando a troca vale. */
    if(APP.ataUrl || APP.ataNome){
      return confirmar('Substituir a ata já anexada?\n\nA ata atual (' + (APP.ataNome || 'sem nome') +

/**
 * Aviso que fica na tela até a pessoa confirmar. Para o que ela precisa
 * mesmo ler — ao contrário do toast, que passa sozinho e serve a
 * confirmações rápidas.
 */
let avisoFoco = null, avisoCancela = null;
/**
 * v7.3 (T-13): o 4º argumento é lido. `opcoes.rotulo` e `opcoes.rotuloCancelar`
 * rotulam os botões (com rotuloCancelar o botão de cancelar aparece);
 * `opcoes.aoCancelar` roda no cancelamento. Se `aoFechar` devolver `false`, o
 * diálogo FICA ABERTO — é assim que um formulário dentro do aviso valida sem
 * perder o que a pessoa digitou (use erroNoAviso para dizer o que faltou).
 */
function aviso(titulo, html, aoFechar, opcoes){
  const o = opcoes || {};
  $('#avisoTitulo').textContent = titulo;
  $('#avisoTexto').innerHTML = html;
  limparErroNoAviso();
  avisoFoco = aoFechar || null; avisoCancela = o.aoCancelar || null;
  $('#avisoCancelar').hidden = !o.rotuloCancelar;
  $('#avisoCancelar').textContent = o.rotuloCancelar || 'Cancelar';
  $('#avisoOk').textContent = o.rotulo || 'Fechar';   /* v9.0 (R3): o botão diz a ação; "OK" não diz nada */
  $('#avisoOk').classList.remove('btn-perigo');
  $('#ovAviso').hidden = false;
  setTimeout(function(){ $('#avisoOk').focus(); }, 40);
}
/** Mensagem de validação dentro do diálogo aberto — o formulário continua na tela. */
function erroNoAviso(msg){
  const el = $('#avisoErro'); el.textContent = msg; el.classList.add('show');
  return false;
}
function limparErroNoAviso(){ const el = $('#avisoErro'); el.textContent = ''; el.classList.remove('show'); }
function fecharAviso(){
  const fn = avisoFoco, cancela = avisoCancela;
  $('#ovAviso').hidden = true;
  avisoFoco = null; avisoCancela = null;
  if(fn && fn() === false){
    /* a validação reprovou: o diálogo volta, com o formulário intacto */
    avisoFoco = fn; avisoCancela = cancela;
    $('#ovAviso').hidden = false;
  }
}
function cancelarAviso(){
  $('#ovAviso').hidden = true;
  const fn = avisoCancela; avisoFoco = null; avisoCancela = null;
  limparErroNoAviso();
  if(fn) fn();
}
/** Texto simples com quebras de linha vira parágrafos, com escape. */
function textoParaHTML(t){
  return String(t == null ? '' : t).split(/\n{2,}/)
    .map(function(p){ return '<p style="margin-bottom:10px">' + esc(p).replace(/\n/g, '<br>') + '</p>'; })
    .join('').replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>');
}
/**
 * Substituem os diálogos nativos do navegador, bloqueados quando a
 * página roda dentro de um iframe com sandbox — caso do simulador e do
 * arquivo aberto para conferência. Além disso ficam com a cara do sistema.
 */
function alerta(msg, titulo){ aviso(titulo || 'Aviso', textoParaHTML(msg)); }
function confirmar(msg, aoConfirmar, opcoes){
  const o = opcoes || {};
  /* Nos testes automatizados a confirmação é dada de imediato: o que se
     quer verificar ali é o efeito da ação, não o clique no botão. Os
     testes específicos do diálogo desligam esta bandeira. */
  if(window.confirmarAuto){ if(aoConfirmar) aoConfirmar(); return; }
  $('#avisoTitulo').textContent = o.titulo || 'Confirmar';
  $('#avisoTexto').innerHTML = textoParaHTML(msg);
  limparErroNoAviso();
  avisoFoco = aoConfirmar || null;
  avisoCancela = o.aoCancelar || null;
  $('#avisoCancelar').hidden = false;
  $('#avisoCancelar').textContent = o.rotuloCancelar || 'Cancelar';
  $('#avisoOk').textContent = o.rotulo || 'Confirmar';
  /* v9.0 (M04): a confirmação de uma ação destrutiva (remover, desativar,
     inativar, descartar) mostra o botão no vermelho do erro — quem chama passa
     {perigo:true}; as demais confirmações continuam com o primário. */
  $('#avisoOk').classList.toggle('btn-perigo', !!o.perigo);
  $('#ovAviso').hidden = false;
  setTimeout(function(){ $('#avisoCancelar').focus(); }, 40);
}

/* ==========================================================
   13. MOTOR DE CONTEÚDO EDITÁVEL
   Todo o texto do sistema vive nos blocos acima (T, UI, TELAS,
   catálogos, VÍDEOS, referências…). A Curadoria do Órgão Central
   grava, na planilha, apenas as DIFERENÇAS em relação a esses
   padrões — um par "caminho → novo valor". Ao abrir, o sistema
   restaura os padrões e aplica as diferenças por cima. Assim:
     · atualizar a legislação não exige programador;
     · "restaurar padrão" é sempre possível, campo a campo;
     · um PPP já concluído não muda — seu HTML fica congelado
       no Drive desde a conclusão.
   ========================================================== */
const RAIZES = {T:T, UI:UI, VIDEOS:VIDEOS, MODULOS:MODULOS, TELAS:TELAS,   /* v10.2: REDE saiu */
  ETAPAS:ETAPAS, MODALIDADES:MODALIDADES, INFRA:INFRA, TEMAS:TEMAS, PRINCIPIOS:PRINCIPIOS,
  METODOS:METODOS, DETALHES:DETALHES, REF_LEGISLACAO:REF_LEGISLACAO, REF_COND:REF_COND,
  SRES:SRES, SEGMENTOS:SEGMENTOS, IND_ALERTA:IND_ALERTA, IND_COLS:IND_COLS,
  SECOES:SECOES, SUBSECOES:SUBSECOES, ABERTURAS:ABERTURAS, VAZIOS:VAZIOS};

const CONTEUDO = {versao:0, itens:{}, ocultos:{}, padroesServidor:{}, previa:false, ignorados:[]};
const clonar = x => JSON.parse(JSON.stringify(x));

/** fotografia dos textos originais, tirada antes de qualquer alteração */
const PADRAO = (function(){
  const o = {};
  Object.keys(RAIZES).forEach(function(k){ o[k] = clonar(RAIZES[k]); });
  o.CHECK = CHECK.map(function(c){ return {t:c.t, ref:c.ref}; });
  return o;
})();

/** devolve os objetos vivos ao estado original, preservando as referências */
function reporPadrao(){
  Object.keys(RAIZES).forEach(function(k){
    const alvo = RAIZES[k], fonte = clonar(PADRAO[k]);
    if(Array.isArray(alvo)){ alvo.length = 0; fonte.forEach(function(x){ alvo.push(x); }); }
    else { Object.keys(alvo).forEach(function(x){ delete alvo[x]; });
           Object.keys(fonte).forEach(function(x){ alvo[x] = fonte[x]; }); }
  });
  CHECK.forEach(function(c,i){ c.t = PADRAO.CHECK[i].t; c.ref = PADRAO.CHECK[i].ref; });
}

/** posição de uma tela pelo seu identificador estável (t01, t02, …) */
function indiceDaTela(id, lista){
  const L = lista || TELAS;
  for(let i = 0; i < L.length; i++) if(L[i].id === id) return i;
  return -1;
}
/** "TELAS.t14.conteudo.lead" → índice atual da tela t14. Endereçar por
    identificador permite acrescentar ou remover telas sem invalidar os
    textos que a curadoria já publicou. */
function normalizarCaminho(partes, lista){
  if(partes[0] === 'TELAS' && partes[1] && !/^\d+$/.test(partes[1])){
    const i = indiceDaTela(partes[1], lista);
    if(i < 0) return null;
    return ['TELAS', String(i)].concat(partes.slice(2));
  }
  return partes;
}
/** grava um valor em "TELAS.t14.conteudo.lead"; ignora caminhos que não existem mais */
function aplicarCaminho(caminho, valor){
  let partes = String(caminho).split('.');
  if(partes[0] === 'CHECK'){
    const c = CHECK[+partes[1]]; if(c && partes[2]) c[partes[2]] = valor; return true;
  }
  partes = normalizarCaminho(partes);
  if(!partes) return false;
  let alvo = RAIZES[partes[0]];
  if(alvo === undefined) return false;
  for(let i = 1; i < partes.length - 1; i++){
    alvo = alvo[partes[i]];
    if(alvo === null || typeof alvo !== 'object') return false;
  }
  if(partes.length === 1){
    if(Array.isArray(alvo) && Array.isArray(valor)){ alvo.length = 0; valor.forEach(x=>alvo.push(x)); return true; }
    if(alvo && typeof alvo === 'object' && valor && typeof valor === 'object'){
      Object.keys(valor).forEach(function(k){ alvo[k] = valor[k]; }); return true;
    }
    return false;
  }
  const ultima = partes[partes.length - 1];
  if(!(ultima in alvo) && !Array.isArray(alvo)) return false;
  alvo[ultima] = valor;
  return true;
}

/* v10.2: `interpolarTudo` saiu. Não há mais marcador a resolver — a citação
   está escrita no texto, e o que a curadoria publica é o que a escola lê. */

/**
 * Aplica um conjunto de diferenças sobre os textos padrão.
 * itens: {caminho: valor}. Chaves especiais:
 *   NOVOS.<grupo> — itens acrescentados a um catálogo
 *   OCULTOS       — ["temas:financeira", …] retirados da tela de marcação
 */
function aplicarConteudo(itens){
  const mapa = itens || {};
  CONTEUDO.ocultos = {};
  reporPadrao();
  const ignorados = [];
  Object.keys(mapa).forEach(function(c){
    if(c.indexOf('NOVOS.') === 0){
      const g = c.slice(6), lista = mapa[c];
      if(GRUPOS[g] && Array.isArray(lista)) lista.forEach(function(x){ if(x && x.id) GRUPOS[g].push(clonar(x)); });
    }
  });
  if(Array.isArray(mapa.OCULTOS))
    mapa.OCULTOS.forEach(function(x){ CONTEUDO.ocultos[x] = true; });
  // do mais raso ao mais profundo: assim uma alteração em um item isolado
  // ("…perguntas.2") prevalece sobre a substituição da lista inteira ("…perguntas")
  Object.keys(mapa)
    .filter(function(c){ return c.indexOf('NOVOS.') !== 0 && c !== 'OCULTOS' &&
                                c.indexOf('EMAIL.') !== 0 && c.indexOf('DOC.') !== 0; })
    .sort(function(a, b){ return a.split('.').length - b.split('.').length; })
    .forEach(function(c){ if(!aplicarCaminho(c, mapa[c])) ignorados.push(c); });
  aplicarUI();
  /* v8.13 (E06, A7-10): o que a tela não reconhece deixa de ser um
     console.warn que ninguém vê. Fica guardado e a curadoria o mostra em
     faixa de alerta, com o botão de restaurar ao padrão ao lado — que é o
     caminho de limpeza do que já está gravado. */
  CONTEUDO.ignorados = ignorados;
  return ignorados;
}

/** itens de um catálogo que aparecem na tela de marcação (ocultos só se já marcados) */
function itensVisiveis(grupo){
  const set = state.sel[grupo];
  return GRUPOS[grupo].filter(function(o){
    return !CONTEUDO.ocultos[grupo + ':' + o.id] || (set && set.has(o.id));
  });
}


/* ==========================================================
   14. CURADORIA DE CONTEÚDO — interface do Órgão Central
   ========================================================== */
const CUR = {aberta:false, token:'', autor:'', rascunhos:{}, grupo:'', busca:'', mapa:null, historico:[], deOutros:[]};

/* --- leitura e escrita de um valor pelo caminho, na fotografia padrão --- */
function valorPadrao(caminho){
  let partes = String(caminho).split('.');
  if(partes[0] === 'EMAIL' || partes[0] === 'DOC')
    return CONTEUDO.padroesServidor && CONTEUDO.padroesServidor[partes.join('.')];
  partes = normalizarCaminho(partes, PADRAO.TELAS);
  if(!partes) return undefined;
  let o = PADRAO[partes[0]];
  for(let i = 1; i < partes.length && o !== undefined && o !== null; i++) o = o[partes[i]];
  return o;
}
function valorPublicado(caminho){
  return (caminho in CONTEUDO.itens) ? CONTEUDO.itens[caminho] : valorPadrao(caminho);
}
function valorAtual(caminho){
  if(caminho in CUR.rascunhos) return CUR.rascunhos[caminho] === null ? valorPadrao(caminho) : CUR.rascunhos[caminho];
  return valorPublicado(caminho);
}
const iguais = (a,b) => JSON.stringify(a) === JSON.stringify(b);

/* --- conversão entre o valor e o que aparece na caixa de edição --- */
function paraCaixa(v, tipo){
  if(tipo === 'lista')  return (v||[]).join('\n');
  if(tipo === 'matriz') return (v||[]).map(l=>l.join(' | ')).join('\n');
  if(tipo === 'numero') return String(v == null ? '' : v);
  return String(v == null ? '' : v);
}
function daCaixa(txt, tipo){
  if(tipo === 'lista')  return txt.split('\n').map(x=>x.trim()).filter(Boolean);
  if(tipo === 'matriz') return txt.split('\n').map(x=>x.trim()).filter(Boolean).map(l=>l.split('|').map(c=>c.trim()));
  if(tipo === 'numero'){ const n = parseFloat(String(txt).replace(',','.')); return isNaN(n) ? 0 : n; }
  return txt;
}

function camposDaTela(i){
  const t = PADRAO.TELAS[i], c = t.conteudo || t, base = 'TELAS.' + t.id, cs = [];
  const add = (p, rot, tipo, onde) => cs.push({p:p, rot:rot, tipo:tipo||'texto', onde:onde||''});
  const raiz = t.conteudo ? base + '.conteudo' : base;
  if(c.eyebrow) add(raiz + '.eyebrow', 'Etiqueta da tela', 'linha');
  if(c.titulo)  add(raiz + '.titulo',  'Título da tela', 'linha');
  if(c.lead)    add(raiz + '.lead',    'Texto de abertura');
  if(c.hint)    add(raiz + '.hint',    'Orientação da tela');
  (c.blocos || []).forEach(function(b, j){
    const bp = raiz + '.blocos.' + j, n = 'Bloco ' + (j+1);
    if(b.t === 'p')       add(bp + '.txt', n + ' — parágrafo');
    if(b.t === 'dest' || b.t === 'atencao'){
      add(bp + '.titulo', n + ' — ' + (b.t==='dest'?'destaque':'atenção') + ': título', 'linha');
      add(bp + '.txt',    n + ' — ' + (b.t==='dest'?'destaque':'atenção') + ': texto');
    }
    if(b.t === 'lista' || b.t === 'legal'){
      add(bp + '.titulo', n + ' — lista: título', 'linha');
      add(bp + '.itens',  n + ' — lista: itens (um por linha)', 'lista');
    }
    if(b.t === 'compare'){
      add(bp + '.sim.titulo', n + ' — comparação: título (é)', 'linha');
      add(bp + '.sim.itens',  n + ' — comparação: itens (é)', 'lista');
      add(bp + '.nao.titulo', n + ' — comparação: título (não é)', 'linha');
      add(bp + '.nao.itens',  n + ' — comparação: itens (não é)', 'lista');
    }
    if(b.t === 'exemplos'){
      add(bp + '.titulo', n + ' — exemplos: título', 'linha');
      ['fraco','bom'].forEach(function(k){
        const r = n + ' — exemplo ' + (k==='fraco'?'inadequado':'adequado');
        add(bp + '.' + k + '.rotulo', r + ': rótulo', 'linha');
        add(bp + '.' + k + '.texto',  r + ': texto');
        add(bp + '.' + k + '.notas',  r + ': comentários (um por linha)', 'lista');
      });
    }
    if(b.t === 'tabela'){
      add(bp + '.titulo',  n + ' — tabela: título', 'linha');
      add(bp + '.colunas', n + ' — tabela: cabeçalho (uma coluna por linha)', 'lista');
      add(bp + '.linhas',  n + ' — tabela: linhas (células separadas por |)', 'matriz');
      if(b.nota) add(bp + '.nota', n + ' — tabela: nota');
    }
  });
  if(t.perguntas) add(base + '.perguntas', 'Perguntas para a equipe (uma por linha)', 'lista');
  [['tarefa','Tarefa de preparação'],['tarefaSe','Tarefa condicional']].forEach(function(par){
    const tar = t[par[0]] || (t.conteudo && t.conteudo[par[0]]);
    if(!tar) return;
    const tp = (t[par[0]] ? base : raiz) + '.' + par[0];
    add(tp + '.titulo', par[1] + ' — título', 'linha');
    add(tp + '.intro',  par[1] + ' — introdução');
    add(tp + '.itens',  par[1] + ' — itens (um por linha)', 'lista');
  });
  if(t.legend)    add(base + '.legend', 'Legenda do quadro de marcação', 'linha');
  if(t.legendSub) add(base + '.legendSub', 'Subtítulo da legenda');
  if(t.info)      add(base + '.info', 'Nota informativa ao pé da tela');
  if(t.vazio)     add(base + '.vazio', 'Aviso quando nada foi marcado');
  (t.campos || []).forEach(function(f, j){
    const fp = base + '.campos.' + j, n = 'Campo "' + f.label + '"';
    add(fp + '.label', n + ' — rótulo', 'linha', f.ref);
    add(fp + '.ref',   n + ' — referência', 'linha');
    add(fp + '.helper', n + ' — orientação');
    add(fp + '.placeholder', n + ' — exemplo de preenchimento');
  });
  return cs;
}

/* --- desenho da interface de curadoria --- */
function curAlterados(grupo){
  return grupo.campos.filter(function(c){
    return (c.p in CUR.rascunhos) || (c.p in CONTEUDO.itens);
  }).length;
}
/* v8.13 (E07): quantos campos deste grupo têm rascunho de OUTRO curador —
   é o que a navegação assinala, para ninguém publicar o alheio sem ver. */
function curDeOutros(grupo){
  const alheios = {};
  (CUR.deOutros || []).forEach(function(x){ alheios[x.caminho] = x; });
  return grupo.campos.filter(function(c){ return !!alheios[c.p]; }).length;
}
function curDesenharNav(){
  $('#curNav').innerHTML = CUR.mapa.map(function(g){
    const alterados = g.historico ? '' : curAlterados(g);
    const outros = g.historico ? 0 : curDeOutros(g);
    return '<button data-g="' + g.id + '" class="' + (g.id === CUR.grupo ? 'on' : '') + '"' +
      (outros ? ' title="' + n(outros, 'campo', 'campos') + ' com rascunho de outro curador"' : '') + '>' +
      esc(g.nav) + (alterados ? '<span class="n">' + alterados + '</span>' : '') +
      (outros ? '<span class="n outro">' + outros + '</span>' : '') + '</button>';
  }).join('');
}
function curCampoHTML(c){
  const padrao = valorPadrao(c.p), atual = valorAtual(c.p);
  const rascunho = (c.p in CUR.rascunhos), publicado = (c.p in CONTEUDO.itens) && !iguais(CONTEUDO.itens[c.p], padrao);
  const v = paraCaixa(atual, c.tipo);
  const linhas = c.tipo === 'linha' ? 1 : Math.min(14, Math.max(3, Math.ceil(v.length / 95) + (v.match(/\n/g)||[]).length + 1));
  /* v8.13 (E05): o curador precisa saber QUAIS marcações são aceitas — antes
     ele escrevia HTML às cegas e descobria no documento publicado. */
  const dica = {lista:'Um item por linha.',
                matriz:'Uma linha por registro; células separadas por barra vertical ( | ).',
                texto:'Marcações aceitas: <b> <i> <em> <strong> <br> <p> <ul> <ol> <li> <blockquote>, sem atributos. Qualquer outra marcação é gravada como texto.'}[c.tipo];
  const alheio = (CUR.deOutros || []).filter(function(x){ return x.caminho === c.p; })[0];
  return '<div class="cur-campo ' + (rascunho ? 'rascunho' : (publicado ? 'alterado' : '')) +
    '" data-p="' + esc(c.p) + '" data-t="' + c.tipo + '">' +
    '<div class="cur-rot"><b>' + esc(c.rot) + '</b>' +
      (c.tela ? '<span class="cur-onde">tela ' + c.tela + '</span>' : '') +
      (c.onde ? '<span class="cur-onde">' + esc(c.onde) + '</span>' : '') +
      (rascunho ? '<span class="cur-badge ras">rascunho</span>' : (publicado ? '<span class="cur-badge pub">alterado</span>' : '')) +
      (alheio ? '<span class="cur-badge outro" title="Rascunho não publicado de outro curador">rascunho de ' + esc(alheio.autor) + '</span>' : '') +
    '</div>' +
    (dica ? '<p class="lista-nota">' + esc(dica) + '</p>' : '') +
    (c.tipo === 'linha' || c.tipo === 'numero'
      ? '<input type="text" value="' + esc(v) + '">'
      : '<textarea rows="' + linhas + '">' + esc(v) + '</textarea>') +

/**
 * v10.2 — QUANTOS TEXTOS AINDA CITAM A RESOLUÇÃO SEM NÚMERO, E ONDE.
 *
 * Até a 10.1 a citação vinha de um parâmetro, e este aviso dizia "preencha os
 * dois campos e todas as citações se atualizam". Sem o parâmetro, a

 * levar até lá: o botão abre o grupo com a busca já preenchida, de modo que a
 * lista que aparece é exatamente a dos textos a corrigir.

function pendenciasDaResolucao(){
  const por = [];

    if(g.historico) return;
    const n = g.campos.filter(function(c){
      return paraCaixa(valorAtual(c.p), c.tipo).indexOf(PENDENCIA_RESOLUCAO) >= 0;
    }).length;

  el.innerHTML = '<b>A resolução pedagógica ainda está sem número.</b> ' +
    n(total, 'texto ainda cita', 'textos ainda citam') + ' a nova resolução como “' + esc(PENDENCIA_RESOLUCAO) + '”. ' +
    'Publicada a resolução, cada um deles é corrigido aqui, na redação em que a norma é citada. ' +
    'Clique num grupo para abri-lo já com a busca preenchida:' +

/* ==========================================================
   16. PERFIS DE ACESSO
   escola   — direção escolar, elabora o PPP (entra pelo protocolo)
   regional — SRE, consulta os PPPs das escolas da sua regional
   central  — Órgão Central, em dois modos: visualização e edição de textos
   ========================================================== */
const SESSAO = {token:'', perfil:'', papel:'', papelNome:'', sre:'', nome:'', modo:'',

/**
 * v7.3 (T-02): UM lugar grava a sessão, seja qual for o caminho de entrada —
 * a conta institucional identificada (entrarIdentificado) ou o e-mail e a
 * senha (entrarInst). Antes, o caminho identificado gravava só token, perfil
 * e unidade, e o papel se perdia: o colegiado virava "Direção escolar".
 */
/* ==========================================================
   v7.8 (P7): a sessão sobrevive ao F5 — o token fica no sessionStorage
   desta aba — e, para quem tem conta do domínio, expira sem drama: a tela
   refaz a entrada sozinha e repete a chamada.
   ========================================================== */
const CHAVE_SESSAO = 'ppp.sessao';
function guardarSessao(){
  try {
    if(!SESSAO.token) { sessionStorage.removeItem(CHAVE_SESSAO); return; }
    sessionStorage.setItem(CHAVE_SESSAO, JSON.stringify({token:SESSAO.token, perfil:SESSAO.perfil, papel:SESSAO.papel, papelNome:SESSAO.papelNome,
      sre:SESSAO.sre, nome:SESSAO.nome, inep:SESSAO.inep, escola:SESSAO.escola, email:SESSAO.email, masp:SESSAO.masp,
      podeValidar:SESSAO.podeValidar, podeAssociar:SESSAO.podeAssociar, soLeitura:SESSAO.soLeitura, cadastra:SESSAO.cadastra, modo:SESSAO.modo}));
  } catch(e){}
}
function sessaoGuardada(){
  try { const s = sessionStorage.getItem(CHAVE_SESSAO); return s ? JSON.parse(s) : null; } catch(e){ return null; }
}
function esquecerSessaoGuardada(){ try { sessionStorage.removeItem(CHAVE_SESSAO); } catch(e){} }
/** Quem tem conta do domínio e cadastro pode reentrar sem digitar nada. */
function podeReentrarSozinho(){ return !APP.local && !!APP.email && !!APP.acesso; }
let REENTRANDO = null;
function reentrarSilencioso(depois){
  if(REENTRANDO){ REENTRANDO.push(depois); return; }
  REENTRANDO = [depois];
  const acIdent = APP.acesso || {};
  const chamar = function(res){
    const fila = REENTRANDO; REENTRANDO = null;
    fila.forEach(function(f){ f(res && res.ok ? res : null); });
  };
  const chamada = google.script.run.withSuccessHandler(function(res){
    if(res && res.ok){ aplicarSessao(res); if(res.perfil !== 'central') SESSAO.modo = SESSAO.modo || 'visualizacao'; }
    chamar(res);
  }).withFailureHandler(function(){ chamar(null); });
  /* v8.13 (E01): o único ponto do App que fala com o google.script.run sem
     passar por servidor() — e por isso também precisa do despachante. */
  chamada.api({fn:'entrarInstitucional', args:{porta:(acIdent.papel === 'colegiado' ? 'colegiado' : acIdent.perfil) || ''}});
}

function aplicarSessao(res){
  const r = res || {};
  SESSAO.token = r.token || ''; SESSAO.perfil = r.perfil || ''; SESSAO.sre = r.sre || '';
  SESSAO.nome = r.nome || ''; SESSAO.inep = r.inep || ''; SESSAO.escola = r.escola || '';
  SESSAO.censo = r.censo || '';                 /* v9.8: o INEP do Censo, da base de escolas */
  SESSAO.email = String(r.email || APP.email || '').toLowerCase(); SESSAO.masp = r.masp || '';
  SESSAO.papel = r.papel || (r.perfil === 'central' ? 'central' : r.perfil === 'escola' ? 'diretor_escolar' : 'superintendente');
  SESSAO.papelNome = r.papelNome || nomePapel(SESSAO.papel);
  SESSAO.podeValidar = (r.podeValidar !== undefined) ? !!r.podeValidar : PAPEIS_VALIDAM_UI.indexOf(SESSAO.papel) >= 0;
  SESSAO.podeAssociar = (r.podeAssociar !== undefined) ? !!r.podeAssociar : PAPEIS_VALIDAM_UI.indexOf(SESSAO.papel) >= 0;
  SESSAO.soLeitura = (r.soLeitura !== undefined) ? !!r.soLeitura : PAPEIS_LEITURA_UI.indexOf(SESSAO.papel) >= 0;
  SESSAO.cadastra = r.cadastra || ((PAPEIS_UI[SESSAO.papel] || {}).cadastra || []);
  guardarSessao();   // v7.8 (P7)
}
/** v7.3 (T-19): sair zera TUDO — papel, competências, filtros e selos. */

  SESSAO.inep = ''; SESSAO.escola = ''; SESSAO.censo = ''; SESSAO.email = ''; SESSAO.masp = '';
  SESSAO.papel = ''; SESSAO.papelNome = ''; SESSAO.porta = ''; SESSAO.papelDemo = '';
  SESSAO.podeValidar = false; SESSAO.podeAssociar = false; SESSAO.soLeitura = false; SESSAO.cadastra = [];
  CONTAS_SRE = ''; CONTAS_FILTRO = ''; ESC_FILTRO = ''; ESC_SRE = ''; ESC_MUN = '';
  BASE_FILTRO = ''; BASE_SRE = ''; BASE_MUN = ''; REG_FILTRO = '';
  PAINEL = {linhas:[], sres:[]}; ESCOLAS = []; CONTAS = {linhas:[], sres:[]}; EQUIPE = []; COLEGIADO = [];
  INSTITUCIONAIS = []; ASSINAR = {pendentes:[], assinados:[]};
  $('#badgeProto').classList.remove('salvo');
  if(APP.protocolo) atualizarBadge(); else $('#badgeProto').textContent = 'Nenhum PPP aberto';   /* v9.0 (T-02): sem PPP não há o que salvar; "não salvo" alarmava à toa */
  $('#badgeUser').textContent = rotuloUsuario();
