  });
  $('#piEquipe').innerHTML = `
    <p class="hint" style="max-width:74ch;margin-bottom:16px">Você é <b>${esc(SESSAO.papelNome || nomePapel(SESSAO.papel))}</b> da SRE ${esc(SESSAO.sre)} e cadastra ${esc(meus.map(nomePapel).join(' e '))}. Cada pessoa recebe por e-mail um link para definir a própria senha; quem tem conta institucional também entra sem digitar nada.</p>
    ${porPapel.map(function(g){
      const lim = (g.papel === 'diretor_educacional') ? 2 : (g.papel === 'coordenador_inspecao' ? 1 : 0);
      const cheio = lim > 0 && g.pessoas.length >= lim;
      return `<div class="check-card" style="margin-bottom:16px">
        <h4>${esc(nomePapel(g.papel))}${lim ? ' · até ' + lim : ''}</h4>
        ${g.papel === 'diretor_educacional' ? '<p class="hint" style="margin-bottom:10px">O segundo é opcional: nem toda Superintendência tem dois.</p>' : ''}
        ${g.papel === 'equipe_de' ? '<p class="hint" style="margin-bottom:10px">A equipe da Diretoria Educacional <b>valida os PPPs</b> e associa diretores às escolas.</p>' : ''}
        ${g.papel === 'equipe_inspecao' ? '<p class="hint" style="margin-bottom:10px">A equipe da Coordenação de Inspeção atua <b>apenas como leitora</b> dos PPPs da regional.</p>' : ''}
        ${g.pessoas.length ? g.pessoas.map(function(a){
          const inativo = a.situacao === 'inativo';
          return `<div class="eq-linha">
            <span><b>${esc(a.nome || '(sem nome)')}</b><span class="sub-linha">${esc(a.email)}${
              a.comSenha ? '' : ' · <i>ainda não entrou</i>'}${
              a.ultimoAcesso ? ' · último acesso ' + esc(a.ultimoAcesso) : ''}</span></span>
            <span><span class="esc-tag ${inativo ? 'off' : 'sim'}">${inativo ? 'inativo' : 'ativo'}</span></span>
            <span class="eq-acoes">
              <button class="pi-acao" data-eqp-editar="${esc(a.email)}">editar</button>
              <button class="pi-acao" data-eqp-convite="${esc(a.email)}">reenviar convite</button>${
              a.comSenha ? '' : `<button class="pi-acao" data-eqp-link="${esc(a.email)}" title="Copiar o link de primeiro acesso para entregar por outro canal">copiar link</button>`}
              <button class="pi-acao" data-eqp-situacao="${esc(a.email)}">${inativo ? 'reativar' : 'suspender'}</button>
              <button class="pi-acao" data-eqp-remover="${esc(a.email)}">remover</button></span>
          </div>`;
        }).join('') : '<p class="pi-vazio">Ninguém cadastrado ainda.</p>'}
        <button class="btn ${cheio ? 'btn-ghost' : 'btn-primary'}" data-eqp-novo="${esc(g.papel)}"
          style="margin-top:12px"${cheio ? ' disabled title="Limite atingido"' : ''}>Cadastrar ${esc(nomePapel(g.papel))}</button>
        ${historicoEmbutidoHTML('papel:' + g.papel, 'Histórico')}
      </div>`;
    }).join('')}`;
  ligarHistoricosEmbutidos($('#piEquipe'));
}

function abrirFormEquipe(papel, email){
  const a = email ? EQUIPE.filter(function(x){ return x.email === email; })[0] : null;
  EQ_EDIT = a ? a.email : '';
  const alvo = a ? (a.papel || papel) : papel;
  aviso(a ? 'Alterar acesso' : 'Cadastrar ' + nomePapel(alvo),
    '<div class="gs-form" style="margin-top:6px">' +
    '<div class="field" style="grid-column:1 / -1"><label for="eqNome">Nome</label>' +
    '<input id="eqNome" type="text" value="' + esc(a ? (a.nome || '') : '') + '"></div>' +
    '<div class="field" style="grid-column:1 / -1"><label for="eqEmail">E-mail institucional</label>' +
    '<input id="eqEmail" type="email" value="' + esc(a ? a.email : '') + '" placeholder="nome@educacao.mg.gov.br"></div>' +
    '</div><p class="hint" style="margin-top:10px">' +
    (a ? 'Trocar o e-mail troca quem entra no sistema: a pessoa nova recebe o convite de primeiro acesso.'
       : 'A pessoa receberá um link por e-mail para definir a própria senha.') + '</p>',
    function(){ return salvarEquipe(alvo); },
    {rotulo:'Salvar', rotuloCancelar:'Cancelar'});
}

function salvarEquipe(papel){
  const nome = ($('#eqNome') || {value:''}).value.trim();
  const email = ($('#eqEmail') || {value:''}).value.trim();
  /* v7.3 (T-13): a validação fala dentro do diálogo e o mantém aberto */
  if(nome.length < 3) return erroNoAviso('Informe o nome do responsável.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return erroNoAviso('Informe um e-mail institucional válido.');
  const editando = EQ_EDIT ? EQUIPE.filter(function(x){ return x.email === EQ_EDIT; })[0] : null;
  /* v7.3 (T-12): ao editar, o e-mail anterior vai junto — trocar o e-mail
     reescreve a mesma pessoa, não cria outra; a situação atual é mantida */
  servidor('acessoSalvar', {token:SESSAO.token, papel:papel, nome:nome, email:email,
      emailAnterior:(EQ_EDIT || ''), situacao:(editando ? (editando.situacao || 'ativo') : 'ativo')},
    function(res){
      if(!res || !res.ok){ alerta((res && res.erro) || 'Não foi possível salvar.'); return; }
      carregarMinhaEquipe();
      toast((EQ_EDIT ? 'Cadastro de ' + nome + ' atualizado.' : nome + ' cadastrado.') +
            (res.convite ? ' ' + fraseDoConvite(email, res.conviteModo || 'enviado') : ''));
      EQ_EDIT = '';
      if(res.aviso) aviso('Conta institucional pendente', textoParaHTML(res.aviso));
    }, function(){ toast('Sem resposta do servidor.'); });
  return true;
}

/* ==========================================================
   v7.6 (P4): CONVITES — reenvio com o modo de envio, link copiável
   ========================================================== */
/** O que dizer depois de um cadastro ou reenvio, conforme o caminho do convite. */
function fraseDoConvite(email, modo){
  if(modo === 'enviado') return 'Convite de primeiro acesso enviado para ' + email + '.';
  if(modo === 'fila') return 'O convite de ' + email + ' será enviado por e-mail nos próximos minutos.';
  if(modo === 'boas-vindas') return email + ' tem conta institucional e entra sem senha; a mensagem de boas-vindas será enviada por e-mail.';
  return '';
}
function reenviarConviteUI(email){
  return servidor('primeiroAcessoReenviar', {token:SESSAO.token, email:email}, function(res){
    if(!res || !res.ok){ alerta((res && res.erro) || 'Não foi possível reenviar.'); return; }
    if(res.erro){
      return aviso('Convite a enviar', '<p style="margin-bottom:10px">' + esc(res.erro) + '</p>' + campoDoLink(res.link),
        null, {rotulo:'Fechar'});
    }
    toast(fraseDoConvite(email, res.modo || 'enviado'));
  }, function(){ toast('Sem resposta do servidor.'); });
}
function campoDoLink(link){
  return '<div class="field" style="margin-top:6px"><label for="linkConviteCampo">Link de primeiro acesso</label>' +
    '<div style="display:flex;gap:8px;align-items:center"><input id="linkConviteCampo" type="text" readonly value="' + esc(link || '') + '" style="flex:1;font-size:12.5px">' +
    '<button type="button" class="btn btn-ghost" id="linkConviteCopiar">Copiar</button></div>' +
    '<span class="dica">Entregue por WhatsApp, telefone ou pessoalmente. O link vale uma única vez e por prazo; quem o tiver define a senha e entra.</span></div>';
}
function copiarTextoParaAreaDeTransferencia(texto){
  const campo = $('#linkConviteCampo');
  const feito = function(){ toast('Link copiado.'); const b = $('#linkConviteCopiar'); if(b) b.textContent = 'Copiado'; };
  try { if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(texto).then(feito, function(){ if(campo){ campo.select(); } toast('Selecione o link e copie com Ctrl+C.'); }); } catch(e){}
  try { if(campo){ campo.select(); document.execCommand('copy'); feito(); return; } } catch(e){}
  toast('Selecione o link e copie com Ctrl+C.');
}
function copiarLinkConvite(email){
  servidor('conviteLink', {token:SESSAO.token, email:email}, function(res){
    if(!res || !res.ok){ alerta((res && res.erro) || 'Não foi possível obter o link.'); return; }
    aviso('Link de primeiro acesso de ' + email,
      '<p style="margin-bottom:8px">O convite vale até <b>' + esc(res.ate || '') + '</b>. Copie o link e entregue à pessoa por outro canal.</p>' + campoDoLink(res.link),
      null, {rotulo:'Fechar'});
  }, function(){ toast('Sem resposta do servidor.'); });
}
document.addEventListener('click', function(e){
  if(e.target && e.target.id === 'linkConviteCopiar'){ const c = $('#linkConviteCampo'); copiarTextoParaAreaDeTransferencia(c ? c.value : ''); }
});

function acaoEquipe(email, acao){
  const a = EQUIPE.filter(function(x){ return x.email === email; })[0]; if(!a) return;
  if(acao === 'convite') return reenviarConviteUI(email);
  if(acao === 'situacao'){
    const reativar = a.situacao === 'inativo';
    return servidor('acessoSalvar', {token:SESSAO.token, papel:a.papel, nome:a.nome, email:a.email,
        situacao:(reativar ? 'ativo' : 'inativo')}, function(res){
      /* v8.13 (F05): reativar um cadastro sem nome continua sendo recusado —
         é o que C15 existe para impedir —, mas a recusa deixa de ser um beco:
         ela se identifica e a tela abre o formulário com o cadastro carregado. */
      if(res && res.precisaNome){ alerta(res.erro, 'Cadastro sem nome'); return abrirFormEquipe('', email); }
      if(!res || !res.ok){ alerta((res && res.erro) || 'Não foi possível alterar.'); return; }
      carregarMinhaEquipe();
      toast(reativar ? (a.nome || email) + ' reativado.' : (a.nome || email) + ' suspenso.');
    }, function(){ toast('Sem resposta do servidor.'); });
  }
  if(acao === 'remover'){
    return confirmar('Remover o acesso de ' + (a.nome || email) + '?\n\nA pessoa deixa de conseguir entrar no sistema. O histórico é preservado: o período é encerrado, não apagado.',
      function(){
        servidor('acessoRemover', {token:SESSAO.token, email:email, motivo:'removido da equipe por ' + SESSAO.nome},
          function(res){
            if(!res || !res.ok){ alerta((res && res.erro) || 'Não foi possível remover.'); return; }
            carregarMinhaEquipe(); toast('Acesso removido.');
          }, function(){ toast('Sem resposta do servidor.'); });
      }, {titulo:'Remover acesso', rotulo:'Remover', perigo:true});
  }
}

/* ============================================================
   CONTAS A REGULARIZAR (v7.2)
   Os diretores com e-mail fora do domínio da rede. O sistema aceita o
   cadastro — recusar faria a rede perder quem dirige a escola —, mas quem
   não tem conta institucional não é identificado sozinho: entra por senha, e
   depende de ter recebido e usado o convite. É uma pendência de implantação,
   e pendência que ninguém vê não se resolve.
   ============================================================ */
let CONTAS = {linhas:[], sres:[]};
let CONTAS_SRE = '';
let CONTAS_FILTRO = '';   // '', 'entrou' ou 'nao'

function carregarContasPendentes(){
  $('#piContas').innerHTML = '<p class="pi-vazio carregando">Conferindo os cadastros…</p>';
  servidor('contasPendentes', {token:SESSAO.token}, function(res){
    if(!res || !res.ok){
      $('#piContas').innerHTML = '<p class="pi-vazio erro">' + esc((res && res.erro) || 'Não foi possível carregar os cadastros.') + '</p>';
      return;
    }
    CONTAS = res; desenharContasPendentes();
  }, function(){ $('#piContas').innerHTML = '<p class="pi-vazio erro">' + TXT_SEM_RESPOSTA + '</p>'; });
}

function contasFiltradas(){
  const b = ($('#ctBusca') ? $('#ctBusca').value : '').trim().toLowerCase();
  return (CONTAS.linhas || []).filter(function(x){
    if(CONTAS_SRE && x.sre !== CONTAS_SRE) return false;
    if(CONTAS_FILTRO === 'entrou' && !x.jaDefiniuSenha) return false;
    if(CONTAS_FILTRO === 'nao' && x.jaDefiniuSenha) return false;
    if(!b) return true;
    return (x.escola + ' ' + x.municipio + ' ' + x.nome + ' ' + x.email + ' ' + x.inep + ' ' +
            (x.segmento || '')).toLowerCase().indexOf(b) >= 0;
  });
}

function desenharContasPendentes(){
  const central = SESSAO.perfil === 'central';
  /* v8.13 (C16): no escopo da escola a lista é do Colegiado servidor, não de
     diretores — e os textos têm de dizer isso, senão a direção lê "diretores"
     e não entende o que está vendo. */
  const daEscola = (CONTAS.escopo === 'escola');
  const quem = daEscola ? 'membros do Colegiado' : 'diretores';
  const onde = daEscola ? ' no Colegiado desta escola' : (central ? ' na rede' : ' nesta regional');
  const L = CONTAS.linhas || [];
  const total = CONTAS.totalDiretores || 0;
  const entraram = CONTAS.jaEntraram || 0;
  const busca = $('#ctBusca') ? $('#ctBusca').value : '';
  if(!L.length){
    $('#piContas').innerHTML =
      '<p class="hint" style="max-width:74ch;margin-bottom:14px">' +
      (daEscola ? 'Nenhum docente ou servidor administrativo do Colegiado com e-mail fora do domínio <b>'
                : 'Nenhum diretor com e-mail fora do domínio <b>') +
      esc(CONTAS.dominio || '@educacao.mg.gov.br') + '</b>' + onde +
      '. ' + (total
        ? (total === 1 ? 'O único cadastro usa conta institucional e é identificado sem senha.' : 'Todos os ' + total + ' cadastros usam conta institucional e são identificados sem senha.')
        : (daEscola ? 'Estudantes, famílias e comunidade não entram nesta lista: deles não se pede conta institucional.' : '')) + '</p>';
    return;
  }
  $('#piContas').innerHTML = `
    <p class="hint" style="max-width:76ch;margin-bottom:14px">${daEscola
      ? 'Estes membros do Colegiado são <b>docentes ou servidores administrativos</b> — servidores da rede — e foram cadastrados com e-mail de outro domínio. O cadastro vale e a assinatura do PPP anda normalmente, mas eles <b>não são identificados pela conta institucional</b>: entram por e-mail e senha, pelo link de primeiro acesso. Estudantes, famílias e comunidade não aparecem aqui, porque deles não se pede conta institucional.'
      : 'Estes diretores foram cadastrados com e-mail de outro domínio. O cadastro vale e o PPP anda normalmente — mas eles <b>não são identificados pela conta institucional</b>: entram por e-mail e senha, pelo link de primeiro acesso. Enquanto não definirem a senha, não conseguem abrir o sistema.'} Providenciar a conta ${esc(CONTAS.dominio || '')} resolve de vez; até lá, o caminho é garantir que o convite chegou.</p>
    <div class="pi-resumo" style="margin-bottom:14px">
      <div class="pi-card"><span class="n">${L.length}</span><span class="r">de ${total} ${quem}${daEscola ? ' servidores' : (central ? ' da rede' : ' desta regional')}</span></div>
      <div class="pi-card destaque"><span class="n">${entraram}</span><span class="r">já definiram a senha</span></div>
      <div class="pi-card ${L.length - entraram ? 'pendente' : ''}"><span class="n">${L.length - entraram}</span><span class="r">ainda não entraram</span></div>
    </div>
    <div class="pi-filtros${central ? ' quatro' : ''}">
      <input id="ctBusca" type="search" placeholder="${daEscola ? 'Nome, e-mail ou segmento' : 'Escola, diretor, e-mail ou código da escola'}" aria-label="Buscar" value="${esc(busca)}">
      ${central ? `<select id="ctSre" aria-label="Superintendência Regional de Ensino">
        <option value="">Todas as regionais</option>
        ${(CONTAS.sres || []).map(x=>`<option${CONTAS_SRE === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}
      </select>` : ''}
      <select id="ctFiltro" aria-label="Situação do primeiro acesso">
        <option value="">Todos</option>
        <option value="nao"${CONTAS_FILTRO === 'nao' ? ' selected' : ''}>Ainda não entraram</option>
        <option value="entrou"${CONTAS_FILTRO === 'entrou' ? ' selected' : ''}>Já definiram a senha</option>
      </select>
      ${SESSAO.perfil === 'central' ? '<button class="btn btn-ghost" id="ctExportar">Baixar planilha</button>' : ''}
    </div>
    <div id="ctLista"></div>`;
  desenharListaContas();
}

function desenharListaContas(){
  const alvo = $('#ctLista'); if(!alvo) return;
  const L = contasFiltradas();
  if(!L.length){ alvo.innerHTML = '<p class="pi-vazio">Nenhum cadastro com esse filtro.</p>'; return; }
  /* v8.13 (C16): no escopo da escola quem se identifica é a PESSOA (a escola
     é sempre a mesma), e "trocar o e-mail" não se aplica — aquele botão leva
     à janela do diretor daquela escola, que é da regional. O membro do
     Colegiado tem o e-mail trocado na aba "Colegiado Escolar". */
  const daEscola = (CONTAS.escopo === 'escola');
  alvo.innerHTML = L.slice(0, 300).map(function(x){
    return `<div class="eq-linha">
      <span><b>${esc(daEscola ? (x.nome || '(sem nome)') : (x.escola || '(escola sem nome)'))}</b><span class="sub-linha">${
        daEscola ? esc(x.segmento || 'Colegiado Escolar') : esc(x.nome || '(sem nome)')} · ${esc(x.email)} · <span style="white-space:nowrap">domínio ${esc(x.dominio)}</span>${
        x.municipio ? ' · ' + esc(x.municipio) : ''}${SESSAO.perfil === 'central' && x.sre ? ' · ' + esc(x.sre) : ''}</span></span>
      <span><span class="esc-tag ${x.jaDefiniuSenha ? 'sim' : 'nao'}">${x.jaDefiniuSenha ? 'já entrou' : 'ainda não entrou'}</span></span>
      <span class="eq-acoes">${
        daEscola ? '' : `<button class="pi-acao" data-ct-email="${esc(x.inep)}">trocar o e-mail</button>`}
        <button class="pi-acao" data-ct-convite="${esc(x.email)}">reenviar convite</button>${
        x.jaDefiniuSenha ? '' : `<button class="pi-acao" data-ct-link="${esc(x.email)}" title="Copiar o link de primeiro acesso para entregar por outro canal">copiar link</button>`}</span>
    </div>`;
  }).join('') + (L.length > 300
    ? '<p class="hint" style="margin-top:10px">Mostrando os 300 primeiros de ' + L.length + '. Use a busca.</p>'
    : '');
}

/** Leva à janela do diretor daquela escola, já em modo de correção. */
function trocarEmailDeContaPendente(inep){
  mostrarAbaPainel('acessos');
  setTimeout(function(){
    const tentar = function(n){
      if(!(ESCOLAS || []).length && n < 12) return setTimeout(function(){ tentar(n+1); }, 250);
      const e = (ESCOLAS || []).filter(function(x){ return x.inep === inep; })[0];
      if(!e) return alerta('Esta escola não está na sua lista de acessos.');
      abrirGestor(inep);
      setTimeout(function(){ if(GESTOR_ATUAL && GESTOR_ATUAL.gestor) prepararFormGestor('correcao'); }, 120);
    };
    tentar(0);
  }, 200);
}

function exportarContasCSV(){
  /* v8.13 (E09, A7-05): a política da v8.9 — "baixar planilha é do Órgão
     Central" — passa a valer para as TRÊS planilhas, sem exceção. Esta era a
     única que não conferia perfil nenhum, e é a que tem mais dado pessoal:
     nome, MASP e e-mail frequentemente particular dos diretores. O botão só
     é emitido para o Central, e a função confere de novo, como as outras
     duas já faziam — botão escondido não é controle de acesso. */
  if(SESSAO.perfil !== 'central'){ toast('A planilha de contas é do Órgão Central.'); return; }
  const L = contasFiltradas();
  if(!L.length){ toast('Não há cadastros para exportar com os filtros atuais.'); return; }
  /* v8.13 (E09, A7-05): a coluna MASP SAI. Esta lista existe para regularizar
     ENDEREÇO DE E-MAIL, e a matrícula do servidor não é necessária para
     isso; quem precisa do MASP o vê na tela, sob sessão, e não numa planilha
     que sai do sistema.
     A C16 previa um cabeçalho próprio para o escopo escolar (o Colegiado da
     direção); com o botão restrito ao Central, aquele ramo deixou de ter
     caminho, e código morto num exportador de dado pessoal é pior do que a
     ausência dele. O escopo escolar continua na TELA, com busca e filtro. */
  const cab = ['Regional','Código da escola','Escola','Município','Diretor','E-mail','Domínio','Primeiro acesso'];
  const linhas = [cab.join(';')].concat(L.map(function(x){
    return [x.sre, x.inep, x.escola, x.municipio, x.nome, x.email, x.dominio,
            x.jaDefiniuSenha ? 'senha definida' : 'ainda não entrou'].map(campoCSV).join(';');
  }));
  const csv = '\uFEFF' + linhas.join('\r\n');          // BOM: abre acentuado no Excel
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'Contas a regularizar' + (CONTAS_SRE ? ' - ' + CONTAS_SRE : '') + '.csv';
  registrarExportacao('contas a regularizar', L.length);
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast('Planilha gerada com ' + n(L.length, 'cadastro', 'cadastros') + '.');
}

      vai assinar o Projeto Político-Pedagógico, e o sistema guarda quem o cadastrou, quando, e — de quem não é
      servidor da rede — a relação que tem com a escola.</p>
    ${historicoEmbutidoHTML('grupo:colegiado', 'Histórico do Colegiado Escolar')}`;
  ligarHistoricosEmbutidos($('#piColegiado'));   /* v9.6 */
}

/* v8.12 — os segmentos que são de SERVIDOR da rede. De quem não é servidor
   não se cobra conta institucional (ela não existe) e se pede, em troca, a
   relação com a escola: é o que identifica quem assina o PPP. */
const SEGMENTOS_SERVIDOR_UI = ['Docente','Servidor administrativo'];
function segmentoDeServidorUI(seg){ return SEGMENTOS_SERVIDOR_UI.indexOf(String(seg || '').trim()) >= 0; }

function abrirFormColegiado(){
  aviso('Cadastrar membro do Colegiado Escolar',
    '<div class="gs-form" style="margin-top:6px">' +
    '<div class="field" style="grid-column:1 / -1"><label for="colNome">Nome</label><input id="colNome" type="text"></div>' +
    '<div class="field" style="grid-column:1 / -1"><label for="colEmail">E-mail</label>' +
    '<input id="colEmail" type="email" placeholder="nome@exemplo.com"></div>' +
    '<div class="field" style="grid-column:1 / -1"><label for="colSegmento">Segmento que representa</label>' +
    '<select id="colSegmento">' + SEGMENTOS.map(function(x){ return '<option>' + esc(x) + '</option>'; }).join('') + '</select></div>' +
    '<div class="field" id="colCampoRelacao" style="grid-column:1 / -1"><label for="colRelacao">Relação com a escola</label>' +
    '<input id="colRelacao" type="text" placeholder="Ex.: pai do estudante João Pedro, 7º ano A">' +
    '<span class="hint">De quem não é servidor da rede: de que estudante é responsável e de que turma, ou que entidade da comunidade representa. Fica no histórico do cadastro.</span></div>' +
    '</div><p class="hint" style="margin-top:10px">O membro receberá um link para definir a própria senha e poderá assinar o PPP entrando no sistema.</p>',
    function(){ return salvarColegiado(); }, {rotulo:'Cadastrar', rotuloCancelar:'Cancelar'});
  const sel = $('#colSegmento');
  const ajusta = function(){ $('#colCampoRelacao').hidden = segmentoDeServidorUI(sel.value); };
  if(sel){ sel.addEventListener('change', ajusta); ajusta(); }
}

function salvarColegiado(){
  const nome = ($('#colNome') || {value:''}).value.trim();
  const email = ($('#colEmail') || {value:''}).value.trim();
  const segmento = ($('#colSegmento') || {value:''}).value;
  const relacao = ($('#colRelacao') || {value:''}).value.trim();
  /* v7.3 (T-13): a validação fala dentro do diálogo e o mantém aberto */
  if(nome.length < 3) return erroNoAviso('Informe o nome do membro.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return erroNoAviso('Informe um e-mail válido.');
  if(SESSAO.email && email.toLowerCase() === SESSAO.email) return erroNoAviso('Este é o seu próprio e-mail: a direção já consta da folha de assinaturas por conta própria.');
  if(!segmentoDeServidorUI(segmento) && relacao.length < 4){
    return erroNoAviso('Informe a relação desta pessoa com a escola — de que estudante é responsável, que turma, que entidade representa.');
  }
  servidor('acessoSalvar', {token:SESSAO.token, papel:'colegiado', nome:nome, email:email, segmento:segmento, relacao:relacao},
    function(res){
      if(!res || !res.ok){ alerta((res && res.erro) || 'Não foi possível cadastrar.'); return; }
      carregarColegiado();
      toast(nome + ' cadastrado.' + (res.convite ? ' ' + fraseDoConvite(email, res.conviteModo || 'enviado') : ''));
      if(res.aviso) aviso('Conta institucional pendente', textoParaHTML(res.aviso));
    }, function(){ toast('Sem resposta do servidor.'); });
  return true;
}

/* ---- base de escolas da rede: cadastro de escola nova e baixa ---- */
let BASE_FILTRO = '';      // '', 'ativa' ou 'inativa'
let BASE_SRE = '';         // regional escolhida — só o Órgão Central escolhe
let BASE_MUN = '';         // município escolhido
let ESCOLA_ATUAL = null;   // escola aberta na janela, ou null ao cadastrar

function carregarBaseEscolas(){
  $('#piEscolas').innerHTML = '<p class="pi-vazio carregando">Carregando a base de escolas…</p>';
  servidor('escolasListar', {token:SESSAO.token}, function(res){
    if(!res || !res.ok){
      $('#piEscolas').innerHTML = '<p class="pi-vazio erro">' + esc((res && res.erro) || 'Não foi possível carregar a base de escolas.') + '</p>';
      return;
    }
    ESCOLAS = res.escolas || [];
    SRES_BASE = res.sres || [];
    desenharBaseEscolas();
  }, function(){ $('#piEscolas').innerHTML = '<p class="pi-vazio erro">' + TXT_SEM_RESPOSTA + '</p>'; });
}

function baseFiltrada(){
  const b = ($('#baseBusca') ? $('#baseBusca').value : '').trim().toLowerCase();
  return ESCOLAS.filter(function(e){
    const inativa = e.situacao === 'inativa';
    if(BASE_FILTRO === 'ativa' && inativa) return false;
    if(BASE_FILTRO === 'inativa' && !inativa) return false;
    /* v9.8: as que ficaram sem o código INEP, para regularizar */
    if(BASE_FILTRO === 'seminep' && e.codigoInep) return false;
    if(BASE_SRE && e.sre !== BASE_SRE) return false;
    if(BASE_MUN && e.municipio !== BASE_MUN) return false;
    if(!b) return true;
    return (e.escola + ' ' + e.municipio + ' ' + e.inep + ' ' + (e.sre || '')).toLowerCase().indexOf(b) >= 0;
  });
}

function desenharBaseEscolas(){
  const central = SESSAO.perfil === 'central';
  /* v8.13 (F09): a confirmação da última carga volta para a tela, com o
     painel aberto — e some no redesenho seguinte, porque ela é de UMA carga,
     não é estado. `CARGA_ESC.resultado` é HTML montado por resumoCargaEscolas,
     que já escapa o que vem do servidor. */
  const ultimaCarga = CARGA_ESC.info; const ultimoResultado = CARGA_ESC.resultado;
  CARGA_ESC.info = ''; CARGA_ESC.resultado = '';
  const ativas = ESCOLAS.filter(function(e){ return e.situacao !== 'inativa'; }).length;
  /* v9.8: o código INEP passou a ser obrigatório no cadastro. A carga de
     implantação aceita a escola sem ele — a extração da rede vem com a
     coluna vazia —, e é aqui que se vê o tamanho da regularização. */
  const semInep = ESCOLAS.filter(function(e){ return !e.codigoInep; }).length;
  const busca = $('#baseBusca') ? $('#baseBusca').value : '';
  const sresBase = central ? valoresDe(ESCOLAS, 'sre') : [];
  if(BASE_SRE && sresBase.indexOf(BASE_SRE) < 0) BASE_SRE = '';
  const munBase = valoresDe(ESCOLAS.filter(function(e){ return !BASE_SRE || e.sre === BASE_SRE; }), 'municipio');
  if(BASE_MUN && munBase.indexOf(BASE_MUN) < 0) BASE_MUN = '';
  $('#piEscolas').innerHTML = `
    <p class="hint" style="max-width:74ch;margin-bottom:14px">Esta é a base de escolas da rede — a fonte de verdade da identificação escolar.
      ${central ? 'O Órgão Central alcança toda a rede.' : 'A regional cadastra e mantém as escolas da sua própria SRE.'}
      Nenhuma escola é excluída: a que sai da rede é marcada como <b>inativa</b>, some dos cadastros de acesso
      e mantém alcançáveis os PPPs que produziu e o histórico de quem a dirigiu.</p>
    <div class="pi-resumo" style="margin-bottom:14px">
      <div class="pi-card"><span class="n">${ESCOLAS.length}</span><span class="r">escolas na base${central ? '' : ' desta regional'}</span></div>
      <div class="pi-card destaque"><span class="n">${ativas}</span><span class="r">ativas</span></div>
      <div class="pi-card ${ESCOLAS.length - ativas ? 'pendente' : ''}"><span class="n">${ESCOLAS.length - ativas}</span><span class="r">inativas</span></div>
      <div class="pi-card ${semInep ? 'pendente' : ''}"><span class="n">${semInep}</span><span class="r">sem código INEP</span></div>
    </div>
    <div class="pi-filtros quatro">
      <input id="baseBusca" type="search" placeholder="Escola, município ou código da escola" aria-label="Buscar escola na base" value="${esc(busca)}">
      ${central ? `<select id="baseSre" aria-label="Superintendência Regional de Ensino">
        <option value="">Todas as regionais</option>
        ${sresBase.map(x=>`<option${BASE_SRE === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}
      </select>` : ''}
      <select id="baseMun" aria-label="Município">
        <option value="">Todos os municípios</option>
        ${munBase.map(x=>`<option${BASE_MUN === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}
      </select>
      <select id="baseFiltro" aria-label="Situação da escola">
        <option value="">Todas as escolas</option>
        <option value="ativa"${BASE_FILTRO === 'ativa' ? ' selected' : ''}>Somente ativas</option>
        <option value="inativa"${BASE_FILTRO === 'inativa' ? ' selected' : ''}>Somente inativas</option>
        <option value="seminep"${BASE_FILTRO === 'seminep' ? ' selected' : ''}>Somente sem código INEP</option>
      </select>
      <button class="btn btn-primary" id="baseNova" style="${central ? 'grid-column:1 / -1' : ''}">Cadastrar escola</button>
    </div>
    <div id="baseLista"></div>
    ${central ? `<details class="check-card" id="escImportar" style="margin-top:18px"${ultimaCarga ? ' open' : ''}>
      <summary style="cursor:pointer;font-weight:600;color:var(--azul-inst)">Importar ou atualizar a base em lote</summary>
      <p class="hint" style="margin-top:12px">Para a carga inicial ou a atualização de muitas escolas de uma vez. Cole uma linha por escola, no formato <b>código da escola; escola; município; SRE</b> — e o <b>código INEP</b> num quinto campo. O cadastro individual passou a <b>exigir</b> o código INEP; a carga ainda aceita a escola sem ele (a extração da rede costuma vir com essa coluna vazia) e informa quantas entraram assim, para regularização. Aceita ponto e vírgula, tabulação ou vírgula, e ignora a linha de cabeçalho. Reimportar a mesma escola corrige os dados — não duplica.
        <b>Campo em branco preserva o que está gravado</b> (situação, INEP, município e SRE): a carga nunca apaga o que não foi informado. Por isso a carga é <b>simulada antes</b>: a prévia diz quantas escolas entram, quantas mudam de regional e quantas voltam a ativa.</p>
      <textarea id="escTexto" style="width:100%;min-height:130px;font-family:ui-monospace,monospace;font-size:12.5px" placeholder="184381;Escola Estadual Professor João Ribeiro;Divinópolis;Divinópolis;31100001"></textarea>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-primary" id="escImportarSimular">Simular</button>
        <button class="btn btn-ghost" id="escImportarBtn" hidden>Importar</button>
        <span class="hint" id="escImportarInfo">${esc(ultimaCarga || '')}</span>
      </div>
      <div id="escImportarResultado" style="margin-top:10px">${ultimoResultado || ''}</div>
    </details>` : ''}`;
  desenharListaBase();
}

function desenharListaBase(){
  const alvo = $('#baseLista'); if(!alvo) return;
  const L = baseFiltrada();
  if(!ESCOLAS.length){
    alvo.innerHTML = '<p class="pi-vazio">A base ainda não tem nenhuma escola. Use <b>Cadastrar escola</b> para incluir a primeira' +
      (SESSAO.perfil === 'central' ? ', ou importe a base em lote logo abaixo.' : '.') + '</p>';
    return;
  }
  if(!L.length){ alvo.innerHTML = '<p class="pi-vazio">Nenhuma escola encontrada com esse filtro.</p>'; return; }
  alvo.innerHTML = L.slice(0, 300).map(function(e){
    const inativa = e.situacao === 'inativa';
    return `<button class="esc-linha" data-base-inep="${esc(e.inep)}">
      <span><b>${esc(e.escola)}</b><span class="sub-linha">código ${esc(e.inep)}${
        e.codigoInep ? ' · INEP ' + esc(e.codigoInep) : ' · <b>sem código INEP</b>'}${
        SESSAO.perfil === 'central' ? ' · ' + esc(e.sre || '—') : ''}</span></span>
      <span><span class="sub-linha">${esc(e.municipio || 'sem município informado')}</span></span>
      <span><span class="esc-tag ${inativa ? 'off' : 'sim'}">${inativa ? 'inativa' : 'ativa'}</span></span>
      <span class="pi-acao">alterar</span>
    </button>`;
  }).join('') + (L.length > 300
    ? '<p class="hint" style="margin-top:10px">Mostrando as 300 primeiras de ' + L.length + '. Use a busca para chegar à escola.</p>'
    : '');
}

/* ---- janela da escola ---- */
function abrirEscola(inep){
  const e = inep ? ESCOLAS.filter(function(x){ return x.inep === inep; })[0] : null;
  ESCOLA_ATUAL = e || null;
  const central = SESSAO.perfil === 'central';
  $('#ecTitulo').textContent = e ? 'Escola na base da rede' : 'Cadastrar escola na base da rede';
  $('#ecIntro').textContent = e
    ? 'O código da escola é a identidade dela e não muda. Alterar o nome ou o município aqui muda o que aparece na lista de acessos e o que é gravado nos próximos PPPs.'
    : 'A escola cadastrada aqui passa a existir para todo o sistema: é ela que aparece na lista de acessos, é dela que vêm o nome e a regional gravados no PPP.';
  $('#ecInep').value = e ? e.inep : '';
  $('#ecInep').readOnly = !!e;
  $('#ecCodInep').value = e ? (e.codigoInep || '') : '';
  /* v8.13 (C12): a instrução antiga ("cadastre a escola certa e inative esta")
     deixava o PPP preso quando seguida à risca — é preciso dizer o roteiro
     inteiro, até o fim. */
  $('#ecInepDica').textContent = e
    ? 'A identidade da escola. Para corrigir um código errado: cadastre a escola certa, inative esta, ' +
      'reassocie a direção na escola certa e, no painel, use "vincular à escola" no PPP que ficou na errada.'
    : 'Somente números, de 2 a 8 dígitos, e não começa por zero. É a identidade da escola e não muda depois.';
  /* v9.8: a escola que veio da carga sem o código INEP é dita aqui — é esta
     janela que a regulariza, e ela não é salva enquanto o código não vier. */
  if($('#ecCodInepDica')) $('#ecCodInepDica').textContent = (e && !e.codigoInep)
    ? 'Esta escola está na base SEM o código INEP, e ele passou a ser obrigatório: informe os 8 dígitos para poder salvar qualquer alteração desta escola.'
    : 'Obrigatório, 8 dígitos. É o código que identifica a escola no Censo Escolar e o que permite cruzá-la com as bases federais.';
  $('#ecNome').value = e ? e.escola : '';
  $('#ecMunicipio').value = e ? (e.municipio || '') : '';
  $('#ecSre').value = e ? (e.sre || '') : (central ? '' : (SESSAO.sre || ''));
  /* a regional não escolhe regional: a escola que ela cadastra é da SRE dela */
  $('#ecSre').readOnly = !central;
  $('#ecSreDica').textContent = central
    ? 'Escolha uma das regionais já cadastradas ou digite a nova.'
    : 'A escola cadastrada pela regional pertence à SRE ' + (SESSAO.sre || '—') + '.';
  $('#ecSres').innerHTML = (SRES_BASE || []).map(function(x){ return '<option value="' + esc(x) + '"></option>'; }).join('');
  const inativa = e && e.situacao === 'inativa';
  $('#ecSituacao').hidden = !e;
  $('#ecSituacao').textContent = inativa ? 'Reativar escola' : 'Inativar escola';
  const aviso = $('#ecAvisoAcesso');
  if(e && e.gestor && !inativa){
    aviso.hidden = false;
    aviso.innerHTML = 'Diretor em exercício: <b>' + esc(e.gestor.nome || e.gestor.email) + '</b>. Inativar a escola encerra esse acesso e registra o período no histórico.';
  } else if(inativa){
    aviso.hidden = false;
    aviso.innerHTML = 'Escola <b>inativa</b>: não aparece na lista de cadastro de acessos e não recebe diretor novo. Os PPPs e o histórico continuam no sistema.';
  } else { aviso.hidden = true; }
  $('#ecErro').classList.remove('show');
  $('#ovEscola').hidden = false;
  setTimeout(function(){ (e ? $('#ecNome') : $('#ecInep')).focus(); }, 60);
}
function fecharEscola(){ $('#ovEscola').hidden = true; ESCOLA_ATUAL = null; }

function salvarEscola(){
  const erro = $('#ecErro'); erro.classList.remove('show');
  const dizer = function(m){ erro.textContent = m; erro.classList.add('show'); };
  const inep = ($('#ecInep').value || '').replace(/\D/g, '');
  const nome = $('#ecNome').value.trim();
  const municipio = $('#ecMunicipio').value.trim();
  const sre = $('#ecSre').value.trim();
  const codInep = ($('#ecCodInep').value || '').replace(/\D/g, '');
  if(!/^\d{2,8}$/.test(inep)) return dizer('O código da escola deve ter de 2 a 8 dígitos, apenas números.');
  if(!codInep) return dizer('Informe o código INEP da escola: são 8 dígitos, e ele é obrigatório.');   /* v9.8 */
  if(codInep.length !== 8) return dizer('O código INEP tem 8 dígitos.');
  if(nome.length < 4) return dizer('Informe o nome da escola.');
  if(!municipio) return dizer('Informe o município da escola.');
  if(!sre) return dizer('Informe a Superintendência Regional de Ensino da escola.');
  /* duplicidade é recusada pelo servidor, mas avisar aqui evita a viagem */
  if(!ESCOLA_ATUAL){
    const ja = ESCOLAS.filter(function(x){ return x.inep === inep; })[0];
    if(ja) return dizer('O código ' + inep + ' já está na base, em ' + ja.escola + '. Abra aquela escola para alterá-la.');
  }
  const btn = $('#ecSalvar'); btn.disabled = true; btn.textContent = 'Salvando…';
  servidor('escolaSalvar', {token:SESSAO.token, inep:inep, escola:nome, municipio:municipio, sre:sre,
      codigoInep:codInep},
    function(res){
      btn.disabled = false; btn.textContent = 'Salvar';
      if(!res || !res.ok){ dizer((res && res.erro) || 'Não foi possível salvar.'); return; }
      ESCOLAS = res.escolas || ESCOLAS;
      SRES_BASE = res.sres || SRES_BASE;
      fecharEscola(); desenharBaseEscolas();
      /* v8.13 (C12): homônima na mesma SRE não bloqueia, mas é dita em voz alta */
      if(res.aviso) alerta(nome + ' incluída na base.\n\n' + res.aviso, 'Confira o código');
      /* v8.13 (C13): mudar a escola de regional move o cadastro junto — quem
         fez a mudança precisa saber o que foi movido */
      else if(res.mudouSre) alerta(nome + ' passou a ' + sre + '.\n\n' +
        n(res.acessosMovidos, 'cadastro de acesso da escola (direção e colegiado) passou', 'cadastros de acesso da escola (direção e colegiado) passaram') + ' para a nova regional, ' +
        'com ' + n(res.periodosReabertos, 'período encerrado na antiga e reaberto', 'períodos encerrados na antiga e reabertos') + ' na nova. ' +
        n(res.registrosMovidos, 'PPP em elaboração acompanhou', 'PPPs em elaboração acompanharam') + ' a escola. ' +
        'Os PPPs já concluídos mantêm a regional que consta do documento — ela faz parte do que foi autenticado.',
        'Escola transferida de regional');
      else toast(res.criada ? nome + ' incluída na base.' : nome + ' atualizada.');
    },
    function(){ btn.disabled = false; btn.textContent = 'Salvar'; dizer('Sem resposta do servidor.'); });
}

function alternarSituacaoEscola(){
  if(!ESCOLA_ATUAL) return;
  const e = ESCOLA_ATUAL;
  const reativar = e.situacao === 'inativa';
  const aplicar = function(confirmado){
    servidor('escolaSituacao', {token:SESSAO.token, inep:e.inep, situacao:reativar ? 'ativa' : 'inativa',
                                confirmado: !!confirmado},
      function(res){
        /* v8.7 (C4): há um PPP em elaboração — a inativação apaga o acesso da
           direção e inativa o colegiado, e ninguém mais assina nem conclui */
        if(res && res.pppAberto && !confirmado){
          return confirmar(res.erro.replace(/\s+/g, ' '),
            function(){ aplicar(true); },
            {titulo:'A escola tem um PPP em elaboração', rotulo:'Inativar mesmo assim'});
        }
        if(!res || !res.ok){ alerta((res && res.erro) || 'Não foi possível alterar a situação.'); return; }
        ESCOLAS = res.escolas || ESCOLAS;
        fecharEscola(); desenharBaseEscolas();
        /* v8.13 (C09): reativar não restaura ninguém — e a resposta passa a
           dizer o que continua faltando, em vez de só "reativada". */
        if(reativar){
          const pendencias = [];
          if(res.semDiretor) pendencias.push('a direção precisa ser reassociada antes que alguém possa assinar');
          if(res.colegiadoInativo) pendencias.push(n(res.colegiadoInativo, 'membro do Colegiado Escolar continua inativo e precisa ser reativado', 'membros do Colegiado Escolar continuam inativos e precisam ser reativados') + ' pela direção');
          if(pendencias.length) alerta(e.escola + ' reativada.\n\n' + pendencias.join('.\n') + '.', 'Escola reativada');
          else toast(e.escola + ' reativada.');
        } else {
          toast(e.escola + ' inativada.' + (res.gestorEncerrado ? ' Acesso de ' + res.gestorEncerrado + ' encerrado.' : '') +
            (res.pppEmAberto ? ' O PPP ' + res.pppEmAberto + ' ficou em aberto — a pendência está no histórico dele.' : ''));
        }
      }, function(){ toast('Sem resposta do servidor.'); });
  };
  if(reativar){
    return confirmar('Reativar ' + e.escola + '?\n\nEla volta a aparecer na lista de cadastro de acessos e pode receber um diretor. ' +
      'Nem o acesso da direção nem os do colegiado são restabelecidos: a direção é reassociada aqui, e os membros do colegiado, pela própria direção.',
      function(){ aplicar(false); }, {titulo:'Reativar escola', rotulo:'Reativar'});
  }
  confirmar('Inativar ' + e.escola + '?\n\nA escola some da lista de cadastro de acessos e deixa de receber diretor novo.' +
    (e.gestor ? '\n\nO acesso de ' + (e.gestor.nome || e.gestor.email) + ' é encerrado e o período vai para o histórico.' : '') +
    '\n\nNada é excluído: os PPPs da escola e o histórico de diretores continua no sistema, e a escola pode ser reativada depois.',
    function(){ aplicar(false); }, {titulo:'Inativar escola', rotulo:'Inativar', perigo:true});
}

/* v7.6 (P4): o resumo da fila de e-mails, para o Órgão Central */

function desenharFilaEmails(r){
  const el = $('#filaResumo'); if(!el) return;
  if(!r || !r.ok){ el.innerHTML = '<p class="pi-vazio erro">' + esc((r && r.erro) || 'Não foi possível ler a fila.') + '</p>'; return; }
  /* v8.13 (E13): "em envio" é situação de verdade desde que o envio saiu de
     dentro da trava — uma linha presa nela é sinal de execução interrompida,
     e o Órgão Central precisa poder vê-la. */
  el.innerHTML =
    '<div class="pi-card ' + (r.pendentes ? 'pendente' : '') + '"><span class="n">' + r.pendentes + '</span><span class="r">pendentes</span></div>' +
    (r.enviando ? '<div class="pi-card pendente" title="Mensagens cujo envio começou e ainda não teve desfecho. Passados 30 minutos, voltam sozinhas para a fila."><span class="n">' + r.enviando + '</span><span class="r">em envio</span></div>' : '') +
    '<div class="pi-card destaque"><span class="n">' + r.enviados + '</span><span class="r">enviados</span></div>' +
    '<div class="pi-card"><span class="n">' + r.desistidos + '</span><span class="r">desistidos</span></div>' +
    '<div class="pi-card"><span class="n">' + (r.cotaRestante == null ? '—' : r.cotaRestante) + '</span><span class="r">cota de hoje restante</span></div>';

  if(erros) erros.innerHTML = ((r.ultimosErros || []).length
    ? '<p class="hint"><b>Últimos erros:</b> ' + r.ultimosErros.map(function(x){ return esc(x.para) + ' (' + esc(x.tipo) + ', ' + n(Number(x.tentativas) || 0, 'tentativa', 'tentativas') + '): ' + esc(x.erro); }).join('; ') + '</p>'
    : '') +
    /* v8.13 (E13): o expurgo virou rotina própria (diária, 2h) — quem olha a
       fila precisa saber quando ela foi limpa pela última vez. */
    (r.expurgo && r.expurgo.em
      ? '<p class="hint">Último expurgo: ' + esc(r.expurgo.em) + ' · ' + n(r.expurgo.apagadas || 0, 'mensagem apagada', 'mensagens apagadas') + (r.expurgo.restam ? ' · ' + r.expurgo.restam + ' ficaram para a próxima execução' : '') + '.</p>'

/** Uma unidade por regional, com as pessoas cadastradas nela. */
function UNIDADES_REG(){
  const porSre = {};
  INSTITUCIONAIS.filter(function(a){ return a.perfil === 'regional'; })
    .forEach(function(a){ (porSre[a.sre] = porSre[a.sre] || []).push(a); });
  /* toda SRE da rede aparece, mesmo sem ninguém; e qualquer SRE que apareça
     só nos cadastros também entra, para que nada fique invisível */
  const nomes = SRES.slice();
  Object.keys(porSre).forEach(function(x){ if(x && nomes.indexOf(x) < 0) nomes.push(x); });
  nomes.sort(function(a,b){ return a.localeCompare(b, 'pt-BR'); });
  return nomes.map(function(n){ return {sre:n, pessoas:porSre[n] || []}; });
}

    if(REG_FILTRO === 'com' && !u.pessoas.length) return false;
    if(REG_FILTRO === 'sem' && u.pessoas.length)  return false;
    if(!b) return true;
    return (u.sre + ' ' + u.pessoas.map(function(a){ return a.nome + ' ' + a.email; }).join(' ')).toLowerCase().indexOf(b) >= 0;
  });
  if(!L.length){ alvo.innerHTML = '<p class="pi-vazio">Nenhuma regional encontrada com esse filtro.</p>'; return; }
  alvo.innerHTML = L.map(function(u){
    const ativos = u.pessoas.filter(function(a){ return a.situacao !== 'inativo'; }).length;
    return `<button class="reg-linha" data-reg="${esc(u.sre)}">
      <span><b>SRE ${esc(u.sre)}</b><span class="sub-linha">${
        u.pessoas.length ? esc(u.pessoas.map(function(a){ return a.nome || a.email; }).slice(0,2).join(', ')) +
          (u.pessoas.length > 2 ? ' e mais ' + (u.pessoas.length - 2) : '') : 'nenhuma pessoa cadastrada'}</span></span>
      <span><span class="sub-linha">${u.pessoas.length ? u.pessoas.length + (u.pessoas.length === 1 ? ' pessoa' : ' pessoas') : '—'}</span></span>
      <span>${u.pessoas.length ? '<span class="esc-tag ' + (ativos ? 'sim' : 'off') + '">' + n(ativos, 'ativo', 'ativos') + '</span>'
            : '<span class="esc-tag nao">sem equipe</span>'}</span>
      <span class="pi-acao">gerir</span>
    </button>`;
  }).join('');
}

function salvarRegional(){
  if(!REG_ATUAL) return;
  const erro = $('#rgErro'); erro.classList.remove('show');

  const nome = $('#rgNome').value.trim();

  if(nome.length < 3) return dizer('Informe o nome do responsável.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return dizer('Informe um e-mail institucional válido.');

     central, no Órgão Central; e, ao alterar alguém, o papel que ele já tem.
     Trocar o e-mail manda o anterior, para reescrever a mesma linha (T-12). */
  const editando = REG_EDITANDO ? pessoasDaRegional().filter(function(x){ return x.email === REG_EDITANDO; })[0] : null;
  const papelEnv = editando ? (editando.papel || (REG_ATUAL.central ? 'central' : 'superintendente'))

/* v8.13 (C10): a carga da base é a operação mais destrutiva do sistema. Como
   a de diretores, passa a ter duas etapas — simular e importar com a chave
   emitida pela simulação. O resumo diz, em número, o que a carga vai fazer. */
/* v8.13 (F09): `info` e `resultado` guardam a confirmação da última carga.
   Sem eles, `carregarBaseEscolas()` reescrevia #piEscolas inteiro logo depois
   de gravar e apagava a única resposta de quem acabou de mandar 3.600
   escolas: quantas mudaram de SRE, quantas voltaram de inativa e quantas
   ganharam INEP. */
let CARGA_ESC = {chave:'', texto:'', info:'', resultado:''};
function resumoCargaEscolas(r){
  const p = [];
  p.push(n(r.incluidas, 'escola', 'escolas') + ' a incluir');
  p.push(r.atualizadas + ' a atualizar');
  if(r.mudamSre) p.push('<b>' + r.mudamSre + ' muda(m) de regional</b>');
  if(r.voltamAtivas) p.push('<b>' + r.voltamAtivas + ' volta(m) de inativa para ativa</b>');
  if(r.ganhamInep) p.push(r.ganhamInep + ' ganha(m) código INEP');
  if(r.mudamInep) p.push(r.mudamInep + ' muda(m) de código INEP');
  if(r.totalErros) p.push(n(r.totalErros, 'linha recusada', 'linhas recusadas'));
  let h = '<p class="hint">' + p.join(' · ') + '.</p>';
  /* v9.8: a carga aceita a escola sem INEP (a extração da rede vem com a
     coluna vazia), mas diz de quantas se trata — o cadastro individual
     passou a exigir o código, e é por ele que a base se regulariza. */
  if(r.semInep) h += '<p class="hint"><b>' + n(r.semInep, 'escola entra', 'escolas entram') +
    ' sem o código INEP.</b> O cadastro individual passou a exigi-lo: use o filtro ' +
    '<b>Somente sem código INEP</b> na lista acima para regularizá-las, uma a uma ou por nova carga com o quinto campo preenchido.</p>';
  if(r.totalErros) h += '<p class="hint"><b>Recusadas:</b> ' + r.erros.map(esc).join('; ') +
    (r.totalErros > r.erros.length ? ' … (' + r.totalErros + ' no total)' : '') + '</p>';
  return h;
}
function importarEscolas(acao){
  const bSim = $('#escImportarSimular'), btn = $('#escImportarBtn');
  const info = $('#escImportarInfo'), res = $('#escImportarResultado');
  const texto = $('#escTexto').value;
  if(!texto.trim()){ info.textContent = 'Cole as linhas antes de simular.'; return; }
  if(acao === 'simular'){
    bSim.disabled = true; bSim.textContent = 'Conferindo…'; info.textContent = ''; res.innerHTML = ''; btn.hidden = true;
    servidor('escolasImportar', {token:SESSAO.token, texto:texto, simular:true}, function(r){
      bSim.disabled = false; bSim.textContent = 'Simular';
      if(!r || !r.ok){ info.textContent = (r && r.erro) || 'Não foi possível simular.'; return; }
      CARGA_ESC = {chave:r.chave, texto:texto, info:'', resultado:''};
      info.textContent = n(r.total, 'linha conferida', 'linhas conferidas') + '. Nada foi gravado.';
      res.innerHTML = resumoCargaEscolas(r);
      btn.hidden = !(r.incluidas + r.atualizadas);
      btn.textContent = 'Importar ' + n(r.incluidas + r.atualizadas, 'linha', 'linhas');
    }, function(){ bSim.disabled = false; bSim.textContent = 'Simular'; info.textContent = 'Sem resposta do servidor.'; });
    return;
  }
  if(!CARGA_ESC.chave || CARGA_ESC.texto !== texto){
    info.textContent = 'O texto mudou desde a simulação. Simule de novo antes de importar.'; btn.hidden = true; return;
  }
  btn.disabled = true; btn.textContent = 'Importando…';
  servidor('escolasImportar', {token:SESSAO.token, texto:texto, simular:false, chave:CARGA_ESC.chave}, function(r){
    btn.disabled = false;
    if(!r || !r.ok){ btn.textContent = 'Importar'; info.textContent = (r && r.erro) || 'Não foi possível importar.'; return; }
    btn.hidden = true;
    const frase = n(r.incluidas, 'escola incluída', 'escolas incluídas') + ', ' + n(r.atualizadas, 'atualizada', 'atualizadas') +
      (r.totalErros ? ' · ' + n(r.totalErros, 'linha recusada', 'linhas recusadas') : '') + '.';
    const resumo = resumoCargaEscolas(r);
    info.textContent = frase;
    res.innerHTML = resumo;
    $('#escTexto').value = '';
    /* v8.13 (F09): a chave e o texto são zerados, mas a confirmação fica
       guardada — `carregarBaseEscolas()`, logo abaixo, reescreve a aba. */
    CARGA_ESC = {chave:'', texto:'', info:frase, resultado:resumo};
    carregarBaseEscolas();
  }, function(){ btn.disabled = false; btn.textContent = 'Importar'; info.textContent = 'Sem resposta do servidor.'; });
}

function atualizarBarraEdicao(){

/** limpa o que o navegador insere na edição direta, preservando ênfases simples */
function limparInline(html){
  return String(html)
    .replace(/<\s*br\s*\/?\s*>/gi, '<br>')
    .replace(/<\/?(?:div|span|p|font|style|script)[^>]*>/gi, '')
    .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
    .replace(/\s(?:style|class)\s*=\s*("[^"]*"|'[^']*')/gi, '')
    .replace(/&nbsp;/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function editarInline(el){
  const caminho = el.dataset.cur;
  const valor = valorAtual(caminho);
  if(typeof valor !== 'string') { abrirNaLista(caminho); return; }
  const original = el.innerHTML;
  const escapado = (esc(valor) === original.replace(/&nbsp;/g,' ').trim()) || esc(valor) === original;
  el.setAttribute('contenteditable', 'true');
  el.setAttribute('role', 'textbox');
  el.setAttribute('aria-label', 'Editar: ' + ((CUR.rotulos && CUR.rotulos[caminho]) || caminho));
  el.classList.add('editando');
  el.focus();
  const dica = document.createElement('div');
  dica.className = 'ed-dica';
  dica.textContent = 'Enter grava · Esc cancela · ' + ((CUR.rotulos && CUR.rotulos[caminho]) || caminho);
  document.body.appendChild(dica);
  const encerrar = function(salvar){
    el.removeEventListener('keydown', tecla);
    el.removeEventListener('blur', aoSair);
    el.removeAttribute('contenteditable');
    el.removeAttribute('role');
    el.removeAttribute('aria-label');
    el.classList.remove('editando');
    dica.remove();
    if(!salvar){ el.innerHTML = original; return; }
    const novo = escapado ? el.textContent.replace(/\s+/g,' ').trim() : limparInline(el.innerHTML);
    if(novo === valor || !novo){ el.innerHTML = original; return; }
    aplicarRascunho(caminho, novo);
    el.classList.add('alterado-agora');
  };
  const tecla = function(e){
    if(e.key === 'Escape'){ e.preventDefault(); encerrar(false); }
    // em campo de texto simples, Enter grava e Shift+Enter não insere quebra:
    // o valor é escapado na exibição e uma quebra apareceria como <br> literal
    if(e.key === 'Enter' && (escapado || !e.shiftKey)){ e.preventDefault(); encerrar(true); }
  };
  const aoSair = function(){ encerrar(true); };
  el.addEventListener('keydown', tecla);
  el.addEventListener('blur', aoSair);
}
/* v10.2: a recusa da v8.8 (G3) saiu junto com os marcadores. Ela existia
   para impedir que uma edição desatenta apagasse o marcador da citação e a
   quebrasse em dezenas de textos de uma vez. Sem marcador não há o que
   apagar: a citação é texto, e reescrevê-la é o que a curadoria faz. */

function aplicarRascunho(caminho, valor){
  const padrao = valorPadrao(caminho);
  if(iguais(valor, padrao)){
    if(caminho in CONTEUDO.itens) CUR.rascunhos[caminho] = null;
    else delete CUR.rascunhos[caminho];
  } else CUR.rascunhos[caminho] = valor;
  aplicarCaminho(caminho, iguais(valor, padrao) ? clonar(padrao) : valor);
  aplicarUI();
  atualizarBarraEdicao();
  renderDoc();
}
function abrirNaLista(caminho){
  if(!CUR.mapa) CUR.mapa = montarMapa();
  const g = CUR.mapa.filter(function(x){ return x.campos.some(function(c){ return c.p === caminho; }); })[0];
  if(!g){ toast('Este texto é editado na lista completa.'); curAbrir(); return; }
  CUR.grupo = g.id; CUR.busca = '';
  curAbrir();
  setTimeout(function(){
    $('#curBusca').value = '';
    curDesenharNav(); curDesenharCampos();
    const box = document.querySelector('.cur-campo[data-p="' + caminho + '"]');
    if(box){ box.scrollIntoView({block:'center'}); const c = box.querySelector('textarea,input'); if(c) c.focus(); }
  }, 60);
}

function abrirNoItinerario(registro, protocolo){

    state.dados.inep = SESSAO.inep;
    if(!state.dados.escola) state.dados.escola = SESSAO.escola || '';
    if(!state.dados.sre)    state.dados.sre    = SESSAO.sre || '';

  }

  atualizarBadge();
  /* v7.3 (T-14): validado (ou travado por qualquer outro motivo), o documento
     abre na tela final — é lá que se conclui; não há o que editar antes */
  irPara(bloqueado() ? TELAS.length - 1 : (state.tela || 0), true);
  renderDoc();
}
function criarNovoPPP(){
  if(SESSAO.papel === 'colegiado'){ alerta(ERRO_SO_DIRECAO_UI); return; }
  const emAndamento = (PAINEL.linhas || []).filter(ppEmElaboracao)[0];
  if(emAndamento){
    /* Não é uma pergunta: a escola escreve um PPP de cada vez. O caminho
       oferecido é continuar o que está aberto — ou, se ele espera a SRE,
       apenas fechar e aguardar (T-06). */
    const emValidacao = emAndamento.status === 'Em validação';
    const validado = emAndamento.status === 'Validado';
    const situacao = emValidacao
      ? ' Ele está em validação pela Diretoria Educacional' + (emAndamento.enviadoValidacaoEm ? ' desde ' + emAndamento.enviadoValidacaoEm : '') + ': aguarde o parecer.'
      : (validado ? ' Ele já foi validado: o passo seguinte é concluir e colher as assinaturas.' : '');
    const msg = 'Esta escola já tem um Projeto Político-Pedagógico em andamento:\n\n' +
      emAndamento.protocolo + ' — versão ' + (emAndamento.versao || 1) +
      ', com ' + emAndamento.pct + '% preenchido, alterado pela última vez em ' +
      (emAndamento.atualizadoEm || '—') + '.' + situacao + '\n\n' +
      'Só é possível ter um PPP em elaboração por vez. Continue esse — ou conclua-o — ' +
      'antes de começar outro. Para revisar um documento já encerrado, inicie uma nova versão a partir dele, na tela final.';
    /* v9.0 (item 47): em validação não há nada a fazer além de fechar — um botão
       só, "Fechar"; "Entendi" ao lado de "Fechar" eram dois nomes para o mesmo ato. */
    if(emValidacao) return aviso('Já existe um PPP em andamento', textoParaHTML(msg), null, {rotulo:'Fechar'});
    return confirmar(msg,
      function(){ continuarPPP(emAndamento.protocolo); },
      {titulo:'Já existe um PPP em andamento',
       rotulo: validado ? 'Concluir esse PPP' : 'Continuar esse PPP', rotuloCancelar:'Fechar'});
  }
  abrirNoItinerario(null, '');
  aviso('Percurso iniciado',
    '<p style="margin-bottom:10px">Você está começando o Projeto Político-Pedagógico de <b>' +
    esc(SESSAO.escola || 'sua escola') + '</b>.</p>' +
    '<p style="margin-bottom:10px">A identificação da escola já veio do seu cadastro de acesso — ' +
    'não é preciso digitar o código da escola nem o nome da unidade.</p>' +
    '<p>O preenchimento é contínuo: salve quando quiser e retome depois, na mesma tela em que parou. ' +
    'O botão <b>Tela inicial</b>, no alto, leva de volta à lista de PPPs da escola.</p>');
}
function continuarPPP(protocolo){
  servidor('buscarPPP', {p:protocolo, sessao:APP.sessao, token:SESSAO.token}, function(res){
    if(!res || !res.ok){ alerta((res && res.erro) || 'Não foi possível abrir o PPP.'); return; }
    if(res.ocupado) return confirmar('Este PPP está aberto por outra pessoa neste momento.\n\nSe vocês dois gravarem, a última gravação prevalece. Abrir mesmo assim?',
      function(){ abrirNoItinerario(res.registro, protocolo); },
      {titulo:'PPP aberto por outra pessoa', rotulo:'Abrir mesmo assim'});
    abrirNoItinerario(res.registro, protocolo);
  }, function(){ toast('Sem resposta do servidor.'); });
}

function aplicarBloqueio(){
  const inst = !!(SESSAO.perfil && SESSAO.perfil !== 'escola');
  const trava = bloqueado() || inst;
  const r = $('#travaRibbon');
  r.hidden = !trava;
  if(inst){
    r.innerHTML = 'Você está no <b>modo de edição de textos</b> do Órgão Central. Os campos da escola ' +
      'ficam bloqueados: o que se altera aqui são os textos do sistema, para toda a rede.';
  } else if(trava){
    /* v8.13 (D06): "Concluído" e "Assinado" são estados LEGADOS — desde a
       v8.2 nenhum documento novo passa por eles. As duas faixas ficam, e são
       código de compatibilidade: há registros nesses estados em bases em uso
       e na demonstração, e eles precisam continuar sendo lidos. */
    r.innerHTML = (APP.status === 'Homologado') ? UI.travaHomologadoSre
      : (APP.status === 'Enviado para homologação') ? UI.travaHomologado
      : (APP.status === 'Concluído') ? UI.travaConcluido
      : (APP.status === 'Assinado')  ? UI.travaAssinado
      : (APP.status === 'Em validação') ? UI.travaValidacao
      : (APP.status === 'Validado') ? UI.travaValidado
      : UI.travaAssinatura;
  }
  $('#btnSalvar').hidden = trava;
  /* v9.0 (M12): com o documento travado, a tela final reordena por CSS — a
     ata, a presença e a assinatura sobem; as datas e a verificação descem. */
  document.body.classList.toggle('doc-travado', trava);
  ['#panelProducao','#panelFormativo'].forEach(function(sel){
    const el = $(sel);
    el.classList.toggle('somente-leitura', trava);
    if(trava) el.querySelectorAll('input,textarea,select').forEach(function(i){ i.disabled = true; });
  });
}

function aplicarContexto(ctx){
  APP.urlApp = (ctx && ctx.urlApp) || '';
  APP.email = (ctx && ctx.email) || '';
  APP.admin = !!(ctx && ctx.admin);
  /* v7.4 (P1): publicado como "Executar como: eu", só quem é do domínio é
     identificado pela conta; os demais entram por e-mail e senha. E-mail
     vazio é normal — o controle (cadastro + sessão) está sempre ativo; a
     tarja só aparece se o servidor não respondeu ao contexto. */
  APP.controleAtivo = !!(ctx && ctx.controleAtivo);
  APP.identificado = !!(ctx && (ctx.identificado || ctx.email));
  APP.curadoria = !!(ctx && ctx.curadoria);
  APP.curador = !!(ctx && ctx.curador);
  APP.senhaDefinida = !!(ctx && ctx.senhaDefinida);
  APP.acessoInstitucional = !!(ctx && ctx.acessoInstitucional);
  APP.acesso = (ctx && ctx.acesso) || null;
  APP.cadastroInativo = !!(ctx && ctx.cadastroInativo);
  document.querySelector('[data-porta="central"]').hidden = !APP.curadoria;
  document.querySelector('[data-porta="regional"]').hidden = !APP.acessoInstitucional;
  mostrarIdentificacao();
  $('#acessoRibbon').hidden = APP.controleAtivo;
  $('#badgeUser').textContent = rotuloUsuario();
}
/** O selo do alto antes de entrar: a conta identificada, ou a entrada por senha. */
function rotuloUsuario(){
  if(APP.local) return 'modo demonstração';
  if(APP.email) return APP.email + (APP.admin ? ' · acesso ampliado' : '');
  return APP.controleAtivo ? 'entrada por e-mail e senha' : 'sem identificação de usuário';
}

const ROT_UNIDADE = {escola:'Direção Escolar', regional:'Superintendência Regional de Ensino', central:'Órgão Central'};
/**
 * Quem abriu o app já foi identificado pela conta institucional. Se houver
 * cadastro para esse e-mail, o sistema mostra de quem se trata e entra sem
 * pedir nada. As portas antigas ficam como caminho alternativo.
 */
/* ---- primeiro acesso: o link do e-mail, a senha e a entrada ---- */
let PRIMEIRO = null;   // convite em curso, quando a URL traz ?pa=<token>

/* v8.11 — Dentro do sandbox do Apps Script a página não enxerga a consulta
   da barra de endereços: quem a entrega é o servidor, no doGet. Fora dele
   (a demonstração, as baterias), vale a própria URL. */
function parametroDaURL(nome){
  try {
    const p = window.PARAMETROS;
    if(p && typeof p[nome] === 'string' && p[nome]) return p[nome];
  } catch(e){}
  try {
    const m = String(location.search || '').match(new RegExp('[?&]' + nome + '=([^&]+)'));
    return m ? decodeURIComponent(m[1]) : '';
  } catch(e){ return ''; }
  return '';
}
function tokenPrimeiroAcessoDaURL(){ return parametroDaURL('pa'); }

/* v7.3 (T-20): o convite da URL é conferido UMA vez. Consumido, o `pa=` sai
   da URL e a bandeira impede que "Sair" reabra a tela de primeiro acesso. */
let PA_CONSUMIDO = false;
function consumirTokenDaURL(){
  PA_CONSUMIDO = true;
  try {
    if(window.history && history.replaceState && /[?&]pa=/.test(location.search || '')){
      const limpa = String(location.search).replace(/([?&])pa=[^&]*&?/, '$1').replace(/[?&]$/, '');
      history.replaceState(null, '', location.pathname + limpa + (location.hash || ''));
    }
  } catch(e){}
}
/** Abre a tela de primeiro acesso quando a URL traz o convite. */
function verificarPrimeiroAcesso(){
  if(PA_CONSUMIDO) return false;
  const tk = tokenPrimeiroAcessoDaURL();
  if(!tk) return false;
  $('#portas').hidden = true;
  $('#portaIdent').hidden = true;
  $('#portaSemCadastro').hidden = true;
  $('#portaPrimeiro').hidden = false;
  $('#paCartao').innerHTML = '<span class="qm">Primeiro acesso</span><div class="nm">Conferindo o convite…</div>';
  servidor('primeiroAcessoInfo', {token:tk}, function(res){
    if(!res || !res.ok){
      $('#portaPrimeiro').hidden = true;
      $('#portas').hidden = false;
      consumirTokenDaURL();
      alerta((res && res.erro) || 'Não foi possível conferir este convite.', 'Primeiro acesso');
      return;
    }
    PRIMEIRO = Object.assign({token:tk}, res);
    $('#paCartao').innerHTML =
      '<span class="qm">Primeiro acesso · ' + esc(res.papelNome) + '</span>' +
      '<div class="nm">' + esc(res.nome || res.email) + '</div>' +
      '<div class="un">' + esc(res.unidade || '') + '</div>' +
      '<div class="em">' + esc(res.email) + '</div>';
    setTimeout(function(){ $('#paSenha').focus(); }, 60);
  }, function(){
    $('#paCartao').innerHTML = '<span class="qm">Primeiro acesso</span><div class="nm">Sem resposta do servidor.</div>';
  });
  return true;
}

function definirSenhaPrimeiroAcesso(){
  if(!PRIMEIRO) return;
  const erro = $('#landErro'); erro.classList.remove('show');
  const dizer = function(m){ erro.textContent = m; erro.classList.add('show'); };
  const senha = $('#paSenha').value, repetir = $('#paSenha2').value;
  if(senha.length < 8) return dizer('A senha deve ter ao menos 8 caracteres.');
  if(senha !== repetir) return dizer('As duas senhas digitadas são diferentes.');
  const btn = $('#btnDefinirSenha'); btn.disabled = true; btn.textContent = 'Definindo…';
  servidor('primeiroAcessoDefinir', {token:PRIMEIRO.token, senha:senha, repetir:repetir},
    function(res){
      btn.disabled = false; btn.textContent = 'Definir senha e entrar';
      if(!res || !res.ok){ dizer((res && res.erro) || 'Não foi possível definir a senha.'); return; }
      /* Definida a senha, entra em seguida: o convite já foi consumido e não
         faz sentido devolver a pessoa ao começo. O `pa=` sai da URL para que
         "Sair" não reabra esta tela (T-20). */
      consumirTokenDaURL();
      $('#portaPrimeiro').hidden = true;
      $('#portaInst').hidden = false;
      $('#instTitulo').textContent = 'Entrar no sistema';
      $('#instSub').textContent = 'Senha definida. Entre com o e-mail e a senha que você acabou de criar.';
      $('#instCampoEmail').hidden = false;
      $('#instEmail').value = res.email || PRIMEIRO.email;
      $('#instSenha').value = senha;
      $('#instCampoNome').hidden = true; $('#instCampoMasp').hidden = true;
      /* v7.3 (T-16d): na demonstração, entra com o papel em que o convite foi
         emitido — não com o papel padrão da porta */
      const papelPA = PRIMEIRO.papel || '';
      SESSAO.papelDemo = papelPA;
      SESSAO.porta = papelPA === 'central' ? 'central'
        : papelPA === 'diretor_escolar' ? 'escola' : papelPA === 'colegiado' ? 'colegiado' : 'regional';
      PRIMEIRO = null;
      entrarInst();
    },
    function(){ btn.disabled = false; btn.textContent = 'Definir senha e entrar'; dizer('Sem resposta do servidor.'); });
}

/* v8.12: a antessala fica acima dos passos do login. Quem a tem aberta não
   pode ter as portas de perfil reveladas por baixo — e é o que aconteceria,
   porque o contexto do servidor chega depois e refaz esta tela. */
function mostrarIdentificacao(){
  /* v8.13 (C18, A1-03) — UM PASSO POR VEZ. A guarda perguntava por um passo
     ESPECÍFICO (a antessala) e, por isso, protegia só ele. Quem clicava em
     "Autenticar PPP" antes de a resposta de `contexto` voltar já tinha a
     antessala oculta: a guarda era pulada, e o retorno do contexto revelava
     as portas de perfil — ou o cartão de identificação — POR CIMA do
     formulário de conferência, que ninguém esconde. A conferência pública é
     um passo sem sessão e sem perfil: nada do login tem o que fazer ali. O
     contexto continua sendo guardado em APP.acesso; quando a pessoa voltar
     (voltarPortas → esconderPassosLanding → mostrarIdentificacao) o login é
     desenhado normalmente. */
  if(!$('#portaVerificar').hidden) return;
  const antessala = !$('#portaEntrada').hidden;
  mostrarIdentificacaoInterna();
  if(antessala){
    $('#portas').hidden = true;
    $('#portasVoltar').hidden = true;
    $('#portaIdent').hidden = true;
    $('#portaSemCadastro').hidden = true;
    $('#uiLandLgpd').hidden = true;
    $('#uiLandSub').hidden = true;
    $('#uiLandEntrada').hidden = false;
    $('#portaEntrada').hidden = false;
  }
}
function mostrarIdentificacaoInterna(){
  const a = APP.acesso;
  /* recomeça sempre do mesmo estado: contexto novo não pode herdar a tela do anterior */
  $('#portaIdent').hidden = true;
  $('#portaSemCadastro').hidden = true;
  $('#portas').hidden = false;
  $('#portasVoltar').hidden = false;
  if(verificarPrimeiroAcesso()){ $('#portaEntrada').hidden = true; return; }
  if(a){
    $('#portas').hidden = true;
    $('#portasVoltar').hidden = true;
    $('#portaIdent').hidden = false;
    /* v7.3 (T-02): o cartão diz o PAPEL — colegiado não é "Direção escolar";
       cadastros antigos, sem papel, ganham o papel de topo do perfil */
    const papelId = a.papel || (a.perfil === 'central' ? 'central' : a.perfil === 'escola' ? 'diretor_escolar' : 'superintendente');
    $('#identCard').innerHTML =
      '<span class="qm">' + esc(a.papelNome || nomePapel(papelId)) + '</span>' +
      '<div class="nm">' + esc(a.nome) + '</div>' +
      '<div class="un">' + esc(a.perfil === 'escola' ? (a.escola || '—')
          : (a.perfil === 'central' ? 'Acesso a toda a rede' : 'SRE ' + (a.sre || '—'))) + '</div>' +
      '<div class="em">' + esc(APP.email) +
        (a.masp ? ' · MASP ' + esc(a.masp) : '') +
        (a.perfil === 'escola' && a.inep ? ' · código ' + esc(a.inep) : '') + '</div>';
    $('#identOutro').hidden = !APP.curadoria;
    return;
  }
  /* v7.4 (P1): sem conta identificada (e-mail vazio) ficam as PORTAS — a
     entrada por e-mail e senha —, sem tarja de erro. O cartão "não
     cadastrado" é só para quem foi identificado e não tem cadastro. */
  if(APP.email && !APP.curadoria){
    $('#portas').hidden = true;
    $('#portaSemCadastro').hidden = false;
    $('#semCadastroCard').innerHTML =
      '<span class="qm">Acesso não cadastrado</span>' +
      '<div class="nm">' + esc(APP.email) + '</div>' +
      '<div class="un">' + (APP.cadastroInativo
        ? 'Este e-mail tem cadastro, mas está inativo.'
        : 'Este e-mail ainda não foi cadastrado no sistema.') + '</div>' +
      '<div class="em">A direção escolar é cadastrada pela Superintendência Regional de Ensino; ' +
      'as equipes das regionais, pelo Órgão Central.</div>';
  }
}
/** Entra com o acesso já resolvido pelo e-mail institucional. */
function entrarIdentificado(){
  const btn = $('#btnEntrarIdent'); btn.disabled = true; btn.textContent = 'Entrando…';
  const erro = $('#landErro'); erro.classList.remove('show');
  /* v7.4: a porta do cartão é a do PAPEL — o colegiado identificado pela conta
     entra pela porta do colegiado, não pela da direção */
  const acIdent = APP.acesso || {};
  servidor('entrarInstitucional', {porta:(acIdent.papel === 'colegiado' ? 'colegiado' : acIdent.perfil) || ''}, function(res){
    btn.disabled = false; btn.textContent = 'Entrar';
    if(!res || !res.ok){ erro.textContent = (res && res.erro) || 'Não foi possível entrar.'; erro.classList.add('show'); return; }
    /* v7.3 (T-02): o mesmo gravador de sessão do caminho por senha — o
       papel e as competências não se perdem mais neste caminho */
    aplicarSessao(res);

/* ==========================================================
   13b. Conferência pública de autenticidade (v8.11)
   ==========================================================
   Sem cadastro: digitando o código do rodapé, a pessoa vê de que documento
   se trata e abre o PDF inteiro. É o que permite a quem recebe o PPP
   impresso saber se é aquele mesmo. */
function formatarCodigo(t){
  const c = String(t || '').toUpperCase().replace(/[^0-9A-F]/g, '').slice(0, 12);
  return c.replace(/^(.{4})(.{0,4})(.{0,4}).*$/, function(_, a, b, d){
    return a + (b ? '-' + b : '') + (d ? '-' + d : '');
  });
}
let VERIF = null;
function conferirAutenticidade(){
  const campo = $('#verifCodigo'), alvo = $('#verifResultado');
  const codigo = formatarCodigo(campo.value);
  campo.value = codigo;
  if(codigo.length < 14){
    alvo.innerHTML = '<div class="verif-erro">O código tem doze caracteres, no formato 0000-0000-0000. ' +
      'Ele está no rodapé de todas as páginas do documento.</div>';
    return;
  }
  alvo.innerHTML = '<p class="sub">Conferindo…</p>';
  servidor('verificarDocumento', {codigo: codigo}, function(res){
    if(!res || !res.ok){
      alvo.innerHTML = '<div class="verif-erro">' + esc((res && res.erro) || 'Não foi possível conferir agora.') + '</div>';
      return;
    }
    VERIF = res;
    const linha = function(r, v){ return v ? '<p class="verif-linha"><b>' + esc(r) + '</b> ' + esc(v) + '</p>' : ''; };
    alvo.innerHTML = '<div class="verif-ok">' +
      '<p class="verif-selo">Documento autêntico</p>' +
      linha('Escola:', res.escola) +
      linha('Município · regional:', (res.municipio || '—') + ' · SRE ' + (res.sre || '—')) +
      linha('Protocolo:', res.protocolo + (res.versao > 1 ? ' · versão ' + res.versao : '')) +
      linha('Situação:', res.status + (res.homolEm ? ' · homologado em ' + res.homolEm : '')) +
      linha('Concluído em:', res.concluidoEm) +
      /* v8.13 (D21): quem confere o papel precisa saber em que ponto o
         documento está — o código existe desde a conclusão, e a coleta de
         assinaturas pode ainda estar aberta. */
      linha('Assinaturas registradas:', res.assinadas + ' de ' + res.total + (res.ata ? ' · ata da aprovação anexada' : '')) +
      (res.total > 0 && res.assinadas < res.total
        ? '<p class="verif-linha">Documento em coleta de assinaturas.</p>' : '') +
      (res.assinantes && res.assinantes.length
        ? '<details class="verif-assin"><summary>Quem assinou</summary>' +
          res.assinantes.map(function(a){
            return '<p class="verif-linha">' + esc(a.nome || '—') + ' · ' + esc(a.papel) +
                   (a.assinadoEm ? ' · ' + esc(a.assinadoEm) : ' · assinatura pendente') + '</p>';
          }).join('') + '</details>'
        : '') +
      '<div class="verif-acoes">' +
        '<button class="btn btn-primary" id="btnVerifVer">Ver o documento</button>' +
        '<button class="btn btn-ghost" id="btnVerifPdf">Baixar o PDF</button>' +
      '</div></div>';
    $('#btnVerifPdf').addEventListener('click', baixarDocumentoPublico);
    $('#btnVerifVer').addEventListener('click', verDocumentoPublico);
    /* v8.12: conferido o código, o documento aparece — é ele que se quer ver,
       e não uma ficha sobre ele. O botão fica para reabrir depois de fechar. */
    verDocumentoPublico();
  }, function(){ alvo.innerHTML = '<div class="verif-erro">Sem resposta do servidor. Tente de novo em instantes.</div>'; });
}
/**
 * v8.12 — O PPP inteiro, na porta pública. É o mesmo visualizador em folhas
 * A4 que a escola usa por dentro, com o documento congelado na conclusão.
 */

function baixarDocumentoPublico(){
