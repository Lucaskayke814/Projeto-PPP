/* ==========================================================
   14a. Não perder o que a escola escreveu (v8.7 — bloco 4)
   ==========================================================
   D1 — o teto por campo é o do servidor: acima dele, a planilha recusa a
   célula e leva a LINHA INTEIRA junto, de modo que o salvamento automático
   passa a falhar em silêncio e tudo o que se escreve depois se perde.
   D2 — o rascunho fica no navegador, por protocolo. Se a gravação falhar,
   se a sessão cair ou se a aba fechar, o texto continua aqui e é oferecido
   de volta na próxima abertura do mesmo PPP. */
const LIMITE_CAMPO = 45000;
const AVISO_CAMPO = 40000;
function milhar(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

const RASC_PREFIXO = 'ppp.rascunho.';
/* v8.13 (D11): de 3 para 2. O rascunho de um PPP cheio passa de 1,4 MB, e três
   deles encostam na cota típica de 5 MB do navegador. Guardar três ESCOLAS
   diferentes na mesma máquina é caso que não existe — a sessão é de uma
   escola —, e a cota gasta à toa é o que fazia o rascunho do PPP em uso não
   caber. Dois cobrem o caso real: o PPP atual e o anterior da mesma escola. */
const RASC_MAX = 2;
let _rascTimer = null;

function chaveRascunhoLocal(prot){ return RASC_PREFIXO + String(prot || APP.protocolo || 'novo'); }
/**
 * v8.13 (D11) — PODAR ANTES, TENTAR DE NOVO, E DIZER QUANDO NÃO COUBE.
 *
 * Até a 8.12 a poda acontecia DEPOIS do setItem, de modo que ela nunca abria
 * espaço para a gravação que acabara de falhar, e o catch vazio engolia o
 * QuotaExceededError sem tarja e sem toast — enquanto a tela continuava
 * prometendo, na sessão perdida, que "o que você escreveu fica guardado neste
 * navegador". Promessa que o sistema não pode cumprir tem de sair da tela no
 * momento em que deixa de valer: é para isso que a tarja de gravação existe.
 */
function guardarRascunhoLocal(){
  /* vale também na demonstração: é o mesmo caminho que a escola percorre */
  if(!APP.protocolo || bloqueado()) return;
  let d;
  try {
    d = coletarDados();
    delete d.token; delete d.sessao;      /* o rascunho não guarda credencial */
  } catch(e){ return; }
  const bruto = JSON.stringify({em: Date.now(), protocolo: APP.protocolo, dados: d});
  try {
    podarRascunhosLocais();               /* ANTES: é o que abre espaço para esta gravação */
    localStorage.setItem(chaveRascunhoLocal(), bruto);
    APP.rascunhoIndisponivel = false;
    return;
  } catch(e){}
  try {
    /* a poda ao mínimo só acontece neste caminho: não se apaga o rascunho de
       outro PPP sem necessidade */
    podarRascunhosLocais(1);
    localStorage.setItem(chaveRascunhoLocal(), bruto);
    APP.rascunhoIndisponivel = false;
    return;
  } catch(e){}
  APP.rascunhoIndisponivel = true;
  falhaAoSalvar('Não foi possível guardar o rascunho neste navegador (armazenamento cheio ou navegação anônima). Não feche a aba sem salvar.');
}
function lerRascunhoLocal(prot){
  try {
    const bruto = localStorage.getItem(chaveRascunhoLocal(prot));
    if(!bruto) return null;
    const o = JSON.parse(bruto);
    return (o && o.dados) ? o : null;
  } catch(e){ return null; }
}
function limparRascunhoLocal(prot){
  try { localStorage.removeItem(chaveRascunhoLocal(prot)); } catch(e){}
}
function podarRascunhosLocais(maximo){
  const teto = (maximo === undefined) ? RASC_MAX : maximo;
  try {
    const atual = chaveRascunhoLocal();
    const chaves = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(RASC_PREFIXO) === 0) chaves.push(k);
    }
    if(chaves.length <= teto) return;
    chaves.map(function(k){
      let em = 0;
      try { em = (JSON.parse(localStorage.getItem(k)) || {}).em || 0; } catch(e){}
      /* v8.13 (D11): o PPP aberto vem sempre primeiro — podar ao mínimo é para
         abrir espaço PARA ELE, nunca para apagá-lo */
      return {k: k, em: (k === atual) ? Infinity : em};
    }).sort(function(a, b){ return b.em - a.em; }).slice(teto).forEach(function(x){
      try { localStorage.removeItem(x.k); } catch(e){}
    });
  } catch(e){}
}
/*
 * v8.13 (D10) — O RELÓGIO SAIU DA DECISÃO.
 *
 * Até a 8.12, a oferta do rascunho era decidida por TEMPO: o carimbo
 * "atualizadoEm" do servidor era remontado com `new Date(a,m,d,h,mi)` — ou
 * seja, no fuso do NAVEGADOR — e comparado com `Date.now()`, que é absoluto.
 * O servidor grava no fuso do script e a leitura volta por getDisplayValues,
 * cujo formato depende do locale da planilha. Daí as três formas do defeito:
 * navegador atrás do fuso apagava TODO rascunho; navegador à frente oferecia
 * rascunho velho por cima de texto novo; e formato não reconhecido devolvia 0
 * e pulava a guarda inteira — falha ABERTA.
 * Comparar CONTEÚDO é exato: não depende de fuso, de locale nem da resolução
 * do carimbo (que é de um minuto). O carimbo continua existindo, mas só para
 * dizer à pessoa QUANDO aquele texto foi escrito.
 * Por isso `msDeDataBR` foi retirada: não havia outro uso, e mantê-la era
 * deixar à mão a mesma armadilha.
 */
/** O nome de cada coluna COMO ELA APARECE NA TELA — montado das TELAS, da
    tela de identificação e dos grupos de marcação, sem lista paralela. */
const ROTULO_DO_CAMPO = (function(){
  const m = {};
  IDENT_CAMPOS.forEach(function(c){ if(c.k) m[c.k] = c.label; });
  FINAL_CAMPOS.forEach(function(c){ m[c.k] = c.label; });
  TELAS.forEach(function(t){
    (t.campos || []).forEach(function(c){ m[c.id] = c.label; });
    if(t.tipo === 'marcacao' && t.grupo) m[t.grupo] = t.titulo;
    if(t.tipo === 'indicadores') m.indicadores = t.titulo;
  });
  m.selecoes = 'marcações das telas de seleção';
  m.detalhes = 'indicações obrigatórias das ofertas';
  m.tarefas = 'itens de preparação confirmados';
  return m;
})();
/**
 * v8.13 (D12) — ONDE CADA COLUNA SE RESOLVE, NA TELA.
 *
 * Quando o servidor recusa uma célula grande demais, a tela tem de levar a
 * pessoa ao lugar em que aquele texto se encurta. `TELAS[].campos` só conhece
 * os textareas: "detalhes", "selecoes", "indicadores" e os campos da
 * identificação devolviam -1, e o clique não fazia nada — o PPP ficava com
 * uma tarja permanente e sem caminho. Este mapa é montado das MESMAS tabelas
 * que desenham as telas, para que coluna nova não nasça órfã.
 */
const TELA_DA_COLUNA = (function(){
  const m = {};
  const iDados = TELAS.findIndex(function(t){ return t.tipo === 'dados'; });
  IDENT_CAMPOS.forEach(function(c){ if(c.k && iDados >= 0) m[c.k] = iDados; });
  FINAL_CAMPOS.forEach(function(c){ m[c.k] = TELAS.length - 1; });
  TELAS.forEach(function(t, i){
    (t.campos || []).forEach(function(c){ m[c.id] = i; });
    if(t.tipo === 'marcacao' && t.grupo && m[t.grupo] === undefined) m[t.grupo] = i;
    if(t.tipo === 'indicadores' && m.indicadores === undefined) m.indicadores = i;
  });
  /* as colunas que reúnem várias telas numa célula só */
  const iMods = TELAS.findIndex(function(t){ return t.tipo === 'marcacao' && t.grupo === 'mods'; });
  if(iMods >= 0) m.detalhes = iMods;           /* as indicações da oferta ficam nas modalidades */
  const iPrim = TELAS.findIndex(function(t){ return t.tipo === 'marcacao'; });
  if(iPrim >= 0 && m.selecoes === undefined) m.selecoes = iPrim;
  return m;
})();
/** Campos (pelo RÓTULO DA TELA) em que o rascunho difere do que está aberto. */
function diferencasDoRascunhoLocal(r){
  const d = (r && r.dados) || {};
  const agora = coletarDados();
  const dif = [], vistos = {};
  const difere = function(k){
    /* rascunho gravado por versão anterior do sistema pode não ter a chave:
       ausência é "não mexe", nunca "apagou" */
    if(d[k] === undefined) return false;
    return String(d[k] === null ? '' : d[k]).trim() !==
           String(agora[k] === undefined || agora[k] === null ? '' : agora[k]).trim();
  };
  const por = function(k){
    if(!difere(k)) return;
    const rot = ROTULO_DO_CAMPO[k] || k;
    if(vistos[rot]) return;
    vistos[rot] = 1; dif.push(rot);
  };
  /* selecoes fica por último: ela é a MESMA marcação que as listas por grupo,
     só que por id. Citada duas vezes, a oferta diria o dobro dos campos. */
  Object.keys(agora).forEach(function(k){
    if(FORA_DO_CONTEUDO[k] || k === 'selecoes') return;
    por(k);
  });
  if(!Object.keys(state.sel).some(function(g){ return vistos[ROTULO_DO_CAMPO[g] || g]; })) por('selecoes');
  return dif;
}
/** Oferece de volta o que não chegou a ser gravado. */
function ofertarRascunhoLocal(reg){
  if(!APP.protocolo || bloqueado()) return;
  const r = lerRascunhoLocal(APP.protocolo);
  if(!r) return;
  const dif = diferencasDoRascunhoLocal(r);
  if(!dif.length){ limparRascunhoLocal(APP.protocolo); return; }
  const quando = new Date(r.em);
  const hora = ('0' + quando.getHours()).slice(-2) + ':' + ('0' + quando.getMinutes()).slice(-2);
  const dia = ('0' + quando.getDate()).slice(-2) + '/' + ('0' + (quando.getMonth() + 1)).slice(-2) + '/' + quando.getFullYear();
  /* a oferta nomeia os campos: aceitar substitui o que está gravado NELES, e
     quem decide precisa saber quais são */
  const nomes = dif.slice(0, 6).join('; ') + (dif.length > 6 ? '; e mais ' + (dif.length - 6) : '');
  confirmar('Neste computador há texto deste PPP que não chegou a ser gravado no servidor, ' +
    'da edição de ' + dia + ' às ' + hora + '.\n\n' +
    n(dif.length, 'campo difere', 'campos diferem') + ' do que está gravado: ' + nomes + '.\n\n' +
    'Quer recuperar esse texto? Ele substitui, <b>na tela</b>, o que está gravado nesses campos; ' +
    'o que está no servidor continua lá até você salvar.',
    function(){ aplicarRascunhoLocal(r); },
    {titulo:'Recuperar o que não foi gravado', rotulo:'Recuperar o texto',
     rotuloCancelar:'Descartar', aoCancelar: function(){ limparRascunhoLocal(APP.protocolo); }});
}
function aplicarRascunhoLocal(r){
  const d = (r && r.dados) || {};
  Object.keys(state.txt).forEach(function(k){ if(d[k] !== undefined) state.txt[k] = d[k]; });
  Object.keys(state.dados).forEach(function(k){ if(d[k] !== undefined) state.dados[k] = d[k]; });
  try { if(d.indicadores) state.ind = JSON.parse(d.indicadores); } catch(e){}
  try { if(d.detalhes) state.det = JSON.parse(d.detalhes); } catch(e){}
  /* v8.13 (D10/A4-14): os itens de preparação também estavam no rascunho e
     não voltavam — a trilha travava de novo em telas já liberadas. */
  try { if(d.tarefas !== undefined) state.tarefas = migrarTarefas_(JSON.parse(d.tarefas || '{}') || {}); } catch(e){}
  try {
    const ids = d.selecoes ? JSON.parse(d.selecoes) : null;
    /* v8.13 (D10/A4-14): o mesmo filtro de preencherRegistro — id que não
       existe mais em GRUPOS não entra no estado nem viaja para a planilha. */
    if(ids) Object.keys(state.sel).forEach(function(g){
      if(!Array.isArray(ids[g])) return;
      const validos = GRUPOS[g].map(function(o){ return o.id; });
      state.sel[g] = new Set(ids[g].filter(function(id){ return validos.indexOf(id) >= 0; }));
    });
  } catch(e){}
  sujar(); irPara(state.tela, true); renderDoc();
  toast('Texto recuperado. Salve para gravar no servidor.');
}

/* --- a tarja de gravação falhando (D2) --- */
function falhaAoSalvar(msg){
  const t = $('#tarjaSalvar');
  if(!t) return;
  $('#tarjaSalvarTexto').textContent = msg ||
    'O PPP não está sendo gravado no servidor. O texto está guardado neste navegador — não feche a aba sem salvar.';
  t.hidden = false;
  /* v9.0 (M14): o toast sobe acima da tarja (como já sobe acima da barra de
     edição), senão "Percurso salvo" aparece por cima de "não está sendo gravado". */
  document.documentElement.style.setProperty('--tarja-h', t.offsetHeight + 'px');
  APP.gravacaoFalhando = true;
}
function gravacaoRestabelecida(){
  const t = $('#tarjaSalvar');
  if(t) t.hidden = true;
  APP.gravacaoFalhando = false;
}

/* ==========================================================
   14b. Acessibilidade dos diálogos (v8.6 — E5)
   ==========================================================
   Sem isto, com um sobreposto aberto a tabulação sai dele e vai para a tela
   que está atrás: dá para marcar itens obrigatórios sem nunca encontrar as
   portas do diálogo. O foco entra no diálogo ao abrir, circula dentro dele
   enquanto estiver aberto e volta ao ponto de partida ao fechar. Uma função
   só, ligada por observação do atributo "hidden" — não é preciso lembrar de
   chamá-la em cada um dos dezessete pontos que abrem ou fecham sobrepostos. */
const FOCAVEIS = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),' +
                 'textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
let _focoAnterior = null;
function ambienteSemLayout(){        /* jsdom e afins não calculam geometria */
  try { return !document.body.getClientRects().length; } catch(e){ return true; }
}
function visivelParaFoco(el){
  if(el.disabled || el.closest('[hidden]')) return false;
  if(el.getClientRects().length) return true;
  if(!ambienteSemLayout()) return false;
  const cs = window.getComputedStyle ? window.getComputedStyle(el) : null;
  return !cs || (cs.display !== 'none' && cs.visibility !== 'hidden');
}
function focaveisDe(el){
  return Array.prototype.slice.call(el.querySelectorAll(FOCAVEIS)).filter(visivelParaFoco);
}
function sobrepostosAbertos(){
  return Array.prototype.slice.call(document.querySelectorAll('.overlay')).filter(function(o){ return !o.hidden; });
}
function aplicarFocoDeDialogo(){
  const abertos = sobrepostosAbertos();
  const topo = abertos.length ? abertos[abertos.length - 1] : null;
  Array.prototype.slice.call(document.body.children).forEach(function(el){
    if(el.tagName === 'SCRIPT' || el.id === 'toast') return;
    if(!topo || el === topo) el.removeAttribute('inert');
    else el.setAttribute('inert', '');
  });
  if(topo){
    if(!topo.contains(document.activeElement)){
      const ant = document.activeElement;
      if(ant && ant !== document.body && !ant.closest('.overlay')) _focoAnterior = ant;
      const alvo = focaveisDe(topo)[0];
      if(alvo) try { alvo.focus({preventScroll:true}); } catch(e){}
    }
    return;
  }
  if(_focoAnterior && document.contains(_focoAnterior) && visivelParaFoco(_focoAnterior)){
    try { _focoAnterior.focus({preventScroll:true}); } catch(e){}
  }
  _focoAnterior = null;
}
function vigiarSobrepostos(){
  if(typeof MutationObserver === 'undefined') return;
  const obs = new MutationObserver(function(muts){
    if(muts.some(function(m){ return m.attributeName === 'hidden'; })) aplicarFocoDeDialogo();
  });
  document.querySelectorAll('.overlay').forEach(function(o){
    obs.observe(o, {attributes:true, attributeFilter:['hidden']});
  });
  aplicarFocoDeDialogo();
}
document.addEventListener('keydown', function(e){
  if(e.key !== 'Tab') return;
  const abertos = sobrepostosAbertos();
  if(!abertos.length) return;
  const topo = abertos[abertos.length - 1], lista = focaveisDe(topo);
  if(!lista.length) return;
  const primeiro = lista[0], ultimo = lista[lista.length - 1];
  if(!topo.contains(document.activeElement)){ e.preventDefault(); primeiro.focus(); return; }
  if(e.shiftKey && document.activeElement === primeiro){ e.preventDefault(); ultimo.focus(); }
  else if(!e.shiftKey && document.activeElement === ultimo){ e.preventDefault(); primeiro.focus(); }
});

/* ==========================================================
   15. Abertura do sistema
   ========================================================== */
function iniciar(){
  renderTrilha();
  irPara(0, true);
}
function marcarVersaoNoRodape(){          /* v8.6 (E7) */
  const el = $('#footVersao');
  if(el) el.textContent = 'v' + VERSAO_SISTEMA + ' · ' + new Date().getFullYear();
}
/**
 * v8.12 — O CONGELADO DA DEMONSTRAÇÃO É O DOCUMENTO INTEIRO.
 *
 * O que se lê ao abrir um PPP já concluído — e o que a porta pública mostra
 * a quem confere um código — é o arquivo congelado na conclusão. Na
 * demonstração ele era um resumo de meia dúzia de linhas, e o resultado era
 * uma folha quase em branco, que parecia um documento mal formatado. Aqui o
 * congelado passa a ser montado pela MESMA função que monta o PPP de
 * verdade, com os dados de cada registro.
 */
function congelarDocumentosDaDemo(){
  if(!APP.local || !window.DEMO || !DEMO.gravarFonte) return;
  let regs = [];
  try { regs = DEMO.registros().filter(function(r){ return r.hash && r.fonteId; }); } catch(e){ return; }
  if(!regs.length) return;
  const guardado = {
    dados: JSON.parse(JSON.stringify(state.dados)),
    protocolo: APP.protocolo, versao: APP.versao, status: APP.status, hash: APP.hash,
    concluidoEm: APP.concluidoEm, assinaturas: APP.assinaturas,
    validadoPor: APP.validadoPor, validadoEm: APP.validadoEm
  };
  regs.forEach(function(r){
    Object.assign(state.dados, {escola:r.escola || '', inep:r.inep || '',
      municipio:r.municipio || '', sre:r.sre || '',
      direcao:r.direcao || guardado.dados.direcao});
    APP.protocolo = r.protocolo; APP.versao = r.versao || 1; APP.status = r.status || '';
    APP.hash = r.hash || ''; APP.concluidoEm = r.concluidoEm || '';
    try { APP.assinaturas = JSON.parse(r.assinaturas || '[]'); } catch(e){ APP.assinaturas = []; }
    APP.validadoPor = r.validadoPor || ''; APP.validadoEm = r.validadoEm || '';
    /* v8.13 (D18): a demonstração congela EXATAMENTE como a produção congela
       — paginado. Gravar sem paginar escondia o defeito de A6-02: a porta
       pública mostrava 5% do documento e as baterias nunca viam. Simulador
       mais permissivo que o mundo é simulador que esconde defeito. */
    try {
      APP.paraPdf = true;
      const congelado = paginar(docHTML(true).html);
      APP.paraPdf = false;
      DEMO.gravarFonte(r.fonteId, congelado);
    } catch(e){ APP.paraPdf = false; }
  });
  Object.assign(state.dados, guardado.dados);
  APP.protocolo = guardado.protocolo; APP.versao = guardado.versao; APP.status = guardado.status;
  APP.hash = guardado.hash; APP.concluidoEm = guardado.concluidoEm;
  APP.assinaturas = guardado.assinaturas;
  APP.validadoPor = guardado.validadoPor; APP.validadoEm = guardado.validadoEm;
}

function bootstrap(){
  marcarVersaoNoRodape();                 /* v8.6 (E7) */
  prepararFontesDoDoc();                  /* v9.1: a fonte do documento, antes de qualquer folha */
  /* v8.11: o link impresso no rodapé do PPP abre a conferência já preenchida */
  const codigoDaURL = parametroDaURL('v');
  if(codigoDaURL){
    setTimeout(function(){
      $('#landing').hidden = false;
      abrirAutenticacao();
      $('#verifCodigo').value = formatarCodigo(codigoDaURL);
      conferirAutenticidade();
    }, 300);
  } else if(!tokenPrimeiroAcessoDaURL()){
    irParaEntrada();                      /* v8.12: entrar ou autenticar */
  }
  vigiarSobrepostos();                    /* v8.6 (E5) */
  if(APP.local){
    $('#demoRibbon').hidden = false;
    $('#badgeUser').textContent = 'modo demonstração';
    APP.curadoria = true; APP.curador = true; APP.senhaDefinida = false; APP.acessoInstitucional = true;
    document.querySelector('[data-porta="central"]').hidden = false;
    document.querySelector('[data-porta="regional"]').hidden = false;
    /* v8.0 (P12): cria os serviços simulados, carrega o Code.gs real e
       semeia a base fictícia; os textos do servidor vêm dele, não de um espelho */
    const pub = DEMO.iniciar();
    CONTEUDO.versao = pub.versao || 0;
    CONTEUDO.padroesServidor = pub.padroes || {};
    CONTEUDO.itens = pub.itens || {};
    aplicarConteudo(CONTEUDO.itens);
    aplicarDemo();
    iniciar();
    congelarDocumentosDaDemo();           /* v8.12 */
    /* v7.3 (T-16d): um link ?pa=<token> abre a tela de primeiro acesso
       também na demonstração */
    mostrarIdentificacao();
    $('#landing').hidden = false;
    return;
  }
  let pronto = false;
  const seguir = function(itens, extra){
    if(pronto) return; pronto = true;
    CONTEUDO.versao = (extra && extra.versao) || 0;
    CONTEUDO.padroesServidor = (extra && extra.padroes) || {};
    CONTEUDO.itens = itens || {};
    aplicarConteudo(CONTEUDO.itens);
    iniciar();
  };
  servidor('contexto', null, function(ctx){
    aplicarContexto(ctx);
    retomarSessaoGuardada();
  }, function(){ aplicarContexto({}); });
  servidor('conteudoPublicado', null, function(res){ seguir(res && res.itens, res); },
                                function(){ seguir({}); });
  $('#landing').hidden = false;
}
/* v7.8 (P7): F5 não derruba ninguém — se há sessão guardada nesta aba e o
   servidor a reconhece, a pessoa volta direto à sua tela inicial */
function retomarSessaoGuardada(){
  const g = sessaoGuardada();
  if(!g || !g.token) return;
  servidor('sessaoValida', {token:g.token}, function(res){
    if(!res || !res.ok){ esquecerSessaoGuardada(); return; }
    aplicarSessao(Object.assign({}, g, {token:g.token}));
    if(g.perfil === 'central'){
      SESSAO.modo = g.modo || 'visualizacao';
      $('#landing').hidden = true;
      if(SESSAO.modo === 'edicao') entrarModoEdicao(); else abrirPainelInst();
      return;
    }
    SESSAO.modo = 'visualizacao'; $('#landing').hidden = true; abrirPainelInst();
  }, function(){ esquecerSessaoGuardada(); }, true);
}

   partes — na demonstração, o servidor simulado é carregado entre App e ela. */
