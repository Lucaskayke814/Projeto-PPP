  organizacaoTrabalho:'Compete à escola organizar o tempo escolar, adotando a distribuição do período letivo em trimestres nos cursos de organização anual e em semestres nos de organização semestral (art. 9º da Resolução SEE nº [nº a publicar], de 2026). O calendário escolar é definido em norma específica publicada anualmente pela Secretaria de Estado de Educação, cabendo à escola adequá-lo às realidades locais, com a participação da comunidade escolar, aprovação do Colegiado Escolar e homologação do Serviço de Inspeção Escolar (art. 10). Considera-se dia letivo aquele em que professores e estudantes desenvolvem atividades de ensino e aprendizagem, na escola ou em outros espaços educativos, desde que previstas neste Projeto Político-Pedagógico (art. 12); e dia escolar aquele destinado às ações coletivas de planejamento, formação e avaliação institucional, com participação obrigatória das equipes docente, técnica e administrativa (art. 14). As atividades realizadas fora do espaço escolar observam a previsão no planejamento anual dos professores, a autorização formal dos responsáveis e a conformidade com este documento e com o Regimento Escolar (art. 13). A jornada escolar observa a carga horária prevista para cada etapa ou modalidade, conforme as matrizes curriculares vigentes (art. 16).',

  praticas:'As práticas pedagógicas adotadas para a efetivação do currículo asseguram a valorização da leitura e da escrita em todas as etapas, com aula semanal dedicada à leitura e ao desenvolvimento contínuo da escrita nos diferentes componentes; o apoio personalizado aos estudantes com defasagens, por meio de intervenção pedagógica, recomposição, acompanhamento sistemático e suporte socioemocional; a utilização de metodologias ativas que promovam a participação do estudante na construção do conhecimento; o uso pedagógico, ético e responsável das tecnologias digitais e da inteligência artificial; o desenvolvimento das competências socioemocionais previstas na BNCC e no CRMG; e o desenvolvimento da pesquisa científica e da Educação para as Relações Étnico-Raciais. Observa-se o art. 37 da Resolução SEE nº [nº a publicar], de 2026.',

  avaliacao:'A avaliação da aprendizagem integra o processo de ensino e aprendizagem e tem caráter contínuo e formativo, visando acompanhar o percurso dos estudantes, identificar avanços e necessidades pedagógicas e assegurar a consolidação das aprendizagens previstas no currículo (art. 138 da Resolução SEE nº [nº a publicar], de 2026). Os critérios, procedimentos e instrumentos de avaliação interna são definidos coletivamente pela equipe pedagógica, em consonância com a proposta curricular, e orientam o planejamento, a reorientação das práticas e a definição de intervenções oportunas. As avaliações realizam-se de forma contínua, cumulativa e diagnóstica; apoiam-se em diferentes instrumentos e procedimentos, adequados às áreas do conhecimento e às especificidades dos estudantes; valorizam prioritariamente os aspectos qualitativos, sem prejuízo dos registros quantitativos; consideram o conjunto de habilidades desenvolvidas ao longo da trajetória formativa; e asseguram tempos, espaços e formas diversificadas de avaliação (art. 139).',

  instrumentos:'São adotados procedimentos diversificados, contextualizados e coerentes com os objetivos pedagógicos, entre eles atividades práticas, experimentais e investigativas, avaliações escritas, produções textuais, situações-problema e registros matemáticos, de modo a evidenciar a compreensão conceitual, o raciocínio e os procedimentos dos estudantes. São adotadas estratégias de autoavaliação, registros pedagógicos e devolutivas sistemáticas aos estudantes e às famílias, bem como a análise pedagógica das transições entre anos, ciclos e etapas (art. 140 da Resolução SEE nº [nº a publicar], de 2026). No início do ano letivo podem ser aplicadas avaliações diagnósticas elaboradas pelos professores, para subsidiar o planejamento (art. 141). A escola assegura, no ano em curso, condições pedagógicas diferenciadas aos estudantes com baixo aproveitamento ou dificuldades de aprendizagem, por meio de ações planejadas de atendimento diferenciado (art. 142).',

  pontuacao:'São distribuídos obrigatoriamente 100 pontos ao longo do período letivo para cada componente curricular. Nos cursos anuais, o ano organiza-se em três trimestres, com 30, 30 e 40 pontos; nos cursos semestrais, 100 pontos por semestre. É aprovado o estudante que obtiver, no mínimo, 60% do total de pontos em cada componente e frequência mínima de 75% da carga horária (art. 143 da Resolução SEE nº [nº a publicar], de 2026). Os componentes com ênfase nos aspectos afetivo, social, cultural, da cultura digital e no protagonismo do estudante têm caráter formativo e não interferem na classificação ou promoção, observado o aproveitamento mínimo de 60% e o cômputo fidedigno da frequência (art. 144).',

  recuperacao:'São asseguradas, ao longo de todo o período letivo, oportunidades contínuas de aprendizagem e recuperação, por meio de intervenções pedagógicas (art. 146 da Resolução SEE nº [nº a publicar], de 2026). Compreendem a recuperação contínua, desenvolvida em sala de aula no decorrer do processo; a recuperação periódica, realizada ao final de cada trimestre ou semestre, antes do Conselho de Classe; os estudos independentes de recuperação, organizados pela escola após o último Conselho de Classe; e os estudos com apoio direcionado, organizados pela SEE/MG e realizados antes do início do ano letivo subsequente. As ações de recuperação priorizam os objetos de conhecimento e as habilidades essenciais, visando à recomposição das aprendizagens, e os estudos independentes contam com plano de estudos elaborado pelo professor responsável, contemplando o que não foi consolidado pelo estudante.',

  conselhoClasse:'O Conselho de Classe é instância colegiada obrigatória, de natureza pedagógica, realizada ao final de cada trimestre ou semestre, em datas previamente definidas no calendário escolar. Responde pela análise coletiva e individual do desenvolvimento e do aproveitamento dos estudantes, pela avaliação do processo de ensino e aprendizagem, pelo compartilhamento das vivências em sala de aula, pelo planejamento e acompanhamento das estratégias de intervenção pedagógica e pela deliberação sobre os resultados finais (art. 148 da Resolução SEE nº [nº a publicar], de 2026). A decisão sobre a promoção é tomada coletivamente no Conselho de Classe, considerando o desempenho global do estudante, seu percurso formativo, o envolvimento no processo de aprendizagem e as evidências de desenvolvimento das competências e habilidades, superando a análise isolada por componente curricular (art. 149).',

  classificacao:'A classificação posiciona o estudante no ano de escolaridade compatível com sua idade, experiência e nível de desenvolvimento, por promoção, por transferência ou mediante avaliação realizada pela escola, independentemente de escolarização anterior, excetuado o 1º ano do Ensino Fundamental (art. 158 da Resolução SEE nº [nº a publicar], de 2026; art. 24, II, da LDB). A reclassificação consiste no reposicionamento do estudante em ano diverso daquele em que se encontra, com base em avaliação de desempenho, nas modalidades de avanço escolar, para estudantes com altas habilidades ou superdotação; aceleração, para estudantes em situação de atraso escolar; por transferência; e por frequência, para estudantes com frequência inferior a 75% que apresentem desempenho satisfatório em todos os componentes (art. 159; art. 23, § 1º, da LDB). Os documentos que fundamentam a classificação e a reclassificação são registrados e arquivados na pasta individual do estudante. Os estudantes em distorção idade/ano são atendidos por reclassificação, por turmas de aceleração ou por encaminhamento à EJA, observados os critérios legais de idade. Na matrícula é permitido o aproveitamento de estudos realizados com êxito, mediante análise dos documentos escolares e adaptações curriculares (art. 18).',

  progressao:'A progressão continuada, com aprendizagem e sem interrupção, é adotada nos Ciclos da Alfabetização e Complementar e vincula-se à avaliação contínua e processual, apoiada em ações de intervenção pedagógica significativas — não se traduzindo em promoção automática (arts. 151 e 152 da Resolução SEE nº [nº a publicar], de 2026). A progressão parcial permite ao estudante avançar em sua trajetória, com novas oportunidades de estudos no ano subsequente, em até três componentes curriculares, do 6º ao 9º ano do Ensino Fundamental e no 1º e 2º ano do Ensino Médio, inclusive na transição do 9º ano para o 1º ano do Ensino Médio (arts. 153 e 154; art. 24, III, da LDB). Ao estudante em progressão parcial são assegurados estudos orientados, conforme plano de intervenção pedagógica elaborado conjuntamente pelos professores do componente do ano anterior e do ano em curso, discutido no Conselho de Classe, com registro do resultado no SIMADE (arts. 155 e 157).',

  inclusiva:'A escola assegura o direito de acesso, permanência, participação e aprendizagem de todos os estudantes. Para isso, oferta o Atendimento Educacional Especializado (AEE) e elabora o Plano de Desenvolvimento Individual (PDI) de cada estudante que dele necessite. Promove as adaptações e flexibilizações pedagógicas necessárias e garante condições de acessibilidade física, pedagógica, comunicacional e atitudinal. A matrícula do estudante público da Educação Especial é obrigatória, sendo vedada a recusa de vaga em razão de deficiência. Observa a Resolução SEE nº 4.256/2020, a Resolução SEE nº 4.701/2022, que dispõe sobre a atuação dos profissionais de apoio à inclusão, e a Lei nº 13.146/2015. Adota ações permanentes de prevenção e combate a todas as formas de discriminação e preconceito.',

  digital:'A educação digital integra-se à formação dos estudantes conforme a Política Nacional de Educação Digital (Lei nº 14.533/2023) e o Referencial Curricular de Computação de Minas Gerais. São promovidos os eixos de Pensamento Computacional, Mundo Digital e Cultura Digital. O uso de ferramentas de Inteligência Artificial (IA) observa os princípios da ética, da transparência, da proteção de dados e da integridade acadêmica. A IA é compreendida como instrumento complementar às práticas pedagógicas, sem substituir a mediação docente, as relações humanas e a construção coletiva do conhecimento. No uso de recursos tecnológicos são assegurados a proteção integral e o melhor interesse do estudante, o nível mais elevado de privacidade e de proteção de dados pessoais, sistemas que impeçam o acesso a conteúdos inadequados à faixa etária e configurações que evitem o uso compulsivo, nos termos do art. 37, IV e V, da Resolução SEE nº [nº a publicar], de 2026. São observados o Estatuto da Criança e do Adolescente, a Lei nº 15.211/2025 (Estatuto Digital da Criança e do Adolescente), a Lei Geral de Proteção de Dados Pessoais (Lei nº 13.709/2018), a Lei nº 15.100/2025 e a Lei Estadual nº 25.881/2026.',

  convivencia:'O Plano de Convivência Escolar é parte integrante deste Projeto Político-Pedagógico e articula-se aos seus objetivos e ações pedagógicas (arts. 8º e 164 da Resolução SEE nº [nº a publicar], de 2026). Apresenta as estratégias da escola voltadas à promoção da convivência democrática, à prevenção das violências e das violações de direitos, ao desenvolvimento das competências socioemocionais, à Educação em Direitos Humanos e ao fortalecimento do pertencimento, do acolhimento, da mediação de conflitos e da construção de um ambiente escolar seguro, respeitoso e colaborativo. Cabe à gestão escolar promover ações permanentes de prevenção à violência e de fortalecimento da cultura de paz; implementar e monitorar políticas antirracistas; fortalecer a participação estudantil por meio dos conselhos de representantes de turma e dos Grêmios Estudantis; registrar, nos instrumentos oficiais, os casos de indisciplina, bullying, cyberbullying e violência, planejando ações educativas de prevenção e enfrentamento; comunicar aos responsáveis as ocorrências; cumprir os Protocolos de Segurança e de Prevenção à Violência da SEE/MG; e adotar a resolução dialogada de conflitos, articulando-se com a Rede de Proteção quando necessário (art. 167).',

  nae:'As equipes multiprofissionais do Núcleo de Acolhimento Educacional (NAE), integradas por profissionais de Psicologia e de Serviço Social, atuam de forma preventiva, coletiva e institucional, articuladas às práticas pedagógicas da escola, considerando este Projeto Político-Pedagógico, o Plano de Convivência Escolar e o diagnóstico institucional (arts. 161 e 162 da Resolução SEE nº [nº a publicar], de 2026; Lei nº 13.935/2019). Seu apoio tem caráter técnico-pedagógico e complementar, não se caracterizando como atendimento clínico individual nem afastando as atribuições da gestão escolar.',

  permanencia:'O controle da frequência é de responsabilidade do Professor de Educação Básica, sob monitoramento do Especialista em Educação Básica, e é registrado diariamente no Diário Escolar Digital (art. 27 da Resolução SEE nº [nº a publicar], de 2026). Verificada infrequência injustificada por cinco dias letivos consecutivos ou dez dias alternados no mês, cabe ao Especialista acompanhar a frequência, notificar por escrito os pais ou responsáveis legais, em articulação com a direção, e promover ações de reintegração escolar e de recomposição das aprendizagens (art. 28). Persistindo a infrequência, compete ao diretor comunicar ao Conselho Tutelar do Município, com relatório circunstanciado, informar o Colegiado Escolar, registrar os encaminhamentos nos sistemas oficiais, prestar informações ao Serviço de Inspeção Escolar e assegurar as ações de reintegração e recomposição após o retorno do estudante (art. 29). O controle de frequência, a prevenção do abandono e a Busca Ativa Escolar observam a Resolução SEE nº 5.080/2024.',

  comunicacaoFamilias:'Os resultados da avaliação da aprendizagem são comunicados por escrito, em até dez dias úteis após o encerramento de cada trimestre ou semestre, aos estudantes e aos seus responsáveis legais, com indicação das estratégias de intervenção pedagógica adotadas e previstas (art. 145 da Resolução SEE nº [nº a publicar], de 2026). No encerramento do ano letivo, após os estudos independentes de recuperação, a escola comunica por escrito o resultado final, informando inclusive a situação de progressão parcial, quando for o caso (art. 147). No ato da matrícula, os pais ou responsáveis, ou o estudante maior de dezoito anos, são informados sobre a organização e o funcionamento da escola, sobre este Projeto Político-Pedagógico e sobre o Regimento Escolar (art. 24). O descumprimento dos dispositivos que obrigam a comunicação da infrequência e do abandono escolar aos responsáveis e às autoridades competentes implica responsabilização administrativa da gestão escolar (art. 32). Aplica-se ainda o art. 12, VII e VIII, da LDB.',

  gestao:'A gestão democrática efetiva-se pela atuação do Colegiado Escolar, instância deliberativa e consultiva que aprova este Projeto Político-Pedagógico e acompanha sua execução, nos termos do art. 7º da Resolução SEE nº [nº a publicar], de 2026. Efetiva-se também pelo funcionamento do Grêmio Estudantil e do Conselho de Representantes de Turma, pela participação das famílias e pela transparência na gestão da Caixa Escolar. Observam-se o art. 14 da LDB e a Resolução SEE nº 4.188/2019, que dispõe sobre a Assembleia Escolar e sobre a estrutura, o funcionamento e a eleição dos membros do Colegiado Escolar.',

  publicidade:'A escola divulga à comunidade escolar os atos da Caixa Escolar; o número de estudantes matriculados por ciclo ou ano; este Projeto Político-Pedagógico; as diretrizes do Regimento Escolar; as formas de avaliação interna; os resultados agregados do desempenho escolar, vedada a identificação individual; os indicadores, estatísticas e resultados obtidos nas avaliações internas e externas; as taxas de distorção idade/ano e as medidas adotadas para reduzi-las; e os projetos, propostas, ações previstas e medidas adotadas para a melhoria dos processos de ensino e aprendizagem (art. 175 da Resolução SEE nº [nº a publicar], de 2026). A publicização observa a Lei nº 13.709/2018 (LGPD) e a Lei nº 12.527/2011 (Lei de Acesso à Informação).',

  articulacao:'A articulação e a integração entre os profissionais da escola realizam-se em tempos institucionais próprios: os dias escolares destinados às ações coletivas de planejamento, formação e avaliação institucional (art. 14 da Resolução SEE nº [nº a publicar], de 2026), os horários de planejamento coletivo por área ou por ano de escolaridade, as reuniões pedagógicas, os Conselhos de Classe e as ações de formação entre pares. Os critérios, procedimentos e instrumentos de avaliação interna são definidos coletivamente pela equipe pedagógica (art. 138, parágrafo único), e a análise pedagógica das transições entre anos, ciclos e etapas é realizada de forma articulada (art. 140, § 3º). Cabe à equipe pedagógica coordenar esses tempos, assegurar a circulação das informações entre turnos e segmentos e acompanhar a implementação das decisões coletivas. A integração alcança também os profissionais de apoio à inclusão, as equipes do NAE, a secretaria escolar e os demais servidores.',

  decisorio:'A participação dos profissionais da escola no processo decisório decorre do art. 14, I, da LDB, que assegura a participação dos profissionais da educação na elaboração do projeto pedagógico da escola, e do art. 5º, I, da Resolução SEE nº [nº a publicar], de 2026, segundo o qual o Projeto Político-Pedagógico deve resultar da participação dos diferentes segmentos da comunidade escolar. Efetiva-se pela representação dos segmentos no Colegiado Escolar, pela deliberação coletiva no Conselho de Classe sobre a promoção dos estudantes (art. 149), pela definição coletiva dos critérios e instrumentos de avaliação interna (art. 138, parágrafo único), pela participação na adequação do calendário escolar (art. 10) e pelo registro das deliberações em ata, à disposição da comunidade escolar.',

  formacao:'A formação continuada dos educadores tem como prioridade o fortalecimento da prática pedagógica e a garantia do direito à aprendizagem para todos os estudantes (art. 177 da Resolução SEE nº [nº a publicar], de 2026). Compreende o conjunto de ações pedagógicas sistemáticas e permanentes, planejadas ao longo do percurso profissional, que articulam tempos formativos, saberes teóricos e práticos e a reflexão sobre a experiência docente (art. 178). É promovida prioritariamente no âmbito da própria escola, por meio de ações organizadas pela gestão e pelos próprios educadores, e, de forma articulada e complementar, pela SEE/MG, por intermédio da Escola de Formação e Desenvolvimento Profissional de Educadores (art. 179).',

  planoAcao:'O planejamento das ações é parte integrante deste Projeto Político-Pedagógico e traduz seus objetivos em ações, metas, prazos e responsáveis. Constitui compromisso conjunto da escola, da Superintendência Regional de Ensino e do Órgão Central com a aprendizagem dos estudantes. Organiza-se em ciclos periódicos de planejamento, execução, monitoramento e correção de rumos, com prioridade para as ações que enfrentam os problemas identificados no diagnóstico. Sua elaboração e seu registro observam os instrumentos e sistemas adotados pela Secretaria de Estado de Educação e as orientações vigentes.',

  avaliacaoInstitucional:'A avaliação institucional interna é o processo pelo qual a própria comunidade escolar examina periodicamente as condições e os resultados do trabalho da escola. Realiza-se nos dias escolares destinados às ações coletivas de planejamento, formação e avaliação institucional, com participação obrigatória das equipes docente, técnica e administrativa e, quando couber, de pais ou responsáveis e estudantes (art. 14 da Resolução SEE nº [nº a publicar], de 2026). Compreende instrumentos de escuta dos segmentos, a análise dos indicadores de aprendizagem, frequência e fluxo, a apreciação do cumprimento das ações planejadas e a devolutiva pública dos resultados à comunidade, na forma do art. 175. A avaliação institucional externa compreende as avaliações e os processos de acompanhamento conduzidos pela Superintendência Regional de Ensino, pela SEE/MG — inclusive o SIMAVE, o PROEB e o PROALFA — e pelos sistemas nacionais de avaliação da educação básica. Os resultados de ambas alimentam a revisão deste documento e a definição das prioridades do planejamento das ações.',

  outrosAspectos:'A escola não identificou, nesta vigência, outros aspectos a acrescentar aos já contemplados nesta proposta pedagógica.',

  acompanhamento:'O acompanhamento deste Projeto Político-Pedagógico ocorre por meio de reuniões pedagógicas, Conselhos de Classe e avaliação institucional. Compreende também a análise dos indicadores educacionais e o monitoramento das metas e ações planejadas. Cabe ao Colegiado Escolar, à equipe pedagógica e gestora e à comunidade escolar acompanhar sua execução, sem prejuízo da orientação, do acompanhamento, do registro e do arquivamento pela Superintendência Regional de Ensino e da articulação institucional promovida pela SEE/MG (art. 7º da Resolução SEE nº [nº a publicar], de 2026). A revisão ocorre no máximo a cada dois anos, na forma do art. 7º, parágrafo único. Ocorre também sempre que houver alteração na legislação ou nas diretrizes da SEE/MG, início da oferta de cursos de Educação Profissional, implementação de novos programas e projetos ou demanda da comunidade escolar.'
};

  lead:'Escola nenhuma revisa o PPP sozinha. O percurso envolve instâncias com responsabilidades distintas, e saber quem faz o quê evita retrabalho — e evita descobrir tarde que faltava um passo.',
  blocos:[
    {t:'lista', titulo:'Quem faz o quê', itens:[
      '<strong>Equipe gestora</strong> — coordena e mobiliza a comunidade escolar. Cabe ao Diretor organizar, agendar e convocar as reuniões, e disponibilizar previamente o PPP vigente para leitura e análise crítica.',
      '<strong>Comunidade escolar</strong> — participa da revisão e valida o documento em <strong>Assembleia Escolar</strong>, espaço em que apresenta ideias, sugestões e esclarece dúvidas.',
      '<strong>Superintendência Regional de Ensino</strong> — realiza a análise técnica e pedagógica do documento.',
      '<strong>Colegiado Escolar</strong> — aprova o PPP em reunião específica, com quórum de maioria absoluta e lavratura de ata.',
      '<strong>SRE, por sua Diretoria Educacional (DIRE)</strong> — homologa e arquiva a versão final encaminhada pela escola.'
    ]},
    {t:'dest', titulo:'O que a análise da SRE é — e o que não é', txt:'A análise técnica e pedagógica <strong>não tem caráter de aprovação ou reprovação</strong>. Seu objetivo é verificar o cumprimento das legislações e diretrizes, corrigir equívocos conceituais e propor melhorias no texto. Quem aprova o PPP é o Colegiado Escolar; a SRE homologa, isto é, registra a conformidade da entrega e arquiva o documento.'},
    {t:'p', txt:'Nas escolas do Campo, Indígenas e Quilombolas, a apresentação às comunidades pode gerar ajustes que devem ser incorporados antes da versão final. Nas escolas indígenas, é obrigatório o <strong>mecanismo de consulta livre, prévia e informada</strong>, na forma da Convenção nº 169 da Organização Internacional do Trabalho (OIT).'},
    {t:'atencao', titulo:'Homologação', txt:'Concluída a aprovação e colhidas as assinaturas no sistema, o documento segue automaticamente à Superintendência Regional de Ensino: nada é enviado por e-mail nem por outro sistema. A Diretoria Educacional registra a homologação aqui mesmo, e a escola é avisada. A partir desse registro, considera-se o PPP homologado.'},
    {t:'p', txt:'Depois da homologação, o trabalho não termina: <strong>a execução e o monitoramento do PPP são contínuos</strong>, e a revisão ocorre no máximo a cada dois anos.'},
    {t:'tabela', titulo:'Roteiro sugerido de encontros', colunas:['Encontro','Módulos','Quem participa','Produto'],
      linhas:[
        ['1. Abertura','1 e 2','Equipe gestora, professores, representantes de estudantes e famílias, Colegiado','Grupos de trabalho definidos; apresentação e histórico esboçados; ata'],
        ['2. Oferta e dados','3 e 4','Equipe gestora, especialista, representantes docentes','Marcações concluídas; tabela de indicadores; leitura do diagnóstico'],
        ['3. Identidade','5','Todos os segmentos — o encontro mais importante','Problema prioritário; missão, visão, valores e objetivos; ata'],
        ['4. Currículo e avaliação','6','Professores por área, especialista','Temas e metodologias descritos; concepção de avaliação'],
        ['5. Inclusão, comunidade e gestão','7 e 8','Professores do AEE, famílias, Colegiado, Grêmio','Seções 10 a 17 escritas'],
        ['6. Ações e acompanhamento','9 e 10','Equipe gestora, Colegiado','Prioridades e monitoramento; datas da assembleia e da aprovação'],
        ['7. Assembleia de validação','10','Comunidade escolar','Sugestões incorporadas; ata'],
        ['8. Aprovação','10','Colegiado Escolar, com quórum de maioria absoluta','Aprovação em ata; conclusão no sistema; assinaturas; homologação']
      ],
      nota:'As durações ficam a critério da escola; o que não deve ser reduzido é o número de pessoas em cada encontro. O sistema salva a qualquer momento, e cada encontro pode retomar o percurso pelo protocolo.'}
  ]}},

/* 4 */ {id:'tBal', tipo:'balanco', modulo:1, somenteRevisao:true, video:'balanco',
  eyebrow:'Módulo 2 · Revisão', titulo:'Balanço da vigência que se encerra',
  lead:'Antes de projetar o próximo período, a escola precisa dizer o que aconteceu com o que prometeu no PPP anterior. Este é o passo que transforma o documento em ciclo: sem ele, cada revisão recomeça do zero e as metas antigas desaparecem sem que ninguém tenha respondido por elas.',
  hint:'Esta tela só aparece na revisão. Os objetivos e os números abaixo são os da versão anterior deste PPP, recuperados automaticamente.',
  perguntas:[
    'Dos objetivos assumidos no PPP anterior, quais foram cumpridos? Com que evidência a equipe afirma isso?',
    'Quais não foram cumpridos — e o que impediu? Faltou condição, faltou prioridade ou a meta era irreal?',
    'O que os números de agora mostram em relação aos de dois anos atrás: melhoraram, pioraram ou ficaram parados?',
    'Que ação do período valeu a pena e deve continuar? Qual deve ser encerrada?'
  ],
  campos:[
    {id:'tBalanco', label:'19.3 Balanço da vigência anterior', ref:'Seção 19.3 · o que foi cumprido e o que não foi',
     placeholder:'Ex.: Dos … objetivos assumidos em … , foram cumpridos … . O abandono nos anos finais caiu de … % para … % , verificado em … . A meta de … não foi alcançada porque … . A ação de … será mantida, por … ; a de … será encerrada, porque … . O que aprendemos com o período é … .',
     helper:'Objetivo por objetivo: cumprido, parcialmente cumprido ou não cumprido, com a evidência e a explicação. É este texto que justifica as prioridades da nova vigência.'}
  ],
  tarefa:{titulo:'Antes de escrever: retomem o documento anterior', obrigatorio:true,
    intro:'O balanço é uma prestação de contas à comunidade, não um formulário. Ele precisa ser feito com quem participou da vigência que termina.',
    itens:[
      'Recuperamos o PPP anterior e a ata de aprovação dele.',
      'Levantamos os números atuais dos mesmos indicadores usados no diagnóstico anterior.',
      'Reunimos a equipe para responder, objetivo por objetivo, o que foi cumprido.',
      'Registramos em ata as conclusões deste balanço.'
    ]}},

/* 6 */ {id:'t04', tipo:'formativa', modulo:2, video:'etapas', conteudo:{
  eyebrow:'Módulo 3 · Formação', titulo:'As etapas da Educação Básica e suas transições',
  lead:'Cada etapa tem finalidade própria definida em lei, e o PPP deve demonstrar que a escola a conhece e a assume. Mas o ponto mais delicado não está dentro das etapas: está entre elas.',
  blocos:[
    {t:'p', txt:'O Ensino Fundamental é a etapa mais longa da Educação Básica. Ao longo dele, crianças e adolescentes passam por mudanças físicas, cognitivas, afetivas, sociais e emocionais profundas. A <strong>transição dos Anos Iniciais para os Anos Finais</strong> exige atenção especial quanto à adaptação a novas rotinas, metodologias, componentes curriculares e relações interpessoais.'},
    {t:'lista', titulo:'O que a norma pede sobre transições', itens:[
      'Da Educação Infantil para os Anos Iniciais: continuidade do aprendizado respeitando a idade, <strong>sem antecipar conteúdos</strong> da etapa seguinte.',
      'Do 5º para o 6º ano: ações de acolhimento, escuta, fortalecimento de vínculos e desenvolvimento da autonomia.',
      'Do 9º ano para o Ensino Médio: práticas que fortaleçam autoconfiança, protagonismo e competências socioemocionais.',
      'Em todas: avaliações diagnósticas, projetos integradores, rodas de conversa, atividades de ambientação e acompanhamento sistemático.'
    ]},
    {t:'dest', titulo:'Recomposição das aprendizagens', txt:'Conforme os arts. 142 e 146 da Resolução SEE nº [nº a publicar], de 2026, as ações de recomposição devem ocorrer <strong>de forma contínua e integrada ao planejamento pedagógico</strong> — não como programa paralelo que começa quando o resultado ruim aparece.'}
  ]}},

/* 9 */ {id:'t07', tipo:'formativa', modulo:2, video:'modalidades', conteudo:{
  eyebrow:'Módulo 3 · Formação', titulo:'Modalidades e formas de oferta em Minas Gerais',
  lead:'Minas Gerais tem escolas em assentamentos, em territórios quilombolas e indígenas, em unidades prisionais e socioeducativas, em tempo integral e com educação profissional. Modalidade não é detalhe cadastral: é o que define como a oferta se organiza para cada público.',
  blocos:[
    {t:'p', txt:'<strong>Etapa</strong> responde a “em que momento da escolarização o estudante está”. <strong>Modalidade</strong> responde a “em que condições e para qual público essa oferta acontece”. Por isso as modalidades são transversais — a Educação Especial, por exemplo, perpassa todos os níveis, etapas e modalidades.'},
    {t:'lista', titulo:'Cuidados que a marcação exige', itens:[
      'Nas escolas de tempo integral, é obrigatório indicar a carga horária no Ensino Fundamental em Tempo Integral (EFTI) — 35 ou 45 horas semanais — e a especificidade da oferta no Ensino Médio em Tempo Integral (EMTI): propedêutico, profissional ou bilíngue.',
      'Na Educação Profissional, os cursos vinculam-se aos Planos de Curso e PPC, conforme o Catálogo Nacional de Cursos Técnicos.',
      'Nas escolas do Campo, Indígenas e Quilombolas, o PPP é construído de forma autônoma e coletiva, com participação direta das comunidades.',
      'Nas escolas indígenas, a revisão exige o mecanismo de consulta livre, prévia e informada.'
    ]},
    {t:'atencao', titulo:'Cuidado frequente', txt:'Marcar modalidade que a escola não oferta gera incoerência entre o PPP, o cadastro oficial da escola na rede e a realidade verificada. Marque somente o que existe de fato.'}
  ]}},

/* 16 */ {id:'t14', tipo:'reflexao', modulo:4, video:'marco',

  lead:'O Marco Referencial reúne princípios, missão, visão, valores e objetivos. É a parte mais copiada dos PPPs — e a que menos diz alguma coisa quando não nasce da reflexão coletiva sobre os dados que vocês acabaram de reunir.',
  blocos:[
    {t:'p', txt:'Um bom teste: se o texto puder ser colado no PPP de qualquer outra escola do estado sem que ninguém perceba a troca, <strong>ele ainda não é sobre esta escola</strong>.'},
    {t:'exemplos', titulo:'Duas missões escritas para a mesma escola',
      fraco:{rotulo:'Versão genérica', texto:'Nossa missão é formar cidadãos críticos, criativos e responsáveis, capazes de atuar na sociedade, promovendo uma educação de qualidade, inclusiva e transformadora.',
        notas:['Serve para qualquer escola do país.','Nenhum verbo indica o que esta escola faz de diferente.','Não é possível verificar se está sendo cumprida.']},
      bom:{rotulo:'Versão própria', texto:'Nossa missão é garantir que nenhum estudante saia do 9º ano sem ler com autonomia. Por isso mantemos duas aulas semanais de leitura mediada em todas as turmas e reservamos o primeiro módulo II de cada mês para analisar, nome a nome, quem ainda não avançou.',
        notas:['Diz o que a escola faz, não apenas o que deseja.','Menciona decisões concretas de organização do tempo.','Pode ser checada: ou as aulas e a reunião existem, ou não.','Nasce de um problema real do diagnóstico.']}},
    {t:'p', txt:'<strong>Missão</strong> define a razão de existir da escola. <strong>Visão</strong> indica onde ela quer chegar. <strong>Valores</strong> apresentam os princípios éticos que orientam a convivência — e só se sustentam se for possível apontar onde aparecem na rotina.'},
    {t:'exemplos', titulo:'Dois objetivos específicos para o mesmo problema',
      fraco:{rotulo:'Objetivo que não se monitora', texto:'Melhorar o desempenho dos estudantes e reduzir a evasão escolar, promovendo ações pedagógicas de qualidade ao longo do ano letivo.',
        notas:['Sem indicador, sem número, sem prazo.','Não diz quem acompanha nem quando.','Nunca poderá ser declarado cumprido ou descumprido.']},
      bom:{rotulo:'Objetivo verificável', texto:'Reduzir o abandono nos anos finais de 3,5% (2025) para 1,5% até dezembro de 2027, mediante contato com a família já na segunda falta consecutiva. Monitoramento: relatório de frequência analisado no Conselho de Classe de cada trimestre.',
        notas:['Indicador, ponto de partida, valor pretendido e prazo.','Explicita o meio pelo qual se pretende chegar lá.','Define quem monitora e com que periodicidade.','Usa o número que veio da tabela de indicadores.']}}

  perguntas:[
    'Se um estudante saísse daqui após nove anos, o que a escola gostaria que tivesse ficado nele?',

    'Olhando os indicadores que vocês preencheram, qual é o problema mais urgente a enfrentar?',

  tarefaSe:{grupo:'mods', id:'ind', titulo:'Escola indígena: consulta livre, prévia e informada', obrigatorio:true,
    intro:'Sua escola marcou a modalidade Educação Escolar Indígena. A revisão do PPP exige o mecanismo de consulta livre, prévia e informada, na forma da Convenção nº 169 da Organização Internacional do Trabalho (OIT).',
    itens:['Comunicamos previamente a comunidade sobre a revisão do PPP e seus efeitos.',
           'Asseguramos que a consulta ocorra na língua e nos processos próprios do povo.',
           'Registramos a manifestação da comunidade e das lideranças.']},
  tarefa:{titulo:'Antes de avançar: conversem sobre isso', obrigatorio:true,
    intro:'As perguntas acima são pauta de encontro, não exercício individual. A missão que sair daqui só será da escola se tiver passado por essa conversa — de reflexão coletiva.',
    itens:[

/* 23 */ {id:'t21', tipo:'formativa', modulo:5, video:'avaliacao', conteudo:{
  eyebrow:'Módulo 6 · Formação', titulo:'Avaliação, recuperação e recomposição',
  lead:'Avaliar para classificar é o oposto do que a norma pede. A avaliação deve ser diagnóstica, formativa, contínua e processual — instrumento de acompanhamento e reorientação das práticas. Há, além disso, regras operacionais que o documento precisa refletir com exatidão.',
  blocos:[
    {t:'legal', titulo:'Regras vigentes na rede estadual', itens:[
      'Ano letivo em 3 trimestres, com 30, 30 e 40 pontos por componente curricular.',
      'Aprovação com no mínimo 60% dos pontos e 75% de frequência.',
      'Recuperação contínua, periódica, estudos independentes e apoio direcionado.',
      'Resultados comunicados por escrito em até 10 dias úteis após cada trimestre.',
      'Conselho de Classe obrigatório ao final de cada trimestre, deliberando pelo desempenho global.'
    ]},
    {t:'p', txt:'Na Educação Infantil, a avaliação realiza-se por acompanhamento e registro do desenvolvimento — relatórios, fotografias, desenhos —, <strong>sendo vedado seu uso para seleção, promoção, classificação ou retenção</strong>.'},
    {t:'dest', titulo:'Recomposição não é recuperação', txt:'Recuperação é oportunidade de retomar conteúdo avaliado. Recomposição das aprendizagens é ação permanente, integrada ao planejamento — dirigida às defasagens que atravessam anos de escolaridade.'},
    {t:'legal', titulo:'Percursos que a proposta pedagógica precisa descrever', itens:[
      '<strong>Classificação</strong> — posicionamento em qualquer ano ou etapa, exceto a primeira do fundamental, por promoção, transferência ou avaliação da escola (art. 24, II, da LDB).',
      '<strong>Reclassificação</strong> — reposicionamento conforme a aprendizagem demonstrada, inclusive em transferências (art. 23, § 1º).',
      '<strong>Aceleração de estudos</strong> — para estudantes com atraso escolar (art. 24, V, “b”).',
      '<strong>Avanço</strong> — nos cursos e nos anos, mediante verificação do aprendizado (art. 24, V, “c”).',
      '<strong>Aproveitamento de estudos</strong> concluídos com êxito (art. 24, V, “d”) e <strong>progressão parcial</strong>, quando adotada (art. 24, III).'
    ]},
    {t:'dest', titulo:'Por que isso costuma faltar no PPP', txt:'São procedimentos que a escola usa pouco e, quando usa, resolve caso a caso na secretaria. A norma pede o contrário: que estejam <strong>descritos antes de serem necessários</strong> — quem decide, com base em quê, com que registro. Sem isso, cada reclassificação vira uma decisão isolada, difícil de sustentar diante de uma família ou de uma auditoria.'},
    {t:'atencao', titulo:'Inserção automática', txt:'Os textos sobre trimestres, pontuação, recuperação, Conselho de Classe e os percursos previstos na LDB já entram no documento. Nas telas seguintes, a escola escreve sua <strong>concepção</strong> de avaliação, os instrumentos que utiliza e como conduz cada um desses procedimentos.'}
  ]}},

/* 25 */ {id:'t23', tipo:'formativa', modulo:6, video:'inclusiva', conteudo:{
  eyebrow:'Módulo 7 · Formação', titulo:'Educação inclusiva e relações étnico-raciais',
  lead:'Duas seções distintas que compartilham um compromisso: garantir que a escola seja de todos, de fato. Uma trata do direito de aprender de quem precisa de apoio específico; a outra, do enfrentamento do racismo na formação de todos.',
  blocos:[
    {t:'lista', titulo:'Dois instrumentos que precisam estar institucionalizados', itens:[
      '<strong>AEE</strong> — Atendimento Educacional Especializado: métodos, técnicas, recursos e procedimentos que complementam ou suplementam a formação do estudante, assegurando acesso ao currículo e participação.',
      '<strong>PDI</strong> — Plano de Desenvolvimento Individual: documento <strong>obrigatório</strong>, construído a partir do histórico de vida do estudante, das avaliações diagnósticas, do planejamento, do acompanhamento e da avaliação final. Cabe ao Especialista em Educação Básica articular e garantir sua construção.'
    ]},
    {t:'dest', titulo:'O PDI na prática: cinco passos', txt:'1) Histórico de vida e escolar do estudante, ouvidas a família e, quando possível, o próprio estudante. 2) Avaliação diagnóstica pedagógica: o que ele já faz, com que apoio, em quais situações. 3) Planejamento: objetivos por área, flexibilizações de conteúdo, tempo, material e avaliação, recursos de acessibilidade. 4) Acompanhamento: registro periódico, com data, do que avançou e do que precisa mudar. 5) Avaliação final e devolutiva à família. O EEB articula; os professores da turma e do AEE escrevem juntos — PDI feito por uma pessoa só não orienta ninguém.'},
    {t:'p', txt:'A acessibilidade tem quatro dimensões que o PPP deve tratar: <strong>física, pedagógica, comunicacional e atitudinal</strong>. Rampa sem material adaptado é acessibilidade pela metade.'},
    {t:'dest', titulo:'Educação antirracista', txt:'A seção de relações étnico-raciais não se cumpre com uma semana temática em novembro. O documento orientador pede práticas educativas antirracistas, inclusivas e interdisciplinares ao longo do ano, voltadas à valorização da cultura afro-brasileira e indígena, ao combate ao preconceito, à valorização das identidades culturais e à promoção da equidade racial.'}
  ]}},

    {t:'dest', titulo:'Indisciplina, violência e ato infracional são coisas distintas', txt:'A norma separa os três, e o Plano deve refletir essa distinção. <strong>Indisciplina</strong> é o descumprimento de normas e rotinas do Regimento e do PPP, sem configurar violência. <strong>Violência</strong> é ação ou omissão que cause dano físico, psicológico, moral, sexual, patrimonial ou social. <strong>Ato infracional</strong> tem procedimento próprio. Tratar tudo como “caso de disciplina” é o erro mais comum — e o que produz respostas desproporcionais nas duas direções.'},

/* 31 */ {id:'t27', tipo:'formativa', modulo:7, video:'gestao', conteudo:{

  blocos:[
    {t:'p', txt:'A norma exige participação dos diferentes segmentos e <strong>aprovação pelo Colegiado Escolar</strong>, com quórum de maioria absoluta e lavratura de ata. Registre as reuniões, os grupos de trabalho e as contribuições recebidas: a participação precisa ser demonstrável, não afirmada.'},
    {t:'lista', titulo:'Instâncias que o PPP deve tratar', itens:[

    {t:'dest', titulo:'Formação em serviço é direito', txt:'Prevista nos arts. 62 e 67 da LDB e detalhada na Resolução CNE/CP nº 1/2020, que institui a Base Nacional Comum para a Formação Continuada, a formação continuada é definida pelo art. 178 da Resolução SEE nº [nº a publicar], de 2026 como ações pedagógicas sistemáticas e permanentes, promovidas prioritariamente no âmbito da própria escola (art. 179). A formação entre os pares da própria equipe é uma das estratégias mais efetivas: aproveita os saberes construídos na escola e não depende de agenda externa. Some-se a ela a participação nas ações formativas ofertadas pela Secretaria de Estado de Educação, em formatos presencial, a distância e híbrido.'},
    {t:'legal', titulo:'Informar as famílias é dever legal da escola', itens:[

      'Notificar ao Conselho Tutelar a relação de estudantes com faltas acima do limite fixado em lei (art. 12, VIII).',
      'Comunicar por escrito os resultados de cada trimestre, no prazo previsto nas normas da rede.',
      'Zelar, junto aos pais e responsáveis, pela frequência à escola — dever também atribuído ao docente (art. 13, VI).'

    {t:'p', txt:'Duas outras exigências normativas se referem ao <strong>coletivo de profissionais</strong>, e não à comunidade: os processos que asseguram a <strong>articulação e integração</strong> entre eles (subseção 16.1) e os processos que garantem sua <strong>participação no processo decisório</strong> (subseção 16.2, fundada no art. 14, I, da LDB). São coisas distintas: a primeira trata de como o trabalho se articula; a segunda, de como as decisões se tomam.'},

/* 34 */ {id:'t29', tipo:'formativa', modulo:8, video:'plano', conteudo:{

  lead:'Objetivo sem ação é intenção; ação sem monitoramento é sorte. Esta é a parte do documento em que o que a escola concluiu no diagnóstico vira compromisso com prazo e responsável.',
  blocos:[
    {t:'p', txt:'O planejamento das ações é <strong>parte integrante do PPP</strong>, não anexo dele. Traduz os objetivos da escola em ações concretas, com metas, prazos e responsáveis atribuídos, e constitui compromisso conjunto da escola, da Superintendência Regional de Ensino e do Órgão Central com a aprendizagem dos estudantes.'},
    {t:'lista', titulo:'O ciclo que sustenta qualquer planejamento escolar', itens:[
      '<strong>Planejar</strong> — definir, a partir dos problemas do diagnóstico, o que será feito, por quem, com que recursos e até quando.',
      '<strong>Executar</strong> — realizar as ações e registrar o que efetivamente aconteceu, não o que estava previsto.',
      '<strong>Monitorar</strong> — verificar periodicamente, com evidências, se o resultado esperado está sendo alcançado.',
      '<strong>Corrigir rumos</strong> — decidir, diante das evidências, o que manter, o que ajustar e o que abandonar.'
    ]},
    {t:'dest', titulo:'Prioridade é escolha, não lista', txt:'Escola que elege quinze prioridades não elegeu nenhuma. A equipe deve concentrar esforço nas ações que enfrentam os problemas mais críticos do diagnóstico, e as ações acrescentadas pela escola devem reforçar — e não competir com — aquelas definidas pela rede.'},
    {t:'exemplos', titulo:'Duas prioridades escritas para o mesmo problema',
      fraco:{rotulo:'Prioridade que não se acompanha', texto:'Melhorar a frequência dos estudantes por meio de ações de conscientização e maior envolvimento das famílias, com acompanhamento da equipe pedagógica ao longo do ano.',
        notas:['Não diz qual turma, qual número, qual prazo.','“Conscientização” não é ação: não tem dia, responsável nem evidência.','Nunca será possível dizer se foi cumprida.','Não se liga a nenhum dado do diagnóstico.']},
      bom:{rotulo:'Prioridade que a equipe consegue verificar', texto:'Reduzir o abandono do 8º ano de 3,5% (2025) para 1,5% até dezembro de 2027. Ação: contato com a família na segunda falta consecutiva, registrado em planilha da secretaria; visita da equipe na quinta falta. Responsável: especialista. Evidência: relatório de frequência analisado no Conselho de Classe de cada trimestre; se o abandono do trimestre superar 1%, a equipe revisa a ação.',
        notas:['Parte de um número do diagnóstico e fixa a meta e o prazo.','A ação tem gatilho concreto (segunda falta), responsável e registro.','Define a evidência e quando ela é olhada.','Já diz o que acontece se não estiver funcionando — a correção de rumo está prevista.']}},
    {t:'p', txt:'Os <strong>instrumentos, sistemas e a nomenclatura</strong> usados para registrar e acompanhar esse planejamento são definidos pela Secretaria de Estado de Educação e podem mudar ao longo do tempo. O que não muda é a lógica: partir de um problema real, definir responsáveis, acompanhar com evidências e corrigir a rota. Consultem sempre as orientações vigentes da SEE/MG e da sua Superintendência.'},
    {t:'atencao', titulo:'O que escrever nesta seção', txt:'Não repita a descrição do instrumento. Diga <strong>quais prioridades esta escola escolheu e por quê</strong>, quem responde por cada ação, com que periodicidade a equipe se reúne para verificar os resultados e como decide mudar de rumo.'}
  ]},

     que é a lista, escrita e conferível, do que a tela pode pedir. A exceção

  google.script.run.withSuccessHandler(okSes).withFailureHandler(aoFalhar).api({fn:fn, args:args});
}
/**
 * A sessão caiu, ou o servidor recusou a ação por competência. Na recusa, a
 * mensagem do servidor é mostrada como veio — ela já diz qual papel pode o
 * quê (v7.3, T-11): antes, toda recusa virava "exclusiva do Órgão Central".
 */
function recusaDoServidor(msg){
  const m = String(msg || '').replace(/^(Exception|Error):\s*/i, '').trim();
  return m || 'O servidor recusou esta ação para o seu perfil de acesso.';
}
function sessaoPerdida(msg, textoServidor){
  const pend = Object.keys(CUR.rascunhos || {}).length;
  const recusa = !/Sessão expirada/i.test(msg);
  /* v8.7 (D2): antes de devolver a pessoa à abertura, o que ela escreveu é
     guardado neste navegador — e ela é avisada de que será oferecido de volta.
     v8.13 (D11): guardar ANTES de prometer. A promessa era feita mesmo quando
     o navegador tinha recusado a gravação (cota cheia), e a pessoa saía da
     tela acreditando que o texto estava a salvo em algum lugar. */
  if(!recusa){ try { if(APP.protocolo && APP.sujo){ guardarRascunhoLocal(); } } catch(e){} }
  alerta(recusa
    ? recusaDoServidor(msg)
    : (textoServidor || 'Sua sessão expirou por inatividade (o acesso dura quatro horas).') +
      (pend ? '\n\n' + (pend === 1 ? 'A alteração que você fez continua' : 'As ' + pend + ' alterações que você fez continuam') + ' na tela: entre novamente e publique.' : '') +
      (APP.protocolo && APP.sujo
        ? (APP.rascunhoIndisponivel
           ? '\n\nAtenção: o que você escreveu e ainda não foi gravado <b>não</b> pôde ser guardado neste navegador (armazenamento cheio ou navegação anônima). Copie o texto da tela antes de sair.'
           : '\n\nO que você escreveu e ainda não foi gravado fica guardado neste navegador: ao entrar de novo e abrir o mesmo PPP, o sistema oferece a recuperação.') : '') +
      '\n\nA tela de entrada será aberta.', recusa ? 'Ação não permitida' : 'Sessão expirada');
  if(recusa) return;
  SESSAO.token = ''; CUR.token = ''; esquecerSessaoGuardada();
  sairEdicao(true);
  $('#painelInst').hidden = true; $('#stage').hidden = false;
  $('#trilha').parentElement.hidden = false;
  irParaEntrada(); $('#landing').hidden = false;
}

/* ---- Devolutiva leve sobre o texto (v6.1) ----
   Verificações heurísticas, sem pretensão de avaliar qualidade: apontam sinais
   objetivos que costumam indicar texto genérico ou incompleto. São sugestões;
   não bloqueiam nada. Os patamares podem ser ajustados pela área pedagógica. */
const DEVOLUTIVA_MIN_PALAVRAS = 40;
const GENERICAS = /cidad[ãa]os? cr[ií]ticos?|educa[çc][ãa]o de qualidade|transformadora|forma[çc][ãa]o de cidad|sujeitos? (cr[ií]ticos?|aut[ôo]nomos?)|capazes de atuar na sociedade/i;
function devolutiva(id, txt){
  const t = String(txt || '').trim();
  if(!t) return [];
  const av = [];
  const n = t.split(/\s+/).filter(Boolean).length;
  const opcional = id === 'tReferencias' || id === 'tOutrosAspectos';
  if(/…|\.\.\./.test(t)) av.push('Há lacunas “…” no texto: parece que o exemplo foi copiado sem ser preenchido.');
  if(!opcional && n < DEVOLUTIVA_MIN_PALAVRAS) av.push('Texto curto (' + n + ' palavras). Esta seção costuma pedir ao menos um parágrafo desenvolvido, com nomes, números e periodicidade.');
  const temNumero = /\d/.test(t);
  if(['tDiagnostico','tEstudantes','tComunidade','tInfraestrutura'].indexOf(id) >= 0 && !temNumero)
    av.push('Nenhum número no texto. O diagnóstico precisa de dado, ano e fonte — “muitos”, “bom” e “alguns” não podem ser verificados.');
  if(id === 'tObjetivos'){
    if(!temNumero) av.push('Objetivo sem número: sem indicador de partida e meta, ele nunca poderá ser declarado cumprido.');
    if(!/20\d\d|até |prazo|trimestre|semestre|ano letivo/i.test(t)) av.push('Nenhum prazo identificado. Cada objetivo específico pede uma data ou período para ser conferido.');
    if(!/monitor|acompanh|verific/i.test(t)) av.push('O texto não diz quem monitora nem quando. Indique o momento em que a equipe confere o resultado.');
  }
  if(id === 'tMissao' && GENERICAS.test(t))
    av.push('Há expressões que servem para qualquer escola (“cidadãos críticos”, “educação de qualidade”…). Diga o que esta escola faz e mantém para cumprir sua missão.');
  if(id === 'tProjetos' && !/respons/i.test(t)) av.push('Nenhum responsável indicado. Cada projeto deve dizer quem responde por ele.');
  if(id === 'tPlanoAcao' && !/respons/i.test(t)) av.push('Indique quem responde por cada prioridade.');
  if(id === 'tBalanco'){
    if(!temNumero) av.push('O balanço precisa de números: de quanto para quanto foi cada indicador da vigência anterior.');
    if(!/cumprid|alcanç|atingi|não foi|parcial/i.test(t))
      av.push('Diga, objetivo por objetivo, se foi cumprido, parcialmente cumprido ou não cumprido — e por quê.');
  }
  if((id === 'tTemas' || id === 'tMetodologias') && !/turma|ano|s[ée]rie|componente|professor/i.test(t))
    av.push('Diga onde acontece: com quais turmas, em quais componentes e sob responsabilidade de quem.');
  if(id === 'tJustificativa'){
    if(!/porque|por isso|em raz[ãa]o|diante|uma vez que|dado que|por essa raz[ãa]o|justifica/i.test(t))
      av.push('O texto não apresenta razões. A justificativa precisa dizer por que a proposta é assim — não repetir o que ela contém.');
    if(!/diagn[óo]stico|indicador|dado|constat|realidade|comunidade/i.test(t))
      av.push('Ligue a justificativa ao diagnóstico: o que a escola constatou que a levou a estas escolhas.');
  }
  if(id === 'tOrganizacaoTrabalho'){
    if(!/turno|manh[ãa]|tarde|noite/i.test(t)) av.push('Informe os turnos de funcionamento e como as turmas se distribuem entre eles.');
    if(!/calend[áa]rio|dia letivo|trimestre|semestre|reuni[ãa]o|conselho/i.test(t))
      av.push('Descreva o que o calendário distribui: conselhos de classe, reuniões pedagógicas, planejamento coletivo e encontros com as famílias.');
  }
  if(id === 'tAceleracao' && !/reclassifica|classifica|acelera|avanç|aproveitamento/i.test(t))
    av.push('Nomeie os procedimentos: classificação, reclassificação, aceleração, avanço, aproveitamento de estudos. A norma trata cada um de forma distinta.');
  if(id === 'tComunicacaoFamilias'){
    if(!/dia|prazo|semana|m[êe]s|trimestre|ap[óo]s/i.test(t))
      av.push('Informe o prazo: a norma exige comunicação por escrito em até dez dias úteis após cada trimestre.');
    if(!/respons[áa]vel|respons[áa]veis|secretaria|dire[çc][ãa]o|especialista|professor/i.test(t))
      av.push('Diga quem responde por emitir e por cobrar a entrega dos resultados.');
  }
  if(id === 'tConvivencia'){
    if(!/registr/i.test(t)) av.push('Informe onde as ocorrências são registradas — o registro nos instrumentos oficiais é exigência da norma.');
    if(!/media|conflito|acolh/i.test(t)) av.push('Descreva como a escola acolhe e como media conflitos, e quem conduz cada situação.');
  }
  if((id === 'tArticulacao' || id === 'tDecisorio') && !/reuni[ãa]o|m[óo]dulo|conselho|colegiado|planejamento/i.test(t))
    av.push('Nomeie os tempos institucionais concretos: reuniões de módulo, planejamento coletivo, Conselho de Classe, Colegiado.');
  if(id === 'tAvaliacaoInstitucional'){
    if(!/instrument|question[áa]rio|escuta|pesquisa|roda|assembleia/i.test(t))
      av.push('Diga com que instrumento a escola se avalia — sem instrumento, a avaliação institucional não produz evidência.');
    if(!/devolutiv|divulg|comunic|apresent/i.test(t))
      av.push('Descreva a devolutiva: como o resultado volta para a comunidade. É o passo mais esquecido desta seção.');
  }
  return av;
}
function devolutivaHTML(id){
  const av = devolutiva(id, state.txt[id]);
  if(!av.length) return '';
  return '<ul class="devolutiva">' + av.map(a=>'<li>'+esc(a)+'</li>').join('') + '</ul>';
}
function ligarCampos(escopo){
  escopo.querySelectorAll('textarea[data-k]').forEach(function(ta){
    let dvTimer = null;
    const cont = function(){
      const n = ta.value.trim().split(/\s+/).filter(Boolean).length;
      const el = $('#ct_'+ta.dataset.k);
      if(!el) return;
      /* v8.7 (D1): o Sheets recusa célula acima de 50.000 caracteres, e a
         recusa derruba a gravação da linha inteira. O contador aparece antes
         de o texto chegar lá — e diz o que acontece se passar. */
      const ch = ta.value.length;
      el.classList.remove('perto', 'estourou');
      let txt = n + (n === 1 ? ' palavra' : ' palavras');
      /* v8.13 (D12/A4-12): o servidor recusa acima de LIMITE_CELULA — em
         EXATAMENTE 45.000 ele grava. Dizer "não será salvo" ali fazia a
         escola apagar texto por nada. */
      if(ch > LIMITE_CAMPO){
        txt += ' · ' + milhar(ch) + ' de ' + milhar(LIMITE_CAMPO) +
               ' caracteres — acima do limite: o PPP não será salvo enquanto este texto não diminuir';
        el.classList.add('estourou');
      } else if(ch >= AVISO_CAMPO){
        txt += ' · ' + milhar(ch) + ' de ' + milhar(LIMITE_CAMPO) + ' caracteres';
        el.classList.add('perto');
      }
      el.textContent = txt;
    };
    const dv = function(){ const el = $('#dv_'+ta.dataset.k); if(el) el.innerHTML = devolutivaHTML(ta.dataset.k); };
    cont(); dv();
    ta.addEventListener('input', function(){
      state.txt[ta.dataset.k] = ta.value; cont(); sujar(); renderDocSuave();
      clearTimeout(dvTimer); dvTimer = setTimeout(dv, 900);
    });
    ta.addEventListener('blur', dv);
  });
}

/* --- Tarefa de preparação (gate opcional) --- */
/* v8.5: a confirmação passa a ser gravada pelo id da tela, e não pela sua posição —
   a ordem do percurso mudou e as chaves antigas são convertidas ao abrir o registro. */
const ORDEM_ATE_V84 = ['t00','t00b','t01','tBal','t02','t03'];
function chaveTarefa(iTela, iItem){ return (TELAS[iTela] ? TELAS[iTela].id : iTela) + ':' + iItem; }
function tarefasAntigas_(obj){
  return Object.keys(obj || {}).some(function(k){ return /^\d+:\d+$/.test(k); });
}
function migrarTarefas_(obj){
  if(!tarefasAntigas_(obj)) return obj || {};
  const novo = {};
  Object.keys(obj).forEach(function(k){
    const m = /^(\d+):(\d+)$/.exec(k);
    if(!m){ novo[k] = obj[k]; return; }
    const i = +m[1];
    const id = (i < ORDEM_ATE_V84.length) ? ORDEM_ATE_V84[i] : (TELAS[i] ? TELAS[i].id : '');
    novo[(id || i) + ':' + m[2]] = obj[k];
  });
  return novo;
}
function indiceAoAbrir_(tela, antigo){
  let i = parseInt(tela, 10);
  if(!isFinite(i) || i < 0) i = 0;
  if(antigo && i < ORDEM_ATE_V84.length){
    const j = TELAS.map(function(t){ return t.id; }).indexOf(ORDEM_ATE_V84[i]);
    if(j >= 0) return j;
  }
  return Math.min(i, TELAS.length - 1);
}
/** localiza a tarefa da tela, esteja ela no nível da tela ou dentro de "conteudo" */
function tarefaDaTela(iTela){
  const t = TELAS[iTela];
  if(!t) return null;
  const cond = t.tarefaSe;
  if(cond && state.sel[cond.grupo] && state.sel[cond.grupo].has(cond.id)) return cond;
  return t.tarefa || (t.conteudo && t.conteudo.tarefa) || null;
}
function tarefaCompleta(iTela){
  const tar = tarefaDaTela(iTela);
  if(!tar || !tar.obrigatorio) return true;
  return tar.itens.every(function(_, i){ return !!state.tarefas[chaveTarefa(iTela, i)]; });
}
/**
 * v9.9 — A PREPARAÇÃO NÃO TRANCA O MODO EDIÇÃO DE TEXTOS.
 *
 * Os itens de preparação existem para a ESCOLA: confirmam que a equipe fez o
 * que a tela pede antes de escrever aquela parte do PPP. No modo edição de
 * textos, quem percorre as telas é o Órgão Central, e não para produzir um
 * PPP — para corrigir a redação do sistema. Exigir dele a confirmação dos
 * itens de uma escola que não é dele é pedir uma declaração sem objeto, e
 * trancava a revisão em quatro telas e no salto pela trilha e pelo mapa.
 *
 * A caixa da preparação CONTINUA na tela, e continua editável: o título, a
 * introdução e cada item são texto curável, e é ali que se corrigem. O que
 * muda é só a consequência: no modo edição ela não decide navegação.
 *
 * `tarefaCompleta` continua dizendo a verdade sobre a confirmação — é ela que
 * o checklist e o mapa leem para informar a situação de cada tela.
 */
function travaPreparacao(iTela){
  if(EDICAO.ativa) return false;
  return !tarefaCompleta(iTela);
}
function caminhoTarefa(iTela, tar){
  const t = TELAS[iTela];
  if(!t || !tar) return '';
  if(t.tarefaSe === tar) return 'TELAS.' + t.id + '.tarefaSe';
  if(t.tarefa === tar)   return 'TELAS.' + t.id + '.tarefa';
  if(t.conteudo && t.conteudo.tarefa === tar) return 'TELAS.' + t.id + '.conteudo.tarefa';
  return '';
}
function tarefaHTML(tar, iTela){
  if(!tar) return '';
  const feito = tar.itens.filter(function(_,i){ return !!state.tarefas[chaveTarefa(iTela,i)]; }).length;
  const ok = feito === tar.itens.length;
  const b = caminhoTarefa(iTela, tar);
  return `<div class="tarefa ${ok?'completa':''}" id="tarefaBox">
    <h4${ed(b && b + '.titulo')}>${esc(tar.titulo)}</h4>
    <p class="intro"${ed(b && b + '.intro')}>${esc(tar.intro)}</p>
    ${tar.itens.map(function(it,i){
      const marc = state.tarefas[chaveTarefa(iTela,i)] ? 'checked' : '';
      return `<label><input type="checkbox" data-tarefa="${i}" ${marc}>
        <span class="bx" aria-hidden="true">${ico('check')}</span>
        <span class="tx"${ed(b && b + '.itens.' + i)}>${esc(it)}</span></label>`;
    }).join('')}
    <p class="trava">${textoDaTrava(tar, ok)}</p>
  </div>`;
}
/**
 * v9.9: o rodapé da caixa de preparação, num lugar só — a montagem e a
 * marcação de um item diziam a mesma coisa em dois textos paralelos, e no
 * modo edição os dois prometiam uma trava que não existe mais ali.
 */
function textoDaTrava(tar, ok, faltam){
  if(ok) return ico('check') + ' Tudo pronto — pode avançar.';
  if(EDICAO.ativa) return 'Modo edição: a confirmação é da escola e não tranca o seu avanço. ' +
    'O texto desta caixa é editável como o restante da tela.';
  if(!tar.obrigatorio) return 'Recomendado, mas não obrigatório para avançar.';
  if(faltam === undefined) return 'O avanço fica liberado quando os ' + tar.itens.length + ' itens estiverem confirmados.';
  return (faltam === 1 ? 'Falta 1 item' : 'Faltam ' + faltam + ' itens') + ' para avançar.';
}
function ligarTarefa(iTela){
  const box = $('#tarefaBox');
  if(!box) return;
  box.addEventListener('change', function(e){
    const i = e.target.dataset.tarefa;
    if(i === undefined) return;
    state.tarefas[chaveTarefa(iTela, +i)] = e.target.checked;
    const tar = tarefaDaTela(iTela);
    const feito = tar.itens.filter(function(_,j){ return !!state.tarefas[chaveTarefa(iTela,j)]; }).length;
    box.classList.toggle('completa', feito === tar.itens.length);
    box.querySelector('.trava').innerHTML = textoDaTrava(tar, feito === tar.itens.length, tar.itens.length - feito);
    atualizarBotaoAvancar();
  });
}
function atualizarBotaoAvancar(){
  const tar = tarefaDaTela(state.tela);
  const trava = !!(tar && tar.obrigatorio) && travaPreparacao(state.tela);
  const btn = $('#btnNext');
  btn.disabled = false;                       // nunca deixar o botão inerte
  btn.classList.toggle('travado', trava);
  /* v9.0 (M04): o cadeado à esquerda do rótulo diz "está aqui, mas está
     trancado". O SVG não tem nó de texto, então btnNext.textContent continua
     igual ao rótulo que irPara() montou. */
  const cadeado = btn.querySelector('svg.ico');
  if(trava && !cadeado) btn.insertAdjacentHTML('afterbegin', ico('cadeado'));
  else if(!trava && cadeado) cadeado.remove();
  btn.title = trava ? 'Confirme os itens de preparação, logo acima, para avançar' : '';
  const aviso = $('#navAviso');
  aviso.hidden = !trava;
  if(trava) aviso.innerHTML = ico('alerta') + '<span>Confirme os itens de preparação</span>';
}

/** chamado pelo botão Avançar: se houver trava, conduz até a tarefa em vez de nada fazer */
function tentarAvancar(){
  if(!travaPreparacao(state.tela)){ irPara(proximaVisivel(state.tela, 1)); return; }
  const box = $('#tarefaBox');
  if(box){
    box.scrollIntoView({behavior:'smooth', block:'center'});
    box.classList.remove('destaque');
    void box.offsetWidth;
    box.classList.add('destaque');
    const primeiro = box.querySelector('input:not(:checked)');
    if(primeiro) setTimeout(function(){ primeiro.focus(); }, 400);
  }
  toast('Confirme os itens de preparação, logo acima, para avançar.');
}

/* --- Indicadores estruturados --- */
/**
 * v8.13 (D13) — INDICADOR É NÚMERO.
 *
 * As casas da tabela eram texto livre: -500 matrículas, 998% de aprovação,
 * "abc%" de reprovação e "<script>x%" de distorção eram aceitos, gravados e
 * IMPRESSOS na tabela da seção 2.4 do documento oficial.
 * A validação fica aqui, num lugar só, e é a mesma que o servidor aplica nos
 * dois atos que congelam o documento. Não se recusa no SALVAMENTO: travar o
 * autossalvamento por causa de um dígito errado é o caminho mais curto para
 * perder texto, e a regra do projeto é que o que a escola escreveu não se
 * perde. O dado fica guardado enquanto se trabalha; a porta do documento é
 * que é estreita.
 * As três taxas não são somadas exigindo 100%: há remanejamento e
 * transferência, e uma trava aritmética recusaria dado legítimo.
 */
const IND_REGRA = {
  mat: {rotulo:'Matrículas',  inteiro:true, min:0, max:999999,
        razao:'informe um número inteiro de 0 a 999.999'},
  apr: {rotulo:'Aprovação',   min:0, max:100, casas:1, razao:'informe uma taxa de 0 a 100, com até uma casa decimal'},
  rep: {rotulo:'Reprovação',  min:0, max:100, casas:1, razao:'informe uma taxa de 0 a 100, com até uma casa decimal'},
  aba: {rotulo:'Abandono',    min:0, max:100, casas:1, razao:'informe uma taxa de 0 a 100, com até uma casa decimal'},
  dis: {rotulo:'Distorção idade/ano', min:0, max:100, casas:1, razao:'informe uma taxa de 0 a 100, com até uma casa decimal'}
};
/**
 * v8.13 (D13) — a mesma conferência do servidor, feita antes de bater à porta.
 * Devolve '' quando pode seguir, ou a mensagem a mostrar. O segundo efeito é
 * levar a pessoa à tela dos indicadores: recusar sem mostrar onde é o defeito
 * que A4-04 descreve.
 */
function barrarPorIndicadores(acao){
  const ruins = [];
  ETAPAS.filter(function(o){ return state.sel.etapas.has(o.id); }).forEach(function(o){
    const linha = state.ind.etapas[o.id] || {};
    IND_COLS.forEach(function(c){
      const razao = indicadorInvalido(c.k, linha[c.k]);
      if(razao) ruins.push(o.label + ' · ' + c.th + ' = "' + String(linha[c.k]) + '"');
    });
  });
  if(!ruins.length) return '';
  return 'A tabela de indicadores tem valores que não são números: ' +
         ruins.slice(0, 3).join('; ') + (ruins.length > 3 ? '; e mais ' + (ruins.length - 3) : '') +
         '. Corrija na tela de indicadores antes de ' + acao + '.';
}
function indicadorInvalido(col, valor){
  const r = IND_REGRA[col];
  if(!r) return '';
  const s = String(valor == null ? '' : valor).trim();
  if(!s) return '';                                  /* vazio continua válido */
  /* forma aceita: dígitos, vírgula OU ponto decimal. Nada de sinal, de
     notação científica (1e9) nem de texto — era por onde tudo entrava. */
  const forma = r.inteiro ? /^\d+$/ : /^\d+(?:[.,]\d)?$/;
  if(!forma.test(s)) return r.razao;
  const n = parseFloat(s.replace(',', '.'));
  if(isNaN(n) || n < r.min || n > r.max) return r.razao;
  return '';
}
function alertasIndicadores(){
  const av = [];
  /* v8.13 (D13): o que não é número vem PRIMEIRO — antes da 8.13 o único
     alerta que aparecia para "1e9" em abandono era "abandono de
     1000000000%, acima do patamar de 5%". */
  ETAPAS.filter(o=>state.sel.etapas.has(o.id)).forEach(function(o){
    const linha = state.ind.etapas[o.id] || {};
    IND_COLS.forEach(function(c){
      const razao = indicadorInvalido(c.k, linha[c.k]);
      if(razao) av.push({etapa:o.label, campo:c.th.toLowerCase(), valor:linha[c.k], invalido:true, razao:razao});
    });
  });
  ETAPAS.filter(o=>state.sel.etapas.has(o.id)).forEach(function(o){
    const linha = state.ind.etapas[o.id] || {};
    Object.keys(IND_ALERTA).forEach(function(k){
      if(indicadorInvalido(k, linha[k])) return;      /* o que não é número já foi dito */
      const v = numInd(linha[k]);
      if(v !== null && v >= IND_ALERTA[k]){
        const nome = IND_COLS.filter(c=>c.k===k)[0].th.toLowerCase();
        av.push({etapa:o.label, campo:nome, valor:v, limite:IND_ALERTA[k]});
      }
    });
  });
  return av;
}
function alertasHTML(){
  const av = alertasIndicadores();
  if(!av.length) return '';
  return av.map(function(a){
    /* v8.13 (D13): o valor que não é número tem texto próprio — e diz que o
       documento não será concluído com ele */
    if(a.invalido) return `<div class="alerta-dado erro">${ico('erro')}
      <span><b>${esc(a.etapa)}</b> — ${esc(a.campo)}: "${esc(String(a.valor))}" não é um número. ${esc(a.razao)}. Enquanto estiver assim, o PPP não pode ser enviado para validação nem concluído.</span>
    </div>`;
    return `<div class="alerta-dado">${ico('alerta')}
      <span><b>${esc(a.etapa)}</b> — ${esc(a.campo)} de ${String(a.valor).replace('.',',')}%, acima do patamar de ${a.limite}% adotado para leitura do diagnóstico. Este número pede explicação na análise e uma meta correspondente.</span>
    </div>`;
  }).join('');
}

/* v8.13 (D12): a tabela inteira vira UMA célula da planilha ("Indicadores
   (JSON)"). Sem teto por campo, uma colagem em qualquer uma das casas derruba
   a gravação da linha. Número cabe em 12 caracteres; os campos de contexto
   (IDEB, avaliações, clima) são frases curtas. */
const IND_CEL_MAX = 12, IND_TXT_MAX = 120;

/* ==========================================================
   v8.14 — OS ÍNDICES POR ETAPA SEGUEM AS ETAPAS MARCADAS
   ==========================================================
   O IDEB é calculado em dois recortes do Ensino Fundamental — anos iniciais
   e anos finais —, e a avaliação estadual de alfabetização só existe nos
   anos iniciais. Uma escola que oferta apenas uma das duas etapas estava
   sendo interrogada sobre a outra: campo que ela não tem como preencher, em
   documento que depois sai dizendo "não informado". O formulário passa a
   perguntar o que a escola marcou na seção 6.1, e o documento a registrar
   só isso.

   O valor NÃO é apagado quando a etapa é desmarcada: a escola pode estar
   corrigindo a marcação e voltar atrás, e apagar dado por causa de um clique
   seria pior que a pergunta a mais. Ele deixa de ser pedido e deixa de sair
   no documento — e volta inteiro se a etapa for remarcada. */
/* v9.2: o IDEB também existe para o ensino médio (o INEP o publica desde a
   edição de 2017) — a escola que marca a etapa passa a informá-lo. O valor
   vai no mesmo JSON de indicadores; nenhuma coluna nova na planilha. */
const IND_ETAPA_DO_CAMPO = { idebAI: 'efai', idebAF: 'efaf', idebEM: 'em', proalfa: 'efai' };
function indicadorCabe(campo){
  const etapa = IND_ETAPA_DO_CAMPO[campo];
  if(!etapa) return true;                       /* campo que não é de etapa */
  try { return state.sel.etapas.has(etapa); } catch(e){ return true; }
}
/** O IDEB só tem "ano de referência" se algum dos dois índices for pedido. */
function idebCabe(){ return indicadorCabe('idebAI') || indicadorCabe('idebAF') || indicadorCabe('idebEM'); }
/* v9.2: a tela diz de onde vem a lista de campos — as etapas marcadas na
   seção 6.1 — e leva à tela em que se muda a marcação. Sem isto, quem via
   dois campos de IDEB não sabia por que eram dois, nem como mudar. */
function notaDasEtapasHTML(marcadas){
  const iEtapas = TELAS.findIndex(function(x){ return x.tipo === 'marcacao' && x.grupo === 'etapas'; });
  const pedidos = [];
  if(indicadorCabe('idebAI')) pedidos.push('IDEB dos anos iniciais');
  if(indicadorCabe('idebAF')) pedidos.push('IDEB dos anos finais');
  if(indicadorCabe('idebEM')) pedidos.push('IDEB do ensino médio');
  if(indicadorCabe('proalfa')) pedidos.push('avaliação de alfabetização');
  return '<p class="hint ind-etapas-nota">Os campos abaixo seguem as etapas marcadas na seção 6.1: <b>' +
    esc(marcadas.map(function(o){ return o.label; }).join('; ')) + '</b>. ' +
    (pedidos.length ? 'Por isso se pede ' + esc(pedidos.join(', ')) + '. ' : 'Por isso não se pede IDEB nem avaliação de alfabetização. ') +
    (iEtapas >= 0 ? '<button type="button" class="btn-link btn-sm" id="btnMudarEtapas">Alterar as etapas marcadas</button>' : '') + '</p>';
}
function renderIndicadores(t){
  const marcadas = ETAPAS.filter(o=>state.sel.etapas.has(o.id));
  if(!marcadas.length){
    /* v8.8 (F3): o aviso mandava voltar ao módulo das etapas sem oferecer o
       caminho — agora o botão leva direto à tela em que se marcam. */
    const iEtapas = TELAS.findIndex(function(x){ return x.tipo === 'marcacao' && x.grupo === 'etapas'; });
    $('#panelProducao').innerHTML =
      `<span class="eyebrow">${esc(t.eyebrow)}</span><h2>${esc(t.titulo)}</h2>
       <div class="vazio-aviso"${ed('TELAS.' + t.id + '.vazio')}>${esc(t.vazio)}</div>` +
      (iEtapas >= 0 ? `<button type="button" class="btn btn-primary" id="btnIrEtapas" style="margin-top:14px">Ir para as etapas de ensino</button>` : '');
    const b = $('#btnIrEtapas');
    if(b) b.addEventListener('click', function(){ irParaComTravas(iEtapas); });
    return;
  }
  const g = state.ind;
  $('#panelProducao').innerHTML = `
    <span class="eyebrow"${ed('TELAS.' + t.id + '.eyebrow')}>${esc(t.eyebrow)}</span><h2${ed('TELAS.' + t.id + '.titulo')}>${esc(t.titulo)}</h2>
    <p class="hint"${ed('TELAS.' + t.id + '.hint')}>${t.hint}</p>
    <div class="grid-fields" style="margin-bottom:20px">
      <div class="field"><label for="iAno">Ano de referência dos dados</label>
        <input id="iAno" data-g="ano" type="text" maxlength="${IND_CEL_MAX}" value="${esc(g.ano)}" placeholder="Ex.: 2025"></div>
      <div class="field"><label for="iDoc">Nº de profissionais docentes</label>
        <input id="iDoc" data-g="docentes" type="text" maxlength="${IND_CEL_MAX}" value="${esc(g.docentes)}" placeholder="Ex.: 32"></div>
    </div>
    <div class="ind-scroll">
      <table class="ind-tabela">
        <thead><tr><th style="text-align:left">Etapa</th>${IND_COLS.map(c=>`<th>${esc(c.th)}${c.suf?' (%)':''}</th>`).join('')}</tr></thead>
        <tbody>${marcadas.map(function(o){
          const l = g.etapas[o.id] || {};
          return `<tr><td class="et">${esc(o.label)}</td>${IND_COLS.map(function(c){
            const ruim = indicadorInvalido(c.k, l[c.k]);          /* v8.13 (D13) */
            return `<td data-r="${esc(c.th)}${c.suf?' (%)':''}"><input data-etapa="${o.id}" data-col="${c.k}" type="text" inputmode="decimal" maxlength="${IND_CEL_MAX}"
                     class="${ruim ? 'campo-alerta erro' : ''}" title="${esc(ruim)}"
                     value="${esc(l[c.k]||'')}" placeholder="${esc(c.ph)}" aria-label="${esc(o.label)} — ${esc(c.th)}"></td>`;
          }).join('')}</tr>`;
        }).join('')}</tbody>
      </table>
    </div>
    <p class="ind-nota">Fonte: sistemas oficiais de gestão escolar e de avaliação da rede. Percentuais com uma casa decimal; use vírgula.</p>
    ${notaDasEtapasHTML(marcadas)}
    <div class="grid-fields" style="margin-bottom:18px">
      ${indicadorCabe('idebAI') ? `<div class="field"><label for="iIdebAI">IDEB — anos iniciais</label>

/* --- Tabela de indicadores no documento --- */
function tabelaIndicadores(paraPdf){
  const marcadas = ETAPAS.filter(o=>state.sel.etapas.has(o.id));
  const comDados = marcadas.filter(function(o){
    const l = state.ind.etapas[o.id] || {};
    return IND_COLS.some(c => String(l[c.k]||'').trim());
  });
  if(!comDados.length) return '';
  const cel = function(v, suf, col){
    const s = String(v==null?'':v).trim();
    if(!s) return '—';
    /* v8.13 (D13): "%" só se acrescenta a número. "abc%" não é indicador, e
       o documento não pode dar a um texto qualquer a aparência de taxa. */
    const numerico = !indicadorInvalido(col, s);
    return esc(s) + (numerico && suf && !/%$/.test(s) ? suf : '');
  };
  let h = `<table class="ind"><thead><tr><th>Etapa</th>${
      IND_COLS.map(c=>`<th>${esc(c.th)}</th>`).join('')}</tr></thead><tbody>${
      comDados.map(function(o){
        const l = state.ind.etapas[o.id] || {};
        return `<tr><td class="et">${esc(o.label)}</td>${
          IND_COLS.map(c=>`<td>${cel(l[c.k], c.suf, c.k)}</td>`).join('')}</tr>`;
      }).join('')}</tbody></table>`;

  const g = state.ind, extras = [];
  /* v8.14: o documento registra os índices das etapas que a escola oferta.
     Valor gravado de etapa hoje desmarcada fica no registro, mas não entra
     no documento — ele diria um índice de etapa que a escola não tem. */
  if(g.idebAI && indicadorCabe('idebAI')) extras.push('IDEB anos iniciais: ' + g.idebAI);
  if(g.idebAF && indicadorCabe('idebAF')) extras.push('IDEB anos finais: ' + g.idebAF);
  if(g.idebEM && indicadorCabe('idebEM')) extras.push('IDEB ensino médio: ' + g.idebEM);
  if(g.idebAno && idebCabe()) extras.push('ano de referência do IDEB: ' + g.idebAno);
  if(g.proalfa && indicadorCabe('proalfa')) extras.push('avaliação estadual de alfabetização: ' + g.proalfa);
  if(g.proeb) extras.push('avaliação estadual de desempenho: ' + g.proeb);
  if(g.clima) extras.push('clima escolar — dimensão mais frágil: ' + g.clima);
  if(g.aee) extras.push('estudantes público-alvo da Educação Especial: ' + g.aee);
  if(g.docentes) extras.push('profissionais docentes: ' + g.docentes);
  h += `<p class="fonte">Dados relativos a ${esc(g.ano || 'exercício informado pela escola')}. ` +
       `Fonte: sistemas oficiais de gestão escolar e de avaliação da rede.` +
       (extras.length ? ' Complementarmente — ' + esc(extras.join('; ')) + '.' : '') + `</p>`;
  return h;
}

/*
 * v8.13 (D10/D12) — A TELA DE IDENTIFICAÇÃO EM UMA TABELA SÓ.
 *
 * Os campos estavam escritos um a um no molde HTML. Duas correções deste lote
 * precisam deles fora do molde: D10 nomeia, na oferta do rascunho, o campo
 * COMO ELE APARECE NA TELA, e D12 põe teto em cada um. Feitos em lista
 * paralela, o próximo campo novo nasceria sem rótulo e sem teto — que é
 * exatamente a classe de defeito que A4-04 e A4-02 são. Aqui a tela e os dois
 * mapas leem a MESMA tabela.
 * `k` é a coluna (e o data-k); sem `k`, o campo é só exibição e não vai ao
 * payload — é o caso da regional, que vem da sessão (D02).
 */
/* v8.13 (D12): `max` é o teto DA TELA, e é o que faz sentido para o campo —
   não o teto da célula. Um nome de escola com 45 mil caracteres é erro de
   colagem, não texto grande. Nos quatro maiores há contador a partir de 80%
