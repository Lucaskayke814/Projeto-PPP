  /** A folha de assinaturas de um registro, com as contagens pedidas pela semente.
      Os membros de colegiado CADASTRADOS entram por último, ainda sem assinar:
      é assim que a demonstração tem o que assinar quando se entra como colegiado. */
  function folhaDe(r) {
    const total = r.totalAssin || 0;
    if (!total) return [];
    const dir = diretorDe(r.inep);
    const reais = colegiadoDe(r.inep);
    const membros = [];
    membros.push({ papel: 'Direção Escolar', segmento: 'Direção Escolar', nome: (dir && dir.nome) || r.escola,
                   masp: (dir && dir.masp) || '', email: (dir && dir.email) || ('direcao.' + r.inep + '@educacao.mg.gov.br') });
    const segmentos = ['Docente', 'Estudante', 'Pai, mãe ou responsável', 'Servidor administrativo', 'Comunidade'];
    /* v10.1: o MASP é do SERVIDOR. Docente e servidor administrativo têm
       matrícula; estudante, família e comunidade não — e é assim que a folha
       do PDF fica, com o número por extenso de quem o tem. Antes a
       demonstração não semeava matrícula nenhuma no Colegiado, e a folha de
       exemplo não mostrava o que a regra faz. */
    const servidor = function (seg) { return seg === 'Docente' || seg === 'Servidor administrativo'; };
    for (let i = membros.length; i < total - reais.length; i++) {
      const seg = segmentos[i % segmentos.length];
      membros.push({ papel: 'Colegiado Escolar', segmento: seg,

                     email: 'colegiado' + i + '.' + r.inep + '@exemplo.mg' });
    }
    reais.forEach(function (c) {
      membros.push({ papel: 'Colegiado Escolar', segmento: c.segmento || 'Colegiado', nome: c.nome,
                     masp: c.masp || (servidor(c.segmento) ? '9930418' : ''), email: c.email });
    });
    /* v8.1 — sem token de convite e sem ressalva: quem está na folha é quem
       a direção marcou como presente na reunião, e assina na própria sessão */
    const assinadas = Math.min(r.assinadas || 0, membros.length);
    membros.forEach(function (m, i) { m.assinadoEm = i < assinadas ? r.atualizadoEm : ''; });
    return membros;
  }

  /** v8.11 — o código de autenticidade da demonstração.

      No sistema de verdade o código são os doze primeiros dígitos do SHA-256
      do conteúdo congelado. Aqui não há SHA-256 disponível na semeadura, mas
      o FORMATO precisa ser o mesmo — doze hexadecimais em três grupos —,
      senão a porta pública da demonstração recusaria os próprios documentos
      que ela mostra. O valor é derivado do protocolo e da versão, de modo
      que o mesmo registro tenha sempre o mesmo código. */
  function codigoDemo(r) {
    const semente = String(r.protocolo || '') + '|' + String(r.versao || '') + '|' + String(r.inep || '');
    let a = 0x811c9dc5, b = 0x01000193;
    for (let i = 0; i < semente.length; i++) {
      a = (a ^ semente.charCodeAt(i)) >>> 0;
      a = (a * 16777619) >>> 0;
      b = (b + a + i * 2654435761) >>> 0;
    }
    const hex = (('00000000' + a.toString(16)).slice(-8) + ('00000000' + b.toString(16)).slice(-8))
      .toUpperCase().substring(0, 12);
    return (hex.match(/.{1,4}/g) || []).join('-');
  }

  /** Um arquivo no Drive simulado, para que o PDF oficial possa ser gerado de verdade.

      abrir um PPP concluído e ao conferir um código na porta pública, e um
      resumo ali fazia a tela parecer um documento mal formatado e vazio. */
  function arquivoFonte(r) {
    const html = '<div class="capa"><div class="brasao"><!--BRASAO--></div>' +
      '<div class="doc-org"><div class="l1">Secretaria de Estado de Educação de Minas Gerais</div>' +

      '<div class="school">' + r.escola + '</div>' +
      '<div class="meta">' + (r.municipio || '') + ' — Minas Gerais</div></div></div>' +
      '<h3 class="doc-h">Identificação da escola</h3>' +
      '<p class="ident"><b>Escola Estadual:</b> ' + r.escola + '</p>' +
      '<p class="ident"><b>Protocolo:</b> ' + r.protocolo + '</p>' +
      '<div class="quebra"></div><h3 class="doc-h">1. Histórico da escola</h3>' +
      '<p>Documento congelado na conclusão, em ' + (r.concluidoEm || '') + '.</p>';
    return BACKEND.obterPastaPdf_().createFile(S.g.Utilities.newBlob(html, S.g.MimeType.HTML, r.protocolo + '_FONTE.html')).getId();
  }
  function arquivoAta(r) {
    return BACKEND.obterPastaPdf_().createFile(S.g.Utilities.newBlob('ata', S.g.MimeType.PDF, r.protocolo + '_ATA_APROVACAO.pdf')).getId();
  }

  function linhaDe(cols, obj, chave) {
    return cols.map(function (c) {
      const v = obj[chave ? c[chave] : c];
      if (Array.isArray(v)) return v.join('; ');
      return (v === undefined || v === null) ? '' : v;
    });
  }

      SEMENTE_ESCOLAS.map(function (e) { return [e.inep, e.escola, e.municipio, e.sre, e.situacao || 'ativa', e.censo || '']; }));

    /* acessos */
    const abaA = BACKEND.abaAcessos_();
    abaA.getRange(2, 1, SEMENTE_ACESSOS.length, BACKEND.ACESSO_COLS.length).setValues(
      SEMENTE_ACESSOS.map(function (a) {
        const sal = a.comSenha ? 'sal-' + a.email : '';
        return [a.email, a.nome, a.perfil, a.perfil === 'central' ? '' : a.sre,
                a.comSenha ? BACKEND.hashSenhaV2_(SENHA_PADRAO, sal) : '', sal,
                a.situacao || 'ativo', '10/01/2026 09:00', a.ultimoAcesso || '',
                a.perfil === 'escola' ? a.inep : '', a.perfil === 'escola' ? a.escola : '',
                a.perfil === 'escola' ? (a.masp || '') : '', a.papel,
                a.comSenha ? '' : 'convite-' + a.email, a.comSenha ? '' : '31/12/2026 23:59',
                a.segmento || '', a.comSenha ? '2' : ''];
      }));

    /* histórico de gestores e de acessos institucionais */
    const abaG = BACKEND.abaGestores_();
    abaG.getRange(2, 1, SEMENTE_GESTORES.length, BACKEND.GESTOR_COLS.length).setValues(
      SEMENTE_GESTORES.map(function (g) {
        return [g.inep, g.escola, g.nome, g.masp, g.email, g.inicio, g.fim, g.registradoPor, g.motivo, g.perfil, g.sre,
                g.encerradoPor || '', g.observacao || ''];
      }));

    /* registros */
    const abaR = BACKEND.abaRegistros_();
    const linhas = SEMENTE_REGISTROS.map(function (r) {
      const encerrado = !emElab(r.status);
      const dir = diretorDe(r.inep);
      const obj = Object.assign({}, r, {
        criadoEm: r.criadoEm || r.atualizadoEm,
        concluidoEm: encerrado ? (r.concluidoEm || r.atualizadoEm) : '',
        assinaturas: JSON.stringify(folhaDe(r)),
        hash: encerrado ? codigoDemo(r) : '',
        /* v8.11 — o PPP concluído leva consigo os textos da folha como eles
           eram naquele dia: é o que faz a demonstração mostrar, de verdade,
           que reescrever o texto no Órgão Central não altera documento já
           assinado. */
        textosFolha: encerrado ? BACKEND.congelarTextosFolha_() : '',
        fonteId: encerrado ? arquivoFonte(r) : '',
        ataId: r.ata ? arquivoAta(r) : '', ataUrl: r.ata ? 'https://drive/demo-ata' : '',
        ataNome: r.ata ? 'ata-aprovacao.pdf' : '', ataData: r.ata ? '20/08/2026' : '',
        ataIdent: r.ata ? 'Ata da reunião do Colegiado Escolar' : '',
        homolDestino: r.homolData ? 'sre.divinopolis@educacao.mg.gov.br' : '',
        /* v8.1 — quem acompanhou o documento pela SRE: é a caixa "acompanhado
           por" ao fim do PPP. Todo documento que passou da validação tem uma. */
        validadoPor: (encerrado || r.status === 'Validado')
          ? (r.sre === 'Divinópolis' ? 'Cristina Diretora Educacional · Diretor Educacional'
                                     : 'Equipe da Diretoria Educacional · Equipe da Diretoria Educacional') : '',
        validadoEm: (encerrado || r.status === 'Validado') ? (r.criadoEm || r.atualizadoEm) : '',
        email: r.email !== undefined ? r.email : ((dir && dir.email) || ''),
        direcao: (dir && dir.nome) || '', especialista: '', tela: 0
      });
      return BACKEND.CAMPOS.map(function (c) {
        const v = obj[c.key];
        return (v === undefined || v === null) ? '' : v;
      });
    });
    abaR.getRange(2, 1, linhas.length, BACKEND.CAMPOS.length).setValues(linhas);

    /* a senha institucional do Órgão Central, para o modo de edição de textos */
    /* v8.13 (E01): a rotina é privada agora; a semeadura chama o BACKEND
       direto, e não pelo despachante — é semeadura, não uso da tela. */
    BACKEND.definirSenhaCuradoria_(SENHA_CURADORIA);
  }

  /* ---------- entrada: escolher o perfil é dizer que conta abriu o app ---------- */
  function emailDoPapel(papel) {
    const daEscola = SEMENTE_ACESSOS.filter(function (a) { return a.papel === papel && a.inep === ESCOLA_DEMO.inep; })[0];
    const daSre = SEMENTE_ACESSOS.filter(function (a) { return a.papel === papel && a.sre === ESCOLA_DEMO.sre; })[0];
    const qualquer = SEMENTE_ACESSOS.filter(function (a) { return a.papel === papel; })[0];
    return ((daEscola || daSre || qualquer) || {}).email || '';
  }
  function entrar(a) {
    /* Que conta abriu o app, na demonstração:
         · quem digita e-mail e senha não é identificado pela conta — é o
           caminho de quem não tem conta institucional, e o servidor confere
           a senha, como na implantação;
         · entrar pelo cartão é dizer que foi aquela conta que abriu o app;
         · nas portas, quem diz a conta é o perfil escolhido. */
    const porSenha = !!(a.email && a.senha);
    const doCartao = (typeof APP !== 'undefined' && APP.acesso && APP.acesso.email) || '';
    const papel = a.papelDemo ||
      (a.porta === 'central' ? 'central' : a.porta === 'colegiado' ? 'colegiado' : a.porta === 'escola' ? 'diretor_escolar' : '');
    if (porSenha) S.estado.identidade = '';
    else if (doCartao) S.estado.identidade = doCartao;
    else if (papel) S.estado.identidade = emailDoPapel(papel);
    return BACKEND.entrarInstitucional({ porta: a.porta || '', email: a.email || '', senha: a.senha || '',
                                         nome: a.nome || '', masp: a.masp || '' });
  }

  /* ---------- despacho ---------- */
  function despachar(fn, args) {
    const a = args || {};
    if (fn === 'entrarInstitucional') return entrar(a);
    /* v8.13 (E04): a linha especial de `curadoriaEntrar` saiu junto com a
       função. A demonstração já entra pela porta `central` de
       entrarInstitucional, com a senha conhecida — o caminho não muda. */
    if (fn === 'sair') { S.estado.identidade = ''; return BACKEND.sair(a); }
    /* v8.13 (E01) — A DEMONSTRAÇÃO RECUSA O QUE A IMPLANTAÇÃO RECUSA. Na
       implantação a tela fala com `api({fn, args})`, que confere o nome
       contra API_TELA; aqui o caminho é direto, e sem esta conferência a
       demonstração deixaria passar exatamente o que o servidor de verdade
       barra — quebrando a promessa do montar.js ("ela executa o mesmo
       servidor que a implantação"). As linhas especiais acima continuam
       antes, porque são semeadura da demonstração, não superfície pública. */
    if (!BACKEND.API_TELA || !Object.prototype.hasOwnProperty.call(BACKEND.API_TELA, fn)) {
      throw new Error('Ação desconhecida.');
    }
    if (typeof BACKEND[fn] !== 'function') throw new Error('Função inexistente no servidor: ' + fn + '.');
    return BACKEND[fn](args === null || args === undefined ? {} : args);
  }

  /** A latência simulada. As baterias a reduzem por window.demoLatencia. */
  function latencia() { return (typeof window.demoLatencia === 'number') ? window.demoLatencia : 600; }

  /* ---------- leitura do estado, para as baterias e para a tela ---------- */
  function linhasDaAba(aba, cols) {
    const n = aba.getLastRow();
    if (n < 2) return [];
    return aba.getRange(2, 1, n - 1, cols.length).getDisplayValues().map(function (r, i) {
      const o = { _linha: i + 2 };
      cols.forEach(function (c, k) { o[c] = r[k]; });
      return o;
    });
  }

  window.DEMO = {
    /** Cria os serviços, carrega o Code.gs real e semeia as abas. */
    iniciar: function () {
      if (pronto) return BACKEND.conteudoPublicado();
      S = SimuladorServicos.criarServicos({ identidade: '', cota: 1500,
        urlApp: 'https://script.google.com/macros/s/DEMONSTRACAO/exec' });
      BACKEND = window.__CODE_GS__.apply(null, SimuladorServicos.ORDEM.map(function (n) { return S.g[n]; }));
      semear();
      pronto = true;
      return BACKEND.conteudoPublicado();
    },
    /** O caminho que servidor() usa quando APP.local. */
    chamar: function (fn, args, ok, falha) {
      setTimeout(function () {
        let r;
        try { r = despachar(fn, args); }
        catch (e) { falha(e && e.message ? e : new Error(String(e))); return; }
        ok(r);
      }, latencia());
    },
    escola: ESCOLA_DEMO,
    /** v8.12: regrava o congelado de um registro com o documento inteiro. */
    gravarFonte: function (fonteId, html) {
      try { S.g.DriveApp.getFileById(fonteId).setContent(html); return true; }
      catch (e) { return false; }
    },
    servicos: function () { return S; },
    backend: function () { return BACKEND; },
    registros: function () {
      const aba = BACKEND.abaRegistros_(), n = aba.getLastRow(), out = [];
      for (let l = 2; l <= n; l++) out.push(BACKEND.lerLinha_(aba, l));
      return out.filter(function (r) { return String(r.protocolo || '').trim(); });
    },
    registro: function (protocolo) {
      return window.DEMO.registros().filter(function (r) { return r.protocolo === protocolo; })[0] || null;
    },
    gravar: function (protocolo, chave, valor) {
      const aba = BACKEND.abaRegistros_();
      BACKEND.gravarCampo_(aba, BACKEND.linhaDoProtocolo_(aba, protocolo), chave, valor);
    },
    acessos: function () { BACKEND.invalidarAcessos_(); return BACKEND.acessosTodos_(); },
    gestores: function () { BACKEND.invalidarGestores_(); return BACKEND.gestoresTodos_(); },
    escolas: function () { return BACKEND.escolasTodas_(); },
    convite: function (email) { const c = BACKEND.acessoPorEmail_(String(email).toLowerCase()); return c ? c.token : ''; },
    identidade: function (email) { S.estado.identidade = email || ''; },
    fila: function () { return linhasDaAba(BACKEND.abaFila_(), ['criadoEm', 'para', 'tipo', 'assunto', 'corpo', 'prioridade', 'situacao', 'tentativas', 'erro', 'enviadoEm']); },
    ciclo: function () { return linhasDaAba(BACKEND.abaCiclo_(), ['data', 'protocolo', 'ato', 'autor', 'papel', 'detalhe']); },
    emails: function () { return S.estado.emails; },
    /* Instantâneo das abas, para a bateria voltar ao estado anterior de um trecho. */
    instantaneo: function () {
      return ['Registros', 'Acessos', 'Gestores — histórico', 'Escolas'].map(function (nome) {
        const a = S.estado.abas[nome];
        const n = a ? a.getLastRow() : 0, c = a ? a.getLastColumn() : 0;
        return { nome: nome, vals: (n && c) ? a.getRange(1, 1, n, c).getValues() : [] };
      });
    },
    restaurar: function (snap) {
      snap.forEach(function (x) {
        const a = S.estado.abas[x.nome];
        if (!a) return;
        a.clear();
        if (x.vals.length) a.getRange(1, 1, x.vals.length, x.vals[0].length).setValues(x.vals);
      });
      BACKEND.invalidarAcessos_(); BACKEND.invalidarGestores_(); BACKEND.invalidarEscolas_();
    },
    /* Escreve direto numa célula da aba Acessos — o que nenhuma tela faz, mas
       a bateria precisa para montar cenários (reativar, expirar, etc.). */
    situacaoAcesso: function (email, situacao) {
      const cad = BACKEND.acessoPorEmail_(String(email).toLowerCase());
      if (!cad) return false;
      BACKEND.abaAcessos_().getRange(cad.linha, BACKEND.ACESSO_COLS.indexOf('Situação') + 1).setValue(situacao);
      BACKEND.invalidarAcessos_();
      return true;
    },
    senhaCuradoria: SENHA_CURADORIA,
    senhaPadrao: SENHA_PADRAO
  };
})();
</script>
